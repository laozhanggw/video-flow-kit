7181】【L7211】，但最后由用户看片确认\"喜欢\"。\n\n## 第 3 步：只取一段\n\n只取最亮眼的那一段【L7011】，Shorts 取开头【L9943】。写清起止秒数。\n\n## 第 4 步：逐秒拆骨架（这是卡的主体）\n\n按原片实际秒数切段，每段一行，填这张表：\n\n| 段 | 起止秒 | 耗时 | 画面里有谁、在哪、紧挨着什么 | 谁入镜/出镜、从哪边 | 镜头怎么动 | 这一段要让观众明白什么 |\n|---|---|---|---|---|---|---|\n\n要求：\n- 耗时精确到 0.1 秒。节奏和每段耗时微调时要尽量往原片靠【L8542】\n- 入镜出镜次序和位置照实写【L6013】\n- 最后一列写\"意思\"，不写画面细节。意思到位就行，不必一模一样【L3330】\n- 【我们】第 0–1 秒单独写一行：观众第一眼看到的关系（谁 + 紧挨着什么 + 离出事多快）。这一行是整张卡最重要的\n\n## 第 5 步：标出核心机制\n\n用一句话写出\"这段为什么好看\"，也就是换掉所有表面之后还必须留下的那一个东西。\n例：飞艇那段只留\"空降的方式\"，其他全换【L5811】。\n写法：A 做了什么 → B 发生了什么 → 留下什么。不写人物、道具、场景的具体名字。\n\n## 第 6 步：列出表面清单（全部可换）\n\n把原片里的人物、背景、数量、外观、场景、道具、台词逐项列出来【L8540–8542】。\n这一栏只是清单，给微调时逐项替换用，不在这里想换成什么。\n\n【我们】**「数量」不许写成约数。**「数十片」「一堆」「不少」都不算填了，必须写成三件套：\n\n- **占比**：占 0.000 秒首帧画面的百分之几（拿 `first_frame-001.jpg` 数像素算）\n- **分布**：铺满 / 成堆 / 散落 / 集中一处（可多选，写清在画面哪一片）\n- **处数类数**：共几处、分几类（写「处」「类」，不写「片」）\n\n观众感知的是覆盖率，不是件数。这个百分比要**原样**传进后续设定书和提示词，\n**不许改写成片数**——「数十片」被改写成「40 到 50 片」就是一次真实的量级事故：\n对标首帧落叶占 25.0%，成片只有 1.1%，差 23 倍。\n\n同理，第 4 步逐秒表最后一列现在只问「这一段要让观众明白什么」，那是**认知**。\n凡涉及问题的严重程度，另写一句**程度**，用 0–3（0 无所谓 / 1 有点在意 / 2 明显难受 / 3 看不下去），\n不许用「很乱」「乱到极致」这类形容词当结论。\n\n## 第 6.5 步：打配对标签【我们】\n\n以后丢选题表进来，要靠标签自动挑卡，所以每张卡都打上：\n- 机制类型：一句话里的动作类型，如\"进入后被拦住\"\"东西掉下来\"\"空间装不下\"\n- 空间要求：室内/室外、窄/宽、需不需要门或台阶\n- 人和动物：几个成人、有没有宠物\n- 有没有台词、取段总长\n\n## 第 7 步：写卡、入台账\n\n1. 在台账同文件夹的 `对标卡\\` 下新建 `HOOK-编号_原片短名.md`，内容：原片链接、播放量、选源五条的核对结果、取的起止秒、第 4 步逐秒表、第 5 步核心机制、第 6 步表面清单、第 6.5 步配对标签\n2. 在台账第 1 张表加一行（含配对标签），状态写\"未用\"\n3. 拿不准的地方写\"待核\"，不要猜【我们】\n\n## 自查（交卡前逐条过）\n\n- [ ] 选源五条都满足，儿童红线已确认\n- [ ] 逐秒表的耗时加起来等于取段总长\n- [ ] 第 0–1 秒那一行写清了\"谁 + 紧挨着什么 + 离出事多快\"\n- [ ] 核心机制一句话里没有具体名字\n- [ ] 配对标签四项都填了\n- [ ] 台账已加行\n- [ ] **表面清单的「数量」写成了 占比＋分布＋处数类数，没有一个约数**\n- [ ] **凡是「程度」判断都带数字（占比／差值／0–3／项数），没有拿形容词当结论**\n- [ ] **有对比关系的，写了「A 侧 X% vs B 侧 Y%，差 Z 个百分点」**\n\n## 后半段拆解（BODY，给 full-storyboard-design 用）【我们】\n\n文件：`D:\\自己开发的程序\\阿初的油管\\方法论v2_20260930\\整片对标\\BODY-编号_原片短名.md`\n内容：\n1. 原片链接、播放量、总时长、分界点（第几秒）和理由\n2. 开头交代了什么问题：一句话，不逐秒。做新片时开头会换成 HOOK 卡\n3. 结尾回报：观众最后得到什么；谁进入成品空间验证\n4. 逐段表，从分界点拆到片尾，精确到 0.5 秒：\n   | 段 | 起止秒 | 耗时 | 画面做了什么 | 景别/镜头 | 职责（交代原因/可见进展/变漂亮/验证） |\n5. 机制（要保留）：每步有没有可见进展、哪段最慢、景别怎么收放、结尾怎么兑现\n6. 表面（要换）：施工方式、材料、人物和动物种类\n7. 配对标签：改造对象（阳台/庭院/室内）、解决的问题类型、后半段时长、有无口播\n8. 台账 1b 表加一行\n\n儿童红线同样适用。BODY 可以重复用。\nBODY 优先非 AI 的真实改造视频。AI 来源的只能标\"备用\"：只借信息顺序和节奏，施工动作要逐个过物理检验，因为 AI 片里的施工可能是现实做不到的【我们】。\n开头卡的 AI 来源规则：\n- 阿初\"要仿非 AI\"【L10736】说的是精品长视频；Shorts 他是先抄同赛道同行，同行多了、同质化了，才转去看跨赛道非 AI【L10594–10596】，而且他也说跨赛道改成 Shorts 比较难【L10625】\n- 所以 AI 来源开头卡标\"试验\"可以用。条件：播放量高、用户看了会停；同赛道里如果已经有很多条长得一样的开头，就不收（观众已经看腻）\n- 来源类型（AI / 非AI、同赛道 / 跨赛道）写进台账，发布后对比哪类数据好，用数据定规则【我们】\n抽帧识别拿不准\"是不是 AI、有没有儿童、有没有口播\"时，直接问用户这三件事，不要只标待核就入库。\n\n## 不做的事\n\n不写提示词，不想替换成什么，不评价\"生活合不合理\"。这些交给 benchmark-adapt-hook。\n\n"}, "benchmark-video-deconstruction": {"label": "①拆解·视频拆解", "path": "skills/benchmark-video-deconstruction/SKILL.md", "text": "---\nname: benchmark-video-deconstruction\ndescription: 深度拆解 YouTube Shorts 或其他短视频对标样本，提取可追溯的观看任务、开头冲突、情绪因果、镜头节奏、剪辑、声音、标题包装和可迁移制作规则，并生成下一条视频的生产合同。不要只看播放量或做表面模仿。\n---\n\n# 对标视频深度拆解\n\n## 目标\n\n把一条或一组真实对标视频拆成两种资产：\n\n1. **证据层**：视频实际出现了什么，在哪个时间点出现，来自画面、声音、字幕、标题、简介或评论的哪一类证据。\n2. **行动层**：下一条视频必须学什么、可以借什么、不能照抄什么、制作时怎样验收。\n\n最终要回答的不是“这个视频为什么爆”，而是：\n\n> 它让观众完成了什么观看任务？它用哪些可观察的机制让观众继续看？哪些机制可以迁移到当前项目？\n\n播放量、点赞量和作者自称的爆款只能作为结果信号，不能单独证明任何机制造成成功。\n\n## 适用范围\n\n适用于：\n\n- YouTube Shorts 对标视频；\n- 阳台、猫舍、空间改造、宠物安全、家居和生活方式视频；\n- 收到一个视频链接、下载视频、Storyboard、字幕、评论或对标拆解聊天记录；\n- 在写脚本、分镜、图片或视频提示词之前做市场表达校准。\n\n不适用于：\n\n- 只判断视频技术上能不能使用；\n- 只审核生成视频是否有畸变；\n- 没有原片证据、只凭标题或截图推断完整结构；\n- 直接照抄某个作者的角色、台词、镜头或人设。\n\n## 强制顺序\n\n### 阶段 0：定义本轮问题\n\n先写清：\n\n- 当前项目、平台、画幅和目标用户；\n- 本轮要学习的是选题、开头、结构、节奏、真实感、声音、标题还是完整制作方式；\n- 对标样本是否与当前项目具有相同的用户问题、空间约束和观看任务；\n- 本轮不做什么，例如不因一个样本直接升级频道规律，不直接写生成提示词。\n\n### 阶段 1：建立原片证据\n\n优先读取原视频和所有可用独立证据：\n\n- 视频技术元数据；\n- 时间轴和抽帧；\n- 关键动作附近的密集抽帧；\n- 字幕或口播转写；\n- 环境音、动作声、BGM和声音变化；\n- 标题、简介、标签和封面；\n- 评论区，优先看高赞评论，也要抽查普通评论和批评评论。\n\n不要把稀疏抽帧当作逐帧观看。无法确认时标记 `U1 无法确认`。\n\n证据标记：\n\n- `F1 原片直接事实`\n- `F2 多模态一致推断`\n- `C1 评论区观众原话/主题`\n- `M1 公开结果信号`\n- `H1 用户提供线索`\n- `V1 观众心理或效果推断，待验证`\n\n### 阶段 2：拆解观看任务，而不是只拆镜头\n\n先用一句话写：\n\n> 观众点开后，最想确认什么？\n\n然后拆成：\n\n1. 初始状态：观众看见什么问题或愿望；\n2. 风险/冲突：为什么不能继续保持原状；\n3. 过程承诺：视频暗示接下来会解决什么；\n4. 中段奖励：每个时间段给观众什么新信息；\n5. 结果验证：是否真的解决了开头问题；\n6. 情绪落点：观众最终是放心、惊喜、治愈、满足、好奇还是怀疑。\n\n### 阶段 3：原子级时间线\n\n按事件边界拆，不按固定秒数硬切。每一行至少记录：\n\n- 开始/结束时间；\n- 画面事实；\n- 人物或宠物动作；\n- 表情、视线和身体状态；\n- 场景与空间关系；\n- 道具新增、移动、固定、消失或状态改变；\n- 镜头景别、机位、运动、剪辑方式；\n- 字幕/口播；\n- 环境音、动作声、BGM；\n- 这一段给观众的新信息；\n- 它兑现的是哪一个承诺；\n- 证据等级和不确定项。\n\n特别标记：\n\n- 首帧是否已经有冲突；\n- 重要动作用了多少真实时间；\n- 哪些动作被快剪或蒙太奇压缩；\n- 哪些关键状态用独立静态镜头展示；\n- 每个剪辑点是落在动作中、反应中还是静止画面；\n- 结果是否通过实际使用而不是成品空镜证明。\n\n### 阶段 4：提取六类可迁移机制\n\n#### A. 需求机制\n\n- 真实用户是谁；\n- 用户想完成什么任务；\n- 痛点是安全、功能、舒适、审美、身份还是情绪；\n- 评论是在回应问题、结果、人物善意，还是只回应视觉刺激；\n- 是否存在租约、预算、物业、承重、天气、宠物安全等现实约束。\n\n#### B. 开头机制\n\n- 0–1 秒看见什么；\n- 0–3 秒是否能静音读懂问题；\n- 冲突是危险、失败、反差、欲望、悬念还是人物关系；\n- 是否先给结果、先给问题、先给人物反应；\n- 开头是否已经暗示结尾奖励。\n\n#### C. 结构和情绪机制\n\n- 谁受益、谁行动；\n- 情绪如何逐段变化；\n- 是否有后怕、失败、重新尝试或发现隐藏问题；\n- 施工动作是否服务于问题解决；\n- 开头暴露的每个问题是否有结尾验证；\n- 是否有“局部改善冒充完整解决”的硬伤。\n\n#### D. 节奏和剪辑机制\n\n- 各段实际时长分布；\n- 长镜头承担什么，短切承担什么；\n- 哪些动作必须给够时间才能看懂；\n- 哪些重复动作被压缩为蒙太奇；\n- 硬切、叠化、静态展示、动作接动作分别承担什么功能；\n- 中段是否每隔一段就出现新状态、新道具、新风险或新结果。\n\n不要把“前三秒留人”误读成“全片每三秒硬切”。\n\n#### E. 真实感和视觉机制\n\n- 是否像真人手机、DV、朋友拍摄或专业纪录；\n- 构图是否故意不完美；\n- 是否有自动对焦、轻微晃动、过曝、动态模糊、生活痕迹；\n- 人物是否有自然的小动作、视线、停顿和失误；\n- 空间状态是否连续；\n- AI 破绽是否影响核心情绪或只是表现层瑕疵。\n\n#### F. 声音和包装机制\n\n- 标题承诺了什么；\n- 简介如何定义人群、问题和结果；\n- 口播是讲故事、点名约束、解释因果还是制造情绪；\n- 环境音和动作声是否帮助观众理解物理事件；\n- BGM 如何控制情绪弧；\n- 评论区是否由结尾问题引导；\n- 封面/首帧是否在手机小尺寸下清楚表达问题或结果。\n\n## 评论区分析规则\n\n至少分开看：\n\n- 情绪回应：害怕、感动、放心、喜欢；\n- 需求回应：我也有这个问题、我需要这个方案；\n- 行动回应：怎么做、材料、预算、租约；\n- 真实性回应：AI、假的、空间变化；\n- 风险/伦理回应：不安全、虐待、消防、植物有毒、物业许可；\n- 结果回应：猫真的使用、空间真的可用。\n\n评论主题只表示观众说了什么，不自动表示所有观众都这样想，也不能等同留存或转化。\n\n## 输出物\n\n每次完成一个对标样本，至少输出：\n\n1. `01_原片事实时间线.md`\n2. `02_观看任务与结构机制.md`\n3. `03_剪辑声音标题包装拆解.md`\n4. `04_评论区需求与反对信号.md`\n5. `05_可迁移生产合同.md`\n\n如果是多个样本，再增加：\n\n6. `06_样本对照与候选规律.md`\n\n## “可迁移生产合同”必须写什么\n\n它不是提示词，而是交给制作对话框的验收合同，必须包含：\n\n- 当前项目要复制的观看任务；\n- 必须保留的开头信息；\n- 必须出现的情绪转折；\n- 必须出现的中段新奖励；\n- 结尾必须验证的结果；\n- 可以借鉴的剪辑节奏和声音职责；\n- 可以借鉴的真实感表现；\n- 不能照抄的表面元素；\n- 当前项目的现实硬伤；\n- 每个问题对应的视觉证据；\n- 生成前停止条件；\n- 发布后要观察的指标和评论关键词。\n\n每条规则按以下格式写：\n\n```text\n规则：\n适用范围：\n什么时候使用：\n具体动作：\n为什么：\n正例：\n反例/失败：\n不能照抄：\n来源：\n证据状态：\n下一步验证：\n```\n\n## 对改造类视频的终局检查\n\n任何空间改造视频进入脚本或生图前，必须建立：\n\n```text\n开头问题\n→ 观众担心的后果\n→ 中间解决动作\n→ 终局必须达到的空间状态\n→ 终局实际使用动作\n→ 观众情绪兑现\n```\n\n逐项检查：\n\n- 开头暴露的风险是否全部在终局解决；\n- 上方、下方、侧面、门口、边缘和动线是否都检查；\n- 安全、隐私、遮阳、防水、收纳、噪音等功能是否真的恢复；\n- 终局是否只是“看起来好看”，还是能够实际使用；\n- 施工动作是否都推动状态变化；\n- 是否存在局部修复冒充完整修复；\n- 结尾是否仍然留下核心疑问。\n\n任何一个核心问题没有对应验证镜头，结论必须是“修改后再制作”。\n\n## 最终决策\n\n只能给出以下三种之一：\n\n- `可以进入结构设计`\n- `补证据/改剧情后再进入结构设计`\n- `不建议制作`\n\n不得因为对标视频播放量高，就直接判断当前题值得做。\n\n## 证据边界\n\n- 一条样本只能形成案例观察；\n- 两到四条可比样本只能形成待验证候选规律；\n- 五条以上可比样本重复出现，才可写阶段性规律；\n- 交给制作对话框前必须合并为 V3 的“可迁移生产合同”；当前口径以 `D:\\自己开发的程序\\AI视频全流程提示词_直接使用版_v3\\13_矛盾清单与冲突处理机制.md` 为准；\n- 本频道发布结果只能说明本次结果，不能自动证明因果；\n- 对标评论区和公开数据不能替代本频道 Studio 数据；\n- 如果原片、声音或评论无法读取，必须写明缺口及其影响。\n\n## 交付前自检\n\n- [ ] 没有把表面元素当核心机制；\n- [ ] 没有把播放量当因果证据；\n- [ ] 没有把对标的特殊场景硬套到当前项目；\n- [ ] 时间线有证据等级和不确定项；\n- [ ] 中段每个关键段都有新信息或新状态；\n- [ ] 开头问题与结尾验证一一对应；\n- [ ] 真实感、剪辑、声音、标题和评论区都被检查；\n- [ ] 写出了不能照抄的内容；\n- [ ] 生成前有明确停止条件；\n- [ ] 结论区分事实、推断、假设和待验证。\n"}, "benchmark-batch-variants": {"label": "②复刻·批量变体", "path": "skills/benchmark-batch-variants/SKILL.md", "text": "---\nname: \"benchmark-batch-variants\"\ndescription: \"一条对标派生一批版本：先按固定维度把对标拆透（七段环节 + 十项表面 + 首帧五要素），再用变/不变判定表锁死该锁的、换掉该换的，V1 做对照版不动结构，V2 到 Vn 各占一个可调子维度。用于「这条对标出 4 条」「一个对标派几个版本」「批量复刻」「几个版本怎么分」「哪些能换哪些不能换」。只出批次规划、变不变判定和每版改动单，不写开头正文、不写分镜、不写提示词。\"\n---\n\n# 一个对标派生一批版本\n\n一句话：**同一道菜，同一套做法每次照做；只换盘子和配菜，每条只调一个子维度，改得对不对看数据。**\n\n---\n\n# 第一部分：依据与边界\n\n## 1.1 出处\n\n- 【0031】ACHU-20260721-0031《今天讲能做出爆款的本质：结构》L119–162、L193–202、L237–241；html L931「物品切成占位符、角色切成火柴人」，L1148「锤子可以换棒子」\n- 【0034】ACHU-20260721-0034《要做出爆款只需这2点》L120–143\n- 【0050】ACHU-20260721-0050《爆款语言剧本的最大来源》L107–113\n- 【0051】ACHU-20260721-0051《这两个点就是当下的爆款公式》L123–131、L153–161\n- 【库】`D:\\自己开发的程序\\阿初的油管\\阿初的油管库.md`，行号标【库Lxxx】\n- 【修坑】印度修坑频道 4 对（8 条）高低播放对比，拆解文件 `E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\对标频道_水坑\\拆解_01～08.md`，汇总 `同目录\\汇总对比.md`。**本 skill 全部\"变/不变\"判定的实证来源。**\n- 【母版】MASTER-001 露台凉棚，约 70 万播放，`20261001_露台坐垫淋雨\\母版卡_露台凉棚.md`\n- 【我们】是我们自己的补充，不是阿初原话\n\n方法论：`D:\\自己开发的程序\\阿初的油管\\方法论v2_20260930\\01_底层方法论_v2.md`\n台账：同文件夹 `02_对标库与数据台账_持续更新.md`\n\n## 1.2 修坑证据的强度（引用时必须带上，不许当成定理）\n\n| 项 | 实际情况 |\n|---|---|\n| 样本量 | 4 对（8 条）。第 1–3 条差异 4 对方向一致，第 4 条 3 对一致 |\n| 性质 | 只能说明\"常一起出现\"，**不能证明是原因** |\n| 秒数精度 | 每秒一张采样，误差约 ±1 秒；前 1.6 秒是每 0.2 秒一张，比较准 |\n| 未核 | 8 条的声音全部没核。C、D 两组的具体播放数没核，只知道谁高谁低 |\n| 已知离群 | 01（5100 万）是孩子骑车整个人摔进坑，属于离群爆款，且有儿童红线，不照搬 |\n\n写改动单时，\"预期\"一栏必须写「依据：修坑 4 对」，不能写「已验证」。\n\n---\n\n# 第二部分：先拆透（这是所有判定的基础）\n\n拆不透，后面全是猜。拆解要按下面三张固定表，字段不许省。\n\n## 2.1 逐镜表（四要素）\n\n| 段 | 起止秒 | 画面一句话 | 环节 |\n|---|---|---|---|\n\n\"画面一句话\"必须同时写清四件事，少一件这条就算没拆：**谁 + 在干什么 + 东西什么状态 + 景别**。\n\n例（拆解_02 第 1 段）：一辆红色拖拉机（白T司机）从路远端朝镜头开来，前景路中是一个积着粉褐色水的椭圆坑；1.6s 左前轮压进坑，泥水溅起。固定低机位，远景→全景\n\n## 2.2 七段环节骨架（固定分类，不许自己起名）\n\n改造/修复类一律按这七段归类，没有的写\"无\"：\n\n| 编号 | 环节 | 判定方法 |\n|---|---|---|\n| 1 | 问题出现 | 从第 0 秒到\"坏事完成\"（车压进坑、雨打到东西上）为止 |\n| 2 | 第一反应 | 出事之后、决定之前：看一眼、愣一下、走近 |\n| 3 | 决定动手 | 打电话、叫人、拿工具、走到位置 |\n| 4 | 连续修 | 第一次接触要修的东西，到修完为止 |\n| 5 | 再测试 | 修好之后，同一个威胁再来一次 |\n| 6 | 这次没事 | 再测试之后，证明这次扛住了 |\n| 7 | 收尾 | 空镜、合影、竖拇指 |\n\n**修坑 8 条实测**：1 占 0–5 秒，2 占 4–5 秒，3 占 4–5 秒，4 占 35–59 秒，**5 和 6 全部是\"无\"**，7 占 2–4 秒。八条都省掉了\"再测试＋这次没事\"。\n\n这条对我们很重要：它说明 5、6 两段不是必需的。但我们自己 70 万那条有这两段，所以**自己不删，对标上没有也不许当成缺点**。\n\n## 2.3 表面清单（十项，一项不许缺）\n\n| 项 | 写什么 | 例（拆解_01） |\n|---|---|---|\n| 地点 | 场地类型、路面/地面材质、两侧是什么、有无国别可辨 | 乡间红土路，两侧绿色农田、树和土堆碎石，看不出国别 |\n| 问题物的大小形状 | 占画面多少、深度、边缘状态 | 近方形坑，宽约占路面三分之一，深看不清，外圈深色湿泥 |\n| 天气 | 晴/阴/雨、光线、地面干湿 | 白天多云，部分蓝天，路面潮湿 |\n| 人物 | 几个人、年龄段、各自身份、谁和谁重复 | 3 人，都是 10–14 岁儿童/少年，绿T男孩既摔车也参与修 |\n| 穿着 | 逐人写颜色＋品类＋鞋 | 薄荷绿T＋破洞牛仔＋凉鞋 |\n| 工具 | 逐件写，含\"压坑道具\"（如车）和\"修的道具\" | 自行车、橙色塑料盆、短柄锄头、扁平抹平工具 |\n| 材料 | 逐样写，含\"看不清是什么\"的要标出来 | 大石块、碎石、白袋灰白粉末（是不是水泥看不清）、土 |\n| 修法 | 用箭头写工序，一步一箭头 | 舀积水→填大石块→铺碎石→倒灰粉翻拌→锄头铺平拍实→手工抹平 |\n| 画面文字 | 字幕、贴字、衣服上的字 | 无字幕；只有衣服上的 CK 字样 |\n| 声音 | 口播、环境声、动作声、BGM | 未核 |\n\n## 2.4 开头段长度 T（变量，不许套默认值）\n\n**T 不是常数。** 原片有的 3 秒、有的 5 秒、有的十几秒，取决于它什么时候开始动手。定 T 三条规则，按顺序用：\n\n1. **主规则**：T ＝ 原片里\"人第一次接触要处理的东西\"的时刻，取到那一段动作结束。\n   - 修坑 01 开舀 13 秒 → T=13；修坑 02 开刨 16 秒 → T=16；修坑 06 开工 22 秒 → T=22\n   - 收衣片伸手抓夹 2.2 秒、动作到 2.6 结束 → T=2.6\n2. **没有\"动手\"段**：T ＝ 第一段有效动作结束的时刻，不是总时长。\n3. **比例校验**：T 应占成片总时长 12%–18%。超出就换源，或单独写明为什么例外。\n\nT 一旦定下写进版本设定书，下游三段一律引用，不许各自重算。\n\n## 2.5 情绪弧（必拆，不许省）\n\n情绪是结构的一部分，不是装饰。先写一句话：**这条原片的情绪是什么，观众看完该有什么感觉。**\n\n母版例：看着东西正要坏、拦不住的那种着急；落点是\"抢到了\"的轻微释然。没有愤怒、没有抱怨、没有表演。\n\n然后按**五个通道**逐一检查原片用了哪几个：\n\n| 通道 | 查什么 |\n|---|---|\n| ① 表情与视线 | 有没有脸部表演？持续几秒？还是只有一闪 |\n| ② 身体动作与节奏 | 快走还是跑、肩背姿态、动作干脆还是犹豫 |\n| ③ 环境（天气、光线） | 天色、光线方向、雨雪风、地面干湿 |\n| ④ 声音 | 雨声疏密、脚步、动作声、有无配乐 |\n| ⑤ 镜头语言 | 全景看局面还是特写看结果、切点节奏 |\n\n**修坑实证**：8 条修坑片的人物都是平静干活，没有表情戏，结尾竖拇指。高低播放的差别不在表情。所以**改造/修复类的情绪大头在②身体节奏和③环境，不在脸**。\n\n**强度标尺**（统一口径，不许自创）：0 无｜1 微（停一下、看一眼）｜2 中（加快动作、皱眉一次）｜3 强（跑、喊、摔东西）。改造类原则上不上 3。\n\n**禁止**：写\"他看起来很着急\"这类无法生成的抽象描述；用对白或旁白解释情绪；加叹气、摊手、摇头等原片没有的表演动作。\n\n## 2.6 首帧五要素\n\n第 0.0 秒这一格，单独写清五件事：\n\n1. 受害物在不在画面里、在哪个位置（前景/中景/画外）\n2. 威胁在不在画面里、朝哪个方向来（正对镜头/侧面/尚未出现）\n3. 威胁离受害物还有多远/多久\n4. 画面里有没有人、几个人\n5. 机位高度、是否固定、景别\n\n例（拆解_06，高播放）：摩托在远处正对镜头骑来，坑在前景，两者距离约 2 秒。\n\n---\n\n# 第三部分：变 / 不变 判定表（本 skill 的核心）\n\n分三层。每一层都给\"怎么算相同、怎么算不同\"，判定时逐条写结论，不许写\"基本一致\"。\n\n## 3.1 锁死层（13 项，每版必须完全一样）\n\n| # | 维度 | 判定\"相同\"的标准 | 越界的例子 |\n|---|---|---|---|\n| L1 | 造的东西 / 修的对象 | 能用同一句话说出是同一样东西 | 「四柱白顶凉棚」→「木平台餐椅凉棚」＝不同，越界 |\n| L2 | 步骤清单与顺序 | 一步一行，步数差 ≤1，顺序完全一致 | 少一步、多一步、换顺序 ＝ 越界 |\n| L3 | 每一步的动作 | 动词一致：砸、舀、抹、拧 | 「砸」换成「钉」＝越界（锤子换棒子可以，砸不能换） |\n| L4 | 工具种类 | 同一功能类 | 锄头→铁锹 可；锄头→电钻 不可 |\n| L5 | 材料种类 | 同一功能类 | 石块→碎砖 可；石块→水泥浇筑 不可 |\n| L6 | 出事方式 | 机制一致：谁从哪来、怎么碰上 | 正面开来→前轮压进 可；从侧面冲进来 不可 |\n| L7 | 结尾验证方式 | 同一个验证手段 | 竖拇指→竖拇指；空镜→空镜。改成\"再测试一次\"＝越界 |\n| L8 | 人物 | 同一个人（Alex），不换 | 换成邻居／换性别／换年龄段 ＝ 越界 |\n| L9 | 场面规模 | 出镜人数上限不变（修坑是 2–4 人） | 加一队人 ＝ 越界 |\n| L10 | 总时长 | 母版 ±5 秒 | 95 秒改成 60 秒 ＝ 越界 |\n| L11 | 关键时间点 | 出事秒、开工秒、结尾秒，各 ±1 秒 | 出事从 2 秒挪到 6 秒 ＝ 越界 |\n| L12 | 机位策略 | 机位数、是否固定、高度层级不变 | 固定机位改成手持跟拍 ＝ 越界 |\n| L13 | 情绪弧 | 每段的情绪、强度、五通道分配与母版一致 | 「着急」改成「生气」＝越界；把情绪从②身体搬到①表情＝越界 |\n\n> L2 与\"刀数\"无关。修坑 8 条步骤完全一样，刀数却从 16 到 27、时长 55–78 秒，说明**照抄的是步骤，不是逐刀**。刀数、每刀几秒属于可换层（C4）。\n\n> **L10 是硬锁，没有例外。** 母版 29 秒就做 29 秒。不许以\"频道成片都 80–95 秒\"\"经验时长\"为由放大——本规范里没有这条规则。等比缩放不改变任何比例（T ÷ 总时长拉伸前后同一个数），所以\"拉长以凑 12%–18%\"在数学上不成立。母版时长与目标差太远，属选源问题，换源，不要拉伸。\n\n> L11 与 L13 会互相牵连：调 L11 的时间点，可能挤掉某个情绪载体（例如时间提前后没空皱眉）。**这类连带变化必须写在改动单的\"情绪是否要跟着调\"一栏**，否则下游照抄原情绪表就会打架。\n\n## 3.2 可换层（8 项，每版全换且互不相同）\n\n| # | 维度 | 换法 | 限制 |\n|---|---|---|---|\n| C1 | 受害物 | 换同一类里的一件（怕雨的：坐垫→纸箱→地毯，都是怕雨的家居物） | 必须同类。坐垫→电钻 不行，电钻不\"怕雨淋坏\"这个语义 |\n| C2 | 地点细节 | 院子/墙面/植物/地面/朝向换掉 | 不能换掉场地类型（独栋户外不能换成公寓阳台） |\n| C3 | 天气细节 | 晴天/阴天/雨后/阵雨、光线方向 | 不能换掉\"外部条件突变\"这个机制 |\n| C4 | 每步怎么拍、几刀、几秒 | 按能生成、好看为准自由安排 | 不许删掉整步；不许整段改成蒙太奇跳过 |\n| C5 | 人物穿着 | 颜色、款式、材质换掉 | 不写颜色文字，只引 RC01 身份图（写了会漂） |\n| C6 | 道具颜色与外观 | 换色、换款式、换旧新程度 | 不改种类（改种类是 L4） |\n| C7 | 数量细节 | 帮忙的人 2–3 个、道具几个 | 上限受 L9 约束；不许加\"无关路人\"（见 D9） |\n| C8 | 画外细节 | 背景里的车、树、远处的房子 | 不许抢主体注意力，不许引入第二条故事线 |\n\n## 3.3 可调层（子维度，每版只占一个）\n\n**关键：可调单元不是\"整个环节\"，而是环节下面的具体子维度。** 只写到\"环节\"这一层，四个版本全会挤在\"问题出现\"上撞车——这是上一版最大的粒度错误。\n\n下表 A 组来自修坑 4 对的实证，有方向；B、C 组没有外部证据，只能靠自己的母版。\n\n### A 组｜前 20 秒（有实证，优先用）\n\n| # | 子维度 | 高播放的做法 | 低播放的做法 | 证据 |\n|---|---|---|---|---|\n| A1 | 首帧关系：威胁是否正对镜头来、受害物是否在前景 | 第 0 秒：车在远处正对镜头开来，坑在前景 | 空坑（05、08）；车从侧面突然入画（07） | 4/4 高片一致；低片 3/4 不同 |\n| A2 | 出事时点 | 1.6–2 秒才碰上 | 1 秒内就碰上 | 4/4 |\n| A3 | 受害者数量 | 1 个，且本人就是后面动手的人 | 07 三次受害；05 前 10 秒在捡果子（后来再没出现） | 4/4 高片 |\n| A4 | 问题段冗余（无关的人/车） | 无 | 08 有 4 拨车和人 | 4/4 |\n| A5 | 开工时点 | A 22 / B 13 / C 15 / D 16 秒 | A 29 / B 19 / C 26 / D 17 秒 | 每一对都是高的先开工；D 组基本持平 |\n\nA 组内部还有一层关系要注意：**A1–A4 全部落在\"问题出现\"这一段的四秒里**。也就是说前 20 秒的差距，几乎全由这四秒决定。0051 说的\"删冗余\"，在修坑里指的就是这一段。\n\n### B 组｜中段（实证与直觉相反，别乱动）\n\n| # | 子维度 | 实证 | 结论 |\n|---|---|---|---|\n| B1 | 修的时长 | 高的修 32–59 秒，低的修 32–44 秒。**高片的中段更长** | 中段不是越短越好。不要压缩 |\n| B2 | 步骤完整性 | 8 条步骤一步不少 | 不能为了节奏删步骤（L2 兜底） |\n| B3 | 蒙太奇比例 | 8 条都用连续动作＋少量快剪，没有整段蒙太奇 | 保持\"看得见在干活\" |\n\n### C 组｜结尾（外部无证据，只认自己的母版）\n\n| # | 子维度 | 实证 | 结论 |\n|---|---|---|---|\n| C1 | 有没有\"再测试＋这次没事\" | 8 条**全部没有**，所以修坑数据既不支持也不否定 | 以 MASTER-001 为准：留着 |\n| C2 | 收尾形式 | 8 条都是并排竖拇指 | 不是差异点，别当变量 |\n\n> **一条被否定的假设，必须写进改动单**：早期单条拆解曾建议\"结尾加测试能提升\"，4 对数据不支持这条（高片低片都没有测试）。所以\"加测试\"不能作为版本变量。\n\n---\n\n# 第四部分：版本怎么排\n\n## 4.1 先算上限\n\n```text\n可调子维度数 = A 组可用的 + B/C 组确有疑问的\n本批最多版本数 = 可调子维度数 + 1     （+1 是最前面的对照版）\n```\n\n修坑这套骨架，A 组 5 个 + C 组 1 个 = 6，所以最多 7 版。要 4 条，够。\n\n如果可调子维度只有 2 个，就只能出 3 条。**不许为了凑数把一个子维度拆成两个，也不许让两版占同一子维度。**\n\n## 4.2 V1 是对照版\n\n锁死层全抄、可换层全换、**可调层一处不动**。它测的是\"这个骨架在我们频道能不能复现\"。这条不行，后面几条全不用做。\n\n## 4.3 V2 起，按优先级分配\n\n| 顺序 | 子维度 | 为什么排这个位置 |\n|---|---|---|\n| V2 | A1 首帧关系 | 决定第一眼划不划走，占成败七成 |\n| V3 | A2 出事时点 | 直接决定\"有没有等待感\" |\n| V4 | A3 受害者数量 | 决定动机集中度 |\n| V5 | A4 问题段冗余 | 删减类，风险最低 |\n| V6 | A5 开工时点 | 中段入口，影响完播 |\n| V7 | C1 结尾验证 | 只有自己的母版支持，最后试 |\n\n**一版只占一行。** 想同时调 A1 和 A2，就再加一版，不要合并。\n\n## 4.4 版本差异矩阵（一批一张）\n\n| 版本 | 一句话差异 | 占的子维度 | 调法 | 本版只测什么 | 预期 |\n|---|---|---|---|---|---|\n\n---\n\n# 第五部分：五道硬判定\n\n每版逐条写\"通过／不通过\"，不通过就退回，不许带病往下。\n\n| # | 判定 | 怎么判 | 不通过怎么办 |\n|---|---|---|---|\n| J1 | 没越界 | 锁死层 13 项逐项对照母版，任一项不同即 FAIL | 改回母版，或换对标源 |\n| J2 | 因果三问全\"是\" | ①开头被威胁的东西＝正片要保护的那件？②正片造的东西正好对付这个威胁？③结尾验证的是同一威胁打在同一件东西上、这次没事？ | 改表面或改开场，不许改骨架 |\n| J3 | 不撞车 | 两版占同一子维度即 FAIL | 改掉一个，或减条数 |\n| J4 | 表面不雷同 | 两版在 C1 受害物、C2 地点、C3 天气、C5 穿着 四项上，任一项相同即 FAIL | 换掉那一项 |\n| J5 | 不超限 | 版本数 ≤ 可调子维度数 + 1 | 减条数或换源 |\n| J6 | 情绪一致 | 每段情绪名、强度、五通道分配与母版一致；改时间点导致的连带调整已写明 | 改回母版情绪弧，或在改动单里补记连带变化 |\n\n## 5.1 三条口诀（人不用记表，记这三句）\n\n1. 观众说得出「他这次做的是另一样东西」→ 换过头了（撞了 L1）。\n2. 观众说得出「他这次少了一步／多了一步」→ 换过头了（撞了 L2）。\n3. 两个版本并排看，说不出\"差在哪\" → 撞车了（撞了 J3）。\n4. 看完觉得\"假\"\"演\"→ 情绪分配错了（多半是把情绪从②身体搬到了①表情，撞了 L13）。\n\n---\n\n# 第六部分：输出物\n\n## 5.2 另外两条必须一起过\n\n- 画面里不能有看上去像儿童的人【库L9588–9596】。修坑 01（5100 万）就是孩子摔车，我们不照搬。\n- 换进来的每个表面，都要过 `benchmark-adapt-hook` 的七问。\n\n---\n\n# 第六部分：输出物\n\n## 6.1 变/不变判定表（每批一张，必填）\n\n| 维度 | 母版是什么 | V1 | V2 | V3 | V4 | 判定 |\n|---|---|---|---|---|---|---|\n\n锁死层 13 行照抄母版值，可换层 8 行填各版值，可调层 1 行标各版占的子维度。\n\n## 6.2 情绪节拍表（每批一张，下游三段的唯一来源）\n\n| 段 | 触发事件 | 情绪 | 强度 0–3 | ①表情/视线 | ②身体动作与节奏 | ③环境 | ④声音 | ⑤镜头语言 | 观众应感到 |\n|---|---|---|---|---|---|---|---|---|---|\n\n**情绪弧一句话**：__ → __ → __ → __（四段强度 __/__/__/__）\n\n这张表和骨架主表地位相同，都是\"抄\"的对象，不是\"参考\"。定稿后整份复制进每个版本的设定书。\n\n## 6.3 每版一张《改动单》\n\n```text\n母版：BENCH-xxxx（拆解版本 vN）\n版本：V2\n开头段长度 T＝__ 秒（来源：原片第 __ 秒开始动手；比例校验 __%）\n锁死层：造的东西＝____；步骤＝照母版，__步不动；工具＝____；材料＝____\n        出事方式＝____；结尾验证＝____；人物＝Alex；总长＝__±5 秒\n        关键时间点：出事__秒 / 开工__秒 / 结尾__秒\n        情绪弧＝照母版（__→__→__→__，强度 __/__/__/__）\n可换层：受害物＝____；地点＝____；天气＝____；穿着＝____；道具外观＝____\n可调层：占的子维度＝A2 出事时点；调法＝从 __ 秒挪到 __ 秒\n情绪是否要跟着调：否／是（写明哪一段、哪个通道被挤掉、怎么补）\n理由：____（四类之一：原片拖沓／原片交代不清／动机变了／AI 做不出来）\n因果三问：是／是／是\n六道判定：J1 过 · J2 过 · J3 过 · J4 过 · J5 过 · J6 过\n预期：依据【修坑 4 对】，出事时点提前应改善前 3 秒留存\n越界自查：锁死 13 项与母版逐项一致，通过\n看过感自查：首帧与母版 0 秒并排，受害物与地点都不同，通过\n```\n\n## 6.4 交给下游\n\n- 开头（0–T 秒）→ `benchmark-adapt-hook`，输入：该版改动单 ＋ 情绪节拍表 ＋ 骨架主表\n- 后段（T–结尾）→ `full-storyboard-design`，输入：该版改动单 ＋ 情绪节拍表 ＋ 骨架主表 ＋ 开头交接\n- 提示词 → `adaptive-video-production`，输入：该版改动单 ＋ 情绪节拍表 ＋ 上游两份交接\n\n**下游只读改动单、情绪节拍表、骨架主表和上游交接。** 不许回头重读拆解自己发挥——四个版本一旦各自重新解读对标，越界就是从这一步开始的。\n\n---\n\n# 第七部分：发布后归因\n\n台账第 2 张表每版一行，多填：母版编号、占的子维度、调法。\n\n- 被调那段变好、其余没变差 → 保留，母版版本 +1\n- 变差 → 退回，换调法再试\n- 同一调法连续 2 条变差 → 记\"无效\"\n- 判断只拿**发布头 24 小时**的数和母版同期比；之后会自然下降，不可比\n- 一个调法至少看 2 条再下结论\n\n---\n\n# 第八部分：自查\n\n- [ ] 逐镜表四要素齐全，没有只写\"在修路\"\n- [ ] 七段环节全部归类，没有的写了\"无\"\n- [ ] T 值写了来源和比例校验，不是套的默认值\n- [ ] 表面清单十项齐全，看不清的标了\"看不清\"\n- [ ] 首帧五要素单独写了\n- [ ] **情绪弧单独拆了，五通道逐个查过，写清了哪几个通道承担情绪**\n- [ ] **情绪节拍表十列齐全，强度用了统一标尺 0–3**\n- [ ] 锁死层 13 项逐项对照过，不是\"大致一样\"\n- [ ] 可换层 8 项每版全换，且四项（受害物/地点/天气/穿着）互不相同\n- [ ] 可调层用的是子维度，不是整个环节\n- [ ] 版本数 ≤ 可调子维度数 + 1\n- [ ] V1 是可调层零改动的对照版\n- [ ] 六道判定逐版写了通过/不通过\n- [ ] 调了时间点的版本，写了\"情绪是否要跟着调\"\n- [ ] 每条改动写了四类理由之一\n- [ ] 预期一栏标了\"依据：修坑 4 对\"或\"依据：母版\"，没写\"已验证\"\n- [ ] 没有像儿童的人\n\n---\n\n# 第九部分：不做的事\n\n- 不选源、不拆对标（用 `benchmark-select-and-breakdown`）\n- 不写开头正文（用 `benchmark-adapt-hook`）\n- 不写分镜、不写提示词（用 `full-storyboard-design`、`adaptive-video-production`）\n- **不改锁死层**。要改造的东西或步骤，那是换对标源，不是做版本\n- **不为了凑条数硬拆子维度**\n- 不把\"修坑 4 对\"当因果，只当方向\n"}, "benchmark-adapt-hook": {"label": "③开头·钩子移植", "path": "skills/benchmark-adapt-hook/SKILL.md", "text": "---\nname: \"benchmark-adapt-hook\"\ndescription: \"照一张\\\"未用\\\"的对标卡写出我们自己的新开头（骨架照搬、表面全换），发布后回填数据。用于\\\"照这个对标写开头/微调对标/替换元素/做新钩子/回填数据复盘\\\"。选源拆卡用 benchmark-select-and-breakdown；出提示词和抽卡用 adaptive-video-production。\"\n---\n\n# 对标微调：照卡写新开头\n\n一句话：骨架照原片，表面全换成我们的；每处改动说得出理由；对不对看数据。\n\n依据：阿初的油管库（D:\\自己开发的程序\\阿初的油管\\阿初的油管库.md），行号标【Lxxx】；【我们】是我们自己的补充。\n方法论：D:\\自己开发的程序\\阿初的油管\\方法论v2_20260930\\01_底层方法论_v2.md\n台账：同文件夹 02_对标库与数据台账_持续更新.md\n\n## 第 1 步：拿卡\n\n只用台账里状态为\"未用\"的卡。没有就先去选拆。一张卡只用一次【我们】。\n不要先自己想故事再找卡来套。\"最不应该的 就是全靠自己想象\"【L1217】，\"千千万万不要自己原创\"【L7267】。\n\n## 第 2 步：抄骨架（尽量往原片靠）\n\n把卡里的逐秒表原样抄过来，下面这些尽量不动【L8542】【L6013】：\n- 段数、每段耗时、高潮落在第几秒\n- 入镜出镜的次序和方向\n- 镜头怎么动\n- 每段要传达的意思【L3330】\n- 核心机制【L5811】\n- 【我们】第 0–1 秒的画面关系：换完表面后，观众第一眼仍然要看出\"谁 + 紧挨着什么 + 马上要出事\"\n\n## 第 3 步：换表面（全部换）\n\n按卡里的表面清单逐项换成我们频道的（阳台/房屋改造）：人物、背景、数量、外观、场景、道具、台词【L8540–8542】。\n表面换得越彻底，越不会同质化【L7255–7257】。\n\n换的时候每一项过七问【我们】：\n1. 物理上真的会这样吗（道具行为、距离能不能装进原片秒数）\n2. 这个人为什么这样做（生活动机）\n3. 换完以后这一段的\"意思\"还在吗。不在就换别的，不改骨架\n4. 住在这里的人事先知道这个问题吗？知道的话他平时会绕开。事件要么是他没法预料的（突然起风、来了客人、刚搬进来），要么是他明知道也躲不开的\n5. 有没有更简单的办法他会先用（墨镜、帽子、进屋）？有，就从\"这个办法也不管用\"开始写\n6. 反应力度对吗？真人遇到小麻烦多是皱眉、嘀咕一句、挪挪椅子，不会摔门走人。原片反应多大就给多大\n7. 这个问题有真人抱怨过吗？欧美生活习惯拿不准时，搜 Reddit、评论区的真实帖子核对并贴链接；搜不到就标\"待核\"，不凭印象\n\n反例：女人去没遮阳的窄阳台喝咖啡，被太阳晃到，挪了挪没找到位置，生气走了。错在第 4、5、6 问：住户知道几点晒，会先戴墨镜或不去，也不会为这点事生气走人。\n\n红线：换进来的人不能看上去像儿童【L9588–9596】。\n\n## 第 4 步：删、补、换、留，写理由\n\n和原片不一样的地方，逐条写一行：改了什么 + 为什么。\n合理的理由只有这几类：原片重复拖沓【L3359】、原片交代不清【L1021】、动机变了【L1055】【L1076】、AI 做不出来【L5985】。\n说不出理由的，按原片来。原片拖沓也别自己删改，找相近的参考替换【L7165】。\n\n## 第 5 步：开头硬要求自查\n\n- 不搬原片剧情，观众看不懂剧情【L6502】；爽快的场面往前提【L6496】\n- 不给观众思考和无聊的空间【L8404】，要密度【L8386】\n- 劲不够，就把眼球要素加足【L2840–2844】，不是加自己的故事\n\n## 第 6 步：并排对照，再交生产\n\n1. 把新开头的逐秒表和原片逐秒表并排放，逐段对：耗时、入出镜、意思、第 0–1 秒关系\n2. 差距写出来，能补就补【L2000】\n3. 住户挑刺【我们】：开一个子代理，扮演\"在这间房子住了三年的欧美住户\"，只回答一件事：哪一秒不像真人会做的事、为什么。写方案的人自己查不出自己的毛病。挑出来的改完再往下\n4. 过下面的\"真实感预检\"\n5. 交给 adaptive-video-production 出提示词和抽卡，交接时写明：先出首帧图，和原片 0.0s 截图并排看，不像手机随手拍就不进视频生成\n\n## 真实感预检（交生产前）【我们】\n\n- 每个动作的耗时照原片，不自己估。自己估的几乎总是偏快或偏慢，动作会飘、像表演\n- 场景、人物各列一张\"必须有 / 禁止有\"清单。欧美住宅细节写实（插座、门窗类型、地面材质、晾晒习惯）；禁止样板间式整洁、网红滤镜、摆拍姿势\n- 画质写成家庭手机随手拍：手持轻晃、自然光、有点乱、东西用旧了。不写电影感、4K、完美光线\n- 不写 AI 做不出来的动作（杂物里穿行、手指精细操作、道具变形），换成等效的简单动作【L5985】\n- 成片交用户时只问一件事：像不像真的。用户标\"假\"就行，原因由我们去找\n\n## 第 7 步：止损\n\n- 两次抽卡错在同一处，改提示词；再错，改方案【L6108–6112】\n- 改 5 轮、抽 10 次还不行，改需求【L4463】【L8269】；【我们】还不行就换对标源\n\n## 第 8 步：发布后回填台账\n\n1. 台账第 2 张表加一行：用的卡、骨架照搬程度、选择观看比例、前几秒留存、播放量\n2. 这张卡状态改成\"已用\"\n3. 数据和某条判断冲突，记到台账第 3/4 张表；推翻方法论某条就改 01，版本号 +1【我们】\n\n## 自查（交生产前逐条过）\n\n- [ ] 用的是\"未用\"的卡，不是自己先想的故事\n- [ ] 段数、每段耗时、高潮位置和原片一致或有理由\n- [ ] 第 0–1 秒观众能看出\"谁 + 紧挨着什么 + 马上要出事\"\n- [ ] 表面清单每一项都换了\n- [ ] 每处改动都有理由\n- [ ] 每项替换都过了七问，欧美习惯拿不准的有真实帖子链接或标了待核\n- [ ] 住户挑刺已做，挑出的问题已改\n- [ ] 真实感预检逐条过了，必须有 / 禁止有清单已列\n- [ ] 没有像儿童的人\n\n## 不做的事\n\n不选源、不拆卡（用 benchmark-select-and-breakdown）；不写视频提示词（用 adaptive-video-production）。\n\n"}, "full-storyboard-design": {"label": "④小分镜·分镜设计", "path": "skills/full-storyboard-design/SKILL.md", "text": "---\nname: full-storyboard-design\ndescription: 开头（前3/5/7秒）已锁定后，按对标拆解设计后续完整小分镜，逐段写清动作、情绪、物理与验收，末尾附《移交生产表》交给 adaptive-video-production。用于“做完整小分镜/接着开头往后设计/开头已定写全片分镜”；不用于写生图生视频提示词、不用于重新设计开头、不用于对标拆解本身。\nmetadata:\n  short-description: 开头已锁定后的完整小分镜设计（上游于 adaptive-video-production）\n---\n\n# 完整小分镜设计（开头已锁定）\n\n目标：在不削弱、不偷换已锁定开头的前提下，把后面设计成因果清楚、逐段可执行、结尾真正兑现的小分镜，再交给 adaptive-video-production 生产。\n这里定的是“拍什么、怎么演、为什么”。不写生图/生视频提示词，不决定拆几段生成、要不要首帧——那些归生产 skill。\n\n## 0. 沟通方式（硬规则）\n\n- 大白话，少术语。一次只问一个最影响下一步的问题。\n- 先说结论和下一步，再给细节。\n- 用户已经说清楚的不再确认；直接展示理解，让用户纠正。\n- 用户纠正时：引用原话，记一条纠偏 L，改受影响段，说清改了什么、没改什么。\n\n## 1. 开工前要的材料\n\n必须有，缺了就先要，不自己编：\n1. 锁定的开头：剧本、逐秒说明、关键帧、已生成片段，或一段图生视频提示词都算。\n2. 对标拆解（或对标生产合同）。没有就先做对标拆解，不进本流程。\n\n缺了照常开工，但要标出影响哪一段：开头样片、真实需求证据（帖子/评论）、平台与总时长、结尾要回到的生活动作、人物/场景/道具参考卡。\n\n用户给的是模板占位符（如 `{{比如 YouTube Shorts}}`）就当作没填，暂定一个值并写进未决项。\n\n## 2. 文件放哪\n\n项目文件夹：`E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\{YYYYMMDD}_{项目名}\\`。\n- 先看这个文件夹里已有什么：参考卡、已生成片段、旧版小分镜、任务记录。已有任务记录就先回读，不从头来。\n- 只建一个 `任务记录.md`（模板见第 9 节），另存各版正式稿：`小分镜_v1_首轮.md`、`小分镜_v2_…md`……旧版不覆盖。\n- 规则文件夹和本 skill 目录不写任何项目内容。\n- 不能写文件时，输出可复制的全文并说明“未落盘”。\n\n## 3. 锁定开头怎么处理\n\n- 用户说的“前三秒/前5秒/前7秒”以用户这次说的为准，全文统一用这个时长。锁定段整体作为 N01（或 N01–N0x）。\n- 给的是提示词时，先还原成《锁定页》：谁（外观、衣着）、在哪（空间、关键物件位置）、逐秒发生了什么、结束那一刻的完整状态（谁在哪、物件在哪、门开没开、谁湿了）、观众接下来在等什么（通常 2–3 个）、结尾必须兑现什么。\n- 不改写、不优化。接不上先改后面；真有逻辑冲突，列冲突＋两种改法给用户定。\n- 对照参考卡和已生成片段核一遍；打不开或时长对不上，写进未决项（它决定 N02 从第几秒开始）。\n- 锁定段留下的“挂念”（丢在原地的物件、没说完的话、受影响的人）必须在后面有交代，否则观众会觉得被扔下。\n\n## 4. 读对标：先读出结尾回报，再搭骨架\n\n- 对标拆解是文字，可能漏掉用户在原片里看到的东西；另一个 AI 的分析只算候选解释，不算事实。\n- 搭骨架之前，用一句话向用户确认：“对标结尾给观众的回报是 ___，谁进入成品空间验证？”用户已经说过就不问。\n- 分清两层：\n  - 机制（要保留）：问题怎么让人一眼看懂、每步有没有可见进展、哪段镜头最慢、景别怎么收放、结尾怎么兑现。\n  - 表面（不能照抄）：具体施工方式、材料、动物/人物种类。按新空间的现实可行性替换，例如出租公寓阳台不能挖沟。\n- 用户对原片的描述，优先于拆解文字；原片事实待核就标“待核”。\n\n## 5. 改造片的终局默认值\n\n除非用户另说，改造类视频的终局 = 三件事同时成立：\n1. 问题真的解决了，并且有可见验证（例如下一场雨不积水、地漏在吞水）。\n2. 空间变漂亮、值得欣赏：植物层次、可坐可用、协调材质、合适光线。按普通人能做到的程度来，不做样板房。\n3. 开头的受益者（人或宠物）进入成品空间，重新完成开头被打断的那个生活动作，并有明显情绪反应。\n\n只修功能、只变漂亮、只展示空镜，都算没兑现。\n中段要为第 2 点单独留一段“变漂亮”（植物进场、摆座位、挂灯等），不能让漂亮东西在结尾凭空出现。\n受益者在中段不能消失：给几个很短的插入（≤0.5 秒），让情绪一路积累到结尾。\n\n## 6. 固定要求（用户长期偏好）\n\n- 画面：欧美普通家庭用 iPhone 随手拍的真实感。手持轻晃、景深深、阴天或自然光、不调色。不要大片感、样板房、电影光效、浅景深、慢动作、稳定器运镜。\n- 本地化：场景、人物、物件都要像同一个真实欧美家庭，不能外表欧美、细节不像（封闭阳台、晾衣杆、瓷砖、防盗网、室内拖鞋穿去户外干活……）。需要时列“必须有/禁止有”清单。\n- 物理：道具行为要真实（水怎么流、湿东西怎么干、鞋怎么倒水）；走位距离要装得进**素材秒**（不是成片秒）。装不下时，先换空间布局，再拆刀去掉没信息的走路；不让 AI 把动作加速到不真实。\n- 情绪：每段写清人物情绪、力度（轻/中/猛）、可见表现（视线、手、身体、声音），台词保持原语言逐字写。\n- 连续性：物件数量、衣着、鞋、湿与干、门开关、道具去向逐段对账。\n\n## 7. 交付节奏\n\n第一轮只交三样：\n1. 接手检查：锁定页；观众在等什么；结尾要兑现什么；从对标保留哪些机制；哪些表面不能照抄；缺什么、影响哪段；这轮不做什么。\n2. 全片骨架＋时间预算：一张表，列 N 号、秒数、这段做什么、对应对标哪段、阶段（S0…终局）。\n3. 黄金样段：紧接锁定段之后最容易变味的一段连续内容，按最终颗粒度写（第 8 节）。\n\n用户确认后，按同样颗粒度展开全片。全片确认后，在末尾附《移交生产表》（第 10 节），再告诉用户下一步发什么（第 11 节）。\n用户要求一次出全片时照做，未决项列在末尾。\n\n## 8. 每段固定 7 栏（分组）＋ 15 个字段\n\n标题：`### 对标Dxx → Nxx｜成片秒／素材秒｜本段职责`（新增段写“对标无对应（新增）”）\n\n**「少演不少做」（2026-10-27 核心原则）：** 该做的工作一样不减，但观众不需要看见每一块板，只需要两个证据——「在铺」（2–3 块看得清）＋「已经铺满」（切进来就是结果）。**刀与刀之间可以跳过大段工作（电影语法）；一条镜头里跳，模型就会用走位填空档。**\n\n**7 栏只是阅读顺序的分组；真正的字段是 15 项**，逐项清单在指令文件 `4_小分镜.txt` 的「每一段必须写到下面这些」里，以那份为准。这里只解释每栏管什么。\n\n**必须先写两个秒数（2026-10-27 新增）：**\n- **成片秒**：这段剪完之后占多少。＝对标那一段的长度，是剪辑目标。\n- **素材秒**：这个动作拍完、观众看得清，需要多少秒。**由你按信息量估，不许抄对标。**\n  算法 `起手 0.5 ＋ Σ动作单位 ＋ 收尾 0.5`，动作单位表在 `adaptive-video-production/references/material-seconds.md`。\n- **对标的成片是「AI 生成之后再加速」剪出来的。** 照它的成片秒去拍，一个人做不完，模型就会补走位。素材秒可以远大于成片秒，差额就是剪裁余量。\n- **一刀的定义**：一刀 ＝ 一个人**能连续做完**的一个动作片段，中间不含时间跳跃。做不完就拆刀、中间硬切。\n\n1. 对标情况：对标这段实际做了什么、镜头多长、景别、结构职责。只写拆解里有的，未知写未知。\n2. 新片动作：起始状态 → 逐小段时间的具体动作（谁、在哪、做什么、物件怎么变）→ 结束状态。写机位/景别和关键声音。\n3. 要表现的：观众不用猜就该看懂的一件事；以及不是要表现什么。\n4. 情绪和力度：每个人物的情绪变化、力度词、可见表现、台词原文；观众可能的感受（标“推断”）；与前后段怎么接。\n5. 不能丢：逐条可检查的保留项，标关联的 K 号。至少 1 条。\n6. 差异、风险、证据：对应程度（完整/部分/新增/合并/删减）和理由；物理与时长能否装下；AI 生成容易出错的地方（数量、穿模、道具漂移、凭空出现/消失）；哪些是创作设定，哪些待核。\n7. 验收：现在在哪一层能确认（文字/首帧/视频/成片/发布）；还不能打勾的；下一步查什么。\n\n不许：把几段对标合成一句“10–26 秒：施工、期待”；只写形容词不写动作；把原片事实和新片创作混写；为压时长删掉已确认节点（合并要写映射和理由）。\n\n## 9. 任务记录模板（`任务记录.md`）\n\n```text\n# 任务记录｜[项目名]\n## 0. 当前状态：版本/日期；阶段；本轮目标；本轮不做；下轮唯一优先动作\n## 1. 原片与需求：对标名/时长；材料状态；真实需求（有无证据）；平台与时长\n## 2. 来源表 E：| ID | 材料 | 类型 | 位置 | 状态 | 缺口 |\n## 3. 已确认 K：| ID | 要求 | 用户原话位置 | 范围 | 影响段 | 生效/被替代 |\n## 4. 未决 P：| ID | 问题 | 选项与影响 | 阻塞什么 | 最小补证动作 |\n## 5. 纠偏 L：| ID | 用户核心意思 | 原错误 | 新做法 | 影响段 | 是否落实 |\n## 6. 映射：| 对标段 | 新片段 | 完整/部分/合并/新增 | 差异 |\n## 7. 最近变更：版本；改了什么；为什么；哪些没动\n```\n\n来源要能回到文件名或带日期的消息，不写“上面说过”。“已确认”必须是用户确认过的，AI 自己认可的不算。\n\n## 10. 移交生产表（全片确认后附在正式稿末尾）\n\n生产 skill 只读这张表和逐段正文，不读对标分析。只摘录已确认内容，不新增设计。\n\n1. 终局：最后谁在空间里、在哪、做什么；空间里有什么（地面、植物、座位、灯）；重新完成的开头动作。\n2. 锁定项：已生成、已接受的开头片段和图片的文件路径；不可改的动作和硬时间。\n3. 阶段路线：S0 改造前 → S1 … → 终局；每阶段新增了什么、还没有什么。\n4. 人物、动物、主要物件：名称；参考卡路径或“待制”。\n5. 小分镜清单：\n\n| N编号 | 成片秒 | 素材秒 | 阶段 | 起始 → 动作 → 结束 | 观众新信息 | 机位与景别 | 声音 | 不能丢 | AI生成风险 |\n|---|---|---|---|---|---|---|---|---|---|\n\n6. 未决项：还没确认、会影响生产的事。\n\n不写：拆成几个生成单元、要不要首帧/尾帧、任何提示词。\n**但「素材秒」要写**——它是\"拍多少\"，不是\"拆几段生成\"。这两个别混：素材秒是拍摄时长，生成单元是下游的事。\n\n## 11. 交完之后\n\n全片确认、移交表附好后，本流程结束。告诉用户开新对话发这段：\n\n```text\n用 adaptive-video-production 这个 skill。\n项目文件夹：{绝对路径}\n这是新项目，完整小分镜已确认：{小分镜文件名}，末尾有《移交生产表》。\n从 SKILL.md 第 1 步开始，终局和小分镜直接用这份，不重新设计剧情。\n```\n\n## 12. 交付前自查（每轮都过一遍）\n\n- 锁定段一个动作、一句台词都没改；锁定页的结束状态和 N02 的起始状态完全一致。\n- 锁定段留下的每个挂念都有交代。\n- 每个解决动作对应一个前面看得见的问题；每段结束比开始多一个可见变化；没有随机擦拭/装饰蒙太奇。\n- 中段交代了问题原因（不只是“修了”）。\n- 终局三件事同时成立（第 5 节）；结尾不看字幕也能懂问题解决了。\n- 每段 7 栏齐全，情绪有触发和动作，不只是形容词。\n- 物件数量、衣着、干湿、门的开关逐段一致。\n- 原片事实、AI 推断、创作设定分开标注；施工内容不冒充专业建议。\n- 没有写任何提示词或生成拆分（素材秒不算生成拆分，它是拍摄时长）。\n- 每一刀都有成片秒和素材秒两个数，且素材秒 ≥ 1.0 秒；每一刀都是一个人能连续做完的片段。\n\n## 附：两个最常见的错（来自实际项目）\n\n- 只修功能不变漂亮：2026-09-27 阳台积水项目，首稿只通了地漏、铺了地板，用户纠正“对标不光解决了泥坑，还做得很漂亮，狗过去验证”，于是加了“变漂亮”段和受益者验证。\n- 把“前三秒”死板理解：锁定段可能是 5 秒、7 秒，也可能只给了一段提示词。以用户这次说的为准，先还原故事再往下接。\n"}, "adaptive-video-production": {"label": "⑤生产单元·主 skill", "path": "skills/adaptive-video-production/SKILL.md", "text": "---\nname: adaptive-video-production\ndescription: Turn shot lists, scripts, reference videos, images, or failed generations into ready-to-submit AI video production packs — generation units, shared multiview reference cards, copy-paste Chinese image/video prompts, and targeted local repairs. Use for practical video production; not for video theory, topic selection, or post-publication analytics.\nmetadata:\n  short-description: 自适应 AI 视频生产与多视图参考卡规划\n---\n\n# 自适应视频生产\n\n目标：用最短总用时，把小分镜变成可发布的素材。观众看得懂、情绪和功能兑现，是唯一验收标准。图数、抽卡数、生成秒数、利用率都只是诊断信号。\n\n**这些信号只能用来发现问题，不能用来做决定。** 它们和「一盒装不装得下」冲突时，一律以装得下为准。实测过一次：一盒写了两件事，第二件一次都没生成出来，而图数、秒数、取用率全部正常——事后指标看不见丢件。\n\n## 渠道参数（唯一登记处）\n\n用户 2026-09-23 确认，其他文件只引用这里：\n\n| 项目 | 值 | 用法 |\n|---|---|---|\n| 生参考图上传上限 | 4 张 | 只传本卡真正要借的父图 |\n| 图生视频上传上限 | 4 张 | 硬上限，超过传不进去。每段传 2–4 张有明确职责的图 |\n| 视频可选时长 | **生产档位 13–15 秒**（装满一组） | 平台容量 4–15 秒整数。一组装满 13–15 秒、6–7 刀、每刀约 2 秒（阿初 `L4527–4529`、`L4550`）。末组除不尽可短，不低于 4 秒。**旧的「4–10 秒」2026-10-27 撤销**：那 9 次实测**全部是单镜头盒（0 刀）**，证明的是「一条连续镜头塞 3–4 件事会丢件」，不是「长盒子不行」；同日下午 U04_v01 12 秒 4 刀、U05_v03 11 秒 4 刀，切点全部一帧干净 |\n| 画幅/音频/切镜 | 以用户实际界面为准 | 未核对就标“待确认”，只阻塞提交 |\n\n参数变了只改这张表。\n\n## 语言（用户 2026-09-28 定，硬规则）\n\n- 所有提示词（制卡词、视频正文、声音描述、禁止项）一律用**简体中文**写。用户要能看懂每一句。不要因为“模型对英文更好”自行改成英文；用户明确要求某一条用英文时才例外，且只改那一条。\n- 人物台词、口播、旁白**保持小分镜里的原语言，逐字照抄，不翻译**。英文口播就写英文原句，放进中文正文的引号里，例：妈妈大声喊：“Lily, stop! Not in the water!” 翻成中文是严重错误。\n- 修复、改写、换语言重写时，台词原文不动。改了台词必须是用户明确要求。\n\n## 四种输入，各管一件事\n\n| 名称 | 是什么 | 何时用 |\n|---|---|---|\n| 参考卡（图） | 同一人物/空间/阶段的多视图卡，可带简短中文标签 | 默认；人物卡管身份，空间卡管建筑，阶段卡管当前状态 |\n| 生产卡（文字） | 上传哪几张、各借什么、完整视频正文、设置、输出名 | 每个生产单元一张 |\n| 单幅首帧（图） | 锁定视频开头的一个时刻 | 工具只支持首帧、构图必须锁死，或出现关键几何错误时 |\n| 续接截帧（图） | 前段视频里的实际姿态 | 同一动作必须无缝延续时 |\n\n默认路径是“共用参考卡＋当前动作文字→视频”。叙事先后、施工先后都不产生尾帧依赖；只有无缝动作才等截帧。依据：用户 2026-09-14 鸽子项目实战“提速特别多”，2026-09-23 窗改项目“几乎没有浪费”。\n\n## 你是谁：总控还是子任务\n\n- 用户直接开的对话就是**总控**。只有总控面对用户：收反馈、做决定、改快照、派子任务、每轮结束告诉用户下一步。用户不需要提醒你开子任务或检查，第 7 步规定的时刻你都要主动做。\n- 任务里写着“写词子任务”“检查子任务”“修复子任务”时，你是**子任务**。只读给定的快照和单元卡，写回文件就结束，不和用户讨论，也不改快照。\n- 用户有问题一律找总控。子任务出的错由总控检查发现，派修复。\n\n## 工作流程\n\n接手先读项目快照的最新 R 号和台账里的最新有效记录。项目文件夹里没有快照，就是新项目，从第 1 步开始，在该文件夹里建快照和台账。已确认的剧情、设置、接受状态直接复用。查不到又影响执行的缺口，集中问一次；缺口只阻塞依赖它的那次提交，规划和写正文照常推进。\n\n### 1. 定终局\n\n用户给的是已确认的完整小分镜、末尾附《移交生产表》时：终局、锁定项、阶段路线、人物物件直接抄进快照，N 清单就是第 2 步的输入；不重新设计剧情，只检查能不能拍，拍不了的列给用户改。否则：\n先写清观众在等什么、最后人物怎样使用空间（几个人坐、桌上放什么、通道在哪）、哪些动作和硬时间锁死。功能闭环缺失时读 [输入与终局](references/intake-and-end-state.md)。多个单元共享一个逐步变化的空间时，读 [阶段规划](references/state-planning.md)，先定终局布局和必要阶段，再决定做哪些卡。\n\n### 2. 筛分镜、定单元\n\n每个小分镜给一个结论：保留、并入相邻动作、降为可选过渡、删除。判断标准只有一条：观众静音能否看出新信息或必要的情绪/功能停留。\n\n然后合并。同一人物、空间和时间里能自然连下来的动作放进一条（例如“搬入→放下”）。满足以下任一条件才拆：可选时长装不下、构图或物理条件不兼容、实测超载、用户要求单独交付。\n\n**一条生成内部装 6–7 刀（13–15 秒装满），每一刀只有一种运镜、一条动作线。刀没有最小时长——1 秒也行**（阿初的 15 秒组就是 2/2/2/3/5/1，`阿初的油管库.md` L4550）。**刀数是除出来的，不是规定值：生成秒数 ÷ 2。** 写出 2–4 刀的盒子，等于每刀 4–7 秒，那一刀里必然有 3 秒无事可做。 Seedance 的公开规范写「单条提示词只写 1 种运镜，多镜头必闪屏 / 割裂」——那条约束的是**一条运镜里塞多个机位**，不是禁止写切点。实测 2026-10-27：写明「近景 0.55 m 俯拍 → 硬切 → 全景 1.45 m 略仰」，一帧切干净（F00053→F00054，无过渡帧），机位不漂；**只挪机位、不换景别的\"切\"才漂**——观众看不见那个切，模型就当成一条连续长镜头演下去。判据与写法见 [内部硬切](references/internal-cut.md)。\n\n**装多满由秒数决定，不由件数决定：13–15 秒 ÷ 2 秒 = 6–7 刀，装满为止。**（2026-10-27 实测：12 秒盒子里写“搬第一个 + 搬第二个 + 两趟推车”，第二个动作一次都没生成出来——但那是因为**搬一个墩要 4–5 秒，12 秒装不下三个 4–5 秒**，不是“件数超过 2”。同一批 15 秒装 5 刀、6 刀都没有这个问题。**限制是总时长装不装得下，不是件数。** 原来那句「一盒最多两件事，三件以上一律拆」是错的归因，已撤。）\n\n**还有一条更硬的：一条生成只能装一个地点的一件事。动作里出现「从 A 走到 B 再放下」，必须拆成「起手镜头 ＋ 落点镜头」，中间硬切。** 理由是模型记不住人物手里拿着的东西——人一走远，手里的物体就被丢掉。同一件事试了 5 次，最后一次只写一个动作、8 秒给足、措辞全对，**独轮车和墩照样在人物走远时消失**。这不是措辞、时长或负载问题，是能力边界。判据和拆法见 [一次一个地点](references/one-location-per-shot.md)。\n\n**这一步要顺手过一遍每个小分镜：这条能不能一次生成做完？** 不能的当场标「拆两镜」，不要先划完单元再去试。\n\n**分镜表里的一「段」是剪辑结果，不是拍摄内容。** 母版写「4.633 秒，拆掉旧栈道，旧板被撬起搬走，两岸清出裸土」，那是几十分钟的活剪成 4.6 秒。照抄成一次生成，等于要求模型 4.6 秒拆完 9 米桥面约 60 块板——物理上不成立，改多少措辞都不成立。**落笔前先算一遍：这一段里人手的自然速度，要不要超过这一段的秒数？** 超过就按时间跳跃在段内切刀，每刀只演一个能自然做完的片段（撬起一块板 2.2 s ＋ 硬切 ＋ 桥面已空 2.4 s）。观众接受时间跳跃，因为母版就是这么剪的；不接受的是「4.6 秒演完几十分钟」。细则见 [内部硬切](references/internal-cut.md)。\n\n反过来，一盒只装一件事、生成 4 秒、成片取 2.5 秒，是一盒一件的正常样子，不要因为“生成秒没用满”就硬加内容。\n\n**换机位、换工序、风险高、需要独立验收、\"状态变了\"，都不算拆分理由**，因为合并后可以用内部硬切表达（每刀一机位一动作，刀间换景别，切点写成「硬切，一帧完成，不许推拉摇渐变」）。真正的拆分理由只有上面那四种。\n\n时长从动作推：先估动作和必要停留要几秒、预计可剪几秒，再选最近的档位。**时长按动作自然完成的时间给足，成片秒数靠剪辑拿**，不要为了让生成秒贴近成片秒数而压缩动作。细则见 [分镜与生成单元](references/shot-vs-generation-unit.md)、[提示词密度](references/prompt-density-and-merging.md)。已生成的素材保留，新方案只安排剩余内容。\n\n### 3. 先交生产总图\n\n参考卡阶段确定后，先交一张总图，再展开生产卡。总图回答四件事：\n\n- 每个小分镜归哪个单元，合并理由是什么。\n- 每个单元传哪几张图，每张负责什么（身份/空间/当前阶段/材料/目标），哪些已有、哪些待制。\n- 每张待制卡的父图、完整制卡词、输出名、服务哪些单元。\n- 关系图：`小分镜 → 单元 → 图/制卡词 → 视频词 → 视频`。实线表示真实输入依赖，虚线表示归属或硬切。\n\n格式见 [台账规范](references/production-ledger.md) 和 [台账模板](templates/production-ledger.md)。台账、快照和单元卡放在同一个项目目录里，一个项目只有一本台账。单元多时，总图的内容直接落进 [项目快照](templates/project-snapshot.md) 的单元表和图片职责表，不另写一份。\n\n### 4. 选卡、制卡、查冲突\n\n按 [参考图策略](references/reference-image-policy.md) 执行。优先复用现有的人物、建筑和阶段卡；只在信息不够时补卡，已知缺的视角可以提前补。一张卡只画同一对象、同一阶段，多个视图之间几何要相容。\n\n上传前逐张打开实际图片核对。如果一张卡上显眼地画着本段还不该出现的东西（未来的顶部、家具、完成地板），就去掉这张、换一个合适的视图，或者局部补图。靠文字写“只借局部”压不住图像。\n\n### 5. 空间合同（凡是换机位、安装、跨内外的单元都必做）\n\n内外翻转已经在两个项目里出现过：一次是网内外颠倒，一次是外挑框架跑进室内。所以这类单元写视频正文之前，先写四行：\n\n- **锚点**：2–4 个所有机位都不变的原建筑（墙面、门、栏杆、窗洞），用它们描述方位，不写“画面左/右”。\n- **关系**：新构件在锚点的哪一侧、附着在谁身上；操作者站哪边，都不改变构件所在的面。\n- **状态**：起点有什么 → 谁通过可见接触改变了什么 → 终点仍然没有什么。\n- **证据视点**：哪个镜头证明了功能（能坐、能挡、能通过）。\n\n参考卡和正文都要服从这四行。生成后静音看一遍，先确认锚点关系没变。\n\n**分工：锚点管「内外、附着在哪一面」，画面坐标管「远近、长条贯穿、这一头有没有」。** 两套不许混着用——写\"远端/近端/两端/全长\"一律改成画面坐标，细则见 [空间怎么写](references/space-wording.md)。\n\n### 6. 写生产卡\n\n按 [提示词与时间转译](references/prompt-and-performance.md) 写。顺序按 Seedance 的权重规范排（越前面权重越高，稳定约束和负面词放最后）：\n\n1. 每张图借什么。\n2. 当前阶段、站位、哪些还没完成。\n3. 从贴近有效动作的可信起点开场（道具已在手、人已到位，但来处合理）。动作写「慢、连贯」：缓慢转身、缓慢蹲下、动作轻柔流畅、无僵硬感。\n4. 谁接触什么、产生什么可见变化。\n5. 接下一个有效信息或必要停留。\n6. 相机：**逐刀写机位**（焦段＋高度＋角度＋固定），相邻两刀景别必须不同；每处切点单独一行写「⚠️硬切至镜头N：一帧完成，不许推拉、不许摇、不许渐变、不许叠化、不许闪白」。一刀之内只写一种运镜。\n7. 声音。\n8. **稳定约束（必写，固定一行）**：`面部与人体结构正常、五官清晰不崩坏、动作连贯不僵硬、衣物与发型一致、背景不闪烁、画面无割裂、人物与手持物件全程不消失。`\n9. **负面词（必写，两串分开）**：先抄稳定串 `画面闪烁、卡顿、跳帧、变脸、变形、穿模、肢体畸形、多手指、模糊、重影、色彩断层、人物消失、动作不连贯`，再写本项目的内容串（不要出现第二个人、不要出现文字等）。\n\n第 8、9 条不是可选项。缺了它们，模型收不到「别崩、别丢」的指令——本项目实测丢过整辆独轮车和一个混凝土墩，负面词里当时没有「人物消失」这一条。\n\n真实感先靠参考图本身：普通住宅尺度、使用痕迹、自然光。正文只写当前景别看得见的细节。\n\n声音按“动作—声源—时间”写：可见动作配短促同步声，底下垫一层低环境声；情绪停留可以写克制的无歌词纯音乐，并写清何时进、何时退。无对白、环境声、动作声、配乐是四个独立选择，分别写明。\n\n时间分三层写：成片预算、生成时长、素材内节奏。“成片取 1.6 秒”说的是剪辑，生成时让动作自然完成。\n\n**要表达位置和距离时，按 [空间怎么写](references/space-wording.md) 写：禁用「两端/对岸/全长/近端/远端/另一头」，改用「画面最下缘/画面最上缘」＋两端点名＋数量＋米数。** 这条有 4 次失败、1 次成功的实测记录，不是偏好。\n\n要落到文件的生产卡，格式一律按第 7 步末尾的固定格式（程序读取的单元卡和说明文件分开写）。用户只想自己试生成时，只给上传图、设置、可复制正文和一个观察点。要全片或交接时，给总图加完整卡：[标准说明](templates/standard-generation-card.md)，复杂几何再加 [关键镜头说明](templates/high-risk-generation-card.md)。\n\n### 6b. 有台词或旁白的单元\n\n遇到口播或旁白时：\n\n- 正文里写出台词原文，不写“此处加台词”。台词语言按上面“语言”一节：原语言逐字照抄，不翻译。\n- 按台词字数估出说话时长，再加上动作和停顿的余量，一起决定单元时长。台词装不下就拆单元，不压语速。\n- 写清语气、重音和停顿。模型默认读得很平，这些要明确写出来。\n- 口型同步不可靠时，用构图避开嘴部（侧脸、背影、手部、远景），或者改成画外旁白。\n\n2026-09-28 阳台积水项目首次实用：英文口播被写成中文，是严重错误，已由“语言”一节约束。时长估算等其余做法仍按 [抽卡与停止](references/sampling-and-stop-rules.md) 继续记录。\n\n### 7. 调度：文件驱动，短上下文并行\n\n单元数 ≥4，或用户要求并行时，按 [文件驱动生产](references/file-driven-production.md) 做。要点：\n\n- 信息只存文件：[项目快照](templates/project-snapshot.md)（冻结的“做成什么”，含共享块和已知坑）、台账（进度和实际文件）、每单元一张单元卡。对话随时可关，新对话读文件接着干。\n- 共享块（画面规范、人物、空间、风格光线、环境底声）只在快照里写一次，每条正文原文照贴。子任务只写本单元专属的阶段、动作、接触、镜头和动作音效。\n- 每个写词子任务只拿快照 + 负责的单元卡，不给历史对话。按阶段分组，相邻单元放同一组，每组 2–4 个单元。写词子任务不占生成名额。\n- 按轮次批处理：定快照 → 批量制卡并附验收清单，用户一次审完 → 子任务并行写词 → 新上下文做提交前检查 → 用户一次生成全部视频、一次汇总问题 → 只修有问题的单元。\n- 反馈写回文件：单元问题升单元卡 v 号，通用问题写进快照“已知坑”并升 R 号。\n- 由总控主动推进：第 2 步单元一定完就数单元、宣布走哪种方式；每轮结束用三行告诉用户刚做完什么、要用户做什么、下一轮是什么。开不了子任务时，把要让用户新开的窗口和每个窗口要发的话一次给全。总控自己对话过长时，主动建议换新总控并给出开场话术。细则见 [文件驱动生产](references/file-driven-production.md) 第 9 节。\n\n3 个及以下单元可以由总控直接写，但仍然先写快照。多条生产线同时推进时，另见 [并行规则](references/parallel-production.md)。用户说“一次给齐”时，按 [一次性交付协议](references/one-shot-handoff.md) 冻结当前快照版本，交齐所有已确定单元。正文一律写完整，不写“同上”或占位符。\n\n用户按约定把文件放进可用目录，就算接受。AI 没看过的素材，不写“已审”。\n\n提示词定稿后交给自动生产程序，不让用户手工复制。最终交付一律按 [交给自动生产程序](references/auto-production-table.md)（2026-10-06 定稿，硬规则）输出，这一步只适配现有导入程序的输入格式，不改程序、不改已确认内容：\n\n- `共用卡制卡词.md`：所有图片任务，每节 `## RC01｜名称` → `生产状态：` → `父图：` → `输出：生成\\RC01_名称_v01.png｜模型｜比例｜清晰度｜画质档` → 唯一 ```text。模板 [共用卡制卡词](templates/shared-card-prompts.md)。\n- `单元\\U01.md`：每条视频一个文件，只有标题、五行头部（本卡版本/生产状态/生成/上传顺序/输出文件名）和 `## 拼好的完整正文` 下唯一 ```text。模板 [单元卡](templates/production-unit-card.md)。\n- `说明\\`：分析、空间合同、专属部分、版本记录、历史和待确认事项，程序不读。模板 [单元说明](templates/production-unit-notes.md)。\n- `导入核对清单.md`：逐条任务＋统计＋十项自检，每次必交。模板 [导入核对清单](templates/import-checklist.md)。\n\n路径一律写 `项目文件夹\\准确文件名` 或 `项目文件夹\\生成\\RC编号_名称_v01.png`；状态只写定稿或草稿；参数全部显式填写。不碰 Excel、不改程序和台账。能运行导入器就只做离线解析验证，不能运行就写“已按格式逐项检查，未实际运行导入器验证”。直接交付标准文件和核对清单，不只给框架。\n\n### 8. 局部修复\n\n读 [抽卡与停止](references/sampling-and-stop-rules.md)。达到观看任务就停。失败时先定位是哪一层出的问题：目标、输入冲突、单元超载、提示词漏写、工具能力、声音。只修这一层，已可用的片段保留。同一个错误出现两次，就换输入、构图或负载，不要继续换词重抽。换个单元也会出现的错误，写进快照“已知坑”。偏差按 [变更短记录](templates/production-change-log.md) 记，结果按 [结果简记](templates/review-result.md) 记。\n\n## 常见错误\n\n| 错误 | 正确做法 |\n|---|---|\n| 每段都先做一张首帧图 | 共用参考卡直接生视频 |\n| 按分镜编号排尾帧链 | 硬切各自准备，只有无缝动作才等截帧 |\n| 为凑档位把 1 秒动作拉到 5 秒 | 合并相邻动作，或只取可用短段 |\n| 一盒只装 2 刀，或反过来硬塞三件事 | 两种都错：**按 13–15 秒 ÷ 2 秒 = 6–7 刀装满**。刀少＝每刀被拉长，多出来的时间是傻站；塞不下＝总时长不够。判据看总秒数能不能装下，不看件数 |\n| 生成 12–15 秒的大单元 | **生产档位 13–15 秒，标准做法**（2026-10-27 起）；一棵树/一道工序单独成盒反而会做长刀 |\n| 让一个镜头完成“从这头搬到那头” | 拆起手镜头＋落点镜头，中间硬切；模型记不住手里的东西，人一走远就丢 |\n| 一条生成内部把多刀写成一条连续长镜头 | 每刀一机位一动作，刀间硬切，且必须换景别；切点单独一行写「硬切，一帧完成」 |\n| 两刀景别相同、只挪机位就以为切了 | 必须换景别（近 ↔ 中 ↔ 全）；同景别同机位的切观众看不见，模型会当成一条连续长镜头 |\n| 把母版一段「4.6 秒拆完整座桥」直接当成一次生成 | 母版一段是剪辑结果；按时间跳跃在段内切刀，每刀只演一个能自然做完的片段 |\n| 一段写着 4.6 秒但需要 30 秒的活，靠\"生成秒给足\"硬做 | 算人手自然速度要不要超秒数；超了就切刀，不是加时长 |\n| 为了\"这一刀别太静\"往里加过渡动作（擦汗／直起腰／后退半步／看一眼成果／把工具戳在地上／走过来站住） | **先翻小分镜这一刀的「那一个动作／接触对象／终点状态」，只有这三处写了的才能进提示词。** 实测 2026-10-27：U04＋U05 两盒 23 秒里 5.9 秒（26%）是这么加出来的，小分镜一处都没有，成片里就是白走 |\n| 状态变化在切点上，却从\"完成之后\"开始写（桥已铺满、他走在桥上） | 写「完成那一下」：最后一块板还端在手里，放下去、锤敲两下。起手＝必须看见那一下的前 0.3 秒 |\n| 分镜写「脚步还没停」就写成\"走过来再转身\" | 分镜那半秒只值两声脚步。明写「只许原地并一下步（约 0.4 秒）就停住」并否掉「不许先走一段」；实测写成走位模型会给 2.5 秒 |\n| 靠给某一刀加秒来控制节奏 | 秒数是建议值，模型会漂（写 2.8 秒实出 4.6 秒）。节奏靠刀数和刀的内容，能写住的只有\"没有多余动作可做\" |\n| **让一刀要求一个\"上一刀画面里没有、这一刀内又做不完\"的状态** | **内容层失败的头号原因。** 模型不会停下来问你，它会自己编一段过渡把它填上——走过去、搬东西、站着，全是废动作。实测：U04 第 3 刀要\"桥面铺满\"（上一刀只演了一块板），模型让他抱着长木条站在空桥上；U05 第 4 刀要\"她在桥心\"（上一刀她在校车台阶上），模型让她走回去 2 秒。**合法出口只有三个：上一刀已经看见／这一刀演得完／结果镜头静态重新起手** |\n| 一盒塞四个工序（架梁＋铺板＋立栏杆＋铺碎石） | 每一刀都在跳状态，有效取用率掉到 65%。**一盒一工序**：18 秒生成拿 12.5 秒可用（约 70%），多花 3 秒但多拿回 2.7 秒，且不用重抽。塞得越满，废得越多 |\n| 相邻两刀\"都写了全景\"，以为换了机位就是切 | 切点两侧实际画幅相同，观众看不见这个切，模型会连成一条推近长镜头（U05 第 1→2 刀实测：2.208 的切点两侧都是全景，近景一直到 4.875 才靠推近出现） |\n| 写\"只拍腰以下的近景\" | 模型不会\"一进来只有腿\"，实测两次都失败。要表现\"手没扶栏杆\"改用全景＋手明显垂在身侧，或俯拍桥面只拍脚与栏杆的关系 |\n| 用\"这个动作成片里会不会被剪掉\"当判据 | **这条判断不了。** 剪辑台的决定写卡时无法预判，视频模型也看不到这句话。换成可查的两条：① 这一刀要交代的事写成 6 字短句，和前刀一样就删一刀（阿初：拖沓＝传达同样信息的重复镜头，L3359）② 按\"发生了什么变化\"切段，有\"没变化\"的段就是空的 |\n| **拿分镜的「成片秒」当生成秒用** | 分镜那一栏是**剪完的长度**，不是拍摄长度。成片 4.7 秒的\"40 块板铺满\"，一个人真做要 10–12 秒。**生成秒要按素材秒定，长出来的剪掉**（阿初 15 秒生成、13 秒成片，L4622）。按成片秒生成 = 每个动作被压在自己那一格里做不完 = 模型补走位 = 废动作 |\n| **按单刀卡取用率 60%** | **数学上不成立。** 平台单段最少 4 秒，成片 <2.4 秒的刀用 4 秒生成必然低于 60%（转头 0.834 秒→20.8%、立栏杆 2.033 秒→50.8%、末镜 1.920 秒→48%）。按刀卡会强制这些刀**跨工序并进别的盒子**，而跨工序合并必然产生状态跳跃——10-27 U04 那盒四道工序就是这么来的。**取用率只在盒级考核，目标 87%（阿初 86.7% 也是组级数字）** |\n| 把「中间段时长 ÷ 工序数 ≥ 对标×0.9」当成生成密度要求 | 这条只管**成片看起来不像\"浅浅收拾了一下\"**，跟拍摄要几秒无关。拿它压素材秒，等于让一个人在 0.5 秒里做完 10 秒的活 |\n| **把\"对标那一段几秒\"当成\"自己要拍几秒\"** | 对标的成片是「AI 生成之后再加速」剪出来的。它 4.7 秒的铺板，你照着拍 4.7 秒，一个人铺不完 40 块 —— 模型只能补走位。**素材秒按 `references/material-seconds.md` 算**（起手 0.5 ＋ Σ动作单位 ＋ 收尾 0.5），成片秒＝Σ素材×0.867，是结果不是约束 |\n| 把一段\"一个人做不完的活\"写成一条镜头，靠\"演着演着就完成了\" | 一刀的定义是「一个人能连续做完的一个动作片段」。**判据：按\"发生了什么变化\"切段，有\"没变化\"的段就是不合格**，必须拆成两刀、中间硬切 |\n| 把取用率目标定成 100% | 阿初自己 15 秒生成、13 秒成片，取用率 86.7%（L4622）。**目标 87%**；允许的 13% 是节奏剪切（2 秒剪成 1.5 秒），不是人物白走 |\n| 禁止项写成「不要出现绳索栏杆」，把开头的对照物一起杀掉了 | 禁止项必须**写清是\"新的那个\"还是\"旧的那个\"**。2026-10-27 U04 实测：为防止新栏杆被画成绳索，写了「不要出现绳索栏杆」，结果连旧钢索一起去掉——而分镜明写「钢索不得在这一刀消失（它是开头的证据）」。改成「**新栏杆**做成绳索／铁艺／横板」＋「**旧钢索**被拆掉、被拉直」 |\n| 生成 12–15 秒的大单元 | **生产档位 13–15 秒，标准做法**（2026-10-27 起）。一个工序单独成盒反而会把那一刀拉长到 4–5 秒，出傻站 |\n| 负面词只写「不要出现第二个人」这类内容禁止项 | 稳定串（闪烁/变形/穿模/人物消失）＋内容串，两串都写 |\n| 动作写成「把墩搬过去」 | 写成慢动作序列：缓慢弯腰、双手扣住、缓慢抬起，并加稳定约束 |\n| 搬东西那条反复改词重抽 | 同一个动作改到第二遍没成就换镜头语言（拆两镜），不要改到第五遍 |\n| 写“两端/对岸/全长/近端/远端/另一头” | 改成“画面最下缘/画面最上缘”＋两端点名＋数量＋米数 |\n| 指望多视图卡画对“相隔很远的两头” | 多视图卡只管单个对象的形体；空间关系靠正文，参考图用单幅透视图 |\n| 只写“水泥墩”，不写形状和“不是什么” | 写六面平整有棱角、有凹槽，并明写“不是圆柱、不是水泥管、不是塑料桶” |\n| 用长串“禁止”压制冲突的参考图 | 换图、限定职责或补局部图 |\n| 只写“手机感”来追求真实 | 先修参考图的尺度、痕迹和光线 |\n| 把计划文件名当成已有的图 | 计划路径必须有对应的上游 RC 任务、输出名逐字一致；没有上游任务就是缺口，标草稿 |\n| 单元卡里混入分析、版本记录、多个 text 块，或给机器字段换名字 | 单元卡只留标题＋五行头部＋`## 拼好的完整正文`；其余写进 `说明\\` |\n| 上传顺序写“人物图、场景图”或“同上” | 写 `1 名称 = 项目文件夹\\准确文件名.png`，编号连续 |\n| 交付只给框架，让用户自己整理 | 直接交标准文件＋`导入核对清单.md` |\n| 一个局部失败就重做全片 | 只补失败单元，共享卡不动 |\n| 在一个长对话里逐条写全部提示词 | 写快照，按组开短上下文子任务并行写 |\n| 每条正文各自描述人物和空间 | 共享块原文拼接，只写专属部分 |\n| 等图出来再写视频词 | 制卡词附验收清单，用户审图；偏差只改受影响的词 |\n| 生成一条修一条 | 按轮次批量生成、批量汇总问题、批量修 |\n| 修改只说在对话里 | 写回单元卡或快照，升版本号 |\n| 写词的对话自己检查自己 | 新上下文对照清单做提交前检查 |\n| 等用户提醒才开子任务 | 到了第 7 步的时刻，总控主动开，并告诉用户 |\n| 让用户去和子任务对话里沟通问题 | 用户只找总控；子任务写完就结束 |\n| 提示词写成英文 | 一律简体中文；用户要求英文才改那一条 |\n| 把英文口播翻成中文 | 台词按小分镜原语言逐字照抄 |\n| 手穿玻璃、穿模就改词、加禁止词 | 先剪、再重抽 1 次，仍有才改构图或动作 |\n| 对话被压缩了还不提醒换总控 | 压缩过一次就写台账，并给出新总控开场话术 |\n\n## 例子\n\n实战例子：[窗改外挑低浪费](examples/window-bay-low-waste.md)（先读）、[鸽子多视图](examples/pigeon-multiview.md)、[窗改交接回归样品](examples/window-bay-handoff-golden.md)。归档例子（首帧/续接模式，未实测，只在走条件分支时参考）：[海鸥生产网](examples/seagull-ledger.md)、[海鸥阶段](examples/seagull-plant-batch.md)、[海鸥N15首帧](examples/seagull-n15-prompts.md)、[猫通道虚构样品](examples/golden-sample.md)。\n\n交付时写清哪些是用户已验证、哪些是推断、哪些还没生成。\n"}, "adaptive-video-production-internal-cut": {"label": "⑤生产单元·内部硬切细则", "path": "skills/adaptive-video-production/references/internal-cut.md", "text": "# 内部硬切：一条生成里装 6–7 刀\n\n> 2026-10-27 定稿，当晚按阿初口径修订。起因：B0009 连续五轮改措辞无效，全部失败在同一处——把「3 个短镜头」写成「1 条连续长镜头」。\n\n## 一句话\n\n**一盒装 6–7 刀（13–15 秒装满）。每一刀一个机位、一个动作；刀与刀之间硬切，且必须换景别。**\n\n## 为什么以前写不出来\n\n指令和 skill 里有两句互相打架的话，AI 只能挑一句执行，结果就是「合并成一个盒子，但盒子里不许写切点」——只剩一条连续长镜头能写。\n\n| 位置 | 原话 | 后果 |\n|---|---|---|\n| `指令模板_v3/5_生产单元.txt` 第 2 步 | 「一条生成内部只有一种运镜、一个连续动作，**不写内部切镜**」 | 盒内不许切 |\n| 同上，防过度拆分检查第 2 条 | 「同人物、同空间、可连续表达的相邻动作，先尝试合成一个生产单元；**允许内部硬切**」 | 盒内允许切 |\n| 同上，十四项必写第 8 项 | 「摄像机、景别和**内部硬切**」 | 要求写内部硬切 |\n| 同上，第 2 步 | 「换机位不单独开新盒」 | 不许因换机位拆盒 |\n\n**合起来就是：必须合并 → 不许因换机位拆 → 又不许在盒内写切点。** 三条一起，模型只能收到一条连续运镜。\n\n## 实测证据（B0009，2026-10-27）\n\n| 写法 | 结果 |\n|---|---|\n| 一条连续长镜头，8 件事，10 秒（U04a） | 8 件事只出了 1–2 件，后面全丢 |\n| 一条连续长镜头，3 件事，12 秒（U03b） | 同上，第 2 件之后不再发生 |\n| 固定机位、单动作、5 秒（卡A） | 成功，机位全程不漂 |\n| **两刀硬切：近景 2.208 s → 全景 2.250 s（卡B）** | **成功，F00053→F00054 一帧切干净，无过渡帧、无闪屏** |\n| 两刀硬切：近景 0.55 m 俯拍 → 全景 1.45 m（撬板 v3） | 成功，四帧比对机位不漂 |\n\n结论：**平台能做内部硬切。** 之前「盒子里允许硬切」作废，是因为当时写的是「同景别只挪机位」——那种切观众看不见，模型也看不见，它就当成一条连续长镜头演下去，于是「机位从固定全景漂成跟拍近景」。\n\n## 阿初自己就是这么写的（原文证据）\n\n`D:\\自己开发的程序\\阿初的油管\\阿初的油管库.md`\n\n**L4550**：「下面是这 15 秒我的拆分 分别是 2s 2s 2s 3s 5s 1s」——一组 15 秒，**六个镜头**。\n\nL4552 起是他的原格式，一字未改：\n\n```\n【镜头1】（2秒）\n机位：35mm广角，远景，固定，正面拍摄浮空城外侧底座。\n前景：虚化的云\n背景：蓝天白云，云层自然缓慢流动，浮空城巍然悬浮于空中纹丝不动。\n主体：浮空城底座侧壁可见一根粗大排污石管向外突出……\n⚠️无人物。摄影机严格静止。\n⚠️镜头末尾硬切至镜头2。\n\n【镜头2】（2秒）\n机位：85mm，平视，固定，从水管前方约2米正面特写水管管口。\n前景：⚠️虚化水流从管口倾泻向下，形成虚化水帘前景……\n背景：浮空城底座石墙虚化，管口周围石壁苔藓与水渍清晰。\n动作：\n①管口正常水流持续。\n②约0.5秒：⚠️B惨叫声从管道深处传来……\n③B冲出管口后迅速向下坠落……\n⚠️镜头末尾硬切至镜头3。\n```\n\n**L4529**：「而一组 15 秒 需要设定 7 个左右的镜头 才能勉强逼平他的密度 意味着平均 2 秒左右 你就要设置一个镜头」。\n\n**L10411**：另一组里写着「⚠️4秒后硬切镜头2。」，同一组内是 `【镜头1】【0-4秒】MCU手持OTS` / `【镜头2】【4-8秒】MCU强仰拍` / `【镜头4】【8-15秒】FS贴地`——三个镜头，三个不同焦段（50mm / 35mm / 50mm），三个不同景别。\n\n所以本文件的三条规则不是我们发明的，是照他的写法搬过来的。差别只有一处：他做动作戏，平均 2 秒一镜；我们做改造过程片，一个动作本身要 2–3 秒才看得清，所以同样 15 秒他装 6–7 镜，我们装 2–4 镜。**结构一样，密度不同。**\n\n---\n\n## 三条写法\n\n### 1. 刀间必须换景别\n\n近景（≤1 m，手部/工具）→ 全景（1.4–1.5 m，整条空间）→ 中景（1.0–1.2 m，一个构件）。\n**相邻两刀景别不许相同。** 同景别、只挪角度或高度，等于没切。\n\n### 2. 一刀一个机位、一条动作线\n\n每刀只写：机位（焦段＋高度＋角度＋固定）、前景、背景、动作 ①②③、⚠️约束。\n\n**「一条动作线」不等于「一个手势」。** 阿初的镜头2 就是 ①水流 ②人被冲出 ③人坠落——三步，一条线，一个机位。判据不是「写了几行」，是**这一刀里状态变化几次**：一次就对，两次就切刀。\n\n例：撬起一块板 = 一次状态变化（板从钉着到松脱），可以写 ①②③。\n「撬起一块板」＋「把板搬走」= 两次状态变化（板松脱、板离开桥面），必须切两刀。\n\n### 3. 切点写成显式指令\n\n```\n⚠️硬切至镜头2：一帧完成，不许推拉、不许摇、不许渐变、不许叠化、不许闪白。\n```\n\n不写这一行，模型会用推拉或叠化过渡，那就是漂。\n\n### 4. 每刀约 2 秒（2026-10-27 修订：取消「不少于 2 秒」的下限）\n\n改造片里，一个动作看清楚要 2 秒左右。**这是平均值，不是下限**——阿初自己的 15 秒组是 2/2/2/3/5/1，有 1 秒也有 5 秒。\n所以一盒的刀数 ≈ 生成秒数 ÷ 2。13–15 秒就是 6–7 刀。\n\n**为什么取消「不少于 2 秒」**：那条是剪辑台上的节奏习惯，不是生成约束。它一旦进生成规则，就会把每刀顶到 2 秒以上，而一盒又只许 2–4 刀，结果每刀被拉到 4–6 秒（本文件旧表「生成 8–12 s / 2 刀」＝每刀 4–6 秒）。一刀的活 1 秒就干完，剩下 3–4 秒模型只能站着、走过去、擦汗——**这是「干完活还傻站」的唯一来源。**\n\n实测 13 刀（2026-10-27 U04_v01 4 刀 / U05_v03 4 刀 / U04_v03 5 刀，逐帧复核）：\n\n| 刀长 | 刀数 | 干净可用 | 半废 | 全废 |\n|---|---|---|---|---|\n| **≤2.6 秒** | 6 | **6** | 0 | 0 |\n| **≥2.8 秒** | 7 | **1**（U05 刀3 的 3.2 秒） | 2 | 4 |\n\n### 5. 写机位前先算画宽（2026-10-27 连踩两次）\n\n9:16 竖幅，**画宽 ≈ 系数 × 距离**：\n\n| 焦距 | 系数 | 1.5 米处 | 3 米处 | 5 米处 |\n|---|---|---|---|---|\n| 26mm | 0.90 | 1.35 m | 2.70 m | 4.50 m |\n| 35mm | 0.62 | 0.93 m | 1.86 m | 3.10 m |\n| 50mm | 0.43 | 0.65 m | 1.29 m | 2.15 m |\n| 85mm | 0.26 | 0.39 m | 0.78 m | 1.30 m |\n\n**要往画面里装一个东西，先算画宽够不够；要让人横向跑过画面，先算跑动距离会不会一瞬穿完。**\n\n踩过的两次：\n- 85mm 在 1.2 米只装 0.5 米宽，却写「她横向跑过画面」——2.4 秒跑 3.4 米，一眨眼穿完。\n- 50mm 在 2.5 米只装 1.1 米宽，却写「两根立柱之间扣栏板」——立柱间距 1.5 米，装不下。\n\n反过来，画幅装不下时不要硬拉远（拉远就变成全景，丢掉景别落差），改成**只拍这个东西的一部分**：板太长就只拍板的右端，两根立柱装不下就顺着栏杆方向拍。\n\n### 6. 机位高度写基准面\n\n在桥上拍的镜头，写「离板面 X 米」；在地面拍的，写「离地 X 米」。混用会让模型把机位放到沟底或悬空。\n\n### 7. 只生成「必须看见的那一下」（2026-10-27 U04／U05 实测后新增）\n\n写每一刀之前先问：**这一刀观众必须看见什么？** 只把这个写进动作，其余一律不写。\n\n判据一句话：**这个动作，成片里会不会被剪掉？会剪掉，就不要写进提示词。**\n\n**不算「必须看见」的**（两条片子实测占了约 25% 的生成时长，全部作废）：\n- 直起腰、擦汗、后退半步、看一眼、把工具往地上一戳\n- 从一个地方走到另一个地方（走位）\n- 做完了站在那儿\n\n**算「必须看见」的**：\n- 板落进梁框、栏板扣进槽、耙齿划过碎石\n- 手离栏杆只差十厘米却没伸过去\n\n### 8. 状态变化在切点上时，写「完成那一下」，不写「完成之后」\n\n如果一刀的状态变化发生在两个切点之间（时间跳跃），这一刀要写**完成它的那个动作**，不要写完成之后的状态。\n\n- ✗「桥面已经铺满了，他站在桥上」→ 生成出 3.4 秒无意义的走位\n- ✓「他放下最后一块板，板落进梁框，直起腰」→ 完成和结果一次给到\n\n### 9. 起手位置＝必须看见那一下的前 0.3 秒\n\n不要写「走过来、站好、准备」的过程。过程一写，模型就把整刀时间花在过程上，真正该发生的动作没时间做。\n\n- ✗「她从后院门走上桥，走到桥心站住，转过身挥手」→ 实测只完成了「走」，没转身\n- ✓「起手：她已经站在桥心、背对镜头」→「她转过身面对镜头」→「抬右手挥一下」\n\n### 10. 每刀写的秒数是建议值，模型会漂\n\n实测：U05 镜头4 写 2.8 秒，实出 4.6 秒；前三个镜头被压成 6.4 秒（写的是 8.2 秒）。\n\n所以**节奏靠刀数安排，不要靠「给某一刀多写几秒」**。想让某一段在成片里更长，就多切一刀，不要给现有刀加秒。\n\n## 分镜段 ≠ 一次生成：母版一段是剪辑结果\n\n母版分镜表里的一「段」，是**剪辑台上拼出来的时长**，不是一次拍摄的时长。\n\n例：母版 ⑥ 写「15.300–19.933，4.633 秒，拆掉旧栈道：旧板被撬起搬走，河床与两岸清出裸土」。\n真片里这是几十分钟的活，剪成 4.6 秒。照抄成一次生成，等于要求模型 4.6 秒拆完 9 米桥面约 60 块板——物理上不成立。\n\n**判据（落笔前先算一遍）：** 这一段里人手的自然速度，要不要超过这一段的秒数？\n\n- 不超过 → 一段一刀，照写。\n- 超过 → 段内按**时间跳跃**切刀，每刀只演一个能自然做完的片段。\n  例：撬起一块板 2.2 s ＋ 硬切 ＋ 桥面已空、两岸清到见土 2.4 s。\n\n观众接受时间跳跃，因为母版就是这么剪的。不接受的是「4.6 秒演完几十分钟」。\n\n## 一盒切几刀\n\n**6–7 刀（13–15 秒一盒），每刀约 2 秒。刀数是除出来的，不是规定值：生成秒数 ÷ 2。**\n\n参照阿初：他 15 秒装 6–7 个镜头（2/2/2/3/5/1），平均 2 秒一刀（`阿初的油管库.md` L4527–4529、L4550）。\n\n**本文件原来写着「我们做过程片，一刀要 2–3 秒才看得清，所以同样时长我们刀数比他少」，实践取 2–4 刀。这条 2026-10-27 撤销。**\n它不是实测结论，是一个没验过的判断；而同一天 13 刀实测正好相反——**≤2.6 秒 6/6 切点干净；≥2.8 秒 7 刀里只有 1 刀切点干净**（「切点干净」只指没有过渡帧、机位不漂，不等于刀里有活，见 B12）。\n更直接的反证：U04_v01 是 12 秒 4 刀、跨 3 个工序，三个切点一帧干净；U04_v03 是 15 秒 5 刀，反而废 35%——**差别不在刀数，在第 3 刀的状态跳跃**。\n\n| 盒内刀数 | 生成 13–15 s | 判定 |\n|---|---|---|\n| 6–7 刀 | 每刀 2.0–2.5 s | **标准做法** |\n| 4–5 刀 | 每刀 2.6–3.5 s | 只允许出现在末组（预算除不尽） |\n| 2–3 刀 | 每刀 4–7 s | **不许**：每刀都有 2–4 秒无事可做，必然出傻站 |\n\n刀数不够用的判断：如果你发现某刀里状态变化了两次，那就要多切一刀，别硬压。\n\n## 空间状态是硬边界\n\n一盒只能挂一张空间参考图。**盒内所有刀必须属于同一个空间状态。**\n\n- 拆前（旧板还在）→ 挂旧桥卡\n- 拆空（空桥＋墩＋梁框）→ 挂拆空卡\n- 成品（新桥＋栏杆＋碎石＋白菊）→ 挂成品卡\n\n跨状态必须开新盒，不是工序问题，是参考图问题：挂旧桥卡进「拆空」盒，旧板会复活；挂拆空卡进「拆前」盒，一开始就没有旧板可撬。\n\n## 交付自检（四条，缺一条就不合格）\n\n- [ ] 每刀都写了机位（焦段＋高度＋角度），且相邻两刀景别不同\n- [ ] 每刀只有一次状态变化（一条动作线可以写 ①②③，但不能有两件事）\n- [ ] 每处切点都写了「硬切，一帧完成，不许推拉摇渐变」\n- [ ] 每刀 ≥ 2 秒，总刀数 ≤ 生成秒数 ÷ 2\n"}, "adaptive-video-production-material-seconds": {"label": "④小分镜·素材秒怎么算", "path": "skills/adaptive-video-production/references/material-seconds.md", "text": "# 素材秒怎么估（通用）\n\n> 用途：小分镜写每一刀时，填「素材秒」这一栏用。\n> 为什么需要它：素材秒原来靠\"预演\"，同一个动作这次估 4 秒、下次估 8 秒，下游没法用。\n> 这张表给一个**可复现的基线**，允许 ±25% 浮动，但不许凭空写。\n\n---\n\n## 一、公式\n\n```\n素材秒 ≈ 起手 0.5 秒 + Σ(动作单位) + 收尾 0.5 秒\n```\n\n- **起手 0.5 秒**：手已经伸到东西上／人已经站在起点。不是\"走过去准备\"。\n- **收尾 0.5 秒**：动作完成后的那一下确认（压平、松开、停住）。不是\"直起腰看成果\"。\n- 中间按下面的单位累加。\n\n---\n\n## 二、动作单位表\n\n| 动作类型 | 单个耗时 | 说明 |\n|---|---|---|\n| **接触—改变—离开**（拿、放、按、拧、扣、插、撕、贴） | **1.0–1.5 秒** | 一个完整手部动作。观众要能看清「碰到 → 变了 → 松手」三段，少一段就读不懂 |\n| **同一动作重复**（第 2 次起） | **0.8–1.2 秒／次** | 重复会被观众脑补，从第 3 次起可压到 0.7–0.8 秒 |\n| **位移 1 米**（正常走） | **0.7–0.8 秒** | 跑 1 米 ≈ 0.4 秒；搬着东西走 1 米 ≈ 1.0 秒 |\n| **转身／抬头／回头** | **0.8–1.0 秒** | 只算「转过去」这一下，不含之后的表情 |\n| **蹲下／站起** | **1.0–1.5 秒** | 只算身体起落 |\n| **抱起／放下**（人或大件） | **1.5–2.5 秒** | 含手臂调整重心那一下 |\n| **工具一次行程**（锯一下、刮一趟、锤一下） | **0.6–1.0 秒** | 连续多趟按次数累加 |\n| **开门／关门／上下车一级台阶** | **0.8–1.2 秒** | |\n\n---\n\n## 三、四个算例\n\n**例 1：铺一块板**\n起手 0.5 ＋ 落位 1.2 ＋ 收尾（压平）0.5 ＝ **2.2 秒**\n→ 要看清 4 块：0.5 ＋ 4×1.2（第 3 块起按 0.9）＋ 0.5 ≈ **5.8 秒 ≈ 6 秒**\n\n**例 2：拆一块旧板（撬起来、搬走、扔上车）**\n起手 0.5 ＋ 撬 1.2 ＋ 搬起 1.2 ＋ 扔 0.8 ＋ 收尾 0.5 ＝ **4.2 秒**（第一块）\n→ 连拆 3 块：0.5 ＋ 3.2 ＋ 2.4 ＋ 2.4 ＋ 0.5 ≈ **9 秒**\n\n**例 3：孩子从门口跑到车上（10 米）**\n起手 0.3 ＋ 下 3 级台阶 2.4 ＋ 跑 10 米 4.0 ＋ 上 1 级 0.9 ＝ **7.6 秒**\n→ 这就是为什么 N12 那类刀，素材秒和成片秒接近（跑动本身不能压）\n\n**例 4：转身面对镜头挥手**\n起手 0.3 ＋ 转身 0.9 ＋ 抬手 0.6 ＋ 挥手停住 0.7 ＝ **2.5 秒**\n\n---\n\n## 四、三条硬规矩\n\n1. **素材秒不许小于 1.0 秒。** 低于 1 秒的动作观众看不清，剪的时候也没法用。\n2. **素材秒可以远大于成片秒。** 差额就是剪裁余量，不用解释。\n   例 2 那条 9 秒素材，剪成 4.6 秒成片完全正常（取用率 51%）——**它是一段快剪蒙太奇**。\n3. **估不准就往上取。** 多给 1 秒的代价是 1 秒积分；少给的代价是整刀做不完、要重抽，代价是 4 秒起。\n\n---\n\n## 五、和「对标秒数」的关系\n\n**对标的秒数是别人的成片秒，不是你的素材秒。** 别人的成片是「AI 生成之后加速」剪出来的。\n\n- 对标那一段 4.7 秒 ≠ 你要拍 4.7 秒\n- 对标那一段 4.7 秒 = 你要拍 X 秒，然后剪成 4.7 秒\n- X 由这张表算，不由对标算\n\n**校验方式**：所有刀的素材秒加起来 = 素材总秒；素材总秒 × 0.867 ≈ 成片总时长。落在对标 ±15% 内即可。\n"}}};

const DIMS = [
  {id:"g",  n:"0", label:"总览"},
  {id:"d0-r", n:"★", label:"人读版"},
  {id:"d1", n:"1", label:"拆解复刻"},
  {id:"d2", n:"2", label:"开头"},
  {id:"d3", n:"3", label:"小分镜"},
  {id:"d4", n:"4", label:"生产单元"},
  {id:"d5", n:"5", label:"踩过的坑"}
];

const INSTR_LABEL = {
  "1":"① 拆解 · 完整指令",
  "2":"② 复刻 · 完整指令",
  "3":"③ 开头 · 完整指令",
  "4":"④ 小分镜 · 完整指令",
  "5":"⑤ 生产单元 · 完整指令"
};

/* 每条维度默认挂哪份指令 */
const DIM_INSTR = {d1:null, d2:"3", d3:"4", d4:"5", d5:null, g:null};
/* d1 下面同时挂着 ① 拆解 和 ② 复刻，不能按维度映射，
   这两段各自在节点上写了 instr，由 resolveInstr 优先读节点自己的。 */

let byId = {}, openIds = new Set(), curId = "g";

function index(list, parent){
  list.forEach(nd=>{
    nd._parent = parent || null;
    byId[nd.id] = nd;
    if(nd.children) index(nd.children, nd);
  });
}
index(DATA.nodes, null);

/* ── 阶段条 ── */
function renderFlow(){
  const el = document.getElementById("flow");
  el.innerHTML = "";
  DIMS.forEach((d,i)=>{
    if(i) { const a=document.createElement("span"); a.className="arw"; a.textContent="›"; el.appendChild(a); }
    const s = document.createElement("div");
    s.className = "stage" + (curId.startsWith(d.id) ? " on" : "");
    s.innerHTML = '<span class="n">'+d.n+'</span>'+d.label;
    s.onclick = ()=>{ curId=d.id; openIds.add(d.id); renderAll(); };
    el.appendChild(s);
  });
}

/* ── 左树 ── */
function nodeEl(nd){
  const wrap = document.createElement("div");
  const has = nd.children && nd.children.length;
  const row = document.createElement("div");
  row.className = "node" + (curId===nd.id ? " on" : "");
  row.innerHTML =
    '<span class="tw'+(openIds.has(nd.id)?" open":"")+'">'+(has?"▶":"")+'</span>'+
    '<span class="lb">'+esc(nd.title)+'</span>'+
    (nd.tag?'<span class="tg">'+esc(nd.tag)+'</span>':'');
  row.onclick = (e)=>{
    if(has && (e.target.classList.contains("tw"))){
      openIds.has(nd.id)?openIds.delete(nd.id):openIds.add(nd.id);
      renderAll(); return;
    }
    curId = nd.id; openIds.add(nd.id);
    if(has) openIds.add(nd.id);
    renderAll();
  };
  wrap.appendChild(row);
  if(has){
    const box = document.createElement("div");
    box.className = "kids" + (openIds.has(nd.id)?"":" hide");
    nd.children.forEach(c=>box.appendChild(nodeEl(c)));
    wrap.appendChild(box);
  }
  return wrap;
}

function renderNav(){
  const el = document.getElementById("nav");
  el.innerHTML = "";
  DATA.nodes.forEach(nd=>el.appendChild(nodeEl(nd)));
}

/* ── 详情 ── */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function crumb(nd){
  const a=[]; let p=nd;
  while(p){ a.unshift(p.title); p=p._parent; }
  return a.map(esc).join(" <span style='color:#c3cad6'>/</span> ");
}

function renderView(){
  const nd = byId[curId];
  const el = document.getElementById("view");
  if(!nd){ el.innerHTML='<div class="empty">选一个节点</div>'; return; }

  let h = '<div class="crumb">'+crumb(nd)+'</div>';
  h += '<h2>'+esc(nd.title)+(nd.tag?'<span class="tag2">'+esc(nd.tag)+'</span>':'')+'</h2>';
  if(nd.summary) h += '<p class="lead">'+esc(nd.summary)+'</p>';

  if(nd.points && nd.points.length){
    h += '<h3>要点 <span class="cnt">'+nd.points.length+' 条</span></h3><ul class="pts">';
    nd.points.forEach(p=>h += '<li>'+fmt(p)+'</li>');
    h += '</ul>';
  }

  if(nd.table){
    h += '<h3>对照表</h3><table><thead><tr>';
    nd.table.head.forEach(x=>h+='<th>'+esc(x)+'</th>');
    h += '</tr></thead><tbody>';
    nd.table.rows.forEach(r=>{
      h += '<tr>'; r.forEach(c=>h+='<td>'+fmt(c)+'</td>'); h += '</tr>';
    });
    h += '</tbody></table>';
  }

  if(nd.note) h += '<div class="note"><b>注意　</b>'+fmt(nd.note)+'</div>';

  if(nd.pitfalls && nd.pitfalls.length){
    h += '<div class="pit"><div class="t">⚠ 常见的坑</div><ul>';
    nd.pitfalls.forEach(p=>h += '<li>'+fmt(p)+'</li>');
    h += '</ul></div>';
  }

  /* 子节点快捷入口 */
  if(nd.children && nd.children.length){
    h += '<h3>下一层 <span class="cnt">'+nd.children.length+' 个</span></h3><ul class="pts">';
    nd.children.forEach(c=>{
      h += '<li><a href="javascript:void(0)" onclick="go(\''+c.id+'\')" style="color:var(--ac);text-decoration:none;font-weight:600">'+esc(c.title)+'</a>'+
           (c.summary?'　<span style="color:#8b95a3">'+esc(c.summary)+'</span>':'')+'</li>';
    });
    h += '</ul>';
  }

  /* skill 全文：节点带 skillkey */
  if(nd.skillkey && DATA.skills && DATA.skills[nd.skillkey]){
    const sk = DATA.skills[nd.skillkey];
    h += '<div class="copybar"><span class="lbl">这份 skill 的全文（'+sk.path+'）</span>'+
      '<button class="btn pri" onclick="copySkill(\''+nd.skillkey+'\')">复制全文（'+sk.text.length+' 字）</button></div>';
    h += '<details open><summary>展开看全文</summary><div class="code">'+esc(sk.text)+'</div></details>';
    el.innerHTML = h;
    el.scrollTop = 0;
    return;
  }

  /* 复制区：节点级片段 + 整份指令 */
  const ik = resolveInstr(nd);

  if(nd.snippet || ik){
    h += '<div class="copybar"><span class="lbl">'+
      (nd.snippet?'复制这一节的相关条文':'复制本段完整指令')+'</span>';
    if(nd.snippet){
      h += '<button class="btn" onclick="copyText(nodeSnippet(\''+nd.id+'\'))">复制要点条文</button>';
    }
    if(ik){
      h += '<button class="btn pri" onclick="copyInstr(\''+ik+'\')">'+
           esc(INSTR_LABEL[ik])+'（'+DATA.instr[ik].length+' 字）</button>';
    }
    h += '</div>';
  }

  if(ik){
    h += '<details><summary>展开看这份指令全文</summary><div class="code">'+
         esc(DATA.instr[ik])+'</div></details>';
  }

  el.innerHTML = h;
  el.scrollTop = 0;
}

function fmt(s){
  // 支持 **粗体** 和 `代码`
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code style="background:#f2f4f8;padding:1px 5px;border-radius:4px;font-size:12px;color:#334155">$1</code>');
}

function topDim(nd){
  let p = nd;
  while(p._parent) p = p._parent;
  return p.id;
}

/* 哪一份指令属于这个节点：
   1) 节点自己写了 instr → 用它
   2) 往上找祖先，谁写了用谁（① 的子节点都继承 "1"，② 的都继承 "2"）
   3) 都没有 → 用顶层维度的默认映射
   这样 ① 和 ② 同属 d1 也不会串。 */
function resolveInstr(nd){
  let p = nd;
  while(p){
    if(p.instr && DATA.instr[p.instr]) return p.instr;
    p = p._parent;
  }
  const k = DIM_INSTR[topDim(nd)];
  return (k && DATA.instr[k]) ? k : null;
}

function nodeSnippet(id){
  const nd = byId[id];
  let out = ["## "+nd.title];
  if(nd.summary) out.push(nd.summary);
  if(nd.points) nd.points.forEach(p=>out.push("- "+p));
  if(nd.table){
    out.push("");
    out.push("| "+nd.table.head.join(" | ")+" |");
    out.push("|"+nd.table.head.map(()=>"---").join("|")+"|");
    nd.table.rows.forEach(r=>out.push("| "+r.join(" | ")+" |"));
  }
  if(nd.note) out.push("\n> "+nd.note);
  if(nd.pitfalls) nd.pitfalls.forEach(p=>out.push("- ⚠ "+p));
  return out.join("\n");
}

function go(id){ curId=id; openIds.add(id); renderAll(); }

function copyText(t){
  navigator.clipboard.writeText(t).then(
    ()=>toast("已复制 "+t.length+" 字"),
    ()=>fallbackCopy(t)
  );
}
function copyInstr(k){
  const t = DATA.instr[k];
  if(!t){ toast("没有这份指令"); return; }
  copyText(t);
}
function copySkill(k){
  const sk = (DATA.skills||{})[k];
  if(!sk){ toast("没有这份 skill"); return; }
  copyText(sk.text);
}
function fallbackCopy(t){
  const ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("已复制 "+t.length+" 字"); }
  catch(e){ toast("复制失败，请手动全选"); }
  document.body.removeChild(ta);
}
let toastTimer;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("on"),1900);
}

function renderAll(){ renderFlow(); renderNav(); renderView(); }

/* 导出整棵树为 Markdown */
document.getElementById("btnExport").onclick = ()=>{
  let out = ["# 视频生产流程导图\n"];
  out.push("> 由 流程导图.html 导出。改 .txt 后重跑 tools/生成流程导图.py 即可同步。\n");

  function walk(nd, depth){
    out.push("\n"+"#".repeat(Math.min(depth+1,6))+" "+nd.title+(nd.tag?"（"+nd.tag+"）":""));
    if(nd.summary) out.push("\n"+nd.summary+"\n");
    if(nd.points){ nd.points.forEach(p=>out.push("- "+p)); out.push(""); }
    if(nd.table){
      out.push("| "+nd.table.head.join(" | ")+" |");
      out.push("|"+nd.table.head.map(()=>"---").join("|")+"|");
      nd.table.rows.forEach(r=>out.push("| "+r.join(" | ")+" |"));
      out.push("");
    }
    if(nd.note) out.push("> **注意**　"+nd.note+"\n");
    if(nd.pitfalls){ out.push("**常见的坑**"); nd.pitfalls.forEach(p=>out.push("- "+p)); out.push(""); }
    if(nd.children) nd.children.forEach(c=>walk(c, depth+1));
  }
  DATA.nodes.forEach(nd=>walk(nd,1));

  out.push("\n---\n\n# 附一：五份完整指令\n");
  Object.keys(DATA.instr).sort().forEach(k=>{
    out.push("\n## "+INSTR_LABEL[k]+"\n");
    out.push("```text\n"+DATA.instr[k]+"\n```\n");
  });

  const SK = DATA.skills || {};
  if(Object.keys(SK).length){
    out.push("\n---\n\n# 附二：skill 全文（发给别的 AI 必带）\n");
    out.push("\n> 五份指令里都写着「全文读取 skill」。下面这些就是那些 skill 的原文，\n> 对方读不到本机 E: 盘路径时，以本节为准。\n");
    Object.keys(SK).forEach(k=>{
      out.push("\n## "+SK[k].label+"　`"+SK[k].path+"`\n");
      out.push("```markdown\n"+SK[k].text+"\n```\n");
    });
  }

  const t = out.join("\n");
  const blob = new Blob([t],{type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "视频生产流程导图.md";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast("已导出，含全部指令");
};

document.getElementById("btnExpand").onclick = ()=>{
  function all(list){ list.forEach(n=>{ openIds.add(n.id); if(n.children) all(n.children); }); }
  all(DATA.nodes); renderNav();
};
document.getElementById("btnCollapse").onclick = ()=>{
  openIds.clear(); openIds.add(topDim(byId[curId]));
  if(byId[curId]._parent) openIds.add(byId[curId]._parent.id);
  renderNav();
};

/* 初始展开：总览 + 四个维度第一层 */
openIds.add("g"); openIds.add("d1"); openIds.add("d1-1"); openIds.add("d1-2");
openIds.add("d2"); openIds.add("d3"); openIds.add("d4"); openIds.add("d5");
renderAll();
</script>
