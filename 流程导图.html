<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频生产流程导图</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --line:#e3e6ec; --line2:#eef0f4;
  --tx:#1c2027; --tx2:#5a6472; --tx3:#8b95a3;
  --ac:#2563eb; --ac-bg:#eff4ff; --ac-line:#bfd3fe;
  --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fde68a;
  --danger:#b91c1c; --danger-bg:#fef2f2; --danger-line:#fecaca;
  --ok:#047857; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--tx);font-size:14px;line-height:1.65;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}
/* ── 顶栏 ── */
header{
  flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;align-items:center;gap:16px;
}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
header .sub{font-size:12px;color:var(--tx3);margin-left:2px}
.grow{flex:1}
/* ── 版本条 ── */
.verbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 20px;background:#fbfcfe;border-bottom:1px solid var(--line2);
  font-size:11.5px;color:var(--tx3);line-height:1.5;
}
.verbar b{color:var(--tx2);font-weight:650}
.verbar .vt b{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.verbar .vsep{width:1px;height:11px;background:var(--line);display:inline-block}
.verbar .vl{color:var(--tx3)}
.verbar .vc{
  font-family:ui-monospace,Consolas,monospace;font-size:11px;
  background:#fff;border:1px solid var(--line);border-radius:5px;
  padding:1px 6px;color:var(--tx2);
}
.verbar .vc b{color:var(--ac);font-weight:700;margin-right:3px}
.verbar .vh{color:#a8b0bc;font-size:11px}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--tx2);
  padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;
  font-family:inherit;transition:.12s;white-space:nowrap;
}
.btn:hover{border-color:var(--ac-line);color:var(--ac);background:var(--ac-bg)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:#1d4ed8;color:#fff}
/* ── 阶段条 ── */
.flow{
  flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 20px;display:flex;gap:6px;align-items:center;overflow-x:auto;
}
.stage{
  display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:16px;
  border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;
  white-space:nowrap;transition:.12s;color:var(--tx2);
}
.stage:hover{border-color:var(--ac-line);background:var(--ac-bg)}
.stage.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.stage .n{
  width:17px;height:17px;border-radius:50%;background:var(--line2);color:var(--tx2);
  display:grid;place-items:center;font-size:10.5px;font-weight:700;
}
.stage.on .n{background:rgba(255,255,255,.25);color:#fff}
.arw{color:var(--tx3);font-size:12px;padding:0 1px}
/* ── 主体 ── */
main{flex:1;display:flex;min-height:0}
nav{
  flex:0 0 322px;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px 8px 40px;
}
nav::-webkit-scrollbar,section::-webkit-scrollbar{width:9px}
nav::-webkit-scrollbar-thumb,section::-webkit-scrollbar-thumb{
  background:#d4d9e2;border-radius:5px;
}
.node{
  display:flex;align-items:flex-start;gap:6px;padding:6px 8px;border-radius:7px;
  cursor:pointer;font-size:13px;color:var(--tx2);position:relative;
  border:1px solid transparent;
}
.node:hover{background:var(--bg)}
.node.on{background:var(--ac-bg);border-color:var(--ac-line);color:var(--ac);font-weight:600}
.node .tw{
  flex:0 0 13px;width:13px;height:13px;margin-top:3px;display:grid;place-items:center;
  color:var(--tx3);font-size:9px;transition:.15s;user-select:none;
}
.node .tw.open{transform:rotate(90deg)}
.node .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.node .tg{
  flex:0 0 auto;font-size:10px;padding:0 5px;border-radius:4px;background:var(--line2);
  color:var(--tx3);font-weight:500;margin-top:2px;white-space:nowrap;
}
.node.on .tg{background:#fff;color:var(--ac)}
.kids{margin-left:15px;border-left:1px solid var(--line2);padding-left:4px}
.kids.hide{display:none}
/* ── 详情 ── */
section{flex:1;overflow-y:auto;padding:22px 30px 80px;min-width:0}
.crumb{font-size:12px;color:var(--tx3);margin-bottom:10px}
h2{font-size:21px;margin:0 0 8px;font-weight:680;letter-spacing:-.2px;line-height:1.35}
h2 .tag2{
  font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;
  background:var(--ac-bg);color:var(--ac);border:1px solid var(--ac-line);
  vertical-align:3px;margin-left:9px;letter-spacing:0;
}
.lead{font-size:14.5px;color:var(--tx2);margin:0 0 20px;max-width:820px}
h3{
  font-size:13px;margin:24px 0 10px;font-weight:680;color:var(--tx);
  display:flex;align-items:center;gap:7px;
}
h3::before{content:"";width:3px;height:13px;background:var(--ac);border-radius:2px}
h3 .cnt{font-weight:500;color:var(--tx3);font-size:11.5px}
ul.pts{margin:0;padding-left:0;list-style:none;max-width:880px}
ul.pts li{
  position:relative;padding-left:17px;margin-bottom:7px;color:var(--tx2);
}
ul.pts li::before{
  content:"";position:absolute;left:3px;top:9px;width:5px;height:5px;
  border-radius:50%;background:#c3cad6;
}
ul.pts li b{color:var(--tx);font-weight:620}
table{width:100%;border-collapse:collapse;margin:4px 0 6px;font-size:13px;max-width:960px}
th{
  text-align:left;font-weight:620;color:var(--tx);background:#f2f4f8;
  padding:7px 10px;border:1px solid var(--line);font-size:12.5px;
}
td{padding:7px 10px;border:1px solid var(--line);color:var(--tx2);vertical-align:top}
td:first-child{color:var(--tx);font-weight:560;white-space:nowrap}
tr:nth-child(even) td{background:#fafbfc}
.note{
  border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:var(--r);
  padding:11px 14px;margin:12px 0;font-size:13px;color:#78350f;max-width:900px;
}
.note b{color:var(--warn)}
.pit{
  border:1px solid var(--danger-line);background:var(--danger-bg);border-radius:var(--r);
  padding:11px 14px;margin:12px 0;max-width:900px;
}
.pit .t{font-size:12px;font-weight:680;color:var(--danger);margin-bottom:5px}
.pit ul{margin:0;padding-left:16px;font-size:13px;color:#7f1d1d}
.pit ul li{margin-bottom:4px}
/* 复制区 */
.copybar{
  display:flex;align-items:center;gap:9px;margin:22px 0 10px;
  padding:11px 14px;background:var(--ac-bg);border:1px solid var(--ac-line);
  border-radius:var(--r);max-width:900px;
}
.copybar .lbl{font-size:12.5px;color:var(--ac);font-weight:600;flex:1}
.code{
  background:#0f172a;color:#dbe3f0;border-radius:var(--r);padding:14px 16px;
  font-family:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
  font-size:12px;line-height:1.72;white-space:pre-wrap;word-break:break-word;
  max-height:380px;overflow:auto;max-width:960px;
}
.code::-webkit-scrollbar{width:8px;height:8px}
.code::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
details{margin:8px 0 0;max-width:960px}
details>summary{
  cursor:pointer;font-size:12.5px;color:var(--ac);padding:6px 0;
  user-select:none;list-style:none;
}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";font-size:10px}
details[open]>summary::before{content:"▾ "}
.toast{
  position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);
  background:#111827;color:#fff;padding:9px 18px;border-radius:9px;font-size:13px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--tx3);font-size:13px;padding:40px 0}
@media(max-width:900px){
  nav{flex-basis:250px}
  section{padding:16px 18px 60px}
}
</style>
</head>

为什么要有**：现在每个环节的产出「形式上挺全」，但人看不懂——② 复刻 17 节判定表、④ 小分镜 15 项字段、⑤ 生产单元十五项。这些都回答「合不合规」，不回答「这条片子长什么样、为什么这么做」。", "**阿初的写法**：他讲每一段微调都是四句话——「原片是安静的登场，**但我改成**一脚踢飞」「**为什么**：暴力冲突感更强」「**看起来不同，但和原片的设定思路其实是一致的**」（L3302–3316）。没有表格，人一眼懂。", "**阿初的对比法（借过来当第三栏）**：并排播放，「原片在放、我的黑屏」＝我删了；「我的在放、原片黑屏」＝我加了（L962–964）。我们用四个字开头：**同／删／换／加**。一栏扫下来，差在哪不用读句子。", "**统一格式五块**：① 一句话（这条片子讲什么）② 我是怎么想的（3–5 条）③ 原片 vs 我们（三栏并排）④ 我删了什么加了什么（各 1–3 条带原因）⑤ 这一版你最该盯的一处。", "**硬规矩**：一页纸 ≤600 字；不加粗、不嵌套；第五块必须写真话，不许写「整体没问题」——那是没看出来。", "**分工**：详细文档给 AI（下游机械搬运）＋ 机器检查；**人只审人读版**。人读版方向不对直接打回，人读版过了，详细文档走机器检查。", "**五个环节第三块各不相同**：① 拆解＝第几秒靠什么留住你 ② 复刻＝逐段并排 ③ 开头＝首帧和机位四件套并排 ④ 小分镜＝逐刀并排 ⑤ 生产单元＝盒子表（装什么/生成几秒/剪成几秒/为什么不能合）。", "**▸ 五段衔接审计（2026-10-27 19:03 修完 4 个问题）**：五个环节在不同对话框里跑，中间只靠文件传递，交接处最容易漏。① **`01_微调大纲.md` 原被下游明确标成「可以不读」**——但设定书 4.5 只写「从 X 变成 Y」的状态键值，装不下「她一手死抓钢索、另一只手把孩子按住、她没有喊只是喘」，小分镜只读设定书就只剩「跪坐不动」→ **改为 ④⑤ 必读第 2 节**。② `开头方案_有效.md` 没有下游读（小分镜只读交接）→ 交接必须覆盖方案的七项。③ `改动影响清单.md` 被 ⑤ 读但用不上（那是 ④ 的思考记录）→ 改为不必读。④ 人读版给谁读没写清 → 各段明确「人读版下游不读」。"], "note": "格式全文与两份样例（④ 小分镜、⑤ 生产单元完整写出来）见 `38_人读版_统一格式_20261027.md`。五份指令末尾都加了这一节，缺人读版不算交稿。"}, {"id": "d1", "title": "一、拆解复刻", "tag": "①②", "summary": "把一条对标拆到最细；再拿拆好的东西，一次排出 N 个版本的骨架。", "points": ["这两步合在一起，是因为拆解的唯一目的就是复刻。拆得再细，不能复刻就没用。", "① 的产出物是「项目总文件夹 + 01_拆解」，② 的产出物是「02_复刻 + N 份版本设定书」。", "② 不是一次交 N 份成品。先交一份中间过程稿给人审，人点头了才往下走。"], "children": [{"id": "d1-1", "title": "① 拆解", "tag": "第1段", "instr": "1", "summary": "把原片拆成可以复刻的证据：时间线、骨架、表面清单、情绪弧。", "points": ["只拆解。不评价好不好、不给改进建议、不写提示词、不设计我们自己的片子。", "拆得越细越好。宁可多写两页，不许省字段。"], "children": [{"id": "d1-1-1", "title": "先确认能不能看视频", "summary": "这是第一步，不是可选项。读不了就不要往下做。", "points": ["能读视频 → 直接拆。", "不能读 → 先看这个项目里有没有出好的图片包（<项目>\u0001_拆解\u0001_原片证据\\）。", "有图片包 → 用图片包拆。", "都没有 → 停下来，回三样：① 我读不了视频 ② 需要什么规格的图片包 ③ 把要跑的命令写给我"], "note": "图片包规格：first_frame 1 张；opening 从 0 秒到 T_钩 每 0.2 秒 1 张（5 格一张联络表）；overview 按镜头取中点帧、1 镜 1 张；末帧 1 张。整期读图合计不超过 16 张，开头那几张优先。", "pitfalls": ["凭标题、封面、简介猜内容 —— 这是最严重的错，拆出来的全是假的。"]}, {"id": "d1-1-2", "title": "项目编号与目录", "summary": "一条对标 = 一个项目总文件夹，拆解是第一层。", "points": ["根目录：06_制作对话与决策\\（与自己同级，不再放到 12_视频拆解内化）", "看已有的 `*_B####_*`，取最大号 +1，B#### 四位数字，永不重用。", "项目名：<拆解当天八位日期>_B####_<短名>，例 20261024_B0006_rainy_corridor", "里面：00_项目台账.md + 01_拆解\\（本次产物都在这里）+ 01_原片证据\\", "02_复刻\\ 由第②段建，03_成片\\ 由第⑥段建。现在一个都别建。"], "pitfalls": ["复用旧编号 —— 后面所有引用都会指向错的对标。", "把拆解又写回 12_视频拆解内化 —— 那样一条片子又散成两个地方。"]}, {"id": "d1-1-3", "title": "两个 skill 各管一件事", "summary": "选拆管开头怎么拆成卡，深拆管整片怎么拆成证据。产物分开写，不合并。", "table": {"head": ["skill", "管什么", "别用它干"], "rows": [["benchmark-select-and-breakdown", "开头怎么拆成一张可复用的卡", "不要用它拆整片"], ["benchmark-video-deconstruction", "整片怎么拆成证据", "不要用它定开头机制"]]}, "note": "两个都要读，以 E 盘规范目录里的那份为准，插件目录里的旧副本不要用。"}, {"id": "d1-1-4", "title": "拆解要交的几份东西", "summary": "五份文件，字段一个不能少。", "points": ["00_项目台账.md —— 编号、短名、日期、原片来源；后面每完成一步追加一行进度", "00_对标索引.md —— 第 0 节「一分钟读懂」＋ 编号、名称、链接、时长（到 0.1 秒）、播放量（注明口述还是已核）、来源类型、有没有像儿童的人、被哪些批次用过、一句话骨架", "01_原片证据\\ —— first_frame-001.jpg 必须是 0.000 秒这一帧，名字一个字不能改；另放 overview / opening / 时间轴 / 转写 / 评论区摘录", "02_开头拆解.md —— 开头方案（人读版）＋ 逐镜表（带状态变化/动作数/位移）＋ **1b 开头微段表（0.2 秒一格）** ＋ 七段环节表 ＋ 表面清单 ＋ 冲突强度 ＋ 首帧六要素 ＋ 情绪弧", "03_整片拆解.md —— 结尾方案（人读版）＋ 后半段逐段表（带同样三列） ＋ 终局兑现链", "04_交付自查表.md —— 对着这条指令逐条打勾，⚠️ 和 ❌ 要写清缺在哪"], "pitfalls": ["first_frame 用了第 1 秒的帧 —— 第③段拿它比「看过感」就全错了。", "逐镜表只写「画面做了什么」、不写「从什么变成什么」—— 下游就得靠猜，会把 1 个动作写成 8 个步骤。"]}, {"id": "d1-1-5", "title": "02_开头拆解：一节人读 ＋ 六张表", "summary": "这些表是后面所有判断的依据，缺一张，②就没法排版本。开头那两张表最关键。", "table": {"head": ["表", "里面要写什么"], "rows": [["开头方案（人读版）", "≤250 字、无表格：几秒几镜、画面在发生什么、机位四件套、那一个动作的起止状态、前 3 秒消失几次、为什么能留住人、这一段的硬约束"], ["逐镜表", "段 / 起止秒 / 画面一句话（谁＋在干什么＋东西什么状态＋景别）/ 环节 / 状态变化 / 动作数 / 位移"], ["**1b 开头微段表（0.2 秒一格）**", "从 0 秒到 T_钩，每 0.2 秒一行，一格不许合并。八列：新增了什么 / 消失减少了什么 / 手在哪 / 身体姿态与朝向 / 构图变化 / 观众看到什么。一镜到底的镜头就靠这张表，否则 3 秒会被压成一句话"], ["七段环节表", "问题出现 / 第一反应 / 决定动手 / 连续修 / 再测试 / 这次没事 / 收尾。没有的写「无」，并注明「照抄时不许补」"], ["表面清单十项", "地点 / 问题物大小形状 / 天气 / 人物 / 穿着 / 工具 / 材料 / 修法 / 画面文字 / 声音"], ["首帧五要素", "受害物位置 / 威胁方向 / 距离 / 画面里有几个人 / 机位高度与是否固定（高度写米数，并补焦段与人物占画面高度几成）"], ["情绪弧", "一句话写清原片情绪、观众该有什么感觉；按五通道查原片用了哪几个；逐段给情绪、强度 0–3、载体"]]}, "note": "七段环节表里写「无」的段，是母版的缺口，照抄时不许自己补上。\nT_钩 = 观众已经知道「这条片子要干什么」的那一刻，不是固定 3 秒，由拆解方自己判：首帧就交代清楚→0.2 秒；要一个动作做完才看清→那个动作结束的帧；要一次切换或一句字幕才懂→那一帧。下限 3 秒、上限 8 秒。\n微段表格子数 = T_钩 ÷ 0.2，一格都不许合并。"}, {"id": "d1-1-6", "title": "情绪五通道", "summary": "情绪不能只靠脸。原片用了哪几个通道，复刻就得用哪几个。", "table": {"head": ["通道", "指什么", "例子"], "rows": [["① 表情 / 视线", "脸上的变化、看向哪", "皱一次眉，不持续"], ["② 身体动作与节奏", "动作快慢、力度、姿态", "肩前倾、快步不跑、每步比平时大"], ["③ 环境", "天气、光线、地面状态", "身后雨帘密集、地面湿痕扩大"], ["④ 声音", "动作声、环境声、呼吸", "脚步踩水、道具碰撞"], ["⑤ 镜头语言", "景别、是否固定、切点", "固定全景、1.37 秒硬切"]]}, "note": "强度标尺：0 无 / 1 微（停一下、看一眼）/ 2 中（加快动作、皱眉一次）/ 3 强（跑、喊、摔东西）。改造类原则上不上 3。"}, {"id": "d1-1-7", "title": "拆解的三条硬规则", "summary": "违反了这三条，拆解结果不能用。", "points": ["看不到、听不清、拿不准的，一律标「未核」，不许猜。声音没听就写「声音未核」，不许写「无声音」。", "秒数按事件边界切，不按固定秒数硬切。写清采样精度：开头是 0.2 秒一格，后段是 1 镜 1 张中点帧。", "画面里有像儿童的人，必须在 00_对标索引.md 里明确标出来。"], "pitfalls": ["把「没声音」当成事实写下来 —— 实际是没听，不是没有。", "按 1 秒一格硬切 —— 会把一个连续动作切成两段，后面骨架就错位了。"]}]}, {"id": "d1-2", "title": "② 复刻", "tag": "第2段", "instr": "2", "summary": "拿拆好的对标，排出 N 个版本。先出一份中间过程稿给人审，定稿后才建版本文件夹。", "points": ["这一阶段的产出不是成品，是一份「中间过程稿」。它是给人逐行判「过／改」的。", "人点头之前：不写版本设定书、不建 V 文件夹、不开始写开头。"], "children": [{"id": "d1-2-1", "title": "为什么要有中间过程稿这一层", "summary": "因为「一次产出 N 份」这个方法本身有问题。", "points": ["拆完之后直接开写，AI 会把 N 个版本写成 N 份差不多的东西，你不知道差在哪。", "中间过程稿把「差在哪」先摆成表，人一眼能看出哪两版撞了、哪一版越界了。", "所以它是持续对话：先出稿 → 人纠正 → 改稿 → 人再说定稿 → 才生成设定书。"], "note": "一个批次一份中间过程稿，不是一版一份。"}, {"id": "d1-2-2", "title": "T 值怎么定", "tag": "最容易写死的地方", "summary": "T 不是 13 秒，也不是 2.3 秒。它是原片里「人第一次接触要处理的东西」的那一刻。", "points": ["取到那段动作结束，不是取一个整数。", "必须做比例校验：T ÷ 全片总时长，应落在 12%–18%。", "实测参考：修坑 01 = 13 秒，02 = 16 秒，06 = 22 秒，收衣服那条 = 2.6 秒。", "T 一旦定下来写进设定书，下游三段一律引用，不许重算。"], "pitfalls": ["套 13 秒 —— 那是一条片子的值，不是规范。", "套 2.3 秒 —— 那是另一类开头的值。", "把 T 取成一个整数好看 —— 会切断动作，接缝永远对不上。"]}, {"id": "d1-2-3", "title": "一批评多能出几条", "summary": "版本数 ≤ 可调子维度数 + 1。不够就减条数或换源，不许硬拆。", "points": ["先把这条对标的可调子维度挖出来，列成清单。", "有几个子维度，最多就能出几条（+1 是那个对照版 V1）。", "要的条数超过上限，给两条路：减条数 / 换对标。不许把同一个子维度拆成两条。", "V1 必须是对照版：锁死层全抄、可换层全换、可调层一处不动。"], "pitfalls": ["为了凑够条数，把「出事时点」拆成「早一点」「晚一点」两版 —— 这两版会撞车。"]}, {"id": "d1-2-4", "title": "三层分界：锁死 / 可换 / 可调", "tag": "复刻的底层方法论", "summary": "十三条锁死、八项可换、一组可调子维度。这是整套复刻的地基。", "table": {"head": ["层", "数量", "规则", "越界长什么样"], "rows": [["锁死层", "13 项", "每版完全一致，一个字都不能动", "「砸」换成「钉」＝越界（锤子换棒子可以，砸不能换）"], ["可换层", "8 项", "每版全换，不许重复", "两版用了同一个受害物 ＝ 撞车"], ["可调层", "子维度", "每版只动一处", "一版同时动了首帧关系和出事时点 ＝ 两处，作废"]]}, "note": "锁死层里包含情绪弧：每段的情绪、强度、五通道分配都要与母版一致。「着急」改成「生气」＝越界；把情绪从②身体搬到①表情＝越界。"}, {"id": "d1-2-5", "title": "可调子维度都有哪些", "summary": "从 8 条对标拆解里挖出来的真实可调项。", "points": ["A1 首帧关系 —— 威胁和受害物在不在同一帧、朝不朝向", "A2 出事时点 —— 第几秒出事", "A3 受害者数量 —— 一个还是多个", "A4 问题段冗余 —— 问题展示占几刀", "A5 开工时点 —— 人什么时候开始动手"], "note": "这张表会随着看得更多而变长。每挖到一个新的可调项，先验证它不会和已有的撞车，再加进来。"}, {"id": "d1-2-6", "title": "中间过程稿的十七节", "summary": "第 0 节最要紧，那是给人看的第一屏。", "table": {"head": ["节", "内容"], "rows": [["第 0 节", "判定摘要：八行"], ["第 1 节", "本批说明：T 值、T 的来源、12%–18% 校验"], ["第 2 节", "拆解摘要：七段环节 / 表面十项 / 首帧五要素 / 情绪弧；**开头要有来源戳**（抄自哪份、改于几时），原拆解一改就要重抄；**另加逐段速查表**（段号｜起止秒｜状态变化），否则 4.5 逐刀表没有依据"], ["第 3 节", "骨架主表（全批一张）"], ["第 4 节", "变/不变判定表（锁死 13 项 × 各版）"], ["第 5 节", "情绪节拍表（十列，全批一张）"], ["第 6 节", "表面替换表（可换 8 项 × 各版）"], ["第 7 节", "可调子维度分配"], ["第 8 节", "版本差异矩阵"], ["第 9 节", "V1 十一列逐段对照表（只 V1 写全）"], ["第 10 节", "V2–Vn 只写和 V1 不同的那几行"], ["第 11 节", "每版三处最容易生成错的点"], ["第 12 节", "七问判定"], ["第 13 节", "必须有 / 禁止有"], ["第 14 节", "待裁决冲突（每条两个选项 + 建议）"], ["第 15 节", "改动理由总表"], ["第 16 节", "待核与风险"]]}}, {"id": "d1-2-7", "title": "第 0 节判定八行", "tag": "人只看这一屏", "summary": "八项全「过」，才允许往下走。有一项「改」，就说清哪一行不对。", "points": ["骨架同构 —— 13 项锁死层是否与母版一致", "开头成立 —— 第 0 秒是否真的有事在发生", "表面换净 —— 可换 8 项是否全部换掉、且不撞车", "终局兑现 —— 结尾是否真的解决了开头的问题", "情绪一致 —— 情绪弧、强度、通道分配是否与母版一致", "像真人 —— 有没有一眼看出是演的", "改动量 —— 每版是否只动了一个子维度", "版本不撞 —— 任意两版有没有落在同一个子维度上"], "note": "这八行是给复刻者自己先判一遍的。它判完贴回来，人再判一遍。两边不一致的地方，就是最该谈的地方。"}, {"id": "d1-2-8", "title": "定稿之后：建文件夹 + 写设定书", "summary": "人说「定稿」才开始。之前一步都不许做。", "points": ["在批次目录下建 V01_短名 … Vnn_短名，每个里面建五个子目录：开头\\ 分镜\\ 单元\\ 生成\\ 说明\\", "每个 V 目录写一份 00_版本设定书.md，十节，十节缺一节下游就停。", "写 00_批次总览.md：批次编号、对标编号、N 版清单、发布顺序、当前状态。", "第 14 节的冲突裁决结果，抄进受影响的那几版的设定书。"], "pitfalls": ["提前建 V 文件夹 —— 后面对不上时，空目录会一直在那儿，没人敢删。"]}, {"id": "d1-2-9", "title": "版本设定书十节", "tag": "下游三段的唯一标准", "summary": "这一份文件取代了以前所有的「底稿」「本条设定」。", "table": {"head": ["节", "内容"], "rows": [["1 版本身份证", "版本编号、对标编号、一句话差异、占了哪个子维度、锁死声明"], ["2 T", "T ＝ 几秒、来自原片第几秒、比例校验"], ["3 骨架主表", "段 / 秒 / 原片画面 / 结构一致吗 / 意思一致吗 / 第一眼读到什么"], ["4 本版逐段表", "十一列，含情绪、强度、载体、变了什么＋理由、最易生成错什么"], ["4.1 T 秒末态十项键值", "十项，一项不许空。第④段逐项对上"], ["4.5 逐刀动作预算表", "六列：刀号 / 起止秒 / 从X变成Y / 那一个动作 / 位移 / 动作数（0 或 1）。全表合计≈原片动作数 ±20%"], ["5 情绪节拍表", "十列，全批共用"], ["6 表面清单八项", "C1–C8 本版值"], ["7 七问结论", "七条"], ["8 必须有 / 禁止有", "场景、人物分开"], ["9 已裁决的冲突", "冲突 / 裁决 / 影响哪些段"], ["10 交付契约", "总时长、关键时间点、各段交什么、模型参数"]]}}, {"id": "d1-2-10", "title": "T 秒末态十项键值", "tag": "接缝的唯一依据", "summary": "第③段写到 T 秒就停，第④段从 T 秒接着写，两边靠这十项对齐。", "points": ["末态.主体物数量与状态", "末态.主体物位置与朝向", "末态.场地与地面状态", "末态.主角位置与姿态", "末态.工具去向", "末态.旁观者位置", "末态.情绪强度", "末态.旁白累计词数", "末态.机位锚点 C0", "末态.已被接受的真实媒体（没生成就写「无」）"], "note": "十项里缺任何一项 → 下游必须报 BLOCKED，不许自己编一个。这是第 2、3 条反复冲突（20 英尺箱 vs 40 英尺箱）的根因。"}, {"id": "d1-2-11", "title": "情绪节拍表十列", "summary": "全批共用一张。下游三段的情绪都从这里取，不许自己另写。", "table": {"head": ["列", "填什么"], "rows": [["段", "①②③④…"], ["触发事件", "画面里发生了什么，导致这个情绪"], ["情绪", "一个词：急 / 烦 / 无奈 / 松一口气"], ["强度 0–3", "0 无 / 1 微 / 2 中 / 3 强"], ["① 表情 / 视线", "写具体动作，不写形容词"], ["② 身体动作与节奏", "同上"], ["③ 环境", "同上"], ["④ 声音", "同上"], ["⑤ 镜头语言", "同上"], ["观众应感到", "写观众，不是写人物"]]}, "note": "情绪弧一句话：__ → __ → __ → __（强度 __/__/__/__）。这句话是检查整批情绪有没有跑偏的第一道关。"}]}, {"id": "d1-x", "title": "复刻只交三块，不是十七节（2026-10-27）", "tag": "最新·最省事", "summary": "原来交「中间过程稿＋版本设定书」27 节，用户完全看不懂。现在只交一份微调大纲，三块。", "points": ["**为什么改**：17 节里没有一节叫「大纲」，全是判定表、对照表、矩阵、台账。第 9 节那张表 11 列，**只有 2 列是写作用的**，其余 9 列全是验收。人竖着读句子，横着读 11 格会断——读不懂不是用户的问题。", "**阿初在这一步只交一份东西**：「视频提示词不重要，**重要的是大纲**；大纲弄好就足够了，润色交给 AI」（L371–379）。他说这一步「最难，占我绝大部分时间」（L881）。", "**第一块 · 骨架（一句话 ≤50 字）**：阿初概括《目中无人2》1 分 50 秒只用一句「主角被坏人追逐抓住-被欺负后无力的反击-在要被伤害前被好人阻止-好人打跑了坏人-好人无视了主角」。**人数、道具、场地、「甚至分镜的数量」全是细节，骨架里一个都不出现。**", "**第二块 · 大纲（大白话，按刀往下写，每刀 2–3 行）**：不许表格；情绪写在动作里（「她没有喊，只是喘」＝情绪，「她很害怕」＝废话）；素材秒写在标题行；一刀必须是一个人能连续做完的片段。V01 写全，V02 起只写不同的刀。", "**第三块 · 变更短表（≤20 行）**：占哪个子维度／骨架动没动／表面换了什么／加一个／删一个。**加两个以上不是微调，是重写。**", "**其余 12 节降级成检查项**：锁死项、情绪强度、C1/C2/C3/C5 不撞、骨架分句数、总时长±5秒、T 占比 12–18%、表面八项每版都换、各版不同子维度。**AI 自查，只在对话里报「8 条全过」，不写成文档给人看。**", "**版本设定书仍要写，但是派生**：定稿后从大纲机械搬运，不新增任何设计。派生出大纲里没有的动作或场地＝错，打回。"], "note": "完整对照与阿初原话见 `37_复刻环节对照阿初_20261027.md`；模板见 `12_中间过程稿_模板与样例_20261021.md` 第一部分（三块），旧十七项在附录 A。"}]}, {"id": "d2", "title": "二、开头", "tag": "③  0–T 秒", "summary": "只做 0 到 T 秒。给观众一个必须看下去的理由，并且留下一个待解决的问题。", "points": ["这一段只写开头：0–T 秒。不写后段小分镜，不划整片生产单元。", "**开头自己那一个单元（U01）的图提示词和视频提示词，本轮必须写。** 第⑤段从 U02 开始划，没有 U01 就出不了图，而重生成主要就发生在开头这一段。", "先交三样，人说「确认」之后才存文件：新旧逐秒对照表、必须有/禁止有清单、七问答案。", "**U01 的刀数照样是除出来的：生成秒 ÷ 2，生成秒 ＝ T ÷ 0.867。** T 11 秒 → 生成 13 秒 → 6–7 刀；只写 4 刀就是每刀 2.75 秒以上，会傻站。T 只有 4–6 秒的就 2–3 刀，不许为凑 13–15 秒加内容。", "**视频提示词逐刀写，不许写成一段连续描述。** 每刀四样：镜头号＋时长＋景别机位｜起点状态（画面里看得见的物件）｜那一个动作｜终点状态；每两刀之间单独一行写「⚠️硬切至镜头N：一帧完成，不许推拉、不许摇、不许渐变、不许叠化、不许闪白」。", "和第④段可以同时做 —— 它们不互相等待，都对着版本设定书。"], "children": [{"id": "d2-1", "title": "只读四样东西", "summary": "读多了会跑偏。设定书是唯一标准。", "points": ["00_版本设定书.md —— T、骨架段数与每段秒数、锁死层、可换层、情绪节拍表、表面清单、七问结论、必须有/禁止有，全在里面", "benchmark-adapt-hook 的 SKILL.md —— 全文读", "对标首帧 first_frame-001.jpg —— 必须实际打开看，用来比「看过感」", "RC01_主角身份参考_v01.png —— 必须实际打开看，只借脸和体型，不借衣服"], "note": "禁读：拆解原文、其他版本目录、分镜\\、单元\\、别的批次。", "pitfalls": ["回头去读拆解原文 —— 会拿原片的表面元素，写出一个「像对标」而不是「本版」的开头。", "身份图不存在就自己生成一张 —— 主角会变脸，全片废。"]}, {"id": "d2-2", "title": "T 值不重算", "summary": "设定书第 2 节写了多少就是多少。", "points": ["哪怕某一版你觉得这段太短或太长，也不许改。", "有意见写进「待裁决」交回来，不许自己选一个。", "段数、每段秒数同理，一律照设定书第 3、4 节。"], "pitfalls": ["「优化」一下节奏 —— 这是最常见的越界，改完接缝就全错了。"]}, {"id": "d2-3", "title": "骨架照搬，不改", "summary": "外部条件已经变了 → 人立刻处理暴露的东西 → 原位置留下一个需要改造的问题。", "points": ["核心机制照设定书。上面这句是常见形态，不是唯一形态。", "不许增加解释镜头、表情镜头或额外段落。", "距离走不完，用原有切点吃掉路程，不拉长各段。"], "note": "你如果认为骨架某处不成立，写进「待裁决」并给替代方案，不要静默改。静默改是这套流程里最贵的错误。"}, {"id": "d2-4", "title": "七问：每个替换项都要过", "tag": "判断真实性的唯一工具", "summary": "人物、场景、触发、暴露物、动作、转移方向，逐项回答这七条。", "table": {"head": ["#", "问什么", "答不上来说明什么"], "rows": [["1", "物理上真的会这样吗？距离和动作能否装进设定书的秒数？", "动作设计超出现实，AI 也生成不出来"], ["2", "他为什么这样做？生活动机是什么？", "为了剧情硬凑的动作，观众一眼看出来"], ["3", "替换后，这一段原来要表达的意思还在吗？", "换了表面把机制弄丢了"], ["4", "住户事先知不知道？知道的话，为什么没有提前避开？", "这是个逻辑洞，观众会问"], ["5", "有没有更简单的办法他会先用？", "如果有，整段就不成立"], ["6", "反应力度合理吗？是否演过头？", "演过头就不像家庭录像了"], ["7", "有没有真人抱怨过这个问题？", "编帖子、编链接＝造假，材料不足就标「待核」"]]}, "note": "一项怎么改都过不去，不要硬写。指出卡点，给最接近的替代办法。", "pitfalls": ["把七问当形式，每条写「已检查，没问题」 —— 等于没做。"]}, {"id": "d2-5", "title": "第 0 秒铁律", "summary": "外部条件必须正在打到暴露物上，两者同框，近处看得清。", "points": ["「已经湿了」「已经坏了」「已经脏了」都不算。必须是正在发生。", "观众第一眼要能看出：谁 ＋ 紧挨着什么 ＋ 马上要出事。", "不能为了让效果更明显，把痛点移出画面。"], "pitfalls": ["先拍一段干燥/w正常的画面，再等事情发生 —— 前三秒就废了。"]}, {"id": "d2-5b", "title": "机位四件套（开头最容易丢的两项）", "tag": "微观感 vs 站在旁边看", "summary": "开头两镜决定观众是「站在旁边看一个人收拾」还是「趴在地上看一双手」。差别不在文字风格，在这四个数字。", "table": {"head": ["项", "必须写", "怎么算写清了"], "rows": [["① 高度", "离地多少米", "写数字。「略高」「偏低」「贴地」都不算写清"], ["② 俯仰", "俯视 / 平视 / 仰视 + 证据", "俯视＝能看到他的头顶和身后的地面；仰视＝廊顶或天空占大半"], ["③ 焦段", "广角 / 标准 / 中长焦", "广角的证据：纵深强、近大远小、边缘有透视拉伸。B0001 原片就是广角，廊的纵深一口气吃到尽头的门"], ["④ 人物占比", "人占画面高度几分之几", "约 1/2、约 2/3，必须给比例。不给比例，模型会自己放大成近景"]]}, "pitfalls": ["只写高度不写俯仰 —— 1.3 米可以拍成平视，也可以拍成俯视，效果完全不同。", "只写「中景」不写焦段 —— 中景是取景范围，广角是镜头，两者不互相替代。原片是「广角 + 中景」，我们只写了中景。", "不给人物占比 —— 模型默认把人放大，一放大就从「人＋空间」变成「手＋叶子」，这就是微观感的来源。"], "note": "B0001 首帧实测：机位约 1.5 米（能看到廊顶横梁和他的头顶）、明显俯视、广角（地板砖被拉成梯形、纵深到尽头的木门）、人约占画面 40–45%。拆解文件写的是 1.2–1.4 米，偏低。**这一套只对开头（0–T 秒）严格；后段只要高度写米数、景别写清就能生产，不必逐项复刻原片。**"}, {"id": "d2-6", "title": "情绪：五通道 + 强度", "summary": "设定书第 5 节给了哪几个通道就用哪几个，不许增删。", "points": ["① 表情/视线　② 身体动作与节奏　③ 环境（天气光线）　④ 声音　⑤ 镜头语言", "强度 0 无 / 1 微（停一下、看一眼）/ 2 中（加快动作、皱眉一次）/ 3 强（跑、喊、摔东西）。改造类原则上不上 3。", "每条情绪至少落到 ② 或 ③ 或 ④ 之一。"]}, {"id": "d2-7", "title": "两条情绪红线", "tag": "违反就不许提交", "summary": "这两条是为了让提示词真的能生成出情绪。", "points": ["正文里禁止出现情绪形容词：着急、满意、心疼、无奈、紧张……", "要写就写可见的东西：肩前倾、快步不跑、每步比平时大、皱一次眉不持续、身后雨帘密集。", "只靠 ①表情 一个通道承担情绪的段落，不许提交，标出来交回来。"], "note": "为什么：模型看不见「着急」，只看得见「肩前倾」。形容词写进提示词，生成结果一定平。"}, {"id": "d2-8", "title": "不能撞车：三项表面", "summary": "同一个系列里，这三项必须每版都不一样。", "points": ["暴露物 —— 不能用上一版用过的东西", "拍摄位置 —— 比如不能又是路边车里、又是车库内向外", "问题来源 —— 比如不能又是落水管冲泥沟、又是门槛渗水"], "note": "具体禁什么，照设定书第 6 节表面清单和第 8 节禁止有。不需要去翻别的版本。"}, {"id": "d2-9", "title": "画面质感与声音", "summary": "家庭手机随手拍，不是广告片。", "points": ["自然光、轻微手抖、有点乱、东西是用旧的。", "不要电影感、4K、网红滤镜、样板间。", "第一段固定机位，不运镜，只允许轻微手持抖动。", "没有说话就明确写「无对白」，不编台词、不加字幕、不加音乐。"], "pitfalls": ["为了「好看」加运镜 —— 一运镜就不像手机拍的了。"]}, {"id": "d2-10", "title": "确认前交三样", "summary": "人说「确认」之后才存文件。确认之前不写提示词、不存文件、不生成。", "points": ["交付一：新旧逐秒对照表。行是维度，列是比对。", "交付二：必须有 / 禁止有 清单。场景、人物四块分开。", "交付三：七问逐条答案。每条写具体答案，不写「已检查」。"], "table": {"head": ["对照表的行（12 行）", "对照表的列（7 列）"], "rows": [["画面内容 / 外部条件 / 暴露物 / 入出镜 / 镜头 / 耗时 / 动作 / 力度 / 这段要表达的意思 / 声音 / 原位置留下的问题", "维度 / 原片 / 新片 / 变·不变 / 结构是否一致 / 情绪是否一致 / 为什么"]]}, "note": "另外必须正面回答四个问题：① 第 0 秒外部条件是否正打在暴露物上 ② 原位置的痛点是否还在 ③ 三项表面是否都避开了 ④ T ÷ 总时长是否落在 12%–18%。"}, {"id": "d2-11", "title": "确认后存五个文件", "summary": "只写 开头\\ 及其子目录，加上版本根目录的 共用卡制卡词.md、单元\\U01.md。", "points": ["开头\\开头方案_有效.md —— 逐段表（段/秒/画面/那一个动作/动作数/情绪名/强度/载体/旁白原文/字幕分词）＋「0.0 秒画面里有什么」＋「T 秒末态十项键值」", "开头\\开头交接.md —— T 值 / 十项键值 / 旁白逐字与时间 / 主视点锚点 / 不可改动作 / 首个反应 / 未决项 / 媒体状态；另加「提示词包」一节：U01 生成几秒、装几刀、完整 Prompt 字符数、参考图张数", "开头\\任务记录.md —— 来源、纠正、版本。改一版另存 v2、v3，不覆盖旧版", "共用卡制卡词.md（版本根目录，和设定书同级）—— 照 shared-card-prompts 的格式，只放 RC 章节；主角是一张卡里四个视图，不是四张卡", "单元\\U01.md —— 标题 ＋ 五行头部 ＋ 唯一「## 拼好的完整正文」text 块；图提示词与视频提示词分开写，视频提示词逐刀写，每处切点单独一行写硬切"], "note": "交接里「不可改动作」和「首个反应」这两项别省——第④段要靠它们对齐。U01 是定稿单元，第⑤段不许重写它。"}]}, {"id": "d3", "title": "三、小分镜", "tag": "④  T–结尾", "summary": "从 T 秒末态接起，一次写完到结尾。交的是能直接拿去生产的完整稿，不是框架。", "points": ["只写小分镜。不写生图/视频提示词，不划生产单元，不决定拆几段生成。", "一次完成全片，不单独试做、不以局部代替全片、不等人说「继续」。", "小分镜是成片剪辑单位，不是一次生成单位。两者不要混。"], "children": [{"id": "d3-1", "title": "先接手，不要重新搬运", "summary": "读设定书、开头交接、分镜交接、对标拆解，然后直接开工。", "points": ["全文读 full-storyboard-design 的 SKILL.md。", "读 00_版本设定书.md 第 3、4、4.1、5 节。", "读 开头\\开头交接.md，核对 T 秒末态。", "读 02_开头拆解.md 的 1b）开头微段表（0.2 秒一格），开头的细账全在这里。", "读 RC01 身份图，只借身份，不借旧衣着。"], "note": "设定书和交接里已经写了的事实，不要问第二遍。最新的人确认优先于旧文件。"}, {"id": "d3-2", "title": "什么情况下必须停下来", "tag": "别硬写", "summary": "上游缺项就报 BLOCKED，不要自己编框架。", "points": ["00_版本设定书.md 不存在，或第 2、3、4、4.1、5 节有空 → 停", "第 4.1 节 T 秒末态十项键值缺任何一项 → 停", "第 5 节情绪节拍表缺任何一段 → 停", "停的时候写「缺少上游资料，不能开始正式小分镜」，不要自行编写框架或假设。"], "note": "不许用上一条片子、别的版本目录、历史聊天来补齐。这是第 2、3 条接缝反复出错的根源。", "pitfalls": ["「开头交接不存在，就按设定书自己推」—— 如果设定书十项有缺，这就是猜。"]}, {"id": "d3-3", "title": "第一段必须接上 T 秒", "summary": "逐项对上十项键值，一项对不上就写「待裁决」。", "points": ["从 T 秒那一刻的末态接起，不许让后段重新清场、拆棚、整平、把东西挪回去。", "任何一项对不上 → 写进「待裁决」，不许自己改。", "先调整后段去接开头，不要倒过来改开头。"]}, {"id": "d3-4", "title": "七栏格式", "summary": "每段都按这七栏展开，一栏不许少。", "table": {"head": ["栏", "写什么"], "rows": [["① 对标情况", "原片这段是什么、几秒"], ["② 新片动作", "起点状态 → 那一个动作 → 终点状态 ＋ 机位（后段：高度米数＋景别；首刀另加焦段/俯仰/占比）"], ["③ 要表现的", "观众要看懂什么"], ["④ 情绪和力度", "触发 → 情绪 → 强度 → 载体"], ["⑤ 不能丢", "不能丢失的物理关系"], ["⑥ 差异、风险、证据", "对应对标证据或设定来源、AI 生成风险"], ["⑦ 验收", "本段验收条件"]]}}, {"id": "d3-5", "title": "每段必须写到的十七项", "tag": "七栏是骨架，这是填充", "summary": "七栏是格式，这十七项是内容。少一项这段就生产不了。动作相关只占两项：那一下，和它算几个动作。", "points": ["1 N 编号", "2 起止时间或建议时长", "3 当前人物、空间和道具状态（起点状态）", "4 那一个动作 —— 一句话、不超过 40 字，不拆步骤", "4b 动作数 —— 只填 0 或 1，机器闸门直接读这一栏", "5 接触什么", "6 发生什么可见变化（终点状态）", "7 这一段给观众的新信息", "8 情绪触发和变化（触发 → 情绪 → 强度 → 载体）", "9 机位 —— 后段只要两项：高度写米数 ＋ 景别与运动；俯仰/焦段/人物占比加写更好，不强制。紧接 T 秒的第一刀按开头标准写全", "10 旁白 / 对白原文", "11 字幕分词", "12 动作声、环境声、音乐职责（三类分开写）", "13 不能丢失的物理关系", "14 对应对标证据或本条设定来源", "15 本段验收条件", "16 AI 生成风险"], "pitfalls": ["只写 1–8，声音三类和验收条件省掉 —— 到生产阶段就得回头补。", "把「那一个动作」写成五个步骤 —— 这是 10-22 那条片子废掉的总原因。一句话念不完就是写了两个动作。"]}, {"id": "d3-6", "title": "八条：这些都不算完成", "tag": "交框架＝白干", "summary": "命中任何一条，这份稿子直接退回。", "points": ["只有章节目录", "只有「开头—施工—成品」的框架", "只有阶段名称，没有逐段动作", "只有建议，没有可拍内容", "使用「同上」「略」「后续补充」", "用占位符代替人物动作、旁白、声音或验收", "只写如何拆分，没写真正的小分镜", "只复述对标，没有本条自己的具体内容"], "note": "只能写框架的时候，必须报告 BLOCKED，不能把框架当小分镜交。"}, {"id": "d3-7", "title": "颗粒度硬指标", "tag": "判断是不是框架的尺子", "summary": "这五条能量化地判断一段到底写完没有。", "points": ["第 4 栏「那一个动作」只许一句话、不超过 40 字，动作数恒为 1。出现「先…再…然后…」就是超了。", "动作数 ÷ 秒数 ≤ 本条原片基准 ×1.2。基准用 09 工具\\检查_动作预算.py --baseline 算。", "第②栏必须出现具体动词和接触对象。不许出现「处理」「操作」「施工」「完成」「快速推进」。写一个准确的动词，不是写一串动词。", "声音必须三类分开写：动作声 / 环境声 / 音乐。缺一类就是没写。", "每段正文不少于 150 字，但字数只能由起点状态、终点状态、机位、声音、AI 风险凑，不许用动作步骤凑。"], "note": "第一段是全片颗粒度的标杆。后面任何一段低于它，回头补第一段以下的部分，不是把第一段降下来。"}, {"id": "d3-8", "title": "反例 vs 正例", "tag": "最有效的一条防框架装置", "summary": "给 AI 看「什么叫做完了」，比给它十条规则管用。正例的关键不是写得长，是只写一件事。", "table": {"head": ["", "写法"], "rows": [["反例一（框架）", "N05　05.2–07.0 秒：Alex 在门口安装挡水条。蹲下、对齐、固定，快速完成。"], ["反例二（写成了步骤，最隐蔽）", "N05｜1.8 秒。左手把挡水条右端往回推，推到与门框内沿对齐；左手压住条身；右手放下锤子；去撕胶带背纸，撕开约 15 厘米；把胶面朝下塞进条底。—— 这不是完整，是把一件事拆成了五步。AI 只会做第一步。"], ["正例（完整）", "N05｜1.8 秒｜动作数 1。起点：挡水条躺在门槛内侧，两端各多出约 2 厘米；他蹲在门内，膝盖压着条，右手拎橡胶锤，脚边一卷双面胶还没撕。那一个动作：他把挡水条推正，撕开胶带背纸，把胶面朝下压进条底。终点：条身推不动了，背纸垂在条外。机位：中近景，门内往外斜 45°，固定微晃，不切镜。声音：胶带连续撕开声、条身落地的闷响，屋外雨声持续，无音乐。AI 风险：跳过撕胶带直接摆好；把胶带画在正面。"]]}, "note": "两个反例都要给 AI 看。第一个是「太短」，第二个是「太长但还是一件事被拆碎」——第二个才是 10-22 那条片子的真实死因。正例 120–160 字，其中真正描述动作的只有一句。"}, {"id": "d3-9", "title": "终局闭环六环", "summary": "结尾只有漂亮空镜，这一版就不算成立。", "points": ["开头问题 → 观众担心的后果 → 中间解决动作 → 终局空间状态 → 人物实际使用或结果验证 → 开头情绪兑现", "结尾必须同时兑现三件事：问题真的解决、完成的空间值得欣赏且有施工来处、同一个人真的在用。", "不能只有成品空镜、几秒展示或字幕宣布成功。", "不能移走问题物件、换机位或换场景作弊。"], "pitfalls": ["把「安装完成」当成验证 —— 安装完成 ≠ 功能成立。要有人真的用它。"]}, {"id": "d3-10", "title": "移交生产表九项", "summary": "小分镜末尾必须附这张表，第⑤段全靠它。", "points": ["终局", "开头锁定状态", "阶段路线", "人物、道具和空间", "每个 N 编号分镜清单", "旁白 / 对白冻结位置", "不得改变的物理关系", "未决项", "生产风险"], "note": "没得到人最终确认前，这张表标「待最终确认」。不能伪称已确认，也不能直接启动生产。"}, {"id": "d3-11", "title": "时长怎么定", "summary": "从必要有效动作和验证推导，不是先定时长再删内容。", "points": ["给一个明确的推荐总时长，不留下大段「不够再延长」。", "区分成片取用时间与自然动作素材时间。", "不要先锁镜头数、生成单元数或旧预算，再删薄施工。", "需要增加时长时，说明新增了哪项必要证据，不能只说「更完整所以更长」。"]}, {"id": "d3-x", "title": "成片秒 ≠ 素材秒（2026-10-27 根因）", "tag": "最新·最靠上游", "summary": "小分镜只写了一个秒数，下游拿它当拍摄长度用——这是内容层一直修不完的真正源头。", "points": ["**两个数必须分开写。** 成片秒＝这一刀剪完有多长（＝对标节奏，剪辑目标）；素材秒＝一个人把这个动作真实做完、观众看得清，需要多少秒。**素材秒 ≥ 成片秒。**", "**算术证明它必须分开**：分镜写 N09「40 块板铺满 9 米，成片 4.734 秒」→ 每块 0.12 秒＝一秒铺 8 块半。那不是手在铺板，那是快进。对标能这么剪，因为它是剪辑；我们一次生成里演 40 块，物理上不可能。", "**下游只有成片秒时会怎样**：每个动作被死死压在自己那一格里做不完，模型不会停下来问，它自己补一段走位把空档填上——走过去、搬东西、站着。10-27 两条片子 23 秒里 5.9 秒（26%）是这么来的。", "**正确做法（阿初同款）**：生成到动作做完为止，再在剪辑里压到成片秒。他自己「空中跳下的戏成片 13 秒，我剪掉了 2 秒」——15 秒生成、13 秒成片。", "**顺带修掉一个死锁**：原规则「每单元取用率 ≥60%」按刀卡，数学上不成立——平台单段最少 4 秒，成片 <2.4 秒的刀必然低于 60%（转头 0.834 秒→20.8%、立栏杆 2.033 秒→50.8%、末镜 1.920 秒→48%）。按刀卡会强制这些刀跨工序并进别的盒子，而跨工序合并必然产生状态跳跃。**改成：取用率只在盒级考核，目标 87%。**", "**另外一条要加限定**：「中间段时长 ÷ 工序数 ≥ 对标×0.9」只管成片看起来不像浅浅收拾了一下，**跟拍摄要几秒无关**。拿它压素材秒，等于让一个人在 0.5 秒里做完 10 秒的活。", "**最关键的一句：对标的成片是「AI 生成之后再加速」剪出来的。** 拿它的成片秒去卡我们的拍摄长度，等于要求模型在 4.7 秒里铺完 40 块板——物理上不成立。所以 2026-10-27 起，**上游只约束素材秒，成片秒是「Σ素材秒 × 剪裁比 0.867」算出来的结果**（全项目只有这一个数，别再写 0.83／0.85／0.75–0.85）。", "**同日删掉的一批规则（都是剪辑规矩，不该写进拍摄）**：「每刀 ≥2 秒」「位移刀 ≥2 秒」「每单元成片取用 ≥2 秒」「刀级取用率 60%」。「中间段时长 ÷ 工序数 ≥ 对标×0.9」也删了。阿初自己的 15 秒组是 2/2/2/3/5/1，**含 1 秒的刀**。保留的只有「工序数 ≥ 对标×0.9」——那管的是改造量，是内容不是时长。", "**素材秒由 AI 预演决定，不抄对标。** 算法：数观众要看清几个关键接触点，每个 0.8–1.2 秒，加起手收尾。例：铺一块板＝端起 0.4＋落位 0.4＋压平 0.4≈1.2 秒；要让观众看清 4 块→4.8 秒；加起手收尾→**素材 6 秒**。", "**没有另设「素材段数」这一栏**（这是 10-27 晚间的修正）。改成把**「刀」的定义收紧**：一刀 ＝ 一个人能连续做完的一个动作片段，中间不含时间跳跃。判据：按「发生了什么变化」切段，**有「没变化」的段就不合格**，拆成两刀、中间硬切。段就是刀，拆了刀自然就有了。", "**素材秒不许凭空写**，按 `references/material-seconds.md` 算：`起手 0.5 ＋ Σ动作单位 ＋ 收尾 0.5`。动作单位表：接触—改变—离开 1.0–1.5 秒／重复第 2 次起 0.8–1.2 秒／位移 1 米 0.7–0.8 秒／转身 0.8–1.0 秒／蹲站 1.0–1.5 秒／抱起放下 1.5–2.5 秒／工具一次行程 0.6–1.0 秒。**不许小于 1.0 秒；估不准往上取**（多给 1 秒只花 1 秒积分，少给要重抽，4 秒起）。", "**拆分理由加了第六条：一个人连续做不完（需要时间跳跃）。** 前五条管「盒」（一次生成），第六条管「刀」，别混。拆完每一刀都是一个人真能做完的，所以这条不算过度拆分。", "**18:36 扫出并修掉「小分镜指令 vs 小分镜 skill」三处冲突**：① 指令里同时写着「按 skill 的七栏」＋「每段 15 项」，两套字段表并列 → 改成「七栏是分组、15 项是字段」并给出对应表；② skill 的每段 7 栏没有素材秒 → 补上，并把标题格式改成 `成片秒／素材秒`；③ skill 的移交表只有一栏「建议时长」→ 拆成「成片秒｜素材秒」。另外 `检查_动作预算.py` 里残留的「位移刀 ≥2 秒」也删了。"], "note": "完整推理与逐刀算术见 `36_小分镜是不是根源_20261027.md`。这一节在流程上比「内部硬切」「动作来源」「状态跳跃」都更靠上游——那三条是补救，这一条是去掉病根。"}]}, {"id": "d4", "title": "四、生产单元", "tag": "⑤", "summary": "把确认好的小分镜，转成能直接导入生产程序的包：单元卡、共用卡、导入清单。", "points": ["你就是本轮生产执行总控。直接接手执行，不重新研究选题，不重新设计整片故事。", "我只跟你一个人沟通。你负责划分、写词、整合、检查、修复和交付。", "目标是保留观看任务、施工因果、情绪和终局功能，减少不必要的生成与返工。不是追求单元最少，也不是利用率数字好看。", "分两段交：第一段只报「两个数 ＋ 单元数 ＋ 一张表（生成秒/取用秒/取用率）」，我点头才写词。取用率低于 60% 的行直接打回。"], "children": [{"id": "d4-1", "title": "先读什么，读到什么程度", "summary": "SKILL.md 全文读完；references 按需打开，不要机械读完。", "points": ["SKILL.md 全文 —— 主流程、渠道参数、文件格式都在里面", "00_版本设定书.md 第 4、4.1、5、6、8、10 节", "开头\\开头交接.md 及其指定的开头方案、共用卡、U 卡", "分镜\\分镜交接.md、分镜\\改动影响清单.md", "分镜\\后段小分镜_有效.md —— 最重要，必须完整掌握一次，不许为省 token 跳读", "RC01 身份图 —— 只借脸和体型"], "table": {"head": ["走到哪一步 / 遇到什么", "打开这份 references"], "rows": [["划 U、判断合并还是拆分", "shot-vs-generation-unit"], ["判断一个 U 能塞多少动作", "prompt-density-and-merging"], ["写正文、把动作转成秒数", "prompt-and-performance"], ["选卡、查参考图冲突", "reference-image-policy"], ["写生产总图、建台账", "production-ledger"], ["单元 ≥4，要分组并行", "file-driven-production"], ["机器卡格式拿不准", "auto-production-table"], ["判断什么时候停、失败怎么修", "sampling-and-stop-rules"], ["空间要分阶段", "state-planning"], ["终局或输入不清", "intake-and-end-state"]]}, "pitfalls": ["把二十几份 references 和 templates 全打开一遍 —— 浪费时间，也不会因此写得更对。"]}, {"id": "d4-2", "title": "第一步：接缝核对八条", "summary": "对照 T 秒末态和 T 秒后起点，逐项核。", "points": ["人物身份与穿着", "场地锚点", "主体物朝向、颜色、数量、离地阶段", "工具去向", "旁观者位置", "门窗与地面阶段", "旁白与字幕", "实际总时长"], "note": "还要核三件事：开头最后一句和后段第一句有没有重复/遗漏/句中硬断；T 秒处有没有空档或双重叠放；后段有没有重做开头已经做完的事。", "table": {"head": ["对不上时", "怎么处理"], "rows": [["方案没写清", "退回改方案，不许「生成的时候再说」"], ["AI 生成控制不住（比如木纹每次不同）", "记成风险，写清生成时怎么约束"]]}}, {"id": "d4-3", "title": "防过度拆分检查", "tag": "原文，一字不改", "summary": "这一段是整套生产流程的核心。它防的是「一段分镜一个单元」这个默认错误。", "points": ["小分镜是成片剪辑单位，不是一次生成单位。不得先按分镜或工序划出小组，再默认小组边界不可改变。", "1 先列必须看见的首次接触、状态变化、功能证据和必要情绪停留。", "2 同人物、同空间、可连续表达的相邻动作，先尝试合成一个生产单元；允许内部硬切，重复工序按项目规定省略。", "3 从合并后的有效动作重新估算生成时长，去掉重复开场、取工具、走位、重复劳动和无职责收尾。禁止用两个旧单元的生成预算相加，作为「超过时长所以必须拆」的证明。", "4 对每个拟拆边界，写出具体硬理由：模式不能承载、物理起点不兼容、去冗余后仍超时、真实生成持续过载，或用户明确要求分开。换机位、换工序、高风险、需要独立验收，都不单独构成拆分理由。", "5 提交提示词前，再检查一遍相邻单元是否可以合并、共享参考卡是否可以减少，以及生成与取用差额各自承担什么职责。不能为了利用率好看删除关键证据，也不能把预算节省说成实测成功。", "6 合并容量不确定时，先验证负载最高的一组；失败只补局部或做最小拆分，不默认恢复旧方案。"], "note": "提交生产规划前，必须做「生产单元划分与取用联合检查」。先逐刀区分：完整动作、有效末段、原切点前可省的准备或重复劳动、允许的连续加速、不可压缩的功能与情绪停留。扣清后再合并、重新估生成时长，不把完整施工耗时或旧单元预算相加。", "pitfalls": ["原文里的「量级标尺」已换成下一节点的硬表 —— 旧口径「30 秒级 5–9 个单元」对短片子偏多，照它划就会划出 5–6 秒一个单元。以硬表为准。"]}, {"id": "d4-4", "title": "每个 U 要列的十五项", "summary": "聊天里只给简表，详细依据落文件。前五项是动作预算和取用，必须能算出来。", "table": {"head": ["项目", "必须写清"], "rows": [["动作总数", "本单元覆盖的刀，动作数相加（每刀取自设定书 4.5 节，只能 0 或 1）"], ["动作密度", "动作总数 ÷ 生成秒数，**必须 ≤ 本条原片基准 ×1.2**"], ["位移刀位置", "哪个 N 是位移类，排本单元第几刀。位移刀要排第 1 或第 2 刀"], ["取用率", "取用 ÷ 生成，**必须 ≥60%**。<60% 这个单元不许提交"], ["内容够不够一格", "这一 U 承担的分镜时长，**<2.0 秒不许单独成单元**"], ["覆盖分镜", "具体 N 编号，不写「中段」"], ["完整动作", "从起点到终点的动作链"], ["生成时间", "估计或实测，必须标状态"], ["成片取用", "起止窗口和实际取用职责"], ["负责内容", "这一 U 承担哪些状态变化 / 功能证据 / 情绪停留"], ["差额用途", "生成时间与成片取用差额具体用于什么"], ["拆分理由", "如有拆分，写具体硬理由"], ["参考图", "上传顺序、文件名、每张图的职责"], ["合法裁剪", "是否能从连续动作中合法取用"], ["负载风险", "哪个接触或状态最容易失败"]]}, "pitfalls": ["用「自然动作需要」「剪辑余量」「后期选段」解释差额 —— 这三句话等于没解释。", "只列覆盖刀不列动作总数 —— 10 刀可能装了 41 个动作（实测 4.10 步/秒），表上看不出来。", "只列生成秒数不列取用率 —— 生成 6 秒取 0.3 秒的单元在表上看起来毫无问题。"]}, {"id": "d4-5", "title": "六条不能单独作为拆分理由", "summary": "这六条单独出现，一律不许拆。", "points": ["换机位", "换工序", "风险高", "需要独立验收", "习惯上一个分镜一个单元", "旧方案曾经这样划分"], "note": "后两条是最容易悄悄回潮的。看到「以前就是这么分的」，要问：这次的物理条件变了吗？没变就合并。"}, {"id": "d4-6", "title": "第 1 步：先算两个数，定单元数", "tag": "这时候还没看小分镜", "summary": "顺序是死的：先算数 → 再装盒 → 再填表。先翻小分镜再想单元，就会照着 25 刀划出 25 个盒子。", "points": ["成片总时长 —— 照设定书第 10 节，不自己重算", "生成总时长 ＝ 成片 ÷ 0.867（阿初 15 秒生成剪成 13 秒，L4622／L8392。全项目唯一的剪裁比）", "查下表得到单元数（含开头 U01）"], "table": {"head": ["成片时长", "20–35 秒", "36–50 秒", "51–70 秒", "71–95 秒"], "rows": [["单元数", "3–4 个", "4–5 个", "5–6 个", "6–8 个"]]}, "note": "为什么是这个数（2026-10-27 全部改成阿初口径）：一组＝一次生成＝装满 13–15 秒、装 6–7 刀、每刀约 2 秒。算法是 **1 ＋ ⌈(生成总时长 − U01 生成秒) ÷ 15⌉**——U01 只有 T÷0.867 秒，占不满 15，**直接拿生成总时长 ÷ 15 会少算一个**，装到最后一定有一个盒子超过 15 秒。例：成片 62.5 秒 → 生成 72.1、U01 6 秒 →（72.1−6）÷15＝4.4 → 6 个盒子（直接除只有 5 个，装不下）。**多一个盒子就多一次「每刀被拉长」的机会**：盒子越短、每刀越长，废动作越多。这个数字是后面所有动作的前提，划的盒子数必须落在这一格，多一个都要单独写理由。", "pitfalls": ["先想「这条片子有哪几段」，再往上套数字 —— 那就是照着分镜划，必碎。", "按 100% 排预算 —— 剪裁比是 0.867，按 100% 排成片一定短一截，然后靠删动作硬凑。"]}, {"id": "d4-6b", "title": "第 3 步：填表后四条自检", "tag": "一条不过就重装", "summary": "这两个数（生成几秒、用几秒）填进去，自己就能看见哪一行不对。", "table": {"head": ["自检", "阈值", "不过怎么办"], "rows": [["生成秒", "整数，4–15", "取整或调整盒子"], ["成片取用", "≥ 2 秒", "并到邻居里，内部硬切"], ["取用率 ＝ 取用 ÷ 生成", "≥ 60%", "合回去。6 秒取 0.3 秒＝5%"], ["Σ 生成秒", "≤ 预算 × 1.15", "合并盒子，不是删动作"]]}, "note": "取用和取用率是同一件事：一个盒子在成片里占不到 2 秒，它就不该有自己的 4 秒生成额度。那 4 秒是平台地板，不是奖励 —— 省下来的不是钱，是一次导入、一张参考卡和一段要对的连续性。", "pitfalls": ["为了取用率好看去删关键证据 —— 取用率低要合并，不是删动作。"]}, {"id": "d4-7", "title": "提示词必须写全十四项", "tag": "少一项这段就生产不了", "summary": "每个单元的正文，这十四项一项不能少。", "points": ["1 每张上传参考图借什么", "2 当前空间和阶段", "3 人物站位和动作起点", "4 人物具体接触什么", "5 接触后发生什么可见变化", "6 后续有效动作", "7 结束状态", "8 摄像机、景别和内部硬切（开头单元另写焦段、俯仰、人物占比；后段写清高度米数即可）", "9 动作声、环境声、音乐和旁白", "10 生成时长", "11 成片取用窗口", "12 不能出现的未来状态", "13 AI 生成风险", "14 失败时的最小修复方案"], "note": "不能交付：只有「人物开始施工」、只有「快速完成安装」、只有一串形容词、只有禁止词没有正面描述、只有分析没有可复制正文、一个单元混多个不相容阶段、用「同上」代替共享块。"}, {"id": "d4-8", "title": "参数与字幕规格", "summary": "这些值写死在设定书第 10 节，别自己改。", "table": {"head": ["项", "值"], "rows": [["视频模型", "Seedance 2.0 Mini｜9:16｜480P｜声音开｜单段 13–15 秒（平台容量 4–15，一组装满）"], ["制卡模型", "GPT Image 2.5 Flare｜2K｜Medium｜默认 3:2（首帧卡 9:16）"], ["生参考图上传", "≤ 4 张"], ["图生视频上传", "skill 里登记 50 张，但 2026-10-16 实测只有 4 张 → 按小的走"], ["提示词上限", "≤ 4096 字符，按 CRLF / UTF16 保守值算"], ["字幕", "每屏 2–3 词｜词首大写｜白粗黑描边｜当前词黄｜纵向约 2/3"], ["声音", "画外美国成年男声旁白 ＋ 低轻音乐；不加施工声、不加环境底声"], ["标题", "顶部标题后期一次加，不写进提示词"]]}, "note": "一个 U 需要 5 张以上图才说得清，说明这个 U 装太满，回去合并或拆分，不要把 5 张硬压成 4 张、删掉某张图的职责了事。"}, {"id": "d4-9", "title": "4096 字符上限怎么处理", "summary": "超了就改结构，不许删内容。", "points": ["所有图和视频的最终完整 Prompt ≤ 4096，含共享块、英文、标点、空白、换行。", "按保守 CRLF 和 UTF16 大值检查。", "超了就改结构（合并、拆分、精简共享块），不许删关键动作、必要停留或已冻结的英文。", "字符检查不是实际导入，也不是媒体验收。"], "pitfalls": ["为了过检查，把英文旁白删几个词 —— 旁白是冻结的，一个词都不许动。"]}, {"id": "d4-10", "title": "不许复用别的版本的生产包", "tag": "硬规定", "summary": "一切从本版设定书从零写。这是第 2、3 条踩过的坑。", "points": ["不读上一个版本（或上一条片子）的 单元\\、共用卡制卡词、复用目录、生产底稿。", "看到项目里有 复用\\ 或旧版本的 单元\\，不要打开。看到别的版本的文件名，也不要「顺便参考一下」。", "唯一允许的跨版本输入：RC01_主角身份参考_v01.png，只借脸和体型。"], "note": "为什么：第 2、3 条留下的「不要红砖房」「橄榄绿 T 恤」，就是下游抄上一条底稿抄出来的。底稿会把上一个版本的表面词和旧禁止项一起带进来，改一半就成雷。设定书是自包含的，够用。"}, {"id": "d4-11", "title": "独立检查十九项", "summary": "必须由没参与规划、也没参与写词的新上下文做。前六项是动作预算和取用，机器也能查，但人要先看一遍。", "points": ["每个单元的动作总数 ÷ 生成秒数，是否 ≤ 原片基准 ×1.2", "位移刀是否排在第 1 或第 2 刀（**不设最小时长**，「位移刀 ≥2 秒」已于 2026-10-27 撤销）", "每单元动作总数是否与设定书 4.5 节累加一致（差一个就是漏抄或私加）", "单元数是否落在硬表区间内（超一个都要有硬理由）", "每单元取用率是否 ≥60%（60% 是退回线，87% 是规划目标；只对盒级考核，不对单刀设下限）", "全片取用率（成片 ÷ 生成合计）是否落在 87% 附近，没到 60% 的盒子在哪", "每单元是否装满 13–15 秒、装 6–7 刀；有没有哪一盒只装 2–3 刀、把每刀拉到 4 秒以上（那是傻站的来源）", "是否漏掉首次接触", "是否漏掉状态变化", "是否漏掉功能证据", "是否漏掉必要情绪停留", "是否重复计算准备和重复劳动", "是否预留过多生成时间", "是否有单元负载过满", "是否无法合法裁剪", "是否可以进一步合并相邻单元", "是否能减少共享参考卡", "是否把计划图片写成已有图片", "提示词是否达到可直接提交程度", "差额是否只写了「剪辑余量」这类空话"], "note": "总控负责收口，人不逐个去找子任务。环境开不了独立检查，就明确写「未做独立检查」，不许用自检冒充。前三项可以先用 `09 工具\\检查_动作预算.py` 跑一遍再交人；取用率三项由 `检查_交付物.py` 的 e 段直接查。"}, {"id": "d4-12", "title": "交付清单", "summary": "根目录是唯一导入目录，不能让人把开头包和根目录包各导一遍。", "table": {"head": ["文件", "放什么"], "rows": [["00_生产包入口.md", "总览、导入顺序、参数、检查结果"], ["共用卡制卡词.md", "所有图片任务，一张卡一段"], ["单元\\Uxx.md", "标题 ＋ 五行头部 ＋ 唯一「## 拼好的完整正文」text 块"], ["说明\\Uxx_说明.md", "分析、依据、未决"], ["说明\\接缝核对与有效版本.md", "核了什么、修了什么、未决"], ["导入核对清单.md", "每张图的父图、输出名、参数、字符数"], ["生产单元划分与取用联合检查.md", "两个数 ＋ 单元表（生成/取用/取用率）＋ 每 U 十五项"], ["生产包独立检查.md", "十九项判断结果"], ["任务记录.md", "来源、纠正、版本"]]}, "note": "状态只有两种：定稿 / 草稿。定稿不等于媒体已验收。没有实际生成的图，状态只能写「待生成验证」。"}, {"id": "d4-13", "title": "2026-10-27 新增的三道闸门", "tag": "最新", "summary": "全在 5_生产单元.txt 里，都是实测摔出来的，不是设想。", "points": ["**① 内部硬切装 6–7 刀（13–15 秒一组），每刀约 2 秒，相邻两刀景别必须真的不同。**（2026-10-27 晚定稿：旧口径「2–4 刀、每刀 ≥2 秒」已撤销）以前指令里同时写着「不写内部切镜」和「必写内部硬切」，两句打架，结果永远写成一条连续长镜头——这就是改五轮措辞都没用的原因。", "**② 动作来源闸门**：每刀的动作只能来自小分镜第 ② 节的「那一个动作／接触对象／终点状态」。三处都没有的（擦汗、直起腰、后退半步、看一眼成果、把工具戳地上、走过来站住）一律不许写。工具：`09 工具\\检查_动作来源.py`，退出码 0 才许交稿。", "**③ 状态跳跃定律**（最靠上游）：一刀要的状态，只能用三种合法出口之一——上一刀已经看见 / 这一刀自己演得完 / 结果镜头静态重新起手。第四种（省略大量工作但入口仍延续上刀的人）不合法，模型会自己补一段走位把它填上，填出来的全是要剪掉的。", "**成本账（2026-10-27 晚修正归因）**：一盒塞四道工序、15 秒 5 刀废掉 35%，病根不是「塞得满」，是第 3 刀要求了上一刀没建立的状态。同日反证：U04_v01 12 秒 4 刀、跨 3 个工序，三个切点一帧干净。所以修法是三条合法出口，不是「拆成一盒一工序」——一盒一工序会把每刀拉到 4–5 秒，正好造出傻站。", "**交付前必做覆盖对账（三行算术）**：① 各刀成片秒之和 = 该单元计划覆盖的分镜时长 ② 各单元成片秒之和 = 全片总时长 ③ 每一刀 N 被且只被一个单元覆盖。10-27 就是这么查出 U04 漏了 N08 架梁框 2.633 秒的。", "**10-27 晚定稿：全部对齐阿初**——① 单段时长 13–15 秒（装满一组），旧「4–10 秒」撤销：那 9 次实测全是单镜头盒（0 刀），证明的是「一条连续镜头塞 3–4 件事会丢件」② 刀数 6–7 刀，是「生成秒 ÷ 2」除出来的，不是规定值 ③ 撤销「一盒一个工序」「最多两件事」④ 撤销「每刀 ≥2 秒」「刀数＝生成秒÷2 上限」。依据：阿初 L3696（按场景／机位拆组）、L4527–4529（一组 15 秒、7 个镜头、平均 2 秒）、L4550（2/2/2/3/5/1）、L4622（15 秒生成剪成 13 秒）。"], "note": "三份依据：`31_内部硬切修订_20261027.md`（结构层）、`34_内容层为什么修不完_20261027.md`（内容层归因）、`33_动作来源检查工具_20261027.md`（工具用法与回归测试）。"}]}, {"id": "s1", "title": "八、skill 全文（发给别的 AI 必带）", "tag": "自包含", "summary": "五份指令里都写了「全文读取 skill」。这份网页自带 skill 原文，对方不需要本机 E 盘的路径也能照做。", "points": ["**为什么这一节必须有**：指令里写的是绝对路径 `E:////智线出海内容运营////...////skills////adaptive-video-production////SKILL.md`。把网页发给别的 AI，它读不到这个路径。**没有这一节，对方拿到的是半套规则。**", "**发给别的 AI 时怎么交**：点右上角「导出全部为 Markdown」，导出的 .md 已经包含五份指令＋这七份 skill 全文。一份文件发过去就够。", "**哪一份配哪一段**：①拆解要两份（选题拆解＋视频拆解），②复刻一份，③开头两份（钩子移植＋生产单元主 skill 作参考），④小分镜一份，⑤生产单元两份（主 skill＋内部硬切细则）。", "**skill 与指令的分工**：指令说的是「这一步做什么、交什么、用哪个闸门」，skill 说的是「怎么做、什么算合格」。两边都看才算读完。", "**skill 不需要重跑生成器**：别的 AI 读的是磁盘上的 SKILL.md，改磁盘即生效。但**网页里这一节是快照**，改了 skill 要重跑 `tools/生成流程导图.py`，否则发出去的是旧版。"], "note": "版本条里现在同时显示五份指令字数和七份 skill 字数。字数对不上，就是哪一边改完没重跑。", "children": [{"id": "s1-1", "title": "①拆解 · 选题与拆解", "skillkey": "benchmark-select-and-breakdown", "summary": "决定拆哪条、拆到什么程度。"}, {"id": "s1-2", "title": "①拆解 · 视频拆解", "skillkey": "benchmark-video-deconstruction", "summary": "把一个视频拆成逐段表：状态变化 / 动作数 / 位移。"}, {"id": "s1-3", "title": "②复刻 · 批量变体", "skillkey": "benchmark-batch-variants", "summary": "拿拆好的骨架，一次排出 N 个版本。"}, {"id": "s1-4", "title": "③开头 · 钩子移植", "skillkey": "benchmark-adapt-hook", "summary": "从对标里把钩子搬到新题材上。"}, {"id": "s1-5", "title": "④小分镜 · 分镜设计", "skillkey": "full-storyboard-design", "summary": "一刀一行，写清那一个动作和动作数。"}, {"id": "s1-6", "title": "⑤生产单元 · 主 skill", "skillkey": "adaptive-video-production", "summary": "单元划分、刀、机位、参考图、闸门，全在这份里。"}, {"id": "s1-7", "title": "⑤生产单元 · 内部硬切细则", "skillkey": "adaptive-video-production-internal-cut", "summary": "一盒切几刀、切点怎么写、动作数怎么记的实测细则。"}, {"id": "s1-8", "title": "④小分镜 · 素材秒怎么算", "skillkey": "adaptive-video-production-material-seconds", "summary": "起手 0.5 ＋ Σ动作单位 ＋ 收尾 0.5；动作单位表与四个算例。"}]}, {"id": "d5", "title": "五、踩过的坑", "tag": "动手前扫一遍", "summary": "这些都是真犯过的，不是假设。八成你的问题这里已经有答案。", "children": [{"id": "d5-1", "title": "流程类的坑", "summary": "改流程时最容易再犯的。", "points": ["重写指令而不是打补丁 —— 旧指令是唯一被真实片子验证过的东西，重写等于用未验证的理解覆盖已验证的经验。", "把「说明文档」当「指令」用 —— 说明文档是摘要，摘要必然丢细节。", "拿产出物反推方法 —— 成品文件告诉你「做成了什么样」，指令才告诉你「怎么做到的」。", "同一个概念在两个文件里写了两遍 —— 必然有一天两边不一致。", "把「要求」当成「闸门」—— 「要写得少一点」是形容词，AI 和人都会忘；「退出码必须是 0」忘不了。10-22 那条片子的防过度拆分全文躺在指令里，照样划了 16 个单元。", "只改磁盘不改网站 —— 你实际复制的是网页上那份。每次改完 .txt 必须重跑生成器，再核对字数。**10-27 又犯了一次：一整天改的全在 txt 上，网页还是前一天 13:04 生成的，人复制到的全是旧规则。**", "「记得重跑」不算防住 —— 现在有 `09 工具\\检查_导图同步.py`：比对网页内嵌字数与本机 txt 实际字数，不一致退出码 1。改完 .txt 必须跑它。", "**同一份指令里两套口径并存，AI 一定挑宽的那个** —— `5_生产单元.txt` 曾有 8 处写「4–15 秒」、1 处写「4–10 秒」，结果做出 15 秒 5 刀的盒子。**但 10-27 晚查到，真正的问题不是那两套口径谁宽，而是「4–10 秒 + 2–4 刀 + 一盒一工序」三条本身没有实测依据**：它们来自单镜头盒的丢件样本（9 次里 0 刀），却被当成多刀盒的铁律；同一天 12 秒 4 刀、11 秒 4 刀两条反证切点全干净。改口径必须全文搜一遍，更要问一句「这条是谁测出来的」。", "**指令和 skill 写着两套结构** —— `4_小分镜.txt` 同时写「按 skill 的七栏」和「每段 15 项」，AI 每次随机挑一套。同类共扫出 5 处（时长／刀数／一盒几件事／取用率两个数／50 张旧值）。", "**把验收标准当成写作指令** —— 验收要逐项核对，写作要一次只想一件事。11 列的对照表里只有 2 列是写作用的；17 节里没有一节叫「大纲」。", "**下游被明确标成「可以不读」关键输入** —— `01_微调大纲.md` 原被标成「不是本段的输入，结论已固化进设定书」。但设定书 4.5 只写「从 X 变成 Y」的键值，装不下「她一手死抓钢索、另一只手把孩子按住、她没有喊只是喘」。小分镜只读设定书就只剩「跪坐不动」。", "**五个单元成片加起来对不上全片，没人查** —— U04 漏了 N08 架梁框 2.633 秒，五单元合计 41.787 vs 全片 44.420，差得刚好是 N08。**已经生成过的 U04_v01 也漏**。现在有「覆盖对账三行算术」。"]}, {"id": "d5-2", "title": "内容类的坑", "summary": "写的时候最容易犯的。", "points": ["T 写成固定值（13 秒 / 2.3 秒）—— 它是由原片决定的变量。", "情绪只写在表情上 —— 模型生成不出来，观众也读不到。", "把「安装完成」当功能验证 —— 必须有人真的用它。", "按分镜一段一个单元 —— 这是防过度拆分检查存在的全部理由。", "继承旧卡时只改正面描述，没改末尾禁止项 —— 就会出现「要红砖房」和「不要红砖房」同时存在。", "小分镜交框架 —— 生产阶段才发现没有动作可写，全片退回。", "用「步骤」而不是「状态变化」写动作 —— 1.8 秒写「推→压→撕胶带→塞进条底」五个步骤，模型只做第一步，剩下的时间把做完的动作再做一遍。这是 10-22 那条 Vs 对标差距最大的一处，也是唯一一件在**设计阶段就注定失败**的事。", "照抄原片的「弱兑现」—— 原片结尾本来就没人坐下用起来，你要是连这个也照抄，结尾不够爽就不是生成的问题，是设计的问题，改一百遍提示词也没用。", "剪辑时间线帧率与素材不一致 —— 素材 24fps、时间线 30fps，动作整体快 1.25 倍，5.33 秒被无声吃掉。不是内容问题，改一个设置就回来。", "**让一刀要求一个「上一刀画面里没有、这一刀内又演不完」的状态** —— 内容层失败的头号原因。模型不会停下来问，它会自己编一段过渡填上：走过去、搬东西、站着。实测 10-27：U04 第 3 刀要「桥面铺满」（上一刀只演了一块板），模型让他抱着一根长木条站在空桥上，桥面一直空着；U05 第 4 刀要「她在桥心」（上一刀她一只脚在校车台阶上），模型让她走回去 2 秒。**合法出口只有三个：上一刀已经看见 / 这一刀自己演得完 / 结果镜头静态重新起手。**", "一盒塞四个工序（架梁＋铺板＋立栏杆＋铺碎石）—— 每一刀都在跳状态，U04 有效取用率掉到 65%。改成一盒一工序：18 秒生成拿 12.5 秒可用（约 70%），多花 3 秒生成但多拿回 2.7 秒，还不用重抽。**塞得越满，废得越多。**", "相邻两刀「都写了全景」，以为换了机位就是切 —— 切点两侧实际画幅相同，观众看不见这个切，模型会连成一条推近长镜头。U05 第 1→2 刀切点在 2.208，两侧都是全景，所谓「近景」一直到 4.875 才靠推近出现。", "设计「只拍腰以下」的近景 —— 模型不会「一进来只有腿」，实测两次全失败。要表现「手没扶栏杆」，改用全景＋手明显垂在身侧，或俯拍桥面只拍脚与栏杆的关系。", "为了「这一刀别太静」自己加过渡动作（擦汗／直起腰／后退半步／看一眼成果／把工具戳在地上／走过来站住）—— 小分镜里一处都没有，成片里就是白走。动作只能来自小分镜第 ② 节的「那一个动作／接触对象／终点状态」。", "禁止项没写清是「新的那个」还是「旧的那个」—— 写「不要出现绳索栏杆」，把开头那根旧钢索一起杀了；而分镜明写「钢索不得在这一刀消失（它是开头的证据）」。禁止项必须点名主语。", "**靠改提示词去修内容问题** —— 10-27 三处失败（桥面铺满／近景只拍腿／原地转身），没有一处是「词写得不够清楚」，全是「这个要求超出了这一刀能承载的范围」。改词只会让句子更长，不会让模型做得到。要动的是每一刀要求什么，那是分镜和单元划分的活。", "**把一次实测的结论套到没测过的地方** —— 10-27 最大的一个错：9 次生成（全部是单镜头盒、0 刀）证明的只是「一条连续镜头塞 3–4 件事会丢件」，却被写成「长盒必废 → 一盒 4–10 秒 → 2–4 刀 → 一盒一工序」。同一天下午 12 秒 4 刀、11 秒 4 刀两条反证切点全干净，规则却没回头改。**每条规则都要能回答一句：这条是谁、在哪一次生成里测出来的？答不上来就不是规则，是猜想。**", "**别拿分镜的「建议秒数」当自己的拍摄秒数** —— 分镜写「40 块板铺满，建议 4.734 秒」＝每块 0.12 秒＝一秒铺八块半，那是快进不是手在干活。见 `40_犯过的错_全量清单_20261027.md` B2。", "**焦距和画幅算错，东西装不进画面** —— 50mm 在 1.9 米只装 0.8 米宽，装不下 1.2 米的板。同类错犯了三次。9:16 竖幅画宽系数：26mm 0.90／35mm 0.62／50mm 0.43／85mm 0.26。", "**机位高度不写基准面** —— 桥上写「离地 0.95 米」，模型会把机位放到沟底。要写「离板面」。", "**机位写在会被挡住的地方** —— 写在栏杆外 0.55 米，竖条栏杆正好挡在镜头和她的脚之间，那一刀什么也拍不到。", "**删了动作没删对应的声音** —— 动作「把铁耙往地上一戳」删了，声音里「铁耙戳地一声金属响」还留着，声画不同步，模型可能反过来把动作加回来。"]}, {"id": "d5-3", "title": "验证到哪一步了", "tag": "诚实清单", "summary": "B0009 已经端到端跑到 ⑤ 并出了两条片。结构层过了，内容层没过。", "points": ["**已验证（结构层）**：一条生成里切 4–5 刀成立。U04 四个切点（3.708／5.958／9.500／11.875）、U05 三个切点（2.208／4.875／7.542），全部一帧完成，无推拉、无叠化。", "**未过（内容层，10-27）**：U04 有效取用率约 65%（第 3 刀「桥面铺满」整刀废，模型让他抱长木条站在空桥上）；U05 约 82%（第 4 刀旧病复发走开 2 秒，第 2 刀近景靠推近才出现）。", "根因已定位：不是措辞，是「状态跳跃」——每一刀要求一个上一刀没给、这一刀又演不完的状态，模型就自己补走位。三条定律与成本账见 `34_内容层为什么修不完_20261027.md`。", "仍未验证：⑥ 剪辑合成整片（没有一条完整成片）、⑦ 复盘回填、复刻 skill（benchmark-batch-variants，370 行）从没被真实调用过。", "仍未验证：情绪五通道＋十列节拍表只从 8 条拆解推出来，没在成片上对过账；设定书第 5 节十列每版手填的工作量也没评估过。"], "note": "下一步不是继续改文档。内容层要动的是「每一刀要求什么」——那是分镜和单元划分的活，不是提示词。先在纸上把 U04 按「一盒一工序」重划一遍（不生成），确认每刀的状态出口都合法，再花积分。**全部错误（现象／为什么错／证据／现在怎么防）见 `40_犯过的错_全量清单_20261027.md`，文末附「给 AI 的开场警告」十条可直接粘贴。**"}, {"id": "d5-4", "title": "这套东西怎么长大", "summary": "只有两个东西会升级：拆解 skill、复刻 skill。", "points": ["出了什么错 → 记进「踩过的坑」，写清什么现象、为什么、下次怎么防。", "哪句话 AI 理解错了 → 改对应的那份 .txt，不要只改记忆里的经验。", "改完 .txt 重跑 `tools/生成流程导图.py`，这个网页自动同步。", "**重跑完必须再跑 `09 工具\\检查_导图同步.py`**，退出码 0 才算同步成功。只重跑不核对，等于没核对。", "**每条规则都要写清它值多少钱。** 定这条规则时烧了多少积分、错在哪个画面，写进 `40_犯过的错_全量清单_20261027.md`。将来有人想「优化掉」它，先来看这个数——**没有代价记录的规则，最先被删。**", "后三段基本不动，要动也只调 skill，不动流程。", "**遇到新问题，不要让人在对话框里补一段话——那句话只活在那个对话里。** 要问「这条该写进哪份 .txt」，写进去，重跑生成器。判断标准：如果换个片子、换个人、隔一周再跑，这条规则还在不在？不在，就等于没有。"]}]}, {"id": "d6", "title": "六、每段做完怎么验收", "summary": "AI 犯的错不是随机的，是固定的几类，而且每一类都犯过不止一次。所以可以做成清单，一段一段卡。", "points": ["人看一遍能发现错，但会漏；机器看一遍不会漏，但看不懂语义。分工是：机器查结构和数字，人查意思和判断。", "每一段都有出口闸门。退出码不是 0，这一段就不许交给下一段。这不是建议，是硬规则。", "验收器和流程本身是两个东西：流程改一句话，验收器不用动；验收器加一条，流程照样跑。"], "children": [{"id": "d6-1", "title": "五段各查什么", "tag": "一张表看完", "summary": "必过项不通过就退回；警告项是提醒你人工过一眼。", "table": {"head": ["段", "机器必查（必过项）", "机器查不了、必须人看"], "rows": [["① 拆解", "四份产物齐；两份逐段表都有「状态变化/动作数/位移」三列；秒数连续无跳秒；段号连续；first_frame 是 0.000 秒那帧", "拆得对不对：这一刀的功能说得准不准；「未核」的地方是不是真的没核"], ["② 设定书", "十节齐全（含 4.5）；4.5 表六列；动作数只有 0/1；动作合计 ≈ 原片 ±20%；总时长 ≈ 原片 ±15%", "表面八项换得够不够（会不会被认成同一条）；七问答的是不是真话"], ["③ 开头", "逐段表有「那一个动作」和「动作数」；对照表 12 行；T ÷ 全片在 12–18%；首帧五要素；**U01 刀数 ＝ 生成秒 ÷ 2、时间轴铺满、相邻刀景别不同**", "环节选对没有（原片是「问题出现」，你别做成「连续修」）；情绪递进是不是硬编的；U01 每一刀手上是不是一直有事做"], ["④ 小分镜", "N 编号连续；秒数连续；每刀有动作数；**每刀同时有素材秒和成片秒**；无占位符；动作预算闸门", "每一刀观众能不能看懂因果：手里拿的什么、从哪来、做完哪里变了"], ["⑤ 生产单元", "单元表三列；单元数落在硬表；每盒 13–15 秒装 6–7 刀；位移刀不在最后一刀；盒级取用率 ≥60%；Prompt ≤4096；参考图 ≤4", "单元合并得合不合理；每刀是不是真能演满 2 秒；参考图之间会不会打架"], ["跨环节", "总时长：设定书 = 分镜末段；动作数：4.5 合计 = 分镜声明；T 值与分镜切点对得上", "同一个数字在三份文件里指的是不是同一件事"]]}}, {"id": "d6-2", "title": "怎么跑（你不用跑，AI 自己跑）", "summary": "每段对话框交活前，AI 自己跑一句，生成两张图贴给你。", "points": ["**人不用记命令、不用开程序。**五份指令的结尾都写死了：AI 自己跑、自己贴图、只回一句「过没过」。", "结论图：`体检.py` 生成 `_验收\\体检单.png`，六行，绿/红/灰。", "过程图：`看板_环节.py`（②③④⑤各有参数）或 `看板_对比.py`（⑥成片并排）。", "结论图给「能不能往下走」；过程图给「这一段做到几成」。两张一起看，别看文字。", "你想自己跑一次也行：把版本文件夹拖到 `09 工具\\体检.bat` 上。"], "pitfalls": ["只跑一次就完事 —— 每改一版都要重跑，改完的内容可能又出新问题。", "看到绿色就以为万事大吉 —— 机器只查结构和数字，剧情对不对还得你自己看。"]}, {"id": "d6-3", "title": "机器为什么能查", "tag": "这不是玄学", "summary": "因为它的输入是固定字段，不是自然语言。", "points": ["「状态变化」「动作数」是三列固定字段，正则就能读；AI 想糊弄也糊弄不了，因为它必须填数。", "秒数连续性、段号连续性、章节齐不齐，都是结构问题，不需要理解语义。", "跨环节一致性：同一个数字从设定书传到分镜，两边差一个就是漏抄或私加，直接比就行。", "它查不出「意思对不对」—— 那一层永远是人的活。"]}, {"id": "d6-4", "title": "警告项怎么处理", "summary": "警告不是可以忽略，是「机器没把握，你看一眼」。", "points": ["「未核」标注少 → 说明拆解可能没核完，不是错，但你要知道有多少没核。", "参考图 >4 张 → 平台只让传 4 张，多的要合并。", "位移刀排最后 → 素材保留率从 90% 掉到 65%，不是必错，但要你拍这个板。", "T 比例不在 12–18% → 开头太长或太短，要看是不是风格选择。"]}, {"id": "d6-5", "title": "验收器会骗你的一种情况", "tag": "必须知道", "summary": "它查的是字段，不是你的诚实。", "points": ["把分镜里「动作数」从 2 改成 1、正文还留着五个步骤 —— 闸门会过，片子还是废的。", "动作数的来源是链条：原片拆解（事实）→ 设定书 4.5（抄状态变化）→ 分镜（照抄 4.5）→ 单元表（累加）。任何一段自己发明，前面全白做。", "所以每段结尾都要问一句：这个数字是从上游抄下来的，还是我自己写的？"]}, {"id": "d6-6", "title": "两张图：结论图 + 过程图", "tag": "每段必交", "summary": "结论图告诉你「能不能走」，过程图告诉你「做到几成」。两张都贴在对话框最后。", "points": ["**结论图**（体检单）：六行，绿=过、红=卡住、灰=还没做。人只看颜色，20 秒。", "**过程图**（本段专业图）：你能看懂的格子条，对标在上、我们在下，缺的格子画红框写「缺」。", "过程图不是摆设：开头这一张，能一眼看出「对标 2 镜、我们 4 镜」和「该摊开的那一镜只给了 0.87 秒」。", "两张都在 `<版本目录>\\_验收\\` 里留档，以后复盘可以回看每一段当时的图。"], "table": {"head": ["段", "过程图画什么", "用哪个脚本"], "rows": [["① 拆解", "原片首帧原图 + 问题物占比", "不用脚本，直接贴 first_frame-001.jpg"], ["② 设定书", "工序格子条：对标 vs 本片表 B", "看板_环节.py --stage 设定书 --mode name"], ["③ 开头", "镜头条：镜数 / 每镜秒数 / 景别", "看板_环节.py --stage 开头 --mode seq"], ["④ 小分镜", "工序格子条：缺哪格一眼看见", "看板_环节.py --stage 小分镜 --mode name"], ["⑤ 生产单元", "工序→盒子覆盖条，没进盒的标红", "看板_环节.py --stage 生产单元 --map"], ["⑥ 成片", "并排缩略图 + 三段时间条", "看板_对比.py"]]}, "note": "路径（不要改成相对路径）：工具 `E:\\智线出海内容运营\\09 工具\\`；结论图 `E:\\智线出海内容运营\\09 工具\\体检.py`；总闸门 `E:\\智线出海内容运营\\09 工具\\Pipeline.py`；项目根 `E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\`。"}]}, {"id": "rules20261023", "title": "七、补的六条硬规则", "tag": "最新", "summary": "六条都配了机器检查。规则不配检查，等于没写——这是最贵的一条教训。", "points": ["这六条不是拍脑袋加的，每一条都对应一个真发生过的错误，且与具体片子无关。", "写法统一为：能写成数字的绝不写成形容词，能自动查的绝不靠自觉。"], "table": {"head": ["规则", "一句话", "怎么查"], "rows": [["程度要写给数", "问题物占画面百分之几、冲突差几个百分点、观众第一反应三选一、情绪 0–3", "查 拆解"], ["三段配额", "开头/中间/结尾各占多少秒；中间段工序数 ≥ 对标 ×0.9，每工序秒数也 ≥ ×0.9", "查 设定书"], ["开头只呈现问题", "开头段工序数 0、工具 0、问题物只许不减少（泥水不能冲、霉斑不能刷）", "查 开头"], ["结尾要验证", "根治证据＋使用兑现＋升华成组；对照物（雨/噪音/尘）必须在末镜还看得见", "查 成片"], ["工序名统一", "33 个标准名，全流程只许从 19_工序词表.md 取，不许自己起名", "查 开头 / 看 环节"], ["读到的证明", "随机抽 6 句，要求原样抄回，字符串比对；抄不出＝没读，整版退回", "抽 make / verify"]]}, "note": "六条里最容易被忽略的是「借时间必须报账」：所有段落抢同一笔秒数，不记账就一定会从最软的那段扣——而最软的永远是结尾。"}], "instr": {"1": "════════════════════════════════════════\n只改下面这一行。其他一个字都不用动。\n════════════════════════════════════════\n\n对标视频：<贴 YouTube 链接，或本地文件的完整路径>\n\n**不要单独回我一句「我能看到」。** 能不能看到，写进第一份产物的开头一行就够\n（例：`能读：1080×1920，30fps，28.9 秒`）。看不到就直接说读不到，\n不许凭标题、封面、简介猜内容。\n\n【读什么、读到什么程度｜五段通用，细则见 18_读什么读到什么程度_五段通用.md】\n\n【读到的证明｜硬规定，不交这一节视为没读】\n抽问单：从你必读的文件里随机抽出来的几句话。\n**我发指令时一般不会附抽问单**——你自己跑 `09 工具\\抽查.py make` 出一张，落盘成\n`01_拆解\\_抽问单.md`，然后按它抄。不要问我「抽问单呢」。\n交付物的**第一节**必须叫「读到的原文」，把抽问单里每一句**一字不改**抄进去。\n· 抄不出、改写、概括、只写「已阅读」——一律算没读到，这一版直接打回，不许往下做。\n· 抄错一个字也算没过。原样就是原样，没有「大意对」这种说法。\n· 机制和用法见 20_读到的证明_抽查机制.md\n\n\n每份输入先归四类，按类执行，不许自己另定标准：\n· A 逐条用 —— 每一条都会变成一个产出字段 → 分节读完，一条不许跳\n· B 通读取法 —— 是方法/规范/格式，不是数据 → 全读，掌握硬约束\n· C 配额抽样 —— 连续重复的图/帧 → 按配额看够，其余不看也不报「未看」\n· D 不读 —— 结论已逐条抄进某个 A 类文件 → 不读，也不许报「缺这一项」\n\n图片配额（C 类）：\n· first_frame：必看 1 张（0.000 秒）\n· **opening（开头 0 秒 → T_钩，见下）：每 0.2 秒 1 张，5 格一张联络表**。\n  T_钩 是 3 秒就抽 15 张（3 张表）；是 8 秒就抽 40 张（8 张表）。\n  **开头是全片最重要的地方，这里一张都不许省。**\n· overview：**按镜头取中点帧，1 镜 1 张**。不按秒看，也不要每个切点取两张。\n\nT_钩 是什么：**观众在这一刻已经知道\"这条片子要干什么\"了**。不是固定 3 秒，要你判。\n判据按顺序取第一条成立的：\n· 首帧一出来就交代清楚（人＋脏/坏的东西＋它们挨着）→ T_钩 = 0.2 秒\n· 要一个动作做完才看清（例：他伸手抓起一把叶子，你才知道是在清场）→ T_钩 = 那个动作结束的帧\n· 要一次镜头切换或一句字幕才懂 → T_钩 = 那一帧\n判完写一句话理由，写在 02_开头拆解.md 的开头：`T_钩 = X.X 秒，因为 <一句话>`。\n\n**T_钩 必须落在 0.2 秒的整数倍上。** 实判 1.13 秒就记 1.2 秒，并写成\n`T_钩 = 1.2 秒（实判 1.13），因为 <一句话>`。\n理由：微段表的格子是 0.2 秒一格，T_钩 不落格边界就会出现「一格跨判定点」——\nB0009 判 1.0 秒抓绳，但表里 1.0–1.2 那一格才抓住，两处差 0.2 秒，说不清以哪个为准。\n\n**下限 3 秒、上限 8 秒**：\n· 判出来小于 3 秒 → 仍拆满 3 秒（观众的心理反应比\"看懂\"慢，前 3 秒都要看）\n· 判出来大于 8 秒 → 只拆到 8 秒，后面归逐镜表\n\n镜头中点帧怎么取：\n· 先跑场景检测拿切点秒数，例如\n  ffmpeg -i <原片> -filter:v \"select='gt(scene,0.3)',showinfo\" -f null -\n· 相邻两个切点的**中点**就是这一镜的代表帧，1 镜取 1 张\n· 镜头数 > 40 时，每 2 镜取 1 张（取两镜中较长那一镜的中点）\n· 末帧另取 1 张，用来看终局状态\n· 分段依据是切点秒数，不是人眼看完所有帧\n\n联络表（关键：把 40 多张压到 8 张以内）：\n· 用 ffmpeg 把多帧拼成一张网格图，例如 5 格一行：\n  ffmpeg -i <原片> -vf \"select='eq(n,0)+eq(n,5)+eq(n,10)+eq(n,15)+eq(n,20)',scale=360:-1,tile=5x1\" -frames:v 1 sheet_%02d.jpg\n· 每格宽 360 px（1080 的 1/3），足够判断姿势、物体、状态变化\n· **只有两种情况才回看原帧**：① 这一镜要写「状态变化」但联络表看不清；\n  ② 这一镜是位移刀、或结尾验证段\n· 回看原帧的总额度：不超过 10 张\n\n总量红线：一期拆解读到的图片**合计不超过 16 张**，其中：\n· 开头段联络表最多 8 张（T_钩 8 秒时的上限），**这 8 张不许省**\n· 全片 overview 中点帧最多 5 张\n· 回看原帧最多 3 张\n超过 16 张就说明你在逐张看，停下来改拼联络表。**但开头那 8 张永远优先，不够就砍 overview。**\n\n为什么要有这条红线：这条指令今天实跑过一次，读了 91 次、40 多张图，上下文被撑爆，\n压缩了两次，两次都把机器摘要吐进了对话框，人看到的就是「看不懂」。图看多了不是更认真，是跑不完。\n\n大文件（>20KB）：按 `##` 切，一次读 1–3 节，全部读完才算读过。\n重读两次仍不全的，**不要在对话里停下来问我**：在产物里把那一节标成\n「只读到第 X 节，缺 <内容>，导致 <哪几个字段> 填不了」，然后继续往下做。\n**A/B/C 类的输入，每一节读齐就写这一节，不许把全部输入读完才开始写。**\n只有 D 类可以不读继续。禁止把「只读到第 3 节」写成「已完整读取」。\n落盘顺序见下面「二·五、四步落盘」，顺序不许调。\n\n\n════════════════════════════════════════\n你要做什么\n════════════════════════════════════════\n\n**先分诊。两条路，你自己判，不许问我。**\n\n判据只有一条：**你给我的是几条视频。**\n\n· 只给一条（对标原片）→ **模式 A｜拆对标**。走第一到第四节，产出 00／02／03／04 四份。\n· 给了两条（对标原片 ＋ 我方成片）→ **模式 B｜对比反馈**。走第五节，产出 00 与 05 两份，\n  不交 02／03／04。\n\n两条里哪条是对标、哪条是我方的，你自己认，依据按这个顺序取第一条成立的：\n1. 文件名带版本号／短名／`V01`／`N01` 的是我方；\n2. 频道名是你自己频道的是我方；\n3. 认不出 → 时长更长、有频道包装／片头片尾的是对标。\n\n认完在产物**第一行**写：`模式 B｜对标 = <文件名>｜我方 = <文件名>｜依据 = <哪一条>`。\n认错不算失败，写清依据就行；**不许停下来问我是哪条**。\n\n**「只拆解、不评价」这一条只在模式 A 下执行。**\n模式 B 的全部意义就是评价差距，不受这一条约束；但模式 B 同样不写提示词、不做分镜设计。\n\n> 顺带把一处 skill 冲突显式裁掉：`benchmark-select-and-breakdown` 的 description 和末节写着\n> 「不写提示词、**不做微调**（那是 benchmark-adapt-hook）」。那句话是模式 A 的分工，\n> 到模式 B 不适用——模式 B 要写「怎么追」，那不是改对标，是改我们自己下一版。\n> 读到那句时按本节执行，不要因为 skill 写了就拒绝出「怎么追」。\n\n一条都打不开 → 按第一节「先确认你能不能看」的三步走。不许凭标题、封面、简介猜内容。\n\n**模式 A 往下看：** 对本条对标视频做拆解，拆到最细。\n\n只拆解。不评价好不好，不给改进建议，不写提示词，不设计我们自己的片子。\n\n拆得越细越好。宁可多写两页，不许省字段。\n\n\n════════════════════════════════════════\n一、先确认你能不能看\n════════════════════════════════════════\n\n能读视频 → 直接按下面做。\n\n不能读 → 按这个顺序走：\n\n1. 先找有没有同一条原片已经抽好的图片包，两处都看一遍：\n   a) 旧拆解库（2026-10-24 之前的）：E:\\智线出海内容运营\\12_视频拆解内化\\对标库\\B####_*\\01_原片证据\\\n   b) 新项目（2026-10-24 起）    ：E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\*_B####_*\\01_拆解\\01_原片证据\\\n   按原片内容/短名认，确认是同一条再复用。\n   有 → 用图片包拆。\n\n2. 没有现成图片包 → **自己抽，不要先问我**。用 ffmpeg 按下面的规格自己跑，\n   抽完直接往下做：\n   · first_frame：0.000 秒 1 张\n   · opening：0 秒 → T_钩，每 0.2 秒 1 张，5 格一张联络表\n     （T_钩 3 秒 = 15 张 3 表；T_钩 8 秒 = 40 张 8 表。具体见第一节）\n   · 镜头中点帧：按场景检测切点，1 镜 1 张（镜头数 > 40 时每 2 镜 1 张）\n   · 末帧：1 张\n   命令参考见第一节「图片配额」里的 ffmpeg 示例。\n\n3. 只有 **ffmpeg 跑不起来、或者抽出来是黑帧/花屏** 才算「真读不了」。\n   这时才停下来，回我三样：我读不了视频 / 卡在哪一步（贴报错原文）/ 需要我手动做什么。\n\n\n════════════════════════════════════════\n二、建项目总文件夹（拆解就在这个项目里，不再放别处）\n════════════════════════════════════════\n\n根目录：\n  E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\\n\n**第一步：定编号。要扫两处，取两边的最大号再 +1，别只看一边。**\n   a) 新项目根：E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\ → 找 `*_B####_*`\n   b) 旧拆解库：E:\\智线出海内容运营\\12_视频拆解内化\\对标库\\ → 找 `B####_*`\n   两边所有编号里取最大的那个 +1，四位数字（如 B0006），永不重用、永不复用。\n   两处都没有，才从 B0001 开始。\n   **报给我时必须写清：你在 a 看到最大是 B____，在 b 看到最大是 B____，所以本次用 B____。**\n\n**第二步：建项目总文件夹。** 名字固定三段：`<今天八位日期>_B####_<原片短名>`\n  例：`20261024_B0006_rainy_corridor`\n  短名规则：只用小写英文+下划线，取自原片内容，不要中文、不要空格。\n\n  E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\<今天八位日期>_B####_<短名>\\\n      ├ 00_项目台账.md        ← 你自己写，照 _项目骨架\\00_项目台账_模板.md 抄，把编号/短名/日期填上\n      └ 01_拆解\\             ← 这一次的拆解全部放这里\n          └ 01_原片证据\\\n\n**你现在只建这三个目录**（项目根、01_拆解、01_原片证据），别的一律不建。\n02_复刻\\ 由第②段建，03_成片\\ 由第⑥段建。\n台账建完就填：编号、短名、拆解日期、原片来源，其余留空。\n\n**模式 B 例外**：不建 `_B####_`，改建成 `<今天八位日期>_C####_<短名>\\`，\n  里面只建 `C####_对比反馈\\`（放 `00_对比反馈.md`）与 `01_证据\\`（两边各一首帧一末帧）两个目录。\n  **模式 B 不写 `00_项目台账.md`**——它不进七段流水线，没有进度可追；\n  要留痕就写在 `00_对比反馈.md` 的第一节标题下面一行：`对标 B#### <短名> ／ 我方 <版本号>`。\n  C 号与 B 号分开计，规则见第五节第 7）条。\n\n\n════════════════════════════════════════\n二·五、四步落盘（硬规定，顺序不许调）\n════════════════════════════════════════\n\n每一步做完立刻写盘，再读下一步的输入。任何一步被打断，磁盘上必须留着已经做完的那几步。\n禁止把 40 多张图全部读完才开始写第一个文件。\n禁止把五份产物留到最后一次性写。\n\n第 1 步（目标 3 分钟内完成）\n  做：建目录 + 写 00_项目台账.md + 复制 first_frame\n  读：只读 _项目骨架\\00_项目台账_模板.md\n  立刻落盘：00_项目台账.md、01_原片证据\\first_frame-001.jpg\n\n第 2 步\n  读：两份 skill 全文\n  立刻落盘：00_对标索引.md（含骨架一句话三段式 ＋ 对账四元组）\n\n第 3 步\n  读：opening 全看（约 15 张）+ first_frame\n  立刻落盘：02_开头拆解.md（六张表全填）\n\n第 4 步\n  读：overview（按第一节的切点配额）+ 时间轴（有就放）\n  立刻落盘：03_整片拆解.md（含生成组划分表 ＋ 静态大纲）、04_交付自查表.md\n\n**允许在第 3 步之后合法停下（不算失败）**\n第 3 步（02_开头拆解.md）落盘后，如果你判断这一轮吃不下第 4 步，可以就此交稿：\n在总结里写一行 `已交：台账、索引、证据、02_开头拆解。03/04 下一轮再做。`\n我下一轮只发一句「从第 4 步继续」，你不用重读前面已经写进文件的东西。\n**但第 3 步之前不许停。** 落到 02 为止是分期，停在 02 之前是没做。\n\n每一步落盘后，在 00_项目台账.md 里追加一行：`YYYY-MM-DD HH:MM 第N步完成 <文件名>`。\n\n时间闸（硬规定）\n· 第 1 步必须在开工后 **5 分钟内**落盘。开工 5 分钟磁盘上还没有任何文件，判这一轮失败。\n· 每落盘一步，**立刻在对话里回一行**：`第N步完成：<文件名> <字数>`，然后继续干活，\n  不要停下来等我说话，也不要在中间写总结。\n· 四步全部完成之后，才允许写最后的总结。\n· 不许在中间回「我正在读…」「即将开始…」「先确认一下…」这类话占掉轮次。\n\n\n════════════════════════════════════════\n二·六、零提问（比落盘更硬）\n════════════════════════════════════════\n\n我一次只会发给你两样东西：**这条指令 ＋ 视频路径**。除此之外我什么都不会补。\n\n所以：**任何缺失都不许拿来问我，自己按默认规则处理，并在产物里注明你补了什么。**\n\n| 缺什么 | 你怎么处理（不许问） |\n|---|---|\n| 没贴抽问单 | 自己跑 `09 工具\\抽查.py make` 出单，落盘成 `_抽问单.md` |\n| 没有原帖链接 | 播放量／发布者／发布日期／评论区，全写「未核」 |\n| 没有主角身份图 | 不写依赖身份图的字段，标「缺」 |\n| 目录不存在 | 自己建 |\n| 文件名与内容不符 | 按内容命名，在索引里注明原名不符 |\n| 没有转写／没有评论区 | 写「无」，不要问我有没有 |\n\n**只有一种情况允许停下来问：视频打不开、也抽不出帧。**\n其他任何情况，先按上表走完，最后在总结里列出你补了什么。\n\n────────────────────────────────────────\n回复纪律（治「把分析草稿当回复」）\n────────────────────────────────────────\n\n· 对话里只许出现两种东西：`第N步完成：<文件名>` 这一行；以及四步做完后的总结（最后只回四样）。\n· **禁止在对话里输出**：`<analysis>`、`<summary>`、思考过程、自我复述、\n  逐条读文件清单、「我先看一下」「现在开始读」这类旁白。\n· 如果你觉得自己需要压缩上下文：**不要输出压缩摘要**，只输出当前进度一行，然后继续干。\n· 单次回复不超过 15 行。需要长内容就写进文件，不要贴在对话里。\n\n\n════════════════════════════════════════\n三、读两个 skill\n════════════════════════════════════════\n\n全文读取这两份，以本规范目录 skills\\ 下这份为准，插件目录里的旧副本不要用：\n\n1. E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\skills\\benchmark-select-and-breakdown\\SKILL.md\n\n2. E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\skills\\benchmark-video-deconstruction\\SKILL.md\n\n两个都读。\n\n**读到下面这两节，本流程不执行，直接跳过：**\n· `benchmark-video-deconstruction` 的《可迁移生产合同》那一节（要求写「可以借鉴什么／不能照抄什么」）\n· 同一份的《最终决策》那一节（要求给「可以进入结构设计／改完再做／不建议制作」）\n\n**① 拆解不交 `05_可迁移生产合同.md`，不写「该抄什么、不该抄什么」，不给能不能用的结论。**\n理由：这两节是要「拿我们的项目去比」，可我们的主角是谁、场景在哪、片长多少，① 这一段根本不知道。\n不知道就不能判。这些判断全部归 ② 复刻，那里才有我方约束。\n（旧版的 `01_对标拆解\\05_可迁移生产合同.md` 已经没有任何一步产出它，不用找、不要报缺。）\n选拆那份管\"开头怎么拆成卡\"，深拆那份管\"整片怎么拆成证据\"。\n产物分开写，不要合并。\n\n────────────────────────────────────────\nskill 条款去向表（读完立刻照这张表取用，不许自己权衡）\n────────────────────────────────────────\n\n两个 skill 是「一条片怎么拍好」的方法书；本指令是「这一批片子怎么不跑偏、怎么被机器验」的流水线。\n**两者对不上时，一律以本指令为准。** 三个理由：\n· skill 不知道我方项目是谁、场景在哪、片长多少；\n· skill 不知道闸门要什么文件名、要哪些字段；\n· skill 是按「一条片精读」写的，本流程按「上下文不能撑爆」跑。\n\n| # | skill 那一条 | 本流程怎么办 |\n|---|---|---|\n| 1 | 深拆《输出物》L182–194：交 `01_原片事实时间线`／`02_观看任务与结构机制`／`03_剪辑声音标题包装拆解`／`04_评论区需求与反对信号`／`05_可迁移生产合同` | **整条不执行。** 产物名只认【文件一】～【文件五】。那套名字闸门一个都不认，照它命名就是 0/5 全挂 |\n| 2 | 选拆《第 7 步 写卡、入台账》L89–93：建 `对标卡\\HOOK-编号.md`、台账第 1 张表加行；文末 BODY 写到 `方法论v2\\整片对标\\` | **整条不执行。** 落盘位置只认第二节那三个目录。本段不建 `对标卡\\`、不写对标台账 |\n| 3 | 选拆《第 1.5 步 分诊》L18–26：判「开头能不能做卡／后半段能不能做 BODY」，两个都不能 → 台账备注「不收」，结束 | **整条不执行。** 「分诊」在本流程只指 A/B 模式（见开头）。片子是用户给的，判「不收」等于抗命，必须拆完 |\n| 4 | 选拆《第 3 步 只取一段》L39–41：只取最亮眼那一段，Shorts 取开头 | **整条不执行。** 模式 A 拆整片：开头段走 02，其余走 03 逐段表直到片尾，还要终局兑现链 |\n| 5 | 选拆《第 5 步 核心机制》L56–60：一句话写「这段为什么好看」，A 做了什么→B 发生了什么→留下什么 | **不单独成节。** 这个意思已由 00 的「骨架一句话三段式」承载（刨去外观／背景／道具还剩什么，是同一个问）。不另起一段，不许两处各写一版 |\n| 6 | 选拆《第 6.5 步 配对标签》L81–87：机制类型／空间要求／人和动物／有无台词 | **不执行。** 那是给选题配对用的，本段不选题。真要留，写进 00 的「事实边界」一句，不建字段 |\n| 7 | 选拆 L47「镜头怎么动」；深拆 L96「镜头景别、机位、运动、剪辑方式」 | **执行，但换位置。** 写进逐镜表／逐段表的「景别·机位·运动」一栏（写法见【文件三】1）），不另开新列 |\n| 8 | 深拆 L159–167 声音与包装六项（标题承诺／简介／口播／BGM／封面）；L169–180 评论区六类 | **降级。** 只保留表面清单里的「声音」一项。标题／简介／封面／口播／评论区不拆——本段不判包装；评论区当附件，有就放 `01_原片证据\\` |\n| 9 | 深拆 L62–69 证据六标记 F1／F2／C1／M1／H1／V1 | **不执行。** 本段统一用「未核」一个词。不许出现 F2、M1 这类编号（00 第 0 节更是明令禁止） |\n| 10 | 深拆 L54／L60「关键动作附近密集抽帧」「不要把稀疏抽帧当逐帧观看」 | **让位给 16 张红线。** 配额按开头那节的表走，后半段只有中点帧。宁可标「未核」，不许加图 |\n| 11 | 深拆《阶段 0 定义本轮问题》L39–46：先写当前项目、平台、画幅、目标用户，并判「对标是否与我方同问题」 | **不执行。** ① 不知道我方项目，也不许猜。我方约束全部归 ② |\n| 12 | 深拆《对改造类视频的终局检查》L229–252，末句「结论必须是修改后再制作」 | **只搬结构，不搬结论。** 「开头问题→中间动作→终局状态→使用验证」搬成 03 的终局兑现链；结论只判**原片**（根治够不够、升华有没有），不判我方能不能做 |\n| 13 | 深拆《可迁移生产合同》《最终决策》两节 | **不执行**（理由见上面那一段，不再重复） |\n| 14 | 选拆《第 2 步 选源五条》L28–37：自己喜欢／播放量高／优先非 AI 跨赛道／无明星 IP／无像儿童的人 | **不执行。** 片子是用户给的，选源不在本段。只把「来源类型」和「有没有像儿童的人」记进 00（指令已有这两个字段） |\n| 15 | 选拆《后半段拆解 BODY 8 项》L107–127 | **不执行。** 后半段只按【文件四】的逐段表＋终局兑现链＋生成组划分表＋静态大纲写，不建 BODY 卡 |\n| 16 | 选拆《自查》L95–105 里的「台账已加行」 | **不执行**（同第 2 条）。自查只按【文件五】04 的三节写 |\n| 17 | 深拆《阶段 2 观看任务六问》L71–84 | **不执行。** 改造类短片的观看任务已由 00 的「它凭什么留住人」＋情绪弧承载，不另开六问 |\n| 18 | 深拆《阶段 3》L90–101 的「表情、视线和身体状态」「道具状态改变」「字幕/口播」 | **只执行第一项。** 表情视线落进逐镜表新增的「表情·视线」列；道具状态并入「状态变化」；字幕口播不单列，有就记进表面清单「画面文字」 |\n\n**这张表没列到的条款，一律按「不新增产物、不新增字段」处理**：能塞进已有字段就塞；塞不进的，在 04 的「未核清单」里写一句。不许自己加一节、加一个文件。\n\n\n════════════════════════════════════════\n四、产出\n════════════════════════════════════════\n\n**以下所有文件，全部写进 `<项目总文件夹>\\01_拆解\\`，不要写到别的目录。**\n原片抽出来的图，全部写进 `01_拆解\\01_原片证据\\`。\n\n【格式标准】先读它，照它的「第 2 节 拆解摘要」写：\nE:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\12_中间过程稿_模板与样例_20261021.md\n\n【文件一】00_对标索引.md\n\n  ★ 第 0 节「一分钟读懂」——放在本文件最前面，在第 1 节之前，缺这一节算没交\n\n    这一节不是给我看的数据，是给人看的结论。写法硬规定：\n\n    · 不超过 600 字，不许放表格\n    · 不许出现 O1/P1/S1 这类编号，不许出现「掩码」「逐帧差分」「F2 推断」这类术语\n    · 必须按顺序写这四个小标题：\n        这条片子是什么        —— 三句话讲完：什么地方、出了什么事、最后变成什么样\n        它凭什么留住人        —— 3–4 条，每条带秒数，按重要性排\n        承重结构              —— 哪 3–5 样东西，少了任何一个这条片子就不成立。\n                                 只说原片是怎么撑住的，不说我们该抄什么\n        事实边界              —— 哪些数字没核、哪些从画面看不出来（例：播放量未核、年龄只能人判）\n    · 这一节里的数字必须与 02/03 的表一致，不许另算一套\n\n    为什么要有这一节：三份产物加起来一万五千字、一百多行表格，全是给机器判分的字段。\n    人打开第一眼看到的是红线和凭证表，看不到这条片子。加这一节不改任何已有字段。\n\n  编号 / 名称 / 原片链接 / 时长（精确到 0.1 秒）/ 播放量（注明口述还是已核）/\n  来源类型（AI 还是非 AI、同赛道还是跨赛道）/ 有没有像儿童的人 /\n  被哪些批次用过（新拆的写「无」）/\n\n  ★「骨架一句话」——**固定三段式，三段都是因果链，句子里一个数字都不许有，缺一段算没交**\n\n    改造前：<谁> 在 <什么处境> 里，<什么东西> 坏到什么地步，<他还是只能用它>\n    改造：<谁> 动手，把 <什么> 整个换掉或修好，<中间有没有返工>\n    改造后：<根治了哪几处> ＋ <多出了什么原来没有的>\n\n  ★「对账四元组」——紧接在骨架下一行，单独一行写，缺了算没交\n\n    X=__%（问题物占首帧画面）／N=__ 个动作／T=__ 秒（改造段）／根治 __ 项＋升华 __ 项\n    观众反应：`必须马上处理` / `可以忍但不好看` / `看着舒服`（三选一，不许三个并列）\n\n    写法硬规定：\n    · **骨架的三句话里，不许出现百分比、秒数、动作数、项数。**\n      数字全部只出现在「对账四元组」那一行。这一条不许绕过。\n      理由：带数的句子看不出哪一拍可以动。阿初的骨架是纯因果链——\n      「主角被坏人追逐抓住-被欺负后无力的反击-在要被伤害前被好人阻止-好人打跑了坏人-好人无视了主角」，\n      一个数都没有，但谁做了什么都清楚。\n      用他的白模测试自检：**刨去外观、刨去背景、刨去道具、刨去一切，\n      当所有都是白模，这段视频到底说了什么？** 答得出来才算骨架。\n    · **三段必须各自说清「谁」。** 改造前是谁受害，改造是谁动手，改造后是谁在用。\n      「谁动手」这一拍不许省：原片是施工队、是当事人自己、还是邻居来帮，\n      这一拍决定整条片子的性质，省掉了骨架就变成「状态从 A 变 B」，不是故事。\n    · 四元组里的 X、a、b、N、T 必须与本文件【文件三】表 3 的占比、\n      【文件四】的终局兑现链完全一致，不许另算一套。\n    · 观众反应只能填：`必须马上处理` / `可以忍但不好看` / `看着舒服`\n    · 禁止写成动作流水账。「暴雨打进来 → 捡叶 → 冲地 → 刷墙 → 挂帘 → 摆家具 → 空镜」\n      这种是流水账，不是骨架：它只有「做了什么」，没有「差到什么程度」和「根治了什么、升华了什么」。\n    · 写不出 X% 就先回头算，不许用「很乱」「特别脏」「乱到极致」这类形容词顶替数字。\n\n【文件二】01_原片证据\\\n\n  ★ first_frame-001.jpg —— 必须是 0.000 秒这一帧，文件名一个字不能改。\n   第③段要拿它比\"看过感\"，缺了这一段就废了。\n\n  另外放：overview-001..N.jpg、opening-001..N.jpg、时间轴、转写、评论区摘录（有就放）\n\n【文件三】02_开头拆解.md —— 一节人读 ＋ 六张表 ＋ 一段冲突强度，一样都不许缺\n\n  ★ 「开头方案（人读版）」—— 放在全文件最前面，**不参与下面 1）2）那套编号**，缺这一节算没交\n\n    这一节是给人看的，不是给机器判分的。不超过 250 字，不许放表格。\n    写成能直接照着拍的样子，必须回答六件事：\n\n      · 几秒、几个镜头、要不要一镜到底\n      · 画面里在发生什么（一句话）\n      · 机位：高度几米、俯仰几度、焦段、人占画面几成\n      · 那一个动作：起点状态 → 终点状态\n      · 前 3 秒里\"消失的东西\"一共出现了几次、在哪几秒\n        （从下面 2b）微段表里数出来，给数。**这一句里不要再写\"微段表\"三个字**，\n         写「从下面的细账数出来」就行）\n      · 为什么这样开头能留住人（一句话，说机制，不许说「很抓人」）\n      · 这一段的硬约束是什么（一句话：哪几件事必须一模一样，改了就塌。\n        只说原片，不说我们怎么改——怎么改由复刻那一段决定）\n\n    写完这一节，再接下面的五张表。表是给下游抄的，这一节是给人读的。\n\n  1）逐镜表\n     段 / 起止秒 / 画面一句话（谁＋在干什么＋东西什么状态＋景别·机位·运动）/ 环节\n     / **表情·视线** / **状态变化（从什么变成什么）** / **动作数** / **位移**\n\n     后三列与【文件四】同口径，是复刻写设定书 4.5 节的直接来源，缺了下游只能靠猜：\n     ·「景别·机位·运动」三样缺一不可：景别（特写／近景／中景／全景／远景）＋机位（高度几米、俯仰几度）＋运动（固定／推／拉／摇／移／跟／手持，写清方向）。只写「中景」不算填。\n     ·「状态变化」写「从 X 变成 Y」。一次可见变化算一次；同一动作只换机位、不另算。\n       原片开头两镜经常是同一个动作的两个机位（中景看人 → 广角看空间），那种情况动作数是 1，不是 2。\n     ·「动作数」按状态变化数计，不按手部步骤数。原片每镜通常是 0 或 1，空镜写 0。\n     ·「位移」写是/否：人带着东西在空间里移动＝是。写「是」的镜，下游要给它足够的**素材秒**（走完这段路要几秒就写几秒），**不设最小时长**——「≥2 秒」是剪辑规则，不是拍摄规则。\n     ·「表情·视线」写这一镜里人往哪儿看、脸上是什么状态（例：低头盯着脚下、皱眉、回头看镜头、只给背影不露脸）。背身或空镜写「无」。这是情绪弧五通道的第①项——情绪弧里按它判了，这一列就必须有账，不许判了不记。\n\n  2b）**开头微段表（0.2 秒一格，强制，不许合并）**\n      （编号叫 2b 是跟着「1）逐镜表、2）七段环节表」这套走的；\n       你写成 1b 也能过闸门，但同一份文件里别两种混用）\n\n     逐镜表按切点分，一镜到底的镜头只有一行 —— 那就是「0–3.1 秒粗拆一下」，不行。\n     **开头段必须再拆一层微段表：从 0.000 秒到 T_钩，每 0.2 秒一行，一秒 5 行，一行都不许少。**\n\n     | # | 起止秒 | 这一格新增了什么 | 消失／减少了什么 | 手在哪、在做什么 | 身体姿态与朝向 | 构图变化（机位怎么动） | 观众这一格看到什么 |\n     |---|---|---|---|---|---|---|---|\n\n     写法硬规定：\n     · **格子数 = T_钩 ÷ 0.2，上下取整。** T_钩 3.1 秒 → 16 格（0.0–0.2 … 3.0–3.2）；8 秒 → 40 格\n     · **一格都不许合并。** 连着几格\"没变化\"也要各占一行，写「无新增，手前伸约 20cm」这种\n     · 「新增了什么」写具体东西：第几把叶子、袋子涨到几成、水面露出一块砖、\n       墙面刷出一道白、雨丝方向变了。**不许写「继续捡叶」「画面无变化」**\n     · 「消失／减少了什么」是这条片子的爽点来源，**必须每格都问一遍**：\n       这一格叶子少了多少、水退了多少、霉斑小了多少。没有就写「无」\n     · 「手在哪」要写手相对于身体和画面的位置（例：右手伸到左膝外侧、离地 30cm）\n     · 「观众这一格看到什么」写观众感知，不写判断（例：看到地上少了一片，看到袋子沉下去）\n     · **一格的字数控制在 20–45 字。写不下就是拆得不够细，写太长就是掺了废话。**\n\n     为什么必须这样拆：一镜到底的长镜头里，观众看到的不是\"一个动作\"，\n     而是**几十次微小的消失**。那几十次消失才是他留下来的原因。\n     按镜头拆，这些全部被压成一句话，下游复刻时根本不知道该在第几秒给出什么。\n\n     上面逐镜表是\"有几刀\"的账，这张微段表是\"前几秒里到底发生了什么\"的账。\n     两张表都要有，不许互相替代。逐镜表在微段表里查细节，微段表在逐镜表里对秒数。\n\n  2）七段环节表\n     问题出现 / 第一反应 / 决定动手 / 连续修 / 再测试 / 这次没事 / 收尾\n     有的标起止秒；没有的写「无」，并注明「照抄时不许补」\n\n  3）表面清单十项\n     地点 / **问题物（四件套：占比 ＋ 分布 ＋ 处数类数 ＋ 大小形状）** / 天气 /\n     **人物（四件套：人数＋年龄外观＋人脸特写次数＋正脸:侧脸:背影比例）** / 穿着 / 工具 / 材料 / 修法 / 画面文字 / 声音\n\n     「问题物」这一项**必须按四件套写，缺一件算没交**：\n      占比必须写成固定串：`问题物占全画面 25.0%`。\n      不许写「约两成」「数十片」「满院子都是」。\n       · **占比**：占 0.000 秒首帧画面的百分之几。\n         **唯一单位是画面百分比，不是片数、不是件数、不是堆数。**\n         算法：打开 `01_原片证据\\first_frame-001.jpg`，数目标物像素 ÷ 全画面像素。\n         拿不到首帧 → 写「占比未核」并说明卡在哪，不许用约数顶。\n       · **分布**：铺满 / 成堆 / 散落 / 集中一处（可多选，必须写清在画面的哪一片）\n       · **处数类数**：共几处、分几类。**写「处」和「类」，不写「数十片」这种约数。**\n       · **大小形状**：单件尺寸与形态（原来只有这一项，不够）\n\n      「人物」这一项**也必须按四件套写，缺一件算没交**（这是事实，不是意见）：\n       · **人数**：一共几个人，谁是出镜者\n       · **年龄外观**：目视区间（例 16–22 岁）＋ 是否像儿童。**只报外观，不下\"能不能用\"的结论**\n       · **人脸特写次数**：全片给了几次\"人脸占画面 1/3 以上\"的镜头。0 次就写 0 次\n         （B0006 实测：全片 0 次，只给侧脸和背影）\n       · **正脸:侧脸:背影比例**：按镜头数算，例 0:7:21\n       另记两项：**最大人脸占画面高度几成**（例 18%）、**有没有\"对人做表情\"的镜头**（有／无，几次）。\n       这两项决定复刻时主角的正脸要不要给、给到什么程度，所以必须单独列出来，\n       不许只藏在情绪弧的五通道表里。\n\n    为什么必须这么写：观众感知的是「这块地有多少被占了」，不是「有几片叶子」。\n     写「数十片」→ 下游会写成「40 到 50 片」→ 画出来地上一小堆，与「铺满整条廊」差一个数量级。\n\n  3b）**冲突强度**（新增，单列一段，缺了算没交）\n\n     · 有对比关系的片子（这边乱 vs 那边整、改造前 vs 改造后）：\n       写 `A 侧 X% vs B 侧 <Y% 或 0 处>，差 Z 个百分点`\n       X 取自本文件表 3 的占比，Z = |X − Y|。\n     · **改造后那一侧不要直接测百分比。** 改造后常有暖光、木家具、陶盆，\n       按颜色测会把暖光当成脏东西（实测 B0001 末帧暖灯一开，「褐色占比」从 0 跳到 13.5%，是误判）。\n       改造后只判**有/无**：问题物还在不在，写「0 处」。\n     · 占比只在**同机位、同光照**的两帧之间可比。跨光照比较必须注明\n       「改造后开暖灯，光照变了，占比不可直接比，只判有/无」。\n     · 没有对比关系的片子：写「无对比，冲突来自 <危险 / 失败 / 欲望 / 悬念 / 人物关系>」\n     · **禁止只写类型不写强度。** 「是反差」不算，要写「差 25 个百分点」。\n\n  4）首帧六要素（原五项 ＋ 新增第 6 项，缺一项算没交）\n     受害物位置 / 威胁方向 / 距离 / 画面里有几个人 / 机位高度与是否固定 /\n     **观众第一反应（三选一，禁止形容词）**\n      写法固定成单独一行：`观众第一反应：必须马上处理`\n      冒号后只许写一个选项，不许把三个并列写出来。\n\n     第 6 项只能填这三个里的一个，填别的算没填：\n       `必须马上处理`（不处理人看着难受）｜`可以忍但不好看`｜`看着舒服`\n\n     填「必须马上处理」的，必须再补一句**依据**：画面上哪一处让正常人忍不住\n     （例：烂纸箱泡在泥水里、一脚下去会滑、隔着屏幕都闻到味）。\n     依据写不出来的，说明这个反应是编的，退回重判。\n\n  5）情绪弧\n     一句话写清原片情绪是什么、观众该有什么感觉。\n     **这一句必须带「难受程度」的数字**，用 0–3 标「不处理会有多难受」：\n       0 无所谓 / 1 有点在意 / 2 明显难受 / 3 看不下去\n     例（示例，内容必须换成你这条片子）：「暴雨把走廊泡成一地烂叶，乱到看着**难受 3**、不收拾没法待 → 清干净、挂雨帘\n         → 廊下干爽、暖灯亮着能坐下喝东西，最后松一口气」。\n     只写「闷、脏、潮」这类**情绪名**不算，必须带程度数字，且在句子里说清是哪种程度。\n     按五通道逐个查原片用了哪几个：\n       ① 表情视线　② 身体动作与节奏　③ 环境（天气光线）　④ 声音　⑤ 镜头语言\n     然后逐段给：情绪、强度（0 无 / 1 微 / 2 中 / 3 强）、载体\n\n【文件四】03_整片拆解.md\n\n  ★ 「结尾方案（人读版）」—— 放在逐段表之前，**不参与编号**，缺这一节算没交\n\n    这一节是给人看的。不超过 400 字，不许放表格，必须回答五件事：\n\n      · 最后几秒、几个镜头、每个镜头画面里是什么\n      · 光怎么变：首帧到末帧是变亮还是变暗、色温怎么走（例：冷灰 → 暖黄，亮度 ×1.18）\n      · 对照物还在不在：挡雨的片子，结尾必须还在下雨；隔音的必须还在响。\n        对照物没了，「改造」这件事就没有证据，写清是本条怎么处理的\n      · 有没有人在用：有就写第几秒、谁、用了什么；没有就写「缺口」。\n        只陈述缺什么，**不建议补几秒**——补不补、补多长，由复刻那一段定\n      · 这一段最容易做错什么（一句话，要具体到秒数和动作）\n\n  后半段逐段表（段 / 起止秒 / 画面做了什么 / 景别·机位·运动 / 职责\n  　　/ **状态变化（从什么变成什么）** / **动作数** / **位移**）\n  ＋ 终局兑现链（开头问题 → 中间动作 → 终局状态 → 使用验证），\n    并且**「终局状态」必须拆成两栏，缺一栏算没交**：\n\n      · **根治项**：开头暴露的每一个问题，逐项写它在第几秒被解决。\n        **开头问题数必须等于根治项数**，对不上就说明有漏，要在结论里写清漏了哪一项。\n        （这一栏同时是「改造是否够量」的判据：根治项数少，观众就会觉得「浅浅收拾了一下」。）\n      · **升华项**：开头没有、改造后新加的东西（挡雨结构、灯、绿植、家具、氛围）。\n        逐项列出，并写清每一项解决了什么「根治解决不了」的需求。\n\n      判定：只有根治、没有升华 → 结论必须写「只解决了脏，没有提升，观众不会有『变漂亮』的爽感」。\n      有升华但没有根治 → 结论必须写「表面漂亮，核心问题还在」。\n\n  「状态变化」这一列是给复刻抄的：换表面时，这一列必须一字不改地搬进设定书 4.5 节。\n  「动作数」按\"一次状态变化算一个动作\"数，不是按手部步骤数。原片实测每镜 1–2 个。\n  「位移」写是/否：人带着东西在空间里移动＝是。这一项决定下游要不要单独给 2 秒。\n  「景别·机位·运动」写法同【文件三】1）逐镜表，三样缺一不可。\n\n  ★「生成组划分表」——放在逐段表之后、终局兑现链之前，缺这节算没交\n\n    这张表只回答一件事：**哪几段必须绑在同一次生成里，哪几条缝不许缝在外面。**\n    逐段表是按「画面切在哪」切的；生成组是按「动作能不能切开」切的。两者不是一回事。\n    现在全流程只有前者，所以组边界会被下游按预算算术决定，而不是按动作决定。\n\n    **这一层不决定最终划几个盒。** 最终盒数由第⑤段按硬表区间定（成片 36–50 秒 → 4–5 盒）。\n    这一层只交两样东西给第⑤段：① 每一组的「不可分」边界；② 哪几条边界是「禁切」。\n    第⑤段装箱时可以合并相邻组，**但合并线不许跨过任何一个「禁切＝是」**。\n    举例：44.4 秒的片子按动作划出 6 组、硬表要 4–5 盒 → 合并两条相邻组即可，\n    只要那两条之间不是禁切。**组数多于盒数是正常的，不许为了凑盒数把连续动作切开。**\n\n    | 组 | 起止秒 | 含第几段 | 镜数 | 本组边界为什么不能更早／更晚 | 组内有无连续动作（有→禁切） | 组时长 |\n\n    四条硬规则：\n    · **一组 ≤10 秒。** 不写 12、不写 15——15 秒是平台容量，不是模型能力。\n      实测：失败的长盒全在 12–15 秒，成功的全在 8 秒内。\n      10 秒是**上限不是目标**：能有 3 秒的组，就写 3 秒。\n    · **下列连续动作必须在同一组**：起跳—落地、抬起—放下、掀开—盖上、抓住—拉起、\n      开门—进入、踩断—陷落、递出—接住。判据是**前一段的尾帧就是后一段的首帧**。\n      这两下分开生成，「基本是剪不出无缝衔接的」。\n    · **组边界只能落在**：硬切、场景变化、人物进出画、时间省略。\n      **时间点本身不新增组**——「这段 3 秒了，切一下吧」不算理由。\n    · 某组超 10 秒且切不开 → 在表里标「超限」，并写明**这一组会丢什么**\n      （例：会丢「掀板看水」那一下，因为它在 3.3 秒里是第三件事）。\n      **不许静默压缩**——静默压缩的后果是成片里那一段只剩 0.5 秒。\n\n  ★「静态大纲（生成用）」——**按组写，不是按段写**，缺这节算没交\n\n    这一节是把上面所有的账翻回画面。下游拿它直接写提示词，不再重看片。\n    没有这一节，下游只能从 360px 的联络表里猜机位和光，猜出来的东西和原片没关系。\n\n    格式：一组一个小标题，组内一镜一段。每镜先一行参数，再一段白话。\n\n      ### G02｜7.733–15.300｜7.6 秒｜含第 3–5 段\n\n      1.6 秒／24mm／固定／机位高 1.4m／略仰 3°\n      画面左缘是碎石路肩，前景有一段枯枝，虚化；背景是中景的浅黄木板房、门廊灯亮着、\n      廊下停一辆自行车，轻度虚化。白色皮卡从画面左侧压过落叶驶入，车头朝右，停在草坪边；\n      车厢里看得见手锯、撬棍、推车和几根木方。阴天漫射光，无直射，色温偏冷，地面无强阴影。\n\n      5.1 秒／24mm／固定／同机位，不推不摇\n      前景不变；背景木板房不动。驾驶位车门打开，绿衣灰帽的男人下车、绕到车尾、放下尾板，\n      把油锯和铁锹拎下来堆在桥头碎石上，再推下独轮车。他最后停在画面中偏右，\n      面朝桥、背对镜头，双手撑膝俯身看桥面。光不变。\n\n      ……（组内其余镜同格式，一镜都不能省）\n\n    每镜那段白话，必须**同时说清五件事**，缺一件这一镜不算写完：\n      ① 机位与高度　② 前景是什么、虚不虚　③ 背景是什么、虚不虚\n      ④ 主体从画面哪边进、在哪停下、最后什么姿态　⑤ 光从哪来、软硬、冷暖\n\n    硬规定：\n    · **禁用表格、禁用百分比、禁用「同上」「同前」「照旧」。**\n      每一镜的五件事都要重写一遍，不许引用上一镜。这和单元卡「不写同上」是同一条纪律。\n    · **每 30 秒约 600 字。** 写不下就是拆得不够细；写到 2000 字就是掺了废话。\n    · **只写看得见的东西。** 施工工法、材料配比、人物内心一律不写。\n      写「35mm 手持跟随，拍她腰臀以上，她从画面左侧入镜」；\n      不写「她心里很着急」，也不写「混凝土按 1:2:3 配比」。\n    · 这一节描述的是**原片怎么拍**，不是我们怎么拍，所以它不违反「不设计我们的片子」。\n\n【文件五】04_交付自查表.md\n（**给人看的**：下游不读它。它的作用是让你自己核一遍，不是给下游当输入。）\n\n  这一份是你自己对自己交的账，不是给我看的总结。三节，缺一节算没交。\n\n  · **一、硬字段逐项**：骨架三段 ＋ 对账四元组、问题物四件套、人物四件套、冲突强度、\n    首帧六要素、情绪弧、终局兑现链、**生成组划分表、静态大纲**，\n    每一项一行，写「值」和「过／不过」。\n  · **二、这一轮新加的两节，逐条自检**（缺这一节算没交）：\n      - 生成组：共几组？有几组 ≤10 秒？有没有标「超限」？超限那组写了会丢什么吗？\n      - 静态大纲：覆盖了几组／几镜？有没有出现「同上」「同前」「照旧」？\n        随机挑一段数一下字数，够不够每 30 秒 600 字？\n  · **三、未核清单 ＋ 需要人来定的事**：照实写，不许用「待补」糊过去。\n\n\n\n════════════════════════════════════════\n硬规则\n════════════════════════════════════════\n\n1. **模式 A**：只拆解。不评价、不改写、不设计、不写提示词。\n   **模式 B**：要评价差距、要给「怎么追」，但同样不写提示词、不做分镜设计。\n\n2. 看不到、听不清、拿不准的，一律标「未核」，不许猜。\n   声音没听就写「声音未核」，不许写「无声音」。\n\n3. 秒数按事件边界切，不按固定秒数硬切。\n   写清采样精度（镜头中点帧 1 镜 1 张，还是 5 帧/秒，还是 0.2 秒一张）。\n\n3b. **切点只有一个来源，镜数只有一个数。**\n   ffmpeg 场景检测给的切点，和你人判的事件边界不一致时，**以事件边界为准**，\n   并在逐段表下面写一句「场景检测 __ 处，人判 __ 处，差在 __ 秒，按人判」。\n   `00_对标索引` 的镜数、`03_整片拆解` 的段数、平均镜头长度这三处**必须同源同数**，\n   对不上算没交。反例（真实发生过）：B0009 同时存在「10 镜」「12 段」「44.42÷11＝4.04 秒」\n   三个数，密度结论跟着漂。\n\n4. 画面里有像儿童的人，必须在 00_对标索引.md 里明确标出来。\n\n5. 文件权限，两种走法，不许含糊：\n   能建目录、能存文件 → 目录自己建、文件自己写，最后报真实路径。\n   不能 → 写清让我手动做什么：建哪个目录、每份产物存成什么文件名。\n   两种都不许说\"已创建\"却什么都没落地。\n   **但都不许先停下来问我一句「我可以建目录吗」——先动手试，试不了再写清单。**\n\n6. 拆得越细越好。\n\n7. **「占比」必须原样传下去，不许改写。**\n   表面清单里的画面占比（X%），在后续设定书、制卡词、提示词里必须原样保留这个百分比，\n   **不许改写成片数、件数、堆数、把数**。\n   反例（真实发生过）：拆解写「落叶数十片」→ 中间过程稿抄「数十片」→ 制卡词写成\n   「湿枫叶 40 到 50 片」→ 画出来地上一小堆。实测对标首帧落叶占画面 25.0%，成片只有 1.1%，\n   差 23 倍。改写一次，量级就掉一到两个数量级，后面每一步都会忠实地照着错的量级执行。\n\n8. **「程度」不许用形容词，只能用数或三选一。**\n   禁止出现「很乱」「特别脏」「乱到极致」「一点点」「比较多」这类词充当结论。\n   要么给占比、差值、项数、秒数，要么用三选一（观众反应）。\n   形容词只能出现在「依据」里，不能出现在「判断」里。\n\n\n════════════════════════════════════════\n五、模式 B｜成品 vs 对标：对比反馈\n════════════════════════════════════════\n\n只在给了两条视频时执行。**不交 02／03／04，只交 `05_对比反馈.md`。**\n`检查_拆解.py` 会报「缺 02／03」——**那是预期的，不要补假文件。** 模式 B 的验收方式是第六节。\n\n这一节只回答三件事，顺序不许换：**差在哪 → 为什么差 → 怎么追。**\n每一件都要落到秒数或项数，不许写「感觉不对」「节奏偏快」。\n\n## 1）读到的原文\n同开场那段抽问单规定：六句一字不改抄回。抄不出、改写、只写「已阅读」＝这一版打回。\n\n## 2）身份对账（先对齐口径，再谈差距）\n\n| 项 | 对标 | 我方 | 差 |\n|---|---|---|---|\n| 时长 | | | |\n| 画幅／帧率 | | | |\n| 段数 | | | |\n| 镜数 | | | |\n| 平均镜头长度 | | | |\n| 动作数合计 | | | |\n| 位移次数 | | | |\n| 人脸特写次数 | | | |\n| 正脸:侧脸:背影 | | | |\n\n采样精度两边都要写清。**两边抽帧规格不一致的，先说明差在哪，再比。**\n\n## 3）逐镜对照表（主体，不许省行）\n\n**不按段号对齐，按「职责」对齐。** 两边各自先按\n`问题出现／第一反应／决定动手／连续修／再测试／这次没事／收尾`\n归一次，同一职责放同一行；我方缺哪一拍写「我方：无」，多出来的写「我方：多出一拍」。\n\n| 职责 | 对标·起止秒 | 我方·起止秒 | 秒数差 | 状态变化差 | 动作数差 | 景别·机位差 | 前景背景差 | 光差 | 差在哪个字上 |\n\n最后一列「差在哪个字上」只写**一处**，必须是可改的具体东西。\n写「我方踩断那一刀只给了 1.2 秒，原片 2.8 秒，脚没有真正陷进去」；\n不写「节奏偏快」。\n\n## 4）三处最大差距（只写三处，按「改这一处能补回多少观感」排序）\n\n每处固定四行：\n\n- **差在哪**：秒数 ＋ 具体动作 ＋ 我方缺什么\n- **为什么差**：只能填四类之一——`规划`（组划错／单元划错）／`写法`（提示词没写清）／\n  `模型`（能力不够）／`剪辑`（取用或顺序错）。四选一，不许写「综合原因」\n- **怎么追**：一句可执行的话，写到「下一版第几段改成什么」\n- **验证**：下一版用哪一项能看出追上了（取用率／段长／动作数／某镜是否出现）\n\n## 5）模式 B 禁止做的事\n\n- 不许把差距写成形容词，每一条都要有秒数或项数\n- 不许一次列十条差距——列多了等于没排优先级\n- 不许写提示词、不许改设定书、不许改分镜\n- 不许因为自己片子做得差就说「这条对标不能抄」。差距是对齐问题，不是选源问题\n\n## 6）未核与需要人定\n同【文件一】第 0 节「事实边界」的写法。\n\n## 7）模式 B 的落地顺序\n\n1. 建目录：`<今天八位日期>_C####_<短名>\\\n   编号规则同第二节，扫 `*_C####_*` 取最大 +1。C 号与 B 号**分开计**，互不占用。\n2. 落盘 `00_对比反馈.md`（上面 1–6 节）＋ `01_证据\\`（两边各一张首帧、各一张末帧）。\n3. 报三样：路径、字数、三处最大差距各一句。\n\n════════════════════════════════════════\n六、模式 B 怎么验收（不用 Pipeline）\n════════════════════════════════════════\n\n模式 B 不进 `检查_拆解.py` 和 `体检.py`（那两样是模式 A 的闸门）。它只查四条，缺一条就是没交：\n\n1. 第一行写了 `模式 B｜对标 = …｜我方 = …｜依据 = …`\n2. 身份对账表 9 行全填，没有空格子（填「未核」也算填了）\n3. 逐镜对照表里，**每一个职责行两边都有话**：或写段秒，或写「我方：无」/「我方：多出一拍」\n4. 三处最大差距，每处四行齐，且「为什么差」是四类之一\n\n四条全过，这一版才算交。**不许自己声称「已通过」——把四条逐条打勾给我看。**\n\n\n════════════════════════════════════════\n最后只回四样\n════════════════════════════════════════\n\n**模式 A 回这四样：**\n\n1. 新建的文件夹完整路径 ＋ 五份产物各自的字数\n   ＋ **T_钩 判成几秒、理由一句话、微段表写了几格**\n2. **人读三层各一句话**（我只看这三句就知道这条片子值不值得抄）：\n   · 一分钟读懂里「这条片子是什么」那一句\n   · 开头方案里「为什么这样开头能留住人」那一句\n   · 结尾方案里「最容易做错什么」那一句\n3. **「程度」四件套，逐条报数（缺一项就是没交）**\n   · 骨架一句话三段式：填了几段、三段里的「谁」分别是谁\n   · 对账四元组：X% 是多少、N 几个动作、T 几秒、根治几项、升华几项\n   · 问题物四件套：占比多少%、分布是什么、共几处几类、单件尺寸\n   · 冲突强度：A 侧多少% vs B 侧多少%，差几个百分点（或「无对比，冲突来自…」）\n   · 观众第一反应：三选一填的是哪一个、依据一句话\n4. 所有标「未核」的项 ＋ 所有需要人来定的事（年龄红线、T 值取值等），列成清单\n\n**模式 B 只回三样：**\n\n1. 路径 ＋ `05_对比反馈.md` 字数 ＋ 身份对账表哪几行是「未核」\n2. 三处最大差距，每处一句：`<差在哪（秒数+动作）> ／ 为什么差＝<四类之一>`\n3. 第六节那四条验收，逐条打勾（`[x]` 或 `[ ]`），不许只写「已通过」\n\n════════════════════════════════════════\n交完之后\n════════════════════════════════════════\n\n**模式 A 走这里；模式 B 到第六节为止，不跑 Pipeline、不出体检图。**\n\n全部产出落盘后，最后一行写这句话：\n「这一段的文件都在 <项目总文件夹>\\01_拆解\\。请运行 python \"E:\\智线出海内容运营\\09 工具\\Pipeline.py\" 查 拆解 --对标库 <项目总文件夹>\\01_拆解 检查一遍。」\n\n然后交**两张图**，都用绝对路径。\n\n【图一 · 结论图】自己跑（不用我跑，你有执行权限）：\n    python \"E:\\智线出海内容运营\\09 工具\\体检.py\" \"<项目总文件夹>\"\n→ 生成 `_验收\\体检单.png`：六行，绿=过、红=卡住、灰=还没做。\n\n【图二 · 过程图】这一段的专业图，我要看它判断完成度：\n    （这一段不出图，直接贴原片首帧： `<项目总文件夹>\\01_拆解\\01_原片证据\\first_frame-001.jpg`）\n→ 存到 `不用另存`\n\n两张都贴出来，不要贴文字、不要贴退出码。后面只写一句：**这一段过没过**；\n没过就补一句「卡在第几段 + 那一行写的原因」。\n不许自己声称\"已通过\"——以图为准。我只看图。\n\n【路径速查｜都是本机绝对路径，不要改成相对路径】\n· 工具目录：
