段不靠眼睛，靠已经定死的表\n· 只有两种情况才回看单帧原图：① 要写「状态变化」但联络表看不清；② 位移刀或结尾验证段\n· 回看额度 6 张\n\n拼联络表：`ffmpeg -i <原片> -vf \"select='eq(n,0)+eq(n,5)+...',scale=360:-1,tile=5x1\" -frames:v 1 sheet_%02d.jpg`\n\n大文件（>20KB）：按 `##` 切，一次读 1–3 节，全部读完才算读过。只拿到开头一截预览的，\n重读两次仍不全的，**不要在对话里停下来问我**：在产物里把那一节标成\n「只读到第 X 节，缺 <内容>，导致 <哪几个字段> 填不了」，然后继续往下做。\n**A/B/C 类缺一项不许开工，只有 D 类可以不读继续。** 禁止把「只读到第 3 节」写成「已完整读取」。\n\n────────────────────────────────────────\n零提问 ＋ 回复纪律（比读法更硬）\n────────────────────────────────────────\n\n我只会发给你「指令 ＋ 路径」，缺什么自己按默认处理，**不许拿来问我**：\n· 上游文件不存在 → 产物里标「缺 <文件名>，影响 <哪几项>」，能做的那部分照做\n· 图看不清 → 标「依据不清·待补」，不许靠经验编\n· 数值打架 → 按本文件已写死的优先级判，判完在产物里记一句\n只有「上游核心文件整份读不到」才允许停下来。\n\n对话里只许出现两样东西：第N步完成那一行 ＋ 最后的交付总结。\n**禁止在对话里输出** <analysis>、<summary>、思考过程、自我复述、\n「我先看一下」「现在开始读」这类旁白。单次回复不超过 15 行，长内容写进文件。\n\n每改完或新建一个文件，立刻回一行「第N步完成：文件名」，不要攒到最后一起说。\n\n\n\n════════════════════════════════════════\n你要做什么\n════════════════════════════════════════\n\n拿已经拆好的对标，做「一次复刻 N 条」的**微调大纲**（文件名固定为 `01_微调大纲.md`）。\n\n这一阶段不是一次交出 N 份成品。是**先出一份 `01_微调大纲.md` 给我审**，我逐行判「过／改」，\n我说「定稿」之后你才写版本设定书、才建 V 文件夹。\n\n本轮不写开头、不写小分镜、不写提示词、不划生产单元。\n\n\n════════════════════════════════════════\n零、我方约束（这一节最重要，先看这里）\n════════════════════════════════════════\n\n① 拆解那一段**不给任何\"该抄什么/能不能用\"的意见**，那些判断不在它那里。\n所有\"我们这边怎么定\"，全部由我在下面这张表里给。**你只按我给的做，不要替我推。**\n\n| # | 项 | 我给了什么 | 你没收到时怎么办 |\n|---|---|---|---|\n| 1 | 人物 | 统一人物／不做统一人物；主角是谁、什么气质 | 按对标的\"年龄外观＋正脸比例\"四项照搬，并在稿子里标「人物：未给，按对标默认」 |\n| 2 | 场景 | 国家／建筑形态／室内外 | 按可换层八项换成真实欧美家庭场景（见第五节），标「场景：未给，按默认换」 |\n| 3 | 片长 | 目标总时长（秒） | 按母版时长 ±5 秒，标「片长：未给，按母版」 |\n| 4 | 时间构成 | T 值占比、三段各多少秒 | 按对标同段比例等比缩放，标「时间构成：未给，按对标比例」 |\n| 5 | 主角正脸 | 给不给脸、给到什么程度 | 按对标的人物四件套原样，标「正脸：未给，按对标」 |\n\n硬规定：\n· **我给了的，一律按我给，不许\"优化\"、不许\"为了更像对标\"改回去。**\n· **我没给的，按上表兜底，并在稿子里写一句「XX：未给，按默认」。** 不许沉默、不许自己拍。\n· 我给的和对标冲突时（例：我给的主角不给正脸、对标全程给脸），**以我给为准**，\n  在 `01_微调大纲.md` 第 0 节写一句「冲突：我方要求 XX，对标是 YY，已按我方执行」。\n· 这张表我可能一个字都不填。**不填不等于要我猜，等于按默认兜底并标注。**\n\n\n════════════════════════════════════════\n一、读这些文件\n════════════════════════════════════════\n\n【全局固定路径，不用改】\n\n1. skill 全文，以本规范目录 skills\\ 下这份为准：\n   E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\skills\\benchmark-batch-variants\\SKILL.md\n\n2. 产出格式与颗粒度，读它的第 1 节（新结构）：\n   E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\12_中间过程稿_模板与样例_20261021.md\n   （2026-10-27 起，这篇的旧十七节降级成附录「检查项」，**不再作为产出格式**。产出格式以本文件第四节为准。）\n\n3. 定稿之后写设定书用这份（这一轮先不用细读，知道有这么个东西）：\n   E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\13_下游输入输出契约_20261021.md\n\n【本条对标，路径已写全，不用你改】\n\n4. <项目总文件夹>\\01_拆解\\\n   项目总文件夹 = E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\*_<顶部那个编号>_*\\ （只有一个，不会认错）\n   读里面的：00_对标索引.md、02_开头拆解.md、03_整片拆解.md\n\n禁读：别的批次、别的版本、上一条项目的任何文件。\n\n\n════════════════════════════════════════\n二、第一步：只建一个目录\n════════════════════════════════════════\n\n项目总文件夹已经存在（第①段建的），你只在里面建这一层：\n\n<项目总文件夹>\\02_复刻\\\n\n只建这一个。现在不建 V 文件夹，一个都不建。\n（项目总文件夹里应该只有 00_项目台账.md 和 01_拆解\\，看到别的说明你找错项目了，停下来问。）\n\n\n════════════════════════════════════════\n三、第二步：先告诉我能出几条\n════════════════════════════════════════\n\n版本数 ≤ 可调子维度数 + 1。\n\n先把这条对标的可调子维度挖出来，列成清单给我：\n· 有几个\n· 分别是什么（例：A1 首帧关系 / A2 出事时点 / A3 受害者数量 / A4 问题段冗余 / A5 开工时点）\n· 按这个数，最多能出几条\n\n如果我要的条数超过这个上限，给我两条路选（减条数 / 换源），\n不许为了凑数硬拆子维度、不许把同一个子维度拆成两条。\n\nV1 必须是对照版：锁死层全抄、可换层全换、可调层一处不动。\n\n\n════════════════════════════════════════\n四、第三步：写 01_微调大纲.md（只有三块，不是十七节）\n════════════════════════════════════════\n\n**2026-10-27 重构。** 原来这里要求 17 节（判定摘要 / 骨架主表 / 锁死 12 项 / 情绪十列 /\n表面替换表 / 版本差异矩阵 / 十一列对照表 / 七问判定 / 改动理由总表 / 待核与风险……）。\n那份东西的问题是：**17 节里没有一节叫「大纲」，全是判定表和台账，人读不懂，AI 也只能填格子。**\n\n现在只交**三块**。这是阿初的做法：「视频提示词不重要，**重要的是大纲**；大纲弄好就足够了，\n润色的事情交给 AI 去办」（`阿初的油管库.md` L371–379）。他自己在这一步只交一份微调大纲。\n\n──────────────────────────────\n第一块：骨架（一句话，≤50 字，全批共用）\n──────────────────────────────\n\n**骨架 ＝ 核心脉络 ＝ 这段片子最本质的走向。** 阿初的定义：「骨架就是核心脉络，\n就是这个故事最本质的走向」（L902）。他概括《目中无人2》1 分 50 秒只用了一句：\n\n> 主角被坏人追逐抓住 - 被欺负后无力的反击 - 在要被伤害前被好人阻止 - 好人打跑了坏人 - 好人无视了主角\n\n写法：\n· 用 `→` 或 `-` 串起 3–6 个分句，**每个分句是一个\"状态变化\"，不是一件事**。\n· **只写因果和状态，不写人数、道具、场地、景别、秒数。** 阿初说得更狠：\n  「主角的数量、坏人的数量、道具、欺负/反击/打跑的方式、**甚至分镜的数量**，全部都是细节」。\n· **一句话装不下就是骨架识别错了**，不是句子不够长。\n\n**骨架放在全文最前面，单独立一节。** 我第一眼看的就是它——它不对，后面全白写。\n我不打回，你就往下写；我要打回，只打回这一句。\n\n──────────────────────────────\n第二块：大纲（大白话，按刀往下写）\n──────────────────────────────\n\n**这是主产物。** 用白话说清每一刀在发生什么，不是填表。\n\n每刀这样写（**2–3 行，不超过 60 字 ×3**）：\n\n```\n### N01｜素材 2.8 秒\n她抱着孩子走到桥中段，脚下一块板断了，人往下一沉。\n她一手死死抓住旁边那根钢索，另一只手把孩子按在怀里。\n她没有喊，只是喘。\n```\n\n规则：\n· **一行一件事，按发生的先后往下读。** 不许用表格，不许写「结构一致吗」这种列。\n· **情绪写在动作里**，不单独立表。写「她没有喊，只是喘」就是情绪；\n  写「她很害怕」是废话。阿初原话：「悲伤不只是悲伤，愤怒不止是愤怒」。\n· **素材秒写在标题行**（算法见 `references/material-seconds.md`），成片秒不用在这里写。\n· **一刀必须是一个人能连续做完的动作片段。** 做不完就拆刀，不许写「演着演着就铺满了」。\n· 人数、衣着、道具、场地、光、声音**该写就写**，写在它出现的那一行里，不要抽出来做表。\n\n**N 个版本怎么办**：V01 写全；V02 以后**只写和 V01 不一样的那几刀**，其余写「N05–N09 同 V01」。\n不许把 N 版塞进同一张矩阵表——那就是又回到读不懂。\n\n──────────────────────────────\n第三块：这一版改了什么（短表，≤20 行）\n──────────────────────────────\n\n| 版本 | 占哪个可调子维度 | 骨架动了哪一句 | 表面换了什么 | 加了一个什么 | 删了一个什么 |\n|---|---|---|---|---|---|\n\n· 「骨架动了哪一句」：**没动就写「未动」**。动了必须写清动的是第几分句、为什么。\n· 「表面换了什么」：只写换掉的那几样，**不用列全**。\n· 加/删各最多一个。加两个以上，说明这一版不是微调，是重写。\n\n──────────────────────────────\n机器检查项（不写进大纲，交稿前你自己跑）\n──────────────────────────────\n\n原来那 17 节里，有 12 节是**核对用**的，不是写作用的。它们降级成检查项，不进产物：\n\n· 锁死项是否逐项照抄母版 · 情绪强度是否 0–3 且改造段不上 3\n· C1/C2/C3/C5 任意两版是否相同 · 骨架分句数是否一致\n· 总时长是否落在母版 ±5 秒 · T ÷ 全片是否 12%–18%\n· 表面八项是否每版都换 · 各版是否落在不同子维度\n\n**这些你自己核，核完在对话里报一句「检查项 8 条全过」，不要写成文档给我看。**\n（细则仍留在 `12_中间过程稿_模板与样例_20261021.md` 的附录里，需要时查。）\n\n──────────────────────────────\n产出文件\n──────────────────────────────\n\n`02_复刻\\01_微调大纲.md` —— 就这一个文件，三块内容。\n\n**这份大纲不只是给人看的，下游要读它。**（2026-10-27 明确）\n· ④ 小分镜必读第 2 节「大纲」——设定书 4.5 只写「从 X 变成 Y」的状态键值，\n  装不下「她一手死死抓住那根钢索，另一只手把孩子按在怀里，她没有喊，只是喘」；\n· ⑤ 生产单元也必读第 2 节，写提示词时「字段定骨架、大白话定质感」。\n· **所以第 2 节要写成能直接当原料用的大白话**，不是摘要。第 0／1／3 节才是纯给人看的。\n**不再产出「中间过程稿」这个文件。** 名字改了，内容也只剩三块。\n\n**版本设定书留到我说「定稿」之后才写**，而且它是**从大纲机械派生**的，不新增任何设计：\n· 每刀的动作、状态变化、机位 → 从大纲那一刀直接搬\n· 4.5 逐刀表的「那一个动作」→ 从大纲那一刀的标题行搬\n· 十节里的其余各项 → 从大纲第三块和各版差异搬\n**派生出新东西（大纲里没有的动作、没有的场地）就是错，打回。**\n\n\n\n════════════════════════════════════════\n五、硬规则，违反任一条这份作废\n════════════════════════════════════════\n\n1. T 值必须按 skill 第 2.4 节算：\n   T ＝ 原片里「人第一次接触要处理的东西」的时刻，取到那段动作结束。\n   不许套 13 秒，不许套 2.3 秒，不许套任何默认值。\n\n2. 总时长只能按 skill L10：母版时长 ±5 秒。这一条没有例外。\n\n   本规范里**没有**「成片必须 80–95 秒」这条规则，也没有任何「频道惯例时长」。\n   你要是写出这个数字，那是你自己编的，直接作废。\n   L10 就是：母版多长，成片多长。\n\n   并且：**等比缩放改不了任何比例。** T ÷ 全片总时长，在拉伸前后是同一个数。\n   所以不许以「把比例凑进 12%–18%」为由去改总时长——这个理由在数学上不成立。\n\n3. 12%–18% 校验不过，是**选源不合格**，不是换算问题。\n   不许靠拉伸或压缩时长把它凑进区间。\n   报给我：这条母版的 T 占比是多少、过不过、要不要换源。\n\n4. 母版时长和我想要的目标差太远（比如母版 29 秒、要 85 秒），\n   这不是「拉长」，是换源。把差值报给我，不要自己决定放大。\n\n5. 可换层的八项，每一版都要换，版本之间不许相同。\n   第 6 节表面表里一格都不许写\"同 V1\"、\"同\"、\"同上\"。\n   C1 受害物、C2 地点、C3 天气、C5 穿着 这四项，任意两版有一项相同就是不合格。\n\n   同时，这八项必须换成**真实欧美家庭场景**，人物、物件、场地都是。\n   不是把热带植物换个落叶树就算换完了。\n\n   判断标准：一个在欧美住了三年的人看画面，不会说出「这不是我们这儿的东西」。\n\n   参照 full-storyboard-design 第 6 节：\n   不能外表欧美、细节不像（封闭阳台、晾衣杆、瓷砖、防盗网、室内拖鞋穿去户外干活）。\n\n   半开放廊、雨棚廊、地砖廊这类东南亚／南亚住宅形态，\n   要换成欧美对应的东西：独栋后院、driveway 车道、patio／deck、草坪、围栏、\n   gutter 雨水槽、车库门、siding 外墙、concrete slab。\n\n   换不了的，直接告诉我「这条源的居住形态换不过去」，不要硬做。\n\n   为什么必须每版全换：观众看的是表面。四版穿同一件衣服、站同一个院子、淋同一样东西，\n   观众会觉得\"这我看过了\"，直接划走。8 条修坑片就是表面全换才撑着一个骨架拍了几十条。\n   代价是数据没法精确归因到结构那一个变量——这个代价我们认，宁可归因粗一点，\n   也不能让两条片长得一样。\n\n6. 版本数 ≤ 可调子维度数 + 1。不够就说缺口，不许硬拆。\n\n7. V1 必须是对照版。\n\n8. 每版只占一个子维度，任意两版不许落在同一子维度上。\n\n9. 情绪必须按五通道和强度 0–3 写：\n   ① 表情视线　② 身体动作与节奏　③ 环境　④ 声音　⑤ 镜头语言\n   强度：0 无 / 1 微 / 2 中 / 3 强。改造类原则上不上 3。\n   禁止「他很着急」「表情焦急」这类抽象词。\n   某段情绪只有「表情」一个通道承担，必须标出来。\n\n10. 锁死层 13 项逐项对照母版，不许写「基本一致」。\n\n11. 只读上面那几个文件。不许回头读拆解之外的东西。\n\n12. 这份稿子是给我审的，不是给 AI 读的。画面要写到我能想象出来：\n   谁、在画面哪个位置、穿什么、动作是什么、什么东西在什么状态、什么景别、机位在哪。\n\n13. 结构链必须让我一眼看懂：第 3 节骨架主表以外，\n   另给一张「原片秒 → 我们秒 → 一样的什么／变了的什么」的单行对照链，\n   八段一段一行，不许只给表格不给链。\n\n14. 先说自己有没有文件权限，两种走法，不许含糊：\n   能建目录、能存文件 → 目录和 md 自己建、自己写，最后报真实路径。\n   不能 → 把要建的目录树和每份 md 的完整正文写在回复里，让我复制粘贴。\n   这次不处理图片，但目录和 md 必须真落地，不许只给目录树说\"已建好\"。\n\n15. **结尾验证段 · 独立配额（不可挪用）。**\n   每一版设定书的第 9 节必须有这张表，四行，缺一行作废：\n\n   | 项 | 值 |\n   |---|---|\n   | 对标验证段 | 起 __ s／止 __ s／时长 __ 秒／__ 刀（引 `03_整片拆解.md` 与分镜第 2 节） |\n   | 本片验证段 | 起 __ s／止 __ s／时长 __ 秒／__ 刀，**必须落在对标时长 ×0.9 – ×1.1** |\n   | 对照物 | 问题源是什么（雨／噪音／尘／虫／乱／其他）：____。**它必须在验证段最后一个镜头里仍然可见** |\n   | 使用兑现 | 谁 __／在哪 __／做什么动作 __／__ 秒。**这一格不许写「空镜」或「无人」** |\n\n   四条铁律：\n   · 这笔额度**不可挪用**（见第 16 条）。\n   · 末镜 ≥ 对标末镜时长 ×0.9，且**不许完全静止**（静止会被读成卡帧）。\n   · 末帧平均亮度 ≥ 首帧平均亮度 ×1.05（用 `ffmpeg signalstats` 的 YAVG 量，别凭感觉）。\n     「改造后该更亮」是这类片子的基本语法；做不到就说明\"变漂亮\"没兑现。\n     确实要更暗（夜景等），必须在表下方写明理由，并保证末帧的暖色面积大于首帧。\n   · 结尾不许靠「移走问题物件、换机位、换天气」来假装解决。对照物消失＝这一段作废。\n\n16. **借时间必须报账。**\n   （2026-10-27 修订：原先这里写着「位移刀 ≥2 秒、单元成片 ≥2 秒」这类最小时长，**已全部删除**。\n   理由：那是我在剪辑台上的规矩，不是拍摄规矩。写进上游会逼着下游在固定长度里塞一个做不完的动作。\n   现在只借「素材秒」，不借「成片秒」——见下面第 16b。）\n\n   凡是把一个动作的素材时长挪给别处，花的都是同一笔钱：**素材总秒**。每借一次都要记账，写进设定书第 9 节的「秒数台账」：\n\n   | 借出方（哪段） | 借入方（哪段） | 借几秒素材 | 借出方还剩几秒 | 借出方还够不够做完那个动作 | 够 / 不够 |\n   |---|---|---|---|---|---|\n\n   三条：\n   · **借出方是结尾验证段的，不许自己批，必须报我裁决。这一条没有例外。**\n     （真实事故：为了给 N24 走位凑满「位移刀 ≥2 秒」，把结尾空镜从 2.07 秒砍到 1.17 秒，\n      末镜掉了 43%，成片结尾成了全片最弱的一段。当时没有任何一条规则要求报批。）\n   · 借出方借后低于自己的下限，不许借。\n   · 台账合计必须平衡：**Σ 各段素材秒 ＝ 素材总秒**，素材总秒 ≈ 成片总时长 ÷ 0.867（阿初 15 秒生成 → 13 秒成片，L4622／L8392。**注意**：他说的「原片 30 秒降到 18 秒」是对标→成片的压缩比，不是生成→成片）。\n\n16b. **「成片秒」和「素材秒」是两笔钱，别记混。**（2026-10-27 新增）\n   · **成片秒**：这一段剪完之后占多少。这是剪辑台的结果。\n   · **素材秒**：这个动作拍完、观众看得清，需要几秒。这是拍摄的输入。\n   · **对标那份成片，是别人的素材加速剪出来的。** 照着它的成片秒去卡自己的拍摄，等于要求模型在 4 秒里做完 40 块板——物理上不成立，模型只能用走位填空档，填出来的全要剪掉。\n   · 所以：**上游只约束素材秒，成片秒是 Σ素材秒 × 0.867 算出来的结果**，不是逐段抄对标。\n\n17. **三段配额 ＋ 工序守恒。**\n   这是这条片子最贵的一条教训：**编制不在「总时长」，在「三段怎么分」和「工序被搬到哪」**。\n\n   每一版设定书的第 9 节必须有这两张表，缺一张作废。\n\n   **表 A：三段配额**\n\n   | 段 | 起 s | 止 s | 本片时长 | 对标同段时长 | 对标工序数 | 本片工序数 | 时长比 | 工序比 |\n   |---|---|---|---|---|---|---|---|---|\n   | ① 开头（呈现问题） | | | | | | **必须 0** | ≤1.1 | — |\n   | ② 中间（连续改造） | | | | | | | ≥0.9 | **≥0.9** |\n   | ③ 结尾（验证兑现） | | | | | | | ≥0.9 | — |\n\n   比值一律用「本片 ÷ 对标」，两位小数。对标数字从 `03_整片拆解.md` 逐段表数出来，不许估。\n\n   **表 B：工序清单**（一行一个工序，不许合并写）\n\n   工序名**只能取自 `19_工序词表.md` 的标准名**；词表里没有的，报给我，不许自己起名。\n   同一个工序在表 A、表 B、分镜、单元卡里必须写成同一个名字——名字一变，后面的看板就对不齐。\n\n   | 工序号 | 工序名 | 落在第几段 | 起 s | 止 s | 动作数 | 这一刀证明什么 |\n   |---|---|---|---|---|---|---|\n\n   **五条硬规定：**\n\n   · **开头段工序数必须为 0。** 开头只呈现问题，不动手（细则见 `3_开头.txt` 第二之二节）。\n     判据：开头段里不许出现工具，不许出现「问题物减少」的状态变化。\n   · **中间段工序比 ≥0.9。** 低于这个数，说明有工序被搬到两头去了，**必须搬回中间段**。\n     （真实事故：中间段 13 个工序 vs 对标 16 个，−18.75%，观众感觉「浅浅收拾了一下」。）\n   · **中间段每工序平均秒数 ≥ 对标同项 ×0.9。** 防止工序塞太密——秒数除得开，才有「干得实」的观感。\n   · **同一工序不许被拆到两段里。** 比如「冲地」在中间，「刷墙」在开头，这两件都属清理，必须同段。\n   · 表 A 三段时长之和 ＝ 总时长，一秒不差；表 B 工序动作数之和 ＝ 设定书 4.5 节动作总数。\n\n   **为什么必须写这条**：这两张表以前不存在，所以「开头抢了中间的活」「工序被两头抽空」\n   这类问题，写的时候看不出来、检查的时候没依据，只能等成片出来靠人眼发现。\n\n\n════════════════════════════════════════\n六、第四步：停下来等我审\n════════════════════════════════════════\n\n贴三样东西给我，一共不超过 25 行：\n\n1. **骨架那一句**（原文，一字不改）\n2. **这批的可调子维度有几个、分别是什么、最多能出几条**\n3. **检查项 8 条，过没过**\n\n然后停。**不要把大纲正文贴进对话**——它写在文件里，我自己打开看。\n（我打开就看第一块的骨架和每条 N 的标题行；觉得对，再往下读。）\n\n然后停。\n\n不要写版本设定书，不要建 V 文件夹，不要开始写开头。\n\n\n════════════════════════════════════════\n七、我说「定稿」之后才做\n════════════════════════════════════════\n\n1. 在 `<项目总文件夹>\\02_复刻\\` 下建 V01_短名 … Vnn_短名，每个里面建五个子目录：\n   开头\\　分镜\\　单元\\　生成\\　说明\\\n   （空目录里放一份 _放什么.md，照 _项目骨架\\_V文件夹骨架\\ 抄）\n\n2. 每个 V 目录写一份 00_版本设定书.md，十节，\n   按 13_下游输入输出契约_20261021.md 第二节的十节写。\n\n   **第 4 节「本版逐段表」必须按「一次状态变化」的口径写：**\n   　每一刀一行，写成「从 X 变成 Y」；「那一个动作」只有一句、不超过 40 字。\n   　出现\"先…再…然后…接着\"就是写了第二个动作 —— 拆刀，不许在一行里塞。\n   　这一节的行数与编号必须和 4.5 节逐刀一一对应（25 刀就是 25 行，N01–N25），\n   　行数对不上、或某一行里塞了两个动作，这一版作废重写。\n   　理由：这一节是下游三段唯一的动作来源。它含糊，后面全错，而且错在设计阶段，\n   　生成和剪辑都补不回来。\n\n   第 4 节末尾必须附「T 秒末态十项键值」，十项一项都不许空，写成键值表（`末态.xxx = …`），\n   不许写成散文 —— 它是 ③ 开头和 ④ 小分镜共同的起点，散文没法逐项对。\n   **第 4 节之后必须加一节 4.5「逐刀动作预算表」**，六列：\n   　刀号｜起止秒｜从什么状态→变成什么状态｜那一个动作（一句话）｜位移(是/否)｜动作数。\n   　动作数只能是 0 或 1；写 2 就是错，拆刀。\n   　位移=是的刀**不设最小时长**（走完这段路要几秒就写几秒），但**不许排在生产单元的最后一刀**。\n   　（2026-10-27：「位移刀 ≥2 秒」已删。那条是剪辑规矩，写进上游会逼下游在固定长度里塞一个走不完的走位。）\n   　**「起止秒」写的是素材秒，不是原片的剪点。单刀素材秒 ≥1 秒，不到 1 秒的并进相邻刀。**\n   　对标的成片是加速剪出来的，照抄它的秒数等于要求模型在半秒里演完一个状态变化。\n   　（2026-10-28 真实事故：B0011 的 N02 直接照抄原片 2.600 道全套数据\\06_制作对话与决策\\\n· 本段产物：       <项目总文件夹>\\02_复刻\\\n· 规范目录：       E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\\n\n\n════════════════════════════════════════\n★ 人读版（每个环节都要交，缺了不算交稿）\n════════════════════════════════════════\n\n除了上面给 AI 看的详细文档，**另交一份 `01_复刻_人读版.md`**：\n五块、一页纸、不超过 600 字、大白话。格式见 `38_人读版_统一格式_20261027.md`。\n\n```\n## 一、一句话          这条片子讲的是……\n## 二、我是怎么想的     3–5 条，每条一行，说清为什么这么定\n## 三、原片 vs 我们（逐段并排：原片做什么 / 我们做什么 / 同删换加）\n## 四、我删了什么、加了什么   各 1–3 条，带一句为什么\n## 五、这一版你最该盯的一处   必须写真话，不许写\"整体没问题\"\n```\n\n第三块的对比，第三栏一律用四个字开头：**同／删／换／加**\n（借阿初的办法：并排播放时「原片放、我的黑屏」＝我删了；「我的放、原片黑屏」＝我加了。L962–964）\n\n**人只审人读版。** 详细文档机器检查，人读版人看方向；人读版方向不对直接打回。\n", "3": "════════════════════════════════════════\n只改下面这两行。其他一个字都不用动。\n════════════════════════════════════════\n\n版本文件夹：<粘贴 V0x_短名 的完整路径，形如 …\\<项目总文件夹>\\02_复刻\\V01_短名>\n对标拆解目录：<粘贴 …\\<项目总文件夹>\\01_拆解 的完整路径>\n\n下面所有文件都按两种方式给出：\n· 版本内文件 → 相对路径，直接接在上面「版本文件夹」那行后面\n· 对标文件 → 相对路径，直接接在「对标拆解目录」那行后面\n· 全局文件（skill）→ 路径固定，永远不用改\n\n**不要自己去 06_制作对话与决策 下翻项目找编号。** 上面两行已经给全了，直接进那两个目录读文件。\n目录打不开再申请授权；仍然打不开，明确写\"缺这一项\"，不许假装读过，不许按文件名编内容，也不要让我复制粘贴给你。\n\n【读什么、读到什么程度｜五段通用，细则见 18_读什么读到什么程度_五段通用.md】\n\n【读到的证明｜硬规定，不交这一节视为没读】\n开工前我会贴给你一张「抽问单」：从你必读的文件里随机抽出来的几句话。\n交付物的**第一节**必须叫「读到的原文」，把抽问单里每一句**一字不改**抄进去。\n· 抄不出、改写、概括、只写「已阅读」——一律算没读到，这一版直接打回，不许往下做。\n· 抄错一个字也算没过。原样就是原样，没有「大意对」这种说法。\n· 机制和用法见 20_读到的证明_抽查机制.md\n\n\n每份输入先归四类，按类执行，不许自己另定标准：\n· A 逐条用 —— 每一条都会变成一个产出字段 → 分节读完，一条不许跳\n· B 通读取法 —— 是方法/规范/格式，不是数据 → 全读，掌握硬约束\n· C 配额抽样 —— 连续重复的图/帧 → 按配额看够，其余不看也不报「未看」\n· D 不读 —— 结论已逐条抄进某个 A 类文件 → 不读，也不许报「缺这一项」\n\n图片配额（C 类｜这几段读的是已经抽好的图，不用自己抽）：\n· first_frame：1 张\n· opening：15 张 → 拼成 3 张联络表（每张 5 格）再看，**不要逐张看**\n· overview：每 5 秒 1 张，同样拼成联络表\n· **合计读到的图不超过 8 张**（含联络表）。超过就说明你在逐张看，停下来重拼\n\n分段不靠看图：\n· ② 复刻的分段依据是 `01_拆解\\03_整片拆解.md` 的逐段表，不是图\n· ③④⑤ 的分段依据是 `00_版本设定书.md` 第 4.5 节逐刀表（精确到毫秒），也不是图\n· **禁止「做逐段表就每秒一张全看」这种读法。** 分段不靠眼睛，靠已经定死的表\n· 只有两种情况才回看单帧原图：① 要写「状态变化」但联络表看不清；② 位移刀或结尾验证段\n· 回看额度 6 张\n\n拼联络表：`ffmpeg -i <原片> -vf \"select='eq(n,0)+eq(n,5)+...',scale=360:-1,tile=5x1\" -frames:v 1 sheet_%02d.jpg`\n\n大文件（>20KB）：按 `##` 切，一次读 1–3 节，全部读完才算读过。只拿到开头一截预览的，\n重读两次仍不全的，**不要在对话里停下来问我**：在产物里把那一节标成\n「只读到第 X 节，缺 <内容>，导致 <哪几个字段> 填不了」，然后继续往下做。\n**A/B/C 类缺一项不许开工，只有 D 类可以不读继续。** 禁止把「只读到第 3 节」写成「已完整读取」。\n\n────────────────────────────────────────\n零提问 ＋ 回复纪律（比读法更硬）\n────────────────────────────────────────\n\n我只会发给你「指令 ＋ 路径」，缺什么自己按默认处理，**不许拿来问我**：\n· 上游文件不存在 → 产物里标「缺 <文件名>，影响 <哪几项>」，能做的那部分照做\n· 图看不清 → 标「依据不清·待补」，不许靠经验编\n· 数值打架 → 按本文件已写死的优先级判，判完在产物里记一句\n只有「上游核心文件整份读不到」才允许停下来。\n\n对话里只许出现两样东西：第N步完成那一行 ＋ 最后的交付总结。\n**禁止在对话里输出** <analysis>、<summary>、思考过程、自我复述、\n「我先看一下」「现在开始读」这类旁白。单次回复不超过 15 行，长内容写进文件。\n\n每改完或新建一个文件，立刻回一行「第N步完成：文件名」，不要攒到最后一起说。\n\n\n\n════════════════════════════════════════\n你要做什么\n════════════════════════════════════════\n\n用 skill `benchmark-adapt-hook`，为本项目设计开头 0–T 秒。\n\n本轮只做开头。不写后段小分镜，不划整片生产单元。\n\n开头**自己那一个单元**的图提示词和视频提示词，本轮要写。\n理由：第 5 步（生产单元）的输入清单里明确要「开头交接.md 及其指定的共用卡制卡词、全部开头 U 卡」。\n你不交，他只能重写，开头就没法先出图验证——而重生成主要就发生在开头这一段。\n交付格式见第七节第 4、5 项。\n\n先给我看三样，我说\"确认\"之后你才存文件：\n1. 新旧逐秒对照表\n2. \"必须有 / 禁止有\"清单\n3. 七问的逐条答案\n\n确认之前不写提示词、不存文件、不生成。\n\n\n════════════════════════════════════════\n一、先读这些文件\n════════════════════════════════════════\n\n【全局固定路径，不用改】\n\n1. skill 全文，按第 1–6 步及\"真实感预检\"执行：\n   E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\skills\\benchmark-adapt-hook\\SKILL.md\n\n1b. 写提示词用的 skill（只在做到第七节第 4、5 项时才读，前面别读）：\n   E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\skills\\adaptive-video-production\\SKILL.md\n\n   细则按需打开，不要全部机械读完。\n   下面出现的 references\\ 和 templates\\ 都在**同一个 skill 目录**下，就是上面那个 adaptive-video-production：\n   　E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\skills\\adaptive-video-production\\\n   不要到规范根目录去找 templates\\ —— 根目录没有这个文件夹，找不到就别硬编一份格式。\n\n   · references\\prompt-and-performance.md —— 第 3 节「生图先分多视图参考卡与单幅首帧」、第 4 节「视频写变化、因果和结果」\n   · references\\reference-image-policy.md —— 选卡、参考图之间打架怎么取舍\n   · templates\\shared-card-prompts.md —— 共用卡制卡词的格式\n   · templates\\production-unit-card.md —— 单元卡的格式（程序就是照这个读的）\n\n   口径与第 5 步完全一致，不许自创另一套写法。第 5 步读到的是你交的成品，不是草稿。\n\n【对标拆解目录内，相对路径。目录路径在顶部第二行，不要自己去找】\n\n2. 02_开头拆解.md\n   ← 本段的对标证据全在这一份：首帧六要素、机位四档、逐段秒数与起止点。必须全文读。\n\n   **重点读 `1b）开头微段表`，逐行读，一格都不许跳。** 那是 0.2 秒一格的细账，\n   记着原片前几秒里\"每 0.2 秒新增了什么、消失了什么、手在哪、观众看到什么\"。\n   这张表是设计我们开头的唯一依据 —— 没有它，你只能看到\"他蹲着捡叶\"，\n   看不到\"地上一块砖在第 0.4 秒露出来\"。观众留的是后者，不是前者。\n\n   怎么用这张表（三步）：\n   ① 数出原片前 3 秒\"消失/减少\"发生了 N 次、分别在第几格 → 写进人读版\n   ② 挑出**必须保住的那 3–5 格**（少了这几格，观众就看不出\"在变干净\"）\n   ③ 其余格可以合并或省略，但**不许整体压缩成一句\"他在清理\"**\n\n   ⚠️ **`T_钩` 不是你的 `T`，两个别混：**\n   · `T_钩` 是**原片**的开头段有多长（拆解方判的，3–8 秒），只说明原片那一段有多长\n   · `T` 是**我们这条**的开头到哪里结束，**只认设定书第 2 节**，不许拿 T_钩 去替代\n   · 两者可能不等。差得多的时候，在交接里写一句「对标 T_钩 = X 秒，本版 T = Y 秒，差在 <哪一段>」\n\n   旧版的 `01_对标拆解\\05_可迁移生产合同.md` 已经没有任何一步产出它，不用找，也不要报\"缺这一项\"。\n\n【项目内，相对路径】\n\n3. 00_版本设定书.md\n   ← 这是唯一标准。T 值、骨架段数与每段秒数、锁死层、可换层、情绪节拍表、表面清单、七问结论、必须有/禁止有，全部在里面。\n   不许重算、不许调整、不许\"优化\"。缺节就停下来告诉我缺哪节。\n\n4. 输入\\ 里的对标开头图片包\n   按下面的配额看，看够就够：\n\n   ────────────────────────────────────────\n   看图配额｜不许多看，也不许少看\n   ────────────────────────────────────────\n   · `first_frame-001.jpg`：必看 1 张，它定第 0 秒的一切（机位、人占几成、袋在哪）\n   · `opening-001` 到 `opening-0NN`：15 张 **拼成 3 张联络表**（每张 5 格）看，不要逐张看\n   · `overview-NNN`：每 5 秒 1 张，同样拼联络表\n   · **合计读到的图不超过 8 张**（含联络表），内部分段一律照设定书 4.5，不靠看图\n   · 其余不用看，**也不用在交稿里写「未看 71 张」**——那不是缺口\n\n5. RC01_主角身份参考_v01.png（在项目根目录）\n   命名不固定，找项目根目录下 `RC01_` 开头的 png 就行（可能是 RC01_主角四视图_v01.png）。\n   有几份就打开哪一份，**同一个人只需认一次**。\n   必须实际打开看。只借脸和体型，不借衣服、不借背景、不借旧姿态。\n   一张都没有：**不要停**。制卡词不描述五官、只把身份图当父图，缺父图只卡出图、不卡写词。\n   照常把制卡词和 U01 写完，在交接里写一行「RC01 身份图：缺」，最后总结里列出来。\n   不要自己生成，也不要找替代。\n\n6. 不能撞车的三项（暴露物、拍摄位置、问题来源）\n   写在设定书第 6 节表面清单和第 8 节禁止有里，照那个执行。\n   不需要去翻同系列别的版本，设定书已经把禁项摘出来了。\n\n────────────────────────────────────────\n读到的凭证｜这一栏不写，这一版不收\n────────────────────────────────────────\n\n交稿时，文件最前面必须有这张表，一个要求读的文件占一行：\n\n| 文件 | 读到的 3 条事实（必须是这个文件里才有的，带数字或专名） |\n|---|---|\n| 00_版本设定书.md | ① T=? 秒 ② 骨架几段 ③ 第 5 节强度 3 落在哪一段 |\n| 02_开头拆解.md | ① 首帧时袋在哪 ② 机位几米、俯角多少 ③ 第 ③ 段几秒 |\n\n· 写「已阅读」「已完整读取」「已按 skill 执行」都不算，必须是事实。\n· 凑不出 3 条，就是没读进去：在产物里把这一份标成「未读成·原因…」，其余部分照做，\n  最后在总结里列出来。不许硬写、不许编，**也不要为一两份停掉整轮**。\n· **大文件（超过 20KB）必须分节读完再写这张表。** 只返回了开头一截预览的，\n  要么按 `##` 标题一段一段读，要么明确写「只读到第几节，后面没读到」——不许当成读完了。\n\n\n════════════════════════════════════════\n二、骨架照搬，不改\n════════════════════════════════════════\n\nT 值、骨架段数、每段秒数、核心机制，一律照 00_版本设定书.md 第 2、3、4 节。\n\nT 值 = 原片里\"人第一次接触要处理的东西\"的那一刻，取到那段动作结束。\n不是固定 13 秒，也不是固定 2.3 秒。校验：T ÷ 全片总时长应落在 12%–18%。\n　 **不落在区间时不许硬拉长。** 原片本身就是那个比例的（比如 3.1/28.9＝10.7%），\n　 就在设定书第 1 节写一句「T 占全片 X%，在 12%–18% 区间之外，按原片实际不硬拉长」，\n　 写明了就成立；没写明才算违规。等比缩放改不了这个比例，凑是凑不出来的。\n设定书已经算好了，你直接用，不要自己重算。\n\n核心机制照设定书。通常是：外部条件已经变了 → 人立刻处理暴露的东西 → 原位置留下一个需要改造的问题。\n\n不许增加解释镜头、表情镜头或额外段落。\n距离走不完，用原有切点吃掉路程，不延长各段。\n\n你如果认为骨架某处不成立，写进「待裁决」并给替代方案，不要静默改。\n\n\n════════════════════════════════════════\n二之二、开头只许「呈现问题」，一根手指都不许动工具\n════════════════════════════════════════\n\n**这是硬规则，违反了这一段的产出全部作废。**\n\n开头段（0–T）的功能只有一个：让观众看见问题有多严重、人有多难受。\n**它不承担任何改造工作。** 改造全部属于中间段。\n\n三条判据，逐条自查：\n\n**判据 1：开头段工序数必须为 0。**\n「工序」＝一次把问题物处理掉的操作（冲水、刷洗、铲除、拆卸、擦净、搬运、安装）。\n开头段里一次都不许有。\n工序叫法一律以 `19_工序词表.md` 为准，不许自己起名字（「冲地」不能写成「冲地缝」）。\n\n**判据 2：开头段不许出现任何工具。**\n高压水枪、硬毛刷、抹布、电钻、起子、梯子、漆桶、割灌机、独轮车、铲子、耙子……\n一样都不许入画，也不许出现在画面描述里。\n只允许出现「原片第 0 帧就已经在人手上的那个东西」（比如他正在往里塞叶子的那只袋子）。\n设定书里没写是原片第 0 帧道具的，一律按违规算。\n\n**判据 3：开头段问题物只许「不减少」。**\n· 允许：以手势/脚尖/鞋底压住、拨开、拢一下、把已经散开的归堆——**问题物总量没变**。\n· 只允许一处例外：原片第 0 帧人已经在做的那个动作（比如正在把叶塞进袋子），\n  它可以让问题物「局部减少」，但**减少量必须 ≤ 原片同一动作的减少量**。\n· **禁止：泥水被冲走、霉斑被刷掉、地面被擦干净、废料被搬走。**\n  这些是「问题物明显减少」，一出现就说明你把中间段的活提前干了。\n\n**为什么这条这么硬（真实事故，已抽象成通用情形）**\n真实出现过的一种错法：开头段在 3–4 秒里塞了 4 个镜头、3 个工序\n（捡叶 → 拢叶 → 冲地 → 刷墙），而原片同段只有 1 个镜头、1 个工序（一个动作到底）。\n后果：中间改造段的工序数掉到原片的 0.81、时长掉到 0.72，\n观众的感觉是「浅浅收拾了一下」，而不是「一条流水线干下来」。\n**这条不分片子：只要开头出现第二个工序，中间段就必然变薄。**\n\n**开头多干一个活，中间就少一个工序，观众就少一分「改造量」。**\n\n**写进「待裁决」的例外**\n如果原片开头本身就在大量施工（0 秒就在冲水／刷墙），那是母版特性，照抄即可；\n但必须在设定书第 1 节写一句「原片开头即含工序 X，本片照抄」。\n没写这一句就按违规算。\n\n\n════════════════════════════════════════\n三、初步思路：先判断，再采用\n════════════════════════════════════════\n\n设定书第 4 节写的是初步思路，不是已经批准的方案。\n\n你必须先判断它真实不真实、成立不成立。不成立就换，但不要自行改变骨架。\n\n判断标准看下一节七问。七问过不去，不要硬写，指出卡点，给出最接近的替代办法。\n\n\n════════════════════════════════════════\n四、每个替换项都过七问\n════════════════════════════════════════\n\n人物、场景、触发、暴露物、动作、转移方向，逐项检查，写出具体答案：\n\n1. 物理上真的会这样吗？距离和动作能否装进设定书的秒数？\n2. 他为什么这样做？生活动机是什么？\n3. 替换后，这一段原来要表达的意思还在吗？\n4. 住户事先知不知道？知道的话，为什么没有提前避开？\n5. 有没有更简单的办法他会先用？\n6. 反应力度合理吗？是否演过头？\n7. 有没有真人抱怨过这个问题？引用设定书里的具体来源；材料不足就标\"待核\"，不能编帖子、链接或验证结果。\n\n设定书第 7 节已经给过一轮七问结论，你可以在上面修订，但修订要写清改了什么、为什么。不能直接抄，也不能无视。\n\n一项怎么改都过不去，不要硬写，指出卡点。\n\n\n════════════════════════════════════════\n五、画面、动作、情绪\n════════════════════════════════════════\n\n【人物】\n只用 RC01 那张身份图里的主角。穿着照设定书第 6 节 C5。要换衣服先说明理由。\n没有儿童，没有宠物，没有多余的人，除非设定书明确要求。\n\n【场地】\n普通美国家庭独栋住宅。房屋、道具、门窗、地面状态确定后，全片保持一致。\n\n【机位】\n不能是路边车里，不能是车库里向外拍。\n必须核对主角能从画面左后方（或设定书写的方向）进入画面。\n\n【第 0 秒】\n外部条件必须正在打到暴露物上，两者同框，近处看得清。\n只拍\"已经湿了\"\"已经坏了\"\"已经脏了\"不算。\n\n【不能撞车】\n不能重复本系列已有版本的三项表面：暴露物、拍摄位置、问题来源。\n具体禁什么，照设定书第 6 节表面清单和第 8 节禁止有。\n\n【动作】\n正常偏快速度，连贯，以一把抓、一把抱、简单卷拢这类大动作为主。\n不写复杂手指操作，不要求道具发生复杂变形。\n最多一次皱眉，不演夸张表情。\n\n【情绪｜这一条必须写清，不许省】\n每段的情绪必须落到具体可见的东西上。设定书第 5 节已经给了五通道和强度，你照着填，不许增删通道。\n五个通道是：\n① 表情 / 视线\n② 身体动作与节奏（肩前倾、快步不跑、每步比平时大）\n③ 环境（天气、光线、地面湿痕、雨帘密度）\n④ 声音（脚步踩水、喘气、道具碰撞）\n⑤ 镜头语言（景别、是否固定、切点节奏）\n\n强度标尺：0 无｜1 微（停一下、看一眼）｜2 中（加快动作、皱眉一次）｜3 强（跑、喊、摔东西）。改造类原则上不上 3。\n\n硬红线两条：\n· 正文里禁止出现情绪形容词（着急、满意、心疼、无奈、紧张……）\n· 每条情绪至少落到 ②身体 或 ③环境 或 ④声音 之一；只靠 ①表情 一个通道承担的段落，不许提交，标出来交给我\n\n【画面质感】\n家庭手机随手拍：自然光、轻微手抖、有点乱、东西是用旧的。\n不要电影感、4K、网红滤镜、样板间。\n第一段固定机位，不运镜，只允许轻微手持抖动。\n\n【声音】\n照设定书第 5 节 ④声音 那一列，以及第 8 节里关于声音的禁止项。\n没有说话就明确写\"无对白\"，不编台词、不加字幕、不加音乐。\n\n\n════════════════════════════════════════\n六、检查与交付（确认前只交这三样）\n════════════════════════════════════════\n\n────────────────────────────────────────\n遇到下面这些情况，按这里判，不要问我\n────────────────────────────────────────\n\n这六种在本流程里一定会遇到，答案已经定死，你直接按这个写，不许拿它们来问我。\n\n| 情况 | 怎么判 |\n|---|---|\n| 开头一段里有好几刀 | **先算刀数再写卡，仍然只写一张 U01、不拆盒**。刀数＝生成秒 ÷ 2，生成秒＝T ÷ 0.867。0–11 秒 → 生成 13 秒 → **6–7 刀**；只写 4 刀就是每刀 2.75 秒以上，会傻站。每刀 1 个状态变化，多刀不等于超动作数 |\n| 某一刀动作多、最容易生成失败 | 不用问我。在交接里单列「全片最高风险这一刀」，并给出最小拆法（从第几秒切两段），只写不动 |\n| 我们的硬要求和原片细节打架（如第 0 秒起手点 vs 原片走三步） | **我们的硬要求优先**。第 0 秒必须\"外部条件正打在暴露物上\"；原片细节可以让，让掉的在对照表「为什么」里写一句 |\n| 设定书 4.5 记 1、对标表记 2 | **一律按 4.5**。对标表只作记录，不改、不引用、不影响产出 |\n| 设定书前后不一致（如 4.1 写\"身体朝画面外\"，4.5 写\"背身向里走\"） | **以 4.5 逐刀表为准**，按它写；在交接里记一句\"4.1 此处措辞与 4.5 冲突，已按 4.5 处理\"。**不许改设定书** |\n| 项目里 RC01 的文件名和指令写的不一样 | 找 `RC01_` 开头的 png 就行，不纠结名字；一张都没有才停下 |\n\n**除了上面六种，其他实质冲突才允许问我。** 问的时候一句话说清：哪两个文件、哪两句、你要我选什么。\n\n先做完七问，再做\"在这栋房子住了三年的美国房主\"逐秒挑刺：哪一秒不像真人会做的事、为什么。\n\n工具支持子代理就另开一个独立审查者。不支持就明说这是自己换视角复查，不要声称有独立审查。\n\n写清采纳了哪些意见、没采纳哪些、理由是什么。\n\n【交付零：开头方案（人读版）—— 放最前面，不超过 250 字，不许放表格】\n\n  用白话说清五件事，我要能一眼看懂这条开头打算怎么拍：\n    · 几秒、几个镜头、要不要一镜到底\n    · 画面上在发生什么（一句话）\n    · 机位：高度几米、明显俯视还是平视、焦段、人占画面几成\n    · 那一个动作：起点状态 → 终点状态\n    · 我们和原片哪里不一样（主角是一个压抑的男性，正脸和表情怎么给）\n\n  这一节不是替代下面三样，是让我先看懂、再看表。白话，先结论，少术语。\n\n【交付零：开头_人读版.md】\n五块、≤600 字、大白话。格式见 `38_人读版_统一格式_20261027.md`。\n第三块写「原片 vs 我们」：首帧、机位四件套、第 1 秒，逐项并排，第三栏用 同／删／换／加。\n\n**⚠ `开头交接.md` 必须覆盖 `开头方案_有效.md` 的这七项**，缺一项下游就要来问你：\n① T 值与段边界 ② T 秒末态十项键值（逐字对齐设定书 §4.1）③ 旁白逐字与时间\n④ 主视点锚点 ⑤ 不可改动作 ⑥ 首个反应 ⑦ 首帧六要素\n（2026-10-27：小分镜只读交接、不读方案。交接漏项＝信息遗落。）\n\n【交付一：新旧逐秒对照表】\n行是维度，列是原片/新片/比对。按这十二行写：\n画面内容、外部条件、暴露物、入出镜、镜头、耗时、动作、**动作数**、力度、这段要表达的意思、声音、原位置留下的问题。\n\n「动作数」= 这一段里有几次状态变化（从 X 变成 Y）。\n原片开头段几乎每镜都是 0 或 1；新片如果比原片多，先怀疑是自己加了步骤，不是原片本来就有。\n\n表头：\n| 维度 | 原片 | 新片 | 变/不变 | 结构是否一致 | 情绪是否一致 | 为什么 |\n\n【交付二：必须有 / 禁止有 清单】\n场景必须有 / 场景禁止有 / 人物必须有 / 人物禁止有，四块分开写。\n设定书第 8 节有草稿，在上面补全或修订。\n\n【交付三：七问逐条答案】\n每条写具体答案，不写\"已检查\"\"没问题\"。\n\n【重点回答这四个】\n1. 第 0 秒外部条件是否正打在暴露物上？\n2. 原位置的痛点是否还在？\n3. 三项表面是否都避开了已有版本？\n4. T ÷ 全片总时长是否落在 12%–18%？不在就写清为什么（原片本身如此／选源例外），不许硬拉长。\n\n白话，先说结论，少用术语。不用\"情绪原型\"\"变量层\"这类词。\n\n\n════════════════════════════════════════\n七、确认后保存\n════════════════════════════════════════\n\n我说\"确认\"之后，只在这五个位置写：\n\n1. 开头\\开头方案_有效.md\n   逐段表，每段一行：\n   段 / 秒 / 画面 / **那一个动作** / 动作数 / 情绪名 / 强度 0–3 / 载体（①②③④⑤里哪几个）/ 旁白原文 / 字幕分词\n\n   「那一个动作」只许一句话、不超过 40 字：谁把什么怎么动、变成什么状态。\n   出现\"先…再…然后…接着\"就是写了第二个动作，删到只剩一个。\n   「动作数」只能是 0 或 1；而且必须与设定书 4.5 节同一段的数字一致，对不上就是错。\n\n   另加两块：\n   · 「0.0 秒画面里有什么」\n   · 「T 秒末态十项键值」—— 与设定书第 4.1 节逐项对齐，不许改值\n\n2. 开头\\开头交接.md\n   T 值 / T 秒末态十项键值 / 旁白逐字与时间 / 主视点锚点 / 不可改动作 / 首个反应 / 未决项 / 媒体状态\n   另加一节「提示词包」，写四样：\n   · 共用卡制卡词在 **共用卡制卡词.md**（版本根目录，不是 开头\\）\n   · 开头单元卡在 **单元\\U01.md**\n   · U01 生成几秒（＝T÷0.867 取整）、**装几刀（＝生成秒÷2）**、完整 Prompt 字符数\n   · 用了几张参考图、够不够图生视频那张数上限（实测只让传 4 张）\n   这一节是第 5 步的接手指针，路径写错他就读不到。\n\n3. 开头\\任务记录.md\n   来源、纠正、版本。改一版另存 v2、v3，不覆盖旧版。\n\n4. 共用卡制卡词.md（版本根目录，和 00_版本设定书.md 同级，不是放在 开头\\）\n   照 templates\\shared-card-prompts.md 的格式，只放 RC 章节，别的说明一律不写进来。\n   主角参考卡是**一张卡里放四个视图**（正面 / 3-4 侧 / 侧面 / 背影），\n   不是四张卡、每张一个角度。拆成四张就是白烧三次生图积分，\n   而且四张之间的脸还会互相对不上，越拆越不像同一个人。\n   同一张卡里：同一人物、同一光线、同一衣着、纯色背景。只借 RC01 的脸和体型，\n   不借旧衣服、不借背景、不借道具。\n   写正文时要明说\"这一张里并排给出正面、3-4 侧、侧面、背影四个视图，同一阶段的不同视角，不是动作先后\"。\n   每张卡写全四行：生产状态 / 父图 / 输出文件名与参数 / 完整中文制卡正文。\n   验收清单和参考图职责说明写进 说明\\共用卡说明.md，不要混进制卡词。\n   这张卡是全片所有单元共用的，不是只给开头用，路径不许自己改。\n\n5. 单元\\U01.md\n   照 templates\\production-unit-card.md 的格式：标题 ＋ 五行头部 ＋ 唯一「## 拼好的完整正文」text 块。\n   必须分开写两块：\n   · 图提示词：这一单元的首帧，静态画面描述\n   · 视频提示词：写变化、因果和结果，不写静态画面描述\n\n   **视频提示词必须逐刀写，不许写成一段连续描述。**（2026-10-27 写死。\n   以前没卡这一条，开头交出来的是\"他蹲着把叶子往袋里塞，然后把袋子拖到路边\"这种一段话，\n   模型照着拍成一条长镜头，刀数、景别、切点全丢了。）\n   每一刀单独一小段，四样齐全，缺一样算没写完：\n   ① 镜头N（时长 X 秒｜景别：近景/中景/全景｜高度 X.XX m｜俯仰 X°｜焦段）\n   ② 起点状态：画面里**看得见的物件**在哪、什么姿态（不写\"已经装好\"这类说明句）\n   ③ 那一个动作：谁把什么怎么动 → 变成什么状态（一句话 ≤40 字，不出现\"先…再…然后\"）\n   ④ 终点状态：这一刀结束时画面上多了什么／少了什么／位置变了什么\n   每两刀之间**单独一行**写，一个字都不许省：\n   ⚠️硬切至镜头N：一帧完成，不许推拉、不许摇、不许渐变、不许叠化、不许闪白\n\n   硬约束：\n   · 中文提示词；英文旁白逐字照抄设定书，不许翻译、不许改词\n   · 完整 Prompt ≤ 4096 字符，按保守的 CRLF / UTF16 算，不是按纯字符数算\n   · 视频参考图 ≤ 4 张\n   · 模型与参数：Seedance 2.0 Mini｜9:16｜480P｜声音开｜单段 **4–15 秒**。\n     U01 按 T÷0.867 定秒数，**不硬凑 13–15**——开头段本来就短，凑满等于加内容。\n     后半段 U02 起才按 13–15 秒装满装 6–7 刀（那一步的规则不在本文件）。\n   · 正文里不许出现情绪形容词（着急、满意、心疼、无奈、紧张……）\n   · 每条情绪至少落到 ②身体 / ③环境 / ④声音 之一；\n     只靠 ①表情 一个通道承担情绪的，不许直接定稿，标出来交给我\n   · **机位四件套，四项全写，缺一项就是没写完：**\n     ① 高度：离地多少米（写数字，不写\"略高\"\"偏低\"）\n     ② 俯仰：俯视 / 平视 / 仰视，加一句\"能看到什么\"当证据\n     　　（俯视＝能看到他的头顶和身后的地面；平视＝只看到侧脸和背景；仰视＝看到廊顶或天空占大半）\n     ③ 焦段：广角 / 标准 / 中长焦。广角的证据是\"纵深强、近大远小、边缘有透视拉伸\"\n     ④ 人物占比：人占画面高度的几分之几（如\"约 1/2\"\"约 2/3\"）\n     开头这两镜最容易丢掉第③④项，而这两项正是\"站在旁边看\"和\"趴在地上看\"的分界。\n   · **动作数：每一刀最多一个状态变化。**\n     判断标准是\"从什么变成什么\"：叶子从地上到袋里＝1 个，不管手伸了几次。\n     同一个动作重复（捡、压、捡、压）属于一个动作，可以写；\n     出现第二个不同动作（捡完叶子去推架子、装完袋去拧螺丝）就是超了。\n     超的是\"同一刀里塞两个不同动作\"，那种才要拆，不许自己加时长解决。\n   · **刀数不是\"原片几刀就几刀\"，是除出来的：生成秒 ÷ 2。**（2026-10-27 定稿，全项目统一）\n     U01 的生成秒 ＝ T ÷ 0.867，取整数（T 是成片秒，见设定书第 2 节）。查表：\n     　T 4–6 秒 → 生成 5–7 秒 → **2–3 刀**\n     　T 7–9 秒 → 生成 8–10 秒 → **4–5 刀**\n     　T 10–11 秒 → 生成 12–13 秒 → **6 刀**\n     　T 12–13 秒 → 生成 14–15 秒 → **7 刀**\n     算出来低于 4 秒的按平台下限写 4 秒；超过 15 秒的回头找设定书，**不许自己加长**。\n     **开头 11 秒只写 4 刀，等于每刀 2.75 秒以上——那一刀里的活 1 秒就干完，\n     剩下 1.7 秒模型只能站着、直起腰、走两步。这就是\"傻站\"的来源。**\n     实测（2026-10-27 三条片子逐帧复核，共 13 刀）：**刀 ≤2.6 秒 6/6 切点干净；\n     刀 ≥2.8 秒 7 刀里只有 1 刀切点干净**，其余 4 刀全废、2 刀半废。\n     **\"切点干净\"只指没有过渡帧、机位不漂，不等于刀里有活**——T7 六刀 1.33–2.71 秒，五个切点全干净，\n     刀里没活的地方照样静止，废的总时长 3.7 秒。\n     阿初自己的 15 秒组是 2/2/2/3/5/1，平均 2 秒一个镜头（L4527–4529、L4550）。\n     **单刀不许短于 1 秒**——阿初那组里最短的一刀就是 1 秒。\n     0.5 秒的刀演不完\"抬头＋皱眉＋捏杂志\"，模型只会挑一个做，剩下全丢。\n     **时间轴必须从 0.0 秒铺到最后一秒，一秒都不许留空。**\n     生成 6 秒就要写到 6.0 秒；只写到 5.0 秒的，剩下那 1 秒模型自己编，\n     编出来的全是走位和静止，全要剪掉。\n\n   · **相邻两刀景别必须真的不同（近景 ↔ 中景 ↔ 全景）。**\n     只挪机位、不换景别的\"切\"，观众看不见，模型也看不见，它会当成一条连续长镜头演下去\n     （实测：近景 0.55 m → 全景 1.45 m 一帧切干净；同景别只挪机位，机位会漂成跟拍）。\n     开头要多刀又不许加工序，办法是**换景别看同一件事的不同局部**：\n     近景袋口／全景他在叶堆里／近景压叶的手／全景原位置剩下的那一摊。\n     每刀状态变化仍然只有 0 或 1，问题物仍然不许减少（第二之二节判据 3 不变）。\n\n   · **每一刀都要能\"演满\"：从头到尾手上一直有一件事在做。**\n     只够 0.8 秒活的事，不要给它 2 秒——并进邻居，或把动作写成有起点终点的连续动作\n     （\"从板的一头推到另一头\"），不写\"推正一下\"。\n     实测（T7 六刀 1.33–2.71 秒）：5 个切点全干净，走位彻底没了；但刀里没活干的地方\n     照样静止，废的总时长 3.7 秒，和旧版走位差不多。\n     **短刀只是把\"走位\"换成\"静止\"，不会自己消灭废动作。**\n\n   · **每一刀要的状态，上一刀必须给过。三种合法出口，选一个写进交接：**\n     A 上一刀画面里已经看见（不用跳）／B 这一刀自己演得完／C 结果镜头重新起手\n     （切进来就是一个静态的、已经完成的新画面，人在画面里是静的、不用走一步）。\n     第四种不合法：要求一个\"中间省略了大量工作\"的状态，入口还延续上一刀的人——模型必然用走位填。\n     真实事故：第 3 刀要求\"桥面已铺满\"，上一刀只演了一块板，模型**让他抱着一根长木条站在空桥上**，\n     这一刀整废 3.5 秒。另：**不许设计\"只拍腰以下\"的近景**，实测两次都失败（模型不会\"一进来只有腿\"）。\n\n   · **状态要用画面里看得见的物件证明，不许用说明句。**\n     写「起手：他双手拿着一块竖条栏板，远端还斜着翘在外面」，\n     不写「其他栏板都已装好，只剩手里这一块」。实测：后一句模型只执行了前半句，\n     把画面画成完工状态，手里那块板直接丢掉，整刀空转 2.2 秒。**用解释代替证据，等于没写。**\n\n   · **位移刀（人带着东西从画面一头走到另一头）必须拆成两条生成**：\n     起手镜头（人在起点把东西拿起）＋落点镜头（人已在终点把东西放下），中间那段路不生成。\n     理由：模型记不住人物手里拿着的东西，人一走远、画面里一变小，手里的物件就消失\n     （同一件事试了 5 次，前 4 次改措辞和时长全败，第 5 次 8 秒给足照样消失）。\n     落点镜头写「车已经停在他脚边、车斗里装着一个墩」，不解释来路。\n     空手位移可以一条，但要写「不推不拉不摇不跟」，移动距离不超过画面高度的三分之一。\n\n   · **时长必须是整数（4、5、6…15）。** 网站不认小数点，4.5 这种提交不上去。\n     取整后成片会多出一点余量，是正常的。\n   · **U01 取用率目标 87%，不是 100%**（生成 T÷0.867、成片 T）。\n     剪掉的那 13% 是节奏剪切，不是\"人物白走 3 秒\"。\n   · 不许自己加长\n\n   U01 是开头段的定稿单元，不是草稿。第 5 步从 U02 开始划，\n   不许重写 U01，也不许重写共用卡；要并入后面单元，只许加后缀，不许改正文。\n\n只写 开头\\ 及其子目录，加上版本根目录的 共用卡制卡词.md、单元\\U01.md。\n别的一律不碰（00_版本设定书.md 只读不改）。\n不生成图、不生成视频、不跑导入器、不付费。\n\n\n════════════════════════════════════════\n最后只回四样\n════════════════════════════════════════\n\n1. 五个文件的路径\n2. T 秒末态十项键值\n3. U01 的生成秒、**刀数（生成秒÷2）**、完整 Prompt 字符数、参考图张数\n4. 必须我决定的问题（没有就写\"无\"）\n\n════════════════════════════════════════\n交完之后\n════════════════════════════════════════\n\n全部产出落盘后，最后一行写这句话：\n「这一段的文件都在 <完整路径>。请运行 python \"E:\\智线出海内容运营\\09 工具\\Pipeline.py\" 查 开头 --版本 <本版本目录> 检查一遍。」\n\n然后交**两张图**，都用绝对路径。\n\n【图一 · 结论图】自己跑（不用我跑，你有执行权限）：\n    python \"E:\\智线出海内容运营\\09 工具\\体检.py\" \"<本版本目录>\"\n→ 生成 `_验收\\体检单.png`：六行，绿=过、红=卡住、灰=还没做。\n\n【图二 · 过程图】这一段的专业图，我要看它判断完成度：\n    python \"E:\\智线出海内容运营\\09 工具\\看板_环节.py\" --stage 开头 --mode seq --ref \"<对标第1镜秒数:第2镜秒数>\" --ref-lbl \"<对标各镜景别>\" --ours \"<我们各镜:秒数>\" --ours-lbl \"<我们各镜景别>\" --out \"<本版本目录>\\_验收\\看板_开头.png\"\n→ 存到 `<本版本目录>\\_验收\\看板_开头.png`\n\n两张都贴出来，不要贴文字、不要贴退出码。后面只写一句：**这一段过没过**；\n没过就补一句「卡在第几段 + 那一行写的原因」。\n不许自己声称\"已通过\"——以图为准。我只看图。\n\n【路径速查｜都是本机绝对路径，不要改成相对路径】\n· 工具目录：       E:\\智线出海内容运营\\09 工具\\\n· 结论图：         E:\\智线出海内容运营\\09 工具\\体检.py\n· 总闸门：         E:\\智线出海内容运营\\09 工具\\Pipeline.py\n· 过程图（环节）： E:\\智线出海内容运营\\09 工具\\看板_环节.py\n· 过程图（成片）： E:\\智线出海内容运营\\09 工具\\看板_对比.py\n· 项目根目录：     E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\\n· 本段产物：       <版本文件夹>\\\n· 规范目录：       E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\\n\n\n════════════════════════════════════════\n★ 人读版（每个环节都要交，缺了不算交稿）\n════════════════════════════════════════\n\n除了上面给 AI 看的详细文档，**另交一份 `开头_人读版.md`**：\n五块、一页纸、不超过 600 字、大白话。格式见 `38_人读版_统一格式_20261027.md`。\n\n```\n## 一、一句话          这条片子讲的是……\n## 二、我是怎么想的     3–5 条，每条一行，说清为什么这么定\n## 三、原片 vs 我们（首帧、机位四件套、第 1 秒，逐项并排）\n## 四、我删了什么、加了什么   各 1–3 条，带一句为什么\n## 五、这一版你最该盯的一处   必须写真话，不许写\"整体没问题\"\n```\n\n第三块的对比，第三栏一律用四个字开头：**同／删／换／加**\n（借阿初的办法：并排播放时「原片放、我的黑屏」＝我删了；「我的放、原片黑屏」＝我加了。L962–964）\n\n**人只审人读版。** 详细文档机器检查，人读版人看方向；人读版方向不对直接打回。\n", "4": "════════════════════════════════════════\n只改下面这两行。其他一个字都不用动。\n════════════════════════════════════════\n\n版本文件夹：<粘贴 V0x_短名 的完整路径，形如 …\\<项目总文件夹>\\02_复刻\\V01_短名>\n对标拆解目录：<粘贴 …\\<项目总文件夹>\\01_拆解 的完整路径>\n\n下面所有文件都按两种方式给出：\n· 版本内文件 → 相对路径，直接接在上面「版本文件夹」那行后面\n· 对标文件 → 相对路径，直接接在「对标拆解目录」那行后面\n· 全局文件（skill）→ 路径固定，永远不用改\n\n**不要自己去 06_制作对话与决策 下翻项目找编号。** 上面两行已经给全了，直接进那两个目录读文件。\n目录打不开再申请授权；仍然打不开，明确写\"缺这一项\"，不许假装读过，不许按文件名编内容，也不要让我复制粘贴给你。\n\n【读什么、读到什么程度｜五段通用，细则见 18_读什么读到什么程度_五段通用.md】\n\n【读到的证明｜硬规定，不交这一节视为没读】\n开工前我会贴给你一张「抽问单」：从你必读的文件里随机抽出来的几句话。\n交付物的**第一节**必须叫「读到的原文」，把抽问单里每一句**一字不改**抄进去。\n· 抄不出、改写、概括、只写「已阅读」——一律算没读到，这一版直接打回，不许往下做。\n· 抄错一个字也算没过。原样就是原样，没有「大意对」这种说法。\n· 机制和用法见 20_读到的证明_抽查机制.md\n\n\n每份输入先归四类，按类执行，不许自己另定标准：\n· A 逐条用 —— 每一条都会变成一个产出字段 → 分节读完，一条不许跳\n· B 通读取法 —— 是方法/规范/格式，不是数据 → 全读，掌握硬约束\n· C 配额抽样 —— 连续重复的图/帧 → 按配额看够，其余不看也不报「未看」\n· D 不读 —— 结论已逐条抄进某个 A 类文件 → 不读，也不许报「缺这一项」\n\n图片配额（C 类｜这几段读的是已经抽好的图，不用自己抽）：\n· first_frame：1 张\n· opening：15 张 → 拼成 3 张联络表（每张 5 格）再看，**不要逐张看**\n· overview：每 5 秒 1 张，同样拼成联络表\n· **合计读到的图不超过 8 张**（含联络表）。超过就说明你在逐张看，停下来重拼\n\n分段不靠看图：\n· ② 复刻的分段依据是 `01_拆解\\03_整片拆解.md` 的逐段表，不是图\n· ③④⑤ 的分段依据是 `00_版本设定书.md` 第 4.5 节逐刀表（精确到毫秒），也不是图\n· **禁止「做逐段表就每秒一张全看」这种读法。** 分段不靠眼睛，靠已经定死的表\n· 只有两种情况才回看单帧原图：① 要写「状态变化」但联络表看不清；② 位移刀或结尾验证段\n· 回看额度 6 张\n\n拼联络表：`ffmpeg -i <原片> -vf \"select='eq(n,0)+eq(n,5)+...',scale=360:-1,tile=5x1\" -frames:v 1 sheet_%02d.jpg`\n\n大文件（>20KB）：按 `##` 切，一次读 1–3 节，全部读完才算读过。只拿到开头一截预览的，\n重读两次仍不全的，**不要在对话里停下来问我**：在产物里把那一节标成\n「只读到第 X 节，缺 <内容>，导致 <哪几个字段> 填不了」，然后继续往下做。\n**A/B/C 类缺一项不许开工，只有 D 类可以不读继续。** 禁止把「只读到第 3 节」写成「已完整读取」。\n\n────────────────────────────────────────\n零提问 ＋ 回复纪律（比读法更硬）\n────────────────────────────────────────\n\n我只会发给你「指令 ＋ 路径」，缺什么自己按默认处理，**不许拿来问我**：\n· 上游文件不存在 → 产物里标「缺 <文件名>，影响 <哪几项>」，能做的那部分照做\n· 图看不清 → 标「依据不清·待补」，不许靠经验编\n· 数值打架 → 按本文件已写死的优先级判，判完在产物里记一句\n只有「上游核心文件整份读不到」才允许停下来。\n\n对话里只许出现两样东西：第N步完成那一行 ＋ 最后的交付总结。\n**禁止在对话里输出** <analysis>、<summary>、思考过程、自我复述、\n「我先看一下」「现在开始读」这类旁白。单次回复不超过 15 行，长内容写进文件。\n\n每改完或新建一个文件，立刻回一行「第N步完成：文件名」，不要攒到最后一起说。\n\n\n\n════════════════════════════════════════\n你要做什么\n════════════════════════════════════════\n\n用 skill `full-storyboard-design`，依据已锁定的开头和 00_版本设定书.md，一次完成从 T 秒到结尾的完整小分镜。\n\n全程用中文。我要的是能直接接入下一阶段的完整结果，不是骨架、局部样段、研究报告或中间过程汇报。\n\n本轮只做小分镜。不写生图提示词，不写视频提示词，不划生产单元，不决定拆成几段生成、要不要首帧。那些归下一步的 adaptive-video-production。\n\n\n════════════════════════════════════════\n一、先接手，不让我重新搬运信息\n════════════════════════════════════════\n\n【全局固定路径，不用改】\n\n1. skill 全文，必须按其中的完整小分镜要求执行，不能只参考名称：\n   E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\skills\\full-storyboard-design\\SKILL.md\n\n2. 本项目拆解目录（就是上面第二行那个）：\n   <项目总文件夹>\\01_拆解\\\n   路径已写在顶部第二行，直接进那个目录，不要在这里翻编号。\n\n【项目内，相对路径】\n\n3. 00_版本设定书.md\n   ← 唯一标准。重点读第 2 节 T 值、第 3 节骨架主表、第 4 节本版逐段表、第 4.1 节 T 秒末态十项键值、第 5 节情绪节拍表、第 10 节交付契约。\n\n4. 开头\\开头交接.md\n   存在 → 读来核对末态。\n   不存在 → 以设定书第 4.1 节十项键值为准，并在交接里注明\"开头未交稿，按设定书规划\"。\n\n5. 对标整片拆解 03_整片拆解.md\n   ← 在顶部第二行那个「对标拆解目录」里，直接读。\n   逐段状态变化、动作数、位移从这里来。必须读。\n   旧版的 `01_对标拆解\\05_可迁移生产合同.md` 已经没有任何一步产出它，不用找，也不要报\"缺这一项\"。\n   设定书第 3 行那句「下游不许回头读拆解」，指的是**不许回读它做设计决策**；\n   这一份是动作预算的基准（要算步/秒），属于例外，必须读。\n\n5b. 01_微调大纲.md（版本根目录）\n   ← **必读，只读第 2 节「大纲」。**\n   设定书给你「从 X 变成 Y」的状态键值；大纲给你**同一处的白话描述**——\n   「她一手死死抓住旁边那根钢索，另一只手把孩子按在怀里，她没有喊，只是喘」。\n   **你的每一刀，动作从设定书 4.5 来，质感从大纲来。** 只读设定书，写出来是干的。\n   第 0/1/3 节是给人看的，略过。\n\n6. 输入\\ 里的对标原片、截图、字幕或转写\n\n7. RC01_主角身份参考_v01.png（在项目根目录）\n   只借身份，不借旧衣着、不借背景、不借道具、不借姿态。本次实际穿着照设定书第 6 节 C5。\n\n8. 同项目已有分镜（有就接续，不重做已认可内容）\n\n────────────────────────────────────────\n读到的凭证｜这一栏不写，这一版不收\n────────────────────────────────────────\n\n交稿时，文件最前面必须有这张表，一个要求读的文件占一行：\n\n| 文件 | 读到的 3 条事实（必须是这个文件里才有的，带数字或专名） |\n|---|---|\n| 00_版本设定书.md | ① T=? 秒 ② 骨架几段 ③ 第 5 节强度 3 落在哪一段 |\n| 03_整片拆解.md | ① 后半段几段 ② 动作数合计多少 ③ 最长那一镜几秒 |\n\n· 写「已阅读」「已完整读取」「已按 skill 执行」都不算，必须是事实。\n· 凑不出 3 条，就是没读进去：在产物里把这一份标成「未读成·原因…」，其余部分照做，\n  最后在总结里列出来。不许硬写、不许编，**也不要为一两份停掉整轮**。\n· **大文件（超过 20KB）必须分节读完再写这张表。** 只返回了开头一截预览的，\n  要么按 `##` 标题一段一段读，要么明确写「只读到第几节，后面没读到」——不许当成读完了。\n\n**哪些必须全读、哪些可以不读，按这个分：**\n\n| 类别 | 文件 | 怎么处理 |\n|---|---|---|\n| **必须全读** | `00_版本设定书.md`（约 38KB）、`03_整片拆解.md` | 分节读完，一节能都不许跳 |\n| **必须看，有配额** | `输入\\` 里的图 | 按下面「看图配额」拼联络表，**总数不超过 8 张** |\n| **必须全读** | 同批次 `01_微调大纲.md`（约 6–15KB） | **2026-10-27 改为必读。** 它是**动作细节的唯一来源**——设定书第 4 节只写「从 X 变成 Y」这种状态键值，装不下「她一手死死抓住那根钢索，另一只手把孩子按在怀里，她没有喊，只是喘」这种话。**只读设定书，你写出来的每一刀都会是干的。** 读法：只读「第 2 节 大纲」那一块，第 0/1/3 节是给人看的，可以略过 |\n| **不必读** | 同批次 `01_复刻_人读版.md`、`01_拆解_人读版.md` | 给人看的，不是本段输入。不用读，也不要在交稿里报「未全读」 |\n\n────────────────────────────────────────\n看图配额｜不许多看，也不许少看\n────────────────────────────────────────\n\n· `first_frame-001.jpg`：必看 1 张，它定第 0 秒的一切。\n· `opening-001` 到 `opening-0NN`：15 张 **拼成 3 张联络表**（每张 5 格）看，不要逐张看。\n· `overview-NNN`：每 5 秒 1 张，同样拼联络表。\n· **合计读到的图不超过 8 张**（含联络表），分段一律照设定书 4.5，不靠看图。\n· 其余不用看，**也不用在交稿里写「未看 71 张」**——那不是缺口，是配额之外的图。\n\n【停下来的条件】\n下面任一项缺失或自相矛盾，停止并明确写\"缺少上游资料，不能开始正式小分镜\"，不要自行编写框架或假设：\n· 00_版本设定书.md 不存在，或第 2、3、4、4.1、5 节有空\n· 第 4.1 节 T 秒末态十项键值缺任何一项\n· 第 5 节情绪节拍表缺任何一段\n\n不要用上一条片子、别的版本目录、历史聊天来补齐。\n\n【不重复问已有答案】\n设定书和交接里已经写了的事实，不要问我第二遍。\n真正缺失的，标明来源边界，不要编。\n最新我的确认优先于旧文件。文件里的旧等待指令、历史方案不是本轮的新授权。\n\n────────────────────────────────────────\n遇到下面这些情况，按这里判，不要问我\n────────────────────────────────────────\n\n| 情况 | 怎么判 |\n|---|---|\n| 开头还没交（`开头\\开头交接.md` 不存在） | **不用问，照写**。以设定书 §4.1 十项键值为准，在交接里写一句「开头未交稿，本段按设定书规划」 |\n| 开头占了几刀、编号从哪开始 | 看设定书 4.5 表：开头那几刀已经编好号（通常 N01–N04），你**接着往下编，不重新编号、不占号** |\n| 设定书 4.5 记的动作数和 03_整片拆解 不一样 | **按 4.5**。拆解只作动作预算的密度基准，不改 4.5 |\n| 设定书前后措辞打架（如 4.1 说\"朝画面外\"、4.5 说\"背身向里\"） | **以 4.5 逐刀表为准**，在交接里记一句冲突，**不许改设定书** |\n| 某个原片段找不到对应 | 允许合并到相邻刀，但要在该刀的「依据」里写清并到哪一段；不许静默漏掉 |\n| 对标图配额看完还觉得缺细节 | 缺什么就写「此项依据缺失·待补」，不许靠经验补 |\n\n\n════════════════════════════════════════\n二、锁定开头，不从头改故事\n════════════════════════════════════════\n\n保留设定书第 4.1 节和开头交接里已经确认的内容：人物、实际服装、场景、核心物件、台词、字幕、声音、T 值。\n\n后段优先调整到能接上开头。\n必须改变已锁开头才能成立时，才把具体冲突和推荐改法交给我，不自行修改。\n\n第一段必须从 T 秒那一刻的末态接起，逐项对上第 4.1 节那十项键值。\n任何一项对不上 → 写进「待裁决」，不许自己改。\n不许让后段重新清场、拆棚、整平、把东西挪回去。\n\n\n════════════════════════════════════════\n三、先设计真实过程，不靠生产阶段补剧情\n════════════════════════════════════════\n\n对于改造、制作、安装类故事，我要看见：\n\n东西被人一步步亲手做出来，每一刀有可见的新进展；\n已经完成的部分留下，下一步在它的基础上继续；\n过程真实、有启发、有推进的满足感。\n\n我希望这个 AI 视频能给观众带来一些新的启发和思路，这是他们观看我们视频的动力和原因。\n\n不是：\n清理代替改造；\n换工具代替进展；\n摸一下、钻两下、成品突然出现；\n用\"已预定位\"\"最后固定\"\"安装完成\"省掉核心制造；\n为显得复杂而堆重复动作、假困难或废镜头。\n\n先在内部写清：\n材料/部件 → 加工 → 对位 → 连接 → 结构形成 → 外观完成 → 安装/调校 → 实际使用。\n不是每条故事都机械包含这些步骤，而是选出本项目真实必要的变化。\n\n每个关键变化都写出：\n起始状态、谁接触什么、具体动作、可见结果、结果如何保留到下一镜、观众为什么值得看这一刀。\n\n首次关键工序要看清因果；相同工序可用同机位跳剪压缩。\n每一刀多一样东西，或解决一个真实问题，完成的不变回去。\n\n动作按正常速度设计。剪辑可以省准备、走路和同类重复，\n不能用超人动作、穿模或凭空出现来压时长。\n不要用\"延时摄影/快进\"代替具体动作设计。\n\n如果连续动作需要压缩，必须写清：删掉了什么重复劳动、保留了什么首次接触、状态变化、功能证据和情绪停留。\n不能笼统写\"快速完成\"。\n\n\n════════════════════════════════════════\n四、真实资料校准与创作分工\n════════════════════════════════════════\n\n需要施工或机械知识时，优先找原施工者记录、厂家资料等第一手来源。\n\n真实资料负责校准：部件关系、工序先后、接触方式、支承和检查。\n创作负责：选哪些有效动作、怎样拍、怎样剪、怎样形成情绪和观看回报。\n\n不要混拼不相容的施工体系，不凭脑洞发明机械机理。\n也不要把现实工程认证变成 AI 故事设计的无限前置。\n\n与已锁可见外观相容的隐藏结构、布局和具体工艺，可以选定有依据的创作方案，\n但必须标为\"创作新增\"，不能冒称原图已有、我已确认或工程已认证。\n\n不要把\"选择相符体系\"留给生产总控随机填写。\n要写出本稿推荐的一套具体关系和动作。\n真正与已锁内容冲突的部分，才列为需要我裁决的未决项。\n\n\n════════════════════════════════════════\n五、结尾必须验证，并回到完成生活状态\n════════════════════════════════════════\n\n先回查对标：结尾验证/受益者使用段从哪里开始、哪里结束、用了多少时间、分几刀、谁做什么、实际证明了什么。\n\n区分安装调校、功能验证、庆祝和生活回报。\n不能把庆祝全部算成功能验证，也不能夸大原片没证明的效果。\n\n给一个简明对照：\n原片入出点/时长/动作/证明内容 → 本片对应动作/时长/证明内容。\n\n本片验证段优先与对标的有效观看时长对齐。\n需要增加时长时，说明新增了哪项必要证据，不能只说\"更完整所以更长\"。\n\n同一个受益者要回到同一处已完成空间，实际操作或重新做原来的生活动作。\n操作 → 结果 → 正常使用/自然反应，要有可读时间。\n\n结尾必须同时兑现三件事：\n· 开头的问题确实解决\n· 完成后的空间或物件值得欣赏，漂亮变化有施工来处\n· 同一个人真正使用成果，生活继续\n\n不能只有成品空镜、几秒展示或字幕宣布成功。\n不能移走问题物件、换机位或换场景作弊。\n不要照搬对标作者无关的宠物、家庭成员或私人经历。\n\n**这四行必须逐项填，填「缺」的就要进下面的待裁决表，不许悄悄放过：**\n\n| 项 | 对标 | 本片 | 差在哪 |\n|---|---|---|---|\n| 入点／出点／时长／刀数 | | | |\n| 对照物（问题源）到末镜还在不在 | | | |\n| 使用兑现（谁／在哪／什么动作／几秒） | | | |\n| 状态 | — | 已兑现 / **缺** | |\n\n**末镜三件事，缺一件这一版不许交：**\n· 末镜时长 ≥ 对标末镜 ×0.9\n· 末镜不许完全静止（要有推进、拉远、光变或人在动）\n· 末帧比首帧亮（Δ YAVG ≥ +5%；要更暗必须报我理由）\n\n════════════════════════════════════════\n五之一、工序守恒：中间段不许被两头抽空\n════════════════════════════════════════\n\n设定书第 9 节表 B 是「工序清单」，表 A 里有「中间段工序比」。\n你写分镜的时候，必须保证这三件事：\n\n1. **中间段的工序数 ≥ 对标中间段工序数 ×0.9。**（这一条保留——它管的是「改造量够不够」，是内容，不是时长）\n   写完先数一遍：这一版中间段（T 到结尾验证段之前）有几个不同工序？\n   少于对标的九成，说明有活被搬到开头或结尾了，**搬回来**。\n\n2. **同一工序的刀必须落在同一段里。**\n   不许把「冲水」放开头、「刷墙」放中间——这两件都是清理，属同一工序，\n   必须挨在一起、同段。拆开写，观众读不出「一条流水线」的感觉。\n   **工序名一律取自 `19_工序词表.md` 的标准名**，词表里没有的报给我，不许自己起名。\n   名字不统一，看板会对不齐格子、报出假红灯。\n\n3. **中间段每刀不能过短。**\n   ~~中间段时长 ÷ 工序数 ≥ 对标同项 ×0.9~~ —— **2026-10-27 删除。**\n   理由：对标那份成片是加速剪出来的。拿它的秒数当我们的拍摄长度，等于要求一个人在 4.7 秒里铺完 40 块板。\n   现在只保留「工序数」这一条（内容够不够），时长不再和对比。**成片时长是结果，不是约束。**\n\n**写完之后在 `分镜交接.md` 里贴这张对账表，缺了不许交：**\n\n| 项 | 对标 | 本片 | 比值 | 判定 |\n|---|---|---|---|---|\n| 开头段工序数 | __ | __ | — | 本片必须 0 |\n| 中间段工序数 | __ | __ | __ | ≥0.90（唯一保留的比值） |\n| 素材总秒 | __ | — | — | ＝ Σ 各刀素材秒 |\n| 成片预计 | — | — | — | ≈ 素材总秒 × 0.867，**只校验落在对标 ±15% 内** |\n\n工序数比值 <0.90，就是「改造量不足」，这一版打回重排。\n**时长比值不再判**——成片时长只做一次总量校验：落不进对标 ±15% 的，写清为什么（多给了哪几个动作素材、或者少拍了哪个工序）。\n\n> **剪裁比全项目只有一个数：0.867**（素材秒 → 成片秒，也就是 生成 15 秒剪成 13 秒，阿初 L4622／L8392 两处同句）。\n> 2026-10-27 晚统一：此前这里有 0.83、0.75–0.85、0.85、0.87 四种写法，全部作废。\n> **为什么不是 0.83**：阿初说的「原片 30 秒我降到 18 秒」（L6534）是**对标→成片**的压缩比，不是生成→成片，被误用过一次。\n\n**真实事故**：开头段塞了 3 个工序（捡叶／冲地／刷墙），原片同段只有 1 个；\n结果中间段的工序数只剩原片的 0.81、时长只剩 0.72，\n观众的感觉是「浅浅收拾了一下」而不是「一整条流水线」。**开头多干一个活，中间就少一个工序。**\n\n════════════════════════════════════════\n五之二、待裁决必须清零才能往下走\n════════════════════════════════════════\n\n上面任何一项填了「缺」，或你发现某条流程要求与上游设定书冲突，\n一律登记进这张表，写在 `分镜交接.md` 最前面：\n\n| 编号 | 冲突内容一句话 | 上游怎么写的 | 流程怎么要求的 | 我的建议 | 状态 |\n|---|---|---|---|---|---|\n\n**状态只许写「未裁决」或「已裁决（谁/哪天/怎么定的）」两种。**\n只要有一行「未裁决」，这一版就是**待裁决状态**，第⑤段不许开工。\n\n不许用「按设定书执行」把它压掉——设定书是标准，\n但标准里也可能有一条和流程原则相反，那属于**要我拍板**，不属于你决定。\n\n真实事故：这条表当时确实写了（P01「生活回报：缺」），理由也写了，\n但因为没人拍板，生产照常进行，最后成片结尾真的没人用。\n\n涉及门、轨迹或空间翻转时，先锁定：固定建筑、可动物体、内外关系、收纳/运动方向。\n关键功能用清楚的连续视点证明，不靠切镜掩盖物理关系。\n\n\n════════════════════════════════════════\n六、人物、情绪、声音、台词和文字\n════════════════════════════════════════\n\n【人物】\n生活里的普通人，后段不意识镜头。\n情绪从动作、处境和结果自然产生，不安排对镜头摆笑脸。\n已锁开头的表演例外保留，不倒改开头。\n\n【情绪｜承接头那段，不许换口径】\n沿用设定书第 5 节同一套五通道和同一套强度标尺：\n① 表情 / 视线　② 身体动作与节奏　③ 环境　④ 声音　⑤ 镜头语言\n强度：0 无｜1 微｜2 中｜3 强。改造类原则上不上 3。\n\n「情绪」那一栏必须写成：触发 → 情绪 → 强度 → 载体\n例：看见水已漫到地毯 → 急 → 2 → ②身体（快步不跑）+ ④声音（脚步踩水）\n\n硬红线两条：\n· 正文里禁止出现情绪形容词\n· 只靠 ①表情 一个通道承担的段落，标出来交给我，不许直接当成合格\n\n【画面质感】\n普通欧美家庭 iPhone 随手录像：自然光、深景深、不调色，不大片、不样板房。\n\n【声音】\n每段写清情绪变化、动作力度、关键声音及声源时间。\n动作声、环境声、音乐、旁白分开写，不许合成一句\"有声音\"。\n不是每一刀兴奋，不是每段都塞旁白或弹动标题。\n\n【台词】\n已确认台词保持原语言逐字照抄，放在中文引号里。\n新增台词只能标为新提案，不能称为已锁定。\n没有说话就明确无对白，不编底部台词。\n\n【文字】\n小分镜阶段写清需要的标题/字幕内容与表达职责、分词方式，\n但不提前写生图或视频生产提示词。\n\n\n════════════════════════════════════════\n七、一次交完整结果，不中途停在局部\n════════════════════════════════════════\n\n本轮明确要求一次完成全片，按 skill 允许的一次全片交付执行。\n\n直接按最终详细程度完成全片，重点核查制造段和结尾验证。\n不单独试做，不以局部代替全片，不等我重复说\"继续\"。\n\n【格式：七栏是\"分组\"，下面第 1–15 项才是\"字段\"】\nskill 里那七栏（① 对标情况 ② 新片动作 ③ 要表现的 ④ 情绪和力度 ⑤ 不能丢 ⑥ 差异·风险·证据 ⑦ 验收）\n是**阅读顺序的分组**，不是字段清单。**字段以下面这 15 项为准**，七栏只是把它们归成七组：\n\n| 七栏（分组） | 对应下面哪些字段 |\n|---|---|\n| ① 对标情况 | 1 N 编号、14 对应对标证据 |\n| ② 新片动作 | 2 成片秒、2b 素材秒、2c 能否连续做完、3 起点状态、4 那一个动作、4b 动作数、5 接触对象、6 终点状态、9 机位 |\n| ③ 要表现的 | 7 观众新信息 |\n| ④ 情绪和力度 | 8 情绪触发与变化 |\n| ⑤ 不能丢 | 10 旁白对白、12 声音、13 物理关系 |\n| ⑥ 差异、风险、证据 | 14 来源、15 之外的生成风险 |\n| ⑦ 验收 | 15 验收条件 |\n\n**两套写法打架过（2026-10-27 前的旧稿里，七栏和十五项并列出现，AI 不知道写哪套）。现在统一：七栏只作标题，字段照下面写。**\n\n【每一段必须写到下面这些，一栏不许空】\n1. N 编号\n2. **成片秒**（这一刀在成片里占多少，＝对标节奏，剪辑目标）\n2b. **素材秒**（这个动作拍完、观众看得清，需要多少秒）—— **这是本轮最重要的一栏**\n   · **由你（AI）预演决定，不是抄对标。** 阿初的原话：「关于秒数 这个你自己预演一下……我这里用的是 8 秒 因为我觉得信息很多 需要这么长时间」（L3789）。他凭信息量定，你也要凭信息量定。\n   · **怎么算**：`起手 0.5 ＋ Σ(动作单位) ＋ 收尾 0.5`。动作单位表（接触—改变—离开 1.0–1.5 秒／位移 1 米 0.7–0.8 秒／转身 0.8–1.0 秒……）在 `skills/adaptive-video-production/references/material-seconds.md`。\n     例：铺一块板＝起手 0.5 ＋ 落位 1.2 ＋ 压平 0.5 ≈ 2.2 秒；要看清 4 块（第 3 块起按 0.9）⇒ **素材约 6 秒**。\n   · **素材秒不许小于 1.0 秒**；估不准就往上取（多给 1 秒只花 1 秒积分，少给要重抽，4 秒起）。\n   · **对标的那一段秒数，只是「这一段在别人的成片里占多久」，不能当你的素材秒。** 别人的成片是加速剪出来的，你按它拍，动作做不完。\n   · **素材秒可以比成片秒长很多，不用解释。** 差额就是剪裁余量。阿初 15 秒生成 → 13 秒成片，留 13%。\n   · **没有这一栏，下游只能拿成片秒去生成，每个动作都被压在自己那一格里做不完——模型不会停下来问，它会自己补一段走位把空档填上，补出来的全是要剪掉的。**\n2c. **这一刀，一个人能连续做完吗？**（做不完就拆刀，不要靠\"演着演着就完成了\"）\n   · **一刀的定义（2026-10-27 收紧）**：一刀 ＝ 一个人**能连续做完**的一个动作片段，中间不含时间跳跃。\n   · 判据：把这段素材按\"发生了什么变化\"切段，**如果有一段是\"没变化\"、或者需要观众自己脑补中间省略的工作，那就不合格**，必须拆成两刀。\n   · 例：`把 40 块板铺满` 不合格（一个人 6 秒铺不完 40 块）。正确拆法：\n     　　刀 A：手放 4 块板落位（素材 6 秒）\n     　　刀 B：切进来桥面已铺满，他敲最后一块（素材 2 秒）\n     　　两刀之间是硬切，观众接受时间跳跃。\n   · **不需要另写\"素材段数\"这一栏**——段就是刀，拆了刀自然就有了。\n   · 素材秒**怎么算**见 `skills/adaptive-video-production/references/material-seconds.md`：起手 0.5 ＋ Σ动作单位 ＋ 收尾 0.5，动作单位表里有数。**不许凭空写，允许 ±25% 浮动。**\n2d. **少演，不少做**（2026-10-27 新增，这一条决定成败）\n   · **该做的工作一样不减**：桥必须真的铺满、栏杆必须真的立好、碎石必须真的刮平。这是内容，减了片子就不成立。\n   · **但观众不需要看见每一块板。** 观众只需要两个证据：**①\"在铺\"（2–3 块，看得清手在干什么）②\"已经铺满\"（切进来就是结果）**。\n   · **刀与刀之间可以跳过大量工作，这是电影语法；一条镜头里跳过，模型就会用走位把空档填满。**\n   · 所以别问\"这一刀怎么把 40 块演完\"，要问\"**观众需要看见哪几下才相信这件事发生了**\"。答案通常是 2–3 下 ＋ 一个结果。\n   · **写成 40 块的，等于要求演员在一条镜头里演 40 次；写成 3 块 ＋ 铺满的，才是能拍的。** 两者观众看到的成片一样。\n   · 判据：这一刀里\"必须看见的接触动作\"超过 5 次，就是演多了，砍到 2–3 次，剩下的交给下一刀的\"结果\"。\n3. 起点状态：当前人物、空间和道具状态\n4. 那一个动作：从\"他做的第一下\"到\"这一下做完\"，**一句话说完，不拆步骤**\n4b. 动作数：**只填 0 或 1**。空镜、无人镜填 0；有人做一个动作填 1。\n   　 这一栏是机器闸门直接读的，写 2 就是不合格，不许写\"1（其实是两下）\"这种。\n5. 接触对象：他的手/工具接触的是什么，接触在哪里\n6. 终点状态：发生什么可见变化（观众能指出来的那一处）\n7. 这一段给观众的新信息\n8. 情绪触发和情绪变化（触发 → 情绪 → 强度 → 载体）\n9. 机位 —— 分两档，别一视同仁：\n   **后段（T 秒之后）只要两项写清就能生产：**\n   ① 高度：离地多少米，写数字。不许写\"贴地\"\"低机位\"这种词代替数字\n   ② 景别 + 运动：远/全/中/近/特；固定 / 手持 / 摇 / 推 / 跟\n   **加写更好、但不强制：** 俯仰（俯/平/仰）、焦段（广角/标准/中长焦）、人物占画面高度几成。\n   　 后段观众在看\"事情有没有进展\"，不在看\"镜头怎么说话\"，所以机位不出错就行，不必逐项复刻原片。\n   **例外：紧接着 T 秒的第一刀**，按开头段的标准写全（它是开头的延续，观众还在建立空间感）。\n   同一个场景换机位，就是换了一个镜头，高度和景别要重写，不许写\"同上\"。\n10. 旁白/对白原文\n11. 字幕分词\n12. 动作声、环境声和音乐职责\n13. 不能丢失的物理关系\n14. 对应对标证据或本条设定来源\n15. 本段验收条件\n16. AI 生成风险\n\n【2e. 状态跳跃：这一刀要的状态，上一刀必须给过（2026-10-28 新增，内容层失败的真正原因）】\n\n写每一刀之前，问一句：**这一刀开头的状态，上一刀的画面里有吗？**\n只许三种合法出口，选一个，在交付里标出来：\n· **A 上一刀的画面里已经看见了**（不用跳）\n· **B 这一刀自己演得完**（\"放最后一块板\" 3 秒够）\n· **C 结果镜头重新起手**（切进来就是一个静态的、已经完成的新画面，人在画面里是静的、不用走一步）\n\n**第四种不合法：要求一个\"中间省略了大量工作\"的状态，但入口还延续上一刀的人。**\n模型不会停下来问，它会自己编一段过渡填上——走过去、搬东西、站着。填出来的全是要剪掉的。\n\n真实事故（2026-10-27，两条片子逐帧复核）：\n· 上一刀近景只演了**一块板**放上去，下一刀写\"桥面已铺满\" → 模型让他**抱着一根长木条站在空桥上**，整刀废 3.5 秒。\n· 上一刀结尾她一只脚**踩在校车台阶上**，下一刀写\"她已经在桥心\" → 模型让她**走回去**，走了 2 秒。\n· 上一刀和下一刀**两侧都是全景**，观众看不见这个切，模型当成一条连续镜头，直接推成长镜头。\n\n配套两条禁令：\n1. **切点两侧景别必须真的不同**（近↔中↔全）。都是全景，这个切等于没切。\n2. **不许设计\"只拍腰以下\"的近景**——实测两次都失败，模型不会\"一进来只有腿\"。\n\n> 说明：3–6 合起来就是「一次状态变化」的四段式。\n> 原来的 4、5 两栏（\"从什么动作开始\"＋\"人物具体做什么\"）已经合并成第 4 栏一项，\n> 因为它们本来就是一个动作，分开写只会被写成两个。\n\n【绝对禁止交付框架】\n以下都不算完成：\n· 只有章节目录\n· 只有\"开头—施工—成品\"的框架\n· 只有阶段名称，没有逐段动作\n· 只有建议，没有可拍内容\n· 使用\"同上\"\"略\"\"后续补充\"\n· 用占位符代替人物动作、旁白、声音或验收\n· 只写如何拆分，没写真正的小分镜\n· 只复述对标，没有本条自己的具体内容\n\n必须写成可以直接交给下一阶段生产的完整小分镜成稿。\n如果你只能写框架，必须报告 BLOCKED，不能把框架当成小分镜交付。\n\n【怎么算完整，怎么算框架】\n下面这组对照是本次的验收尺子。你写的每一段，颗粒度不得低于\"正例\"。\n\n**先记住这条总纲：一个镜头 = 一次状态变化。**\n写成三段就够：**起点状态 → 那一个动作 → 终点状态（可见的变化）**。\n中间的手部步骤一律不写，交给模型自己发挥。\n\n反例（这样写就是框架，直接退回）：\n　N05　05.2–07.0 秒：Alex 在门口安装挡水条。蹲下、对齐、固定，快速完成。\n\n正例（这样写才算完整｜动作数 = 1）：\n　N05　05.2–07.0 秒｜建议 1.8 秒\n　起点状态：挡水条已放在门槛内侧，两端各多出约 2 厘米；Alex 蹲在门内，膝盖压在条上，\n　　右手拿橡胶锤，左手边地上一卷双面胶，背纸还没撕。\n　那一个动作：他蹲下去，把挡水条按到门槛上粘住。\n　　（撕胶、对位、压紧都算这一个动作，不拆开写，不写\"先…再…然后…\"）\n　终点状态：条身右端不再左右晃动、底面完全贴地；右端头不超过门框内沿；\n　　胶带背纸撕下一条垂在条外。\n　这一段给观众的新信息：挡水条不是直接摆上去的，底下要先粘住，所以后面水冲不走。\n　情绪：微烦 → 1 → ②身体（按的那一下用力，肩背绷住）\n　机位：中近景，从门内往外斜 45 度，固定机位，轻微手持抖动；不切镜。\n　旁白：照分镜原文逐字抄，写清起止秒和词数。\n　字幕：2–3 词一组，写清怎么分。\n　声音：动作声——胶带撕开的连续声、条身落在混凝土上的闷响；\n　　环境声——屋外雨声持续；音乐——无。\n　不能丢失的物理关系：条身底面必须完全贴地，右侧端头不能超过门框内沿；\n　　胶带只在条底，不能露在正面。\n　依据：设定书第 4.5 节动作预算表 N05；对标同位置动作。\n　验收：能看到条身被按下、底面贴地；用手推有阻力。\n　AI 生成风险：模型容易跳过撕胶带直接摆好；容易把胶带画在正面。\n\n【动作数硬指标】（这一组比字数重要，先过这一组）\n· 第 4 栏「那一个动作」**只许一句话、不超过 40 字，动作数恒为 1**。\n· 出现\"先…再…然后…接着…\"\"一、二、三\"这种并列，就是超了，**必须删到只剩一个**。\n· 想写第二个动作 → 那是该拆刀，不是该加句子。\n· 动作数 ÷ 秒数 不得高于本条原片基准的 1.2 倍。\n　原片基准由 `Pipeline.py 查 分镜 --版本 <你的版本目录> --基准 <对标库\\B####_xxx\\03_整片拆解.md>` 算出。\n\n【颗粒度硬指标】\n· 每段正文（不含表头）不少于 150 字，但**字数只能由这五项凑**：\n　起点状态 / 终点状态（可见变化）/ 机位与景别 / 声音 / AI 生成风险。\n　**不许用动作步骤凑字数。**\n· 第②栏必须出现具体动词和接触对象。不许出现\"处理\"\"操作\"\"施工\"\"完成\"\"快速推进\"这类空动词。\n　（注意：写一个准确的动词，不是写一串动词。）\n· 声音必须三类分开写：动作声 / 环境声 / 音乐。缺一类就是没写。\n· 每一段都要能回答三件事：他手里拿的是什么；这东西从哪来；做完之后画面里哪里变了。\n· 不许用一张七列表格代替正文。表格可以附，但正文不能省。\n· 第一段是全片颗粒度的标杆。第一段必须写到最终详细程度，后面任何一段低于它，\n　都要回头补，不是把第一段降下来对齐。\n\n【交稿前必须跑的机器闸门】\n· 跑：`python \"E:\\智线出海内容运营\\09 工具\\Pipeline.py\" 查 分镜 --版本 <你的版本目录> --基准 <对标库\\B####_xxx\\03_整片拆解.md>`\n· **退出码必须是 0**。不是 0 就重写超线的刀，不许交付、不许进生产单元。\n· 汇报时把检查器的汇总行抄进回复（平均步/秒、超线刀数）。\n\n【交稿前抽查】\n随机抽 3 段（必须包含第一段和结尾验证段），逐段问自己一句：\n\"这一段能不能直接拿去写生图/视频提示词？\"\n不能，就是框架。重写这一段，不要只改措辞、不要加形容词凑字数。\n\n【必须做的终局闭环】\n小分镜必须明确写出这条链：\n开头问题 → 观众担心的后果 → 中间解决动作 → 终局空间状态 → 人物实际使用或结果验证 → 开头情绪兑现\n\n如果结尾只有漂亮空镜，没有实际使用或结果证据，不能通过。\n\n【同时交付这三样】\n· 锁定页（T 秒末态十项键值，与设定书第 4.1 节逐项对齐）\n· 阶段路线、逐段时间预算、连续性对账\n· 全文填好的《移交生产表》，至少九项：\n  终局 / 开头锁定状态 / 阶段路线 / 人物、道具和空间 / 每个 N 编号分镜清单 /\n  旁白对白冻结位置 / 不得改变的物理关系 / 未决项 / 生产风险\n\n未得到我最终确认前，移交表标\"待最终确认\"，不能伪称已确认，也不能直接启动生产。\n\n【时长】（2026-10-27 重写）\n**两个数分开写，别混：**\n· **素材秒**：每一刀\"这个动作拍完、观众看得清\"要多少秒。由你按信息量估（算法见 `references/material-seconds.md`），**不抄对标**。\n· **成片秒**：每一刀剪完之后占多少。**≈ 素材秒 × 0.867（全项目只有一个剪裁比）**。依据：阿初 15 秒生成 → 13 秒成片（`阿初的油管库.md` L4622）。\n**推导顺序（不许反过来）：**\n　① 先把每一刀的动作写清 → ② 用动作单位表算出每刀素材秒 → ③ 加总得素材总秒 → ④ 乘剪裁比得成片预计 → ⑤ 和实拍可行性核一遍\n**对标的作用只剩一个**：校验成片总时长落不落在对标 ±15% 内。**不许拿对标的逐段秒数当自己的素材秒**——对标的成片是加速剪出来的，照它拍，一个人做不完。\n不留下大段\"不够再延长\"。不要先锁镜头数、生成单元数或旧预算，再删薄施工。\n\n【段数与栏数】\n**段数（几刀）**：按\"一个人能不能连续做完\"算，不套模板数字。\n　不是固定 29 段，不是固定 13 秒，也不是照抄对标的段数。一段活里有几个\"一个人做不完\"的转折点，就几刀。\n**栏数**：固定 15 项，一项不许空，不许自创字段。\n**时长**：见下面的【时长】。\n\n\n════════════════════════════════════════\n八、完成标准与最后回复\n════════════════════════════════════════\n\n结束前对实际正文逐条检查：\n· 每一段是否有新的信息或必要停留\n· 首次关键接触是否保留\n· 结构、物件、服装和空间是否连续\n· 核心安装是否仍被\"最后一下\"替代\n· 结尾是否实际兑现开头\n· 台词和声音是否装得进对应时间\n· 是否还把本应自己完成的设计丢给我或生产阶段\n\n遇到资料问题，继续完成不依赖它的部分，\n只保留真正影响结果的具体缺口，不要交一串新问卷。\n\n**交稿第一节必须先写「这一版怎么走（人读版）」，不超过 300 字，不许放表格。**\n写在 `分镜\\后段小分镜_有效.md` 的最前面，用白话说清四件事：\n  · 从第几秒到第几秒、一共几刀、平均每刀几秒\n  · 这一段最要紧的三刀是哪三刀、为什么是它们\n  · 结尾怎么收：光怎么变、有没有人在用、对照物还在不在\n  · 这一版最容易做错什么（具体到秒数和动作）\n\n表放在这一节后面。这一节是给人读的，表是给下游抄的，两层都要有。\n\n最后简短告诉我六样：\n1. 完整稿的绝对路径\n2. 推荐全片时长与验证段时长\n3. 小分镜数量\n4. 开头接缝是否有依据（逐项对上第 4.1 节哪几项）\n5. 每个开头问题对应哪一段解决\n6. 还有哪一个真正需要我最终决定的事项\n\n明确区分：\n完整设计已完成；\n待我最终确认；\n待实际生成验证。\n\n不要用文件数量、自评分或\"执行结束\"证明成功。\n不要只给接手总结、框架或过程解释。\n我要能直接审核的完整小分镜结果。\n\n\n════════════════════════════════════════\n只写这些地方\n════════════════════════════════════════\n\n分镜\\ 及其子目录。别的一律不碰。\n**00_版本设定书.md 只读，一个字都不许改。**\n发现设定书有问题（数字打架、缺项、和拆解对不上），不要自己改，也不要\"顺手修正\"——\n写在交接里报给我，由我统一定改哪一份。你改了，其他对话框读到的还是旧的，会出两个版本。\n不改 skill、不改 Excel、不改生产程序，不生成、不花积分。\n不查看或外发我明确禁止复审的素材。\n旧稿不覆盖，另存新版本。\n\n产出三个文件：\n1. 分镜\\后段小分镜_有效.md\n2. 分镜\\分镜交接.md\n3. 分镜\\改动影响清单.md（对着设定书逐段判断：直接照抄的、只换表面的、必须重写的，各占哪些段，为什么）\n\n\n════════════════════════════════════════\n交完之后\n════════════════════════════════════════\n\n三个文件都落盘后，交**两张图**，都用绝对路径。\n\n【图一 · 结论图】自己跑（不用我跑，你有执行权限）：\n    python \"E:\\智线出海内容运营\\09 工具\\体检.py\" \"<版本目录>\"\n→ 生成 `_验收\\体检单.png`：六行，绿=过、红=卡住、灰=还没做。\n\n【图二 · 过程图】这一段的专业图，我要看它判断完成度：\n    python \"E:\\智线出海内容运营\\09 工具\\看板_环节.py\" --stage 小分镜 --mode name --ref \"<对标工序:秒，逗号分隔>\" --ours \"<本片工序:秒>\" --out \"<本版本目录>\\_验收\\看板_分镜.png\"\n→ 存到 `<本版本目录>\\_验收\\看板_分镜.png`\n\n两张都贴出来，不要贴文字、不要贴退出码。后面只写一句：**这一段过没过**；\n没过就补一句「卡在第几段 + 那一行写的原因」。\n不许自己声称\"已通过\"——以图为准。我只看图。\n\n【路径速查｜都是本机绝对路径，不要改成相对路径】\n· 工具目录：       E:\\智线出海内容运营\\09 工具\\\n· 结论图：         E:\\智线出海内容运营\\09 工具\\体检.py\n· 总闸门：         E:\\智线出海内容运营\\09 工具\\Pipeline.py\n· 过程图（环节）： E:\\智线出海内容运营\\09 工具\\看板_环节.py\ frames:v 1 sheet_%02d.jpg`\n\n大文件（>20KB）：按 `##` 切，一次读 1–3 节，全部读完才算读过。只拿到开头一截预览的，\n重读两次仍不全的，**不要在对话里停下来问我**：在产物里把那一节标成\n「只读到第 X 节，缺 <内容>，导致 <哪几个字段> 填不了」，然后继续往下做。\n**A/B/C 类缺一项不许开工，只有 D 类可以不读继续。** 禁止把「只读到第 3 节」写成「已完整读取」。\n\n────────────────────────────────────────\n零提问 ＋ 回复纪律（比读法更硬）\n────────────────────────────────────────\n\n我只会发给你「指令 ＋ 路径」，缺什么自己按默认处理，**不许拿来问我**：\n· 上游文件不存在 → 产物里标「缺 <文件名>，影响 <哪几项>」，能做的那部分照做\n· 图看不清 → 标「依据不清·待补」，不许靠经验编\n· 数值打架 → 按本文件已写死的优先级判，判完在产物里记一句\n只有「上游核心文件整份读不到」才允许停下来。\n\n对话里只许出现两样东西：第N步完成那一行 ＋ 最后的交付总结。\n**禁止在对话里输出** <analysis>、<summary>、思考过程、自我复述、\n「我先看一下」「现在开始读」这类旁白。单次回复不超过 15 行，长内容写进文件。\n\n每改完或新建一个文件，立刻回一行「第N步完成：文件名」，不要攒到最后一起说。\n\n\n\n════════════════════════════════════════\n你要做什么\n════════════════════════════════════════\n\n你就是本轮生产执行总控。\n\n全文读取 skill，把已经确认的开头和完整小分镜，转成可以实际导入我现有生产程序的完整生产包。\n\n本轮直接接手执行，不是替下一位 AI 整理指令。\n小分镜和生产由不同任务完成；你不延续上游长对话，不重新研究选题，不重新设计整片故事。\n\n全程用中文和我沟通。我只跟你一个人沟通。\n你负责接手、划分、写词、整合、检查、修复和交付，不让我协调多个子任务，也不让我自己拼提示词。\n\n目标是保留观看任务、施工因果、情绪和终局功能，减少不必要的生成与返工。\n\n\n════════════════════════════════════════\n分两段交｜先报单元规划，我点头你再写词\n════════════════════════════════════════\n\n**第一段：只报规划，一个字词都不许写。**\n\n报三样，顺序不许换：\n\n1. 两个数：**素材总秒**（＝Σ 各刀素材秒）、成片预计（≈ 素材总秒 × 0.867）\n2. 单元数（查第三节那张表得出，不是自己感觉）\n3. 这张表：\n\n  单元 ｜ 覆盖哪几刀 ｜ 生成秒 ｜ 刀数 ｜ 成片预计取用秒 ｜ 取用率\n\n下面写一句话：哪几刀你本来想分开，为什么合起来了。\n\n**这一轮不要写图片词，不要写视频词，不要建 单元\\ 文件，不要动根目录。**\n\n四条自检，有一条不过就先自己重装，别报给我：\n· 生成秒是整数，**13–15**（平台容量到 15；末组除不尽可以短，但不低于 4）\n· **盒内刀数 ≈ 生成秒 ÷ 2**（13–15 秒 → 6–7 刀。阿初自己那组 15 秒装的是 6 刀：2/2/2/3/5/1）。\n  **13–15 秒的盒子少于 6 刀就是错的**，说明每刀被拉到 3 秒以上，富余的时间模型只能拿去走位。\n  （短盒子按同一个除法算：6 秒→3 刀、8 秒→4 刀。「少于 6 刀就是错的」只对 13–15 秒的盒子成立，不要拿它去卡开头 U01 那种短片。）\n· **盒级取用率 ≥60%**（不是刀级），目标 87%\n· Σ 生成秒 ≤ 素材总秒 × 1.10\n· 每一刀都拿\"这一刀里的活，1 秒干不干得完\"过一遍；干得完却给了 3 秒以上，就是傻站的来源\n\n**为什么取消「每单元成片取用 ≥2 秒」和「刀级 60%」**（2026-10-27）：\n平台单段最少 4 秒。任何成片 <2.4 秒的刀，用 4 秒生成取用率必然低于 60%（转头 0.834 秒→20.8%、立栏杆 2.033 秒→50.8%、末镜 1.920 秒→48%）。\n按刀卡 60% 等于强制这些刀跨工序并进别的盒子，而跨工序合并必然产生状态跳跃。**取用率只在盒级考核，目标 87%（阿初 15 秒生成、13 秒成片，86.7%）。**\n\n**为什么「一盒 2–4 刀」「一盒一个工序」「最多两件事」也一并撤销**（2026-10-27 晚）：\n这三条都不是实测结论。刀数是拿「每刀不少于 2 秒」去除盒长算出来的，而「每刀不少于 2 秒」是剪辑台上的节奏习惯，不是生成约束；工序和件数两条来自一次单镜头长盒的丢件事故，那次的样本里**没有一个盒子带内部切刀**。\n阿初那边没有这三条：他按场景／机位拆组（L3696），一组 15 秒装 6–7 个镜头、平均 2 秒一个（L4527–4529）。\n同一天的反证：U04_v01 12 秒 4 刀跨 3 个工序，切点全干净；U04_v03 15 秒 5 刀反而废 35%（第 3 刀状态跳跃）。\n\n我看完只会三种回复：\n· \"可以\" → 进第二段，写词、建单元文件\n· \"太多\" / \"太少\" → 按我说的重装，再报一次表\n· \"第几刀有问题\" → 只改那一刀所在的盒子，再报\n\n**第二段：写完整包。** 我点头之后才做，格式按「四、第三步：写完整包」。\n\n\n════════════════════════════════════════\n零、开工前先查待裁决（有未裁决项，一步都不许做）\n════════════════════════════════════════\n\n上游可能有「与指令冲突、已按上游文件执行」的登记项。这类项**不是备注，是欠账**。\n开工前先把它们捞出来，列成这张表：\n\n| 编号 | 哪两份文件冲突 | 冲突内容一句话 | 上游怎么写的 | 指令怎么要求的 | 状态 |\n|---|---|---|---|---|---|\n\n**只要有一行状态是「未裁决」，立刻停，把表发我，等我说了再做。**\n不许用「按设定书执行」当理由直接往下走——设定书是标准，但标准里也可能有一条\n和流程原则相反；那种情况属于**要我拍板的事**，不属于你可以自己决定的。\n\n真实事故：分镜明确写了「生活回报：缺，无人使用 → P01 待裁决」，\n还注明了原因（设定书第 9 节 #4「对照版结尾保持无人空镜」）。\n这条待裁决没有被回答，生产照常开工，最后成片结尾真的没有人用。\n**规则写了、AI 也报了，就是没人拍板，然后按错的那版走了。**\n\n\n════════════════════════════════════════\n一、先读这些文件\n════════════════════════════════════════\n\n【全局固定路径，不用改】\n\n1. skill 全文，必须真正读完并遵守，不得只在回复里声称\"已调用 skill\"：\n   E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\skills\\adaptive-video-production\\SKILL.md\n\n2. 该 skill 的 references 和 templates，按需打开，不要机械读完。\n\n   SKILL.md 里已经把主流程、渠道参数和文件格式写全了。\n   references 是某一步的细则，templates 是输出格式，只有走到那一步、\n   或者对格式拿不准时才打开对应那份。不机械读完全部参考和模板才产出。\n\n   | 走到哪一步 / 遇到什么 | 打开这份（都在同一个 skill 目录下） |\n   |---|---|\n   | 划 U、判断合并还是拆分 | references\\shot-vs-generation-unit.md |\n   | 判断一个 U 能塞多少动作 | references\\prompt-density-and-merging.md |\n   | 写正文、把动作转成秒数 | references\\prompt-and-performance.md |\n   | 选卡、查参考图冲突 | references\\reference-image-policy.md |\n   | 写生产总图、建台账 | references\\production-ledger.md ＋ templates\\production-ledger.md |\n   | 单元 ≥4，要分组并行 | references\\file-driven-production.md |\n   | 机器卡格式拿不准 | references\\auto-production-table.md |\n   | 单元卡 / 共用卡 / 清单格式拿不准 | templates\\production-unit-card.md、templates\\shared-card-prompts.md、templates\\import-checklist.md |\n   | 判断什么时候停、失败怎么修 | references\\sampling-and-stop-rules.md |\n   | 空间要分阶段、逐步变化 | references\\state-planning.md |\n   | 用户要一次给齐 | references\\one-shot-handoff.md |\n   | 多条线同时推进 | references\\parallel-production.md |\n   | 终局或输入不清 | references\\intake-and-end-state.md |\n\n   拿不准读不读，就读。但不要为了\"看起来认真\"把二十几份全打开一遍。\n\n【版本内，相对路径】\n\n3. 00_版本设定书.md\n   ← 唯一标准。重点读第 4 节本版逐段表、第 4.1 节 T 秒末态十项键值、第 5 节情绪节拍表、第 6 节表面清单、第 8 节必须有/禁止有、第 10 节交付契约。\n\n4. 开头\\开头交接.md\n   及其明确指定的当前有效开头方案、共用卡制卡词、全部开头 U 卡。\n\n   这两份的实际位置（2026-10-22 起由第③段交）：\n   · 共用卡制卡词.md —— 版本根目录\n   · 单元\\U01.md —— 开头段单元卡\n\n   U01 和共用卡都是定稿，直接采用，不许重写；本步划单元从 U02 开始。\n   交接里那一节「提示词包」会写清路径和字符数，先照着核一遍。\n\n5. 分镜\\分镜交接.md\n\n6. 分镜\\后段小分镜_有效.md\n   ← 这是本轮最重要的输入。新分镜的具体动作、状态、物理限制和英文原文，必须完整掌握一次，不许为省 token 跳读。\n\n7. ~~分镜\\改动影响清单.md~~ —— **2026-10-27 改为不必读。**\n   它是 ④ 的思考记录（哪几刀照抄、哪几刀重写、为什么），**不是写提示词需要的**。\n   读了反而会误以为\"重写\"那一栏是在要求你改动什么。要写的是\"这一刀演什么\"，那在后段小分镜里。\n\n7b. 01_微调大纲.md（版本根目录）\n   ← **必读，只读「第 2 节 大纲」那一块。**\n   `后段小分镜_有效.md` 给你的是一刀一行的字段（动作、动作数、机位、声音）；\n   大纲给你的是**同一刀的大白话描述**——「她一手死死抓住旁边那根钢索，另一只手把孩子按在怀里，她没有喊，只是喘」。\n   **写提示词时，这两份要合起来用**：字段定骨架，大白话定质感。只有字段，写出来是干的。\n   第 0/1/3 节是给人看的，略过。\n\n7c. `分镜_人读版.md`、`单元_人读版.md` —— 不必读，那是给人看的。\n   **但你自己要交一份 `单元_人读版.md`**（见文末「★ 人读版」）。\n\n────────────────────────────────────────\n读到的凭证｜这一栏不写，这一版不收\n────────────────────────────────────────\n\n交稿时，`生产单元划分与取用联合检查.md` 最前面必须有这张表，一个要求读的文件占一行：\n\n| 文件 | 读到的 3 条事实（必须是这个文件里才有的，带数字或专名） |\n|---|---|\n| 00_版本设定书.md | ① 成片总时长 ② 4.5 节共几刀 ③ 位移刀是哪几刀 |\n| 后段小分镜_有效.md | ① 后段共几刀、起止秒 ② 最长那一刀几秒 ③ 哪几刀动作数 0 |\n| 单元\\U01.md | ① 生成几秒 ② 成片取用到第几秒 ③ 传几张参考图 |\n\n· 写「已阅读」「已完整读取」「已按 skill 执行」都不算，必须是事实。\n· 凑不出 3 条，就是没读进去：在产物里把这一份标成「未读成·原因…」，其余部分照做，\n  最后在总结里列出来。不许硬写、不许编，**也不要为一两份停掉整轮**。\n· **大文件（超过 20KB）必须分节读完再写这张表。** 只返回了开头一截预览的，\n  要么按 `##` 标题一段一段读，要么明确写「只读到第几节，后面没读到」——不许当成读完了。\n\n**哪些必须全读、哪些可以不读，按这个分：**\n\n| 类别 | 文件 | 怎么处理 |\n|---|---|---|\n| **必须全读** | `分镜\\后段小分镜_有效.md`（约 120KB，33 刀全在里面） | **分节读完，一刀都不能漏**。只看开头就划单元，一定划错 |\n| **必须全读** | `00_版本设定书.md`（约 38KB）、`分镜\\分镜交接.md`、`单元\\U01.md` | 分节读完 |\n| **可以不读** | 同批次 `01_中间过程稿.md`（约 57KB）、`输入\\` 里的对标图 | 不是本段输入，结论已固化在设定书里。不用读，也不要在交稿里报「未全读」 |\n\n8. 00_生产包入口.md（根目录，已存在就先核当前状态，接未完成项，不重复重写已经有效的包）\n\n9. RC01_主角身份参考_v01.png（根目录）\n   只借脸和体型，不借旧衣着、不借背景、不借道具、不借姿态。\n\n【停下来的条件】\n下面任一项缺失，只列具体缺哪个文件、影响哪些任务，不编出已定开头、不冒称已完成整包：\n· 00_版本设定书.md 第 4.1 节十项键值缺项\n· 分镜\\后段小分镜_有效.md 不存在或只有框架\n· 开头\\开头交接.md 不存在\n\n不依赖它们的独立核查可以继续做，但要标明哪些是待补的。\n\n\n════════════════════════════════════════\n二、第一步：接缝核对\n════════════════════════════════════════\n\n对照「T 秒末态」和「T 秒后起点」，逐项核这八条：\n\n人物身份与穿着 / 场地锚点 / 主体物朝向、颜色、数量、离地阶段 /\n工具去向 / 旁观者位置 / 门窗与地面阶段 / 旁白与字幕 / 实际总时长\n\n还要核：\n· 开头最后一句旁白和后段第一句，有没有重复、遗漏、句中硬断\n· T 秒处有没有空档或双重叠放\n· 后段有没有重新做开头已经做完的事（重新清场、拆棚、整平、把东西挪回去）\n\n对不上分两类处理：\n· 方案没写清 → 退回改方案，不许\"生成的时候再说\"\n· AI 生成控制不住（比如木纹每次不同）→ 记成风险，写清生成时怎么约束\n\n明确缺漏或表述冲突，在本版既定骨架和授权内做最小联动修复，并记录。\n已接受的媒体不改。\n\n会改终局、主要结构、核心开头、冻结英文或已接受素材的冲突，集中问我，不替我改决定；其他独立部分继续做。\n\n输出：说明\\接缝核对与有效版本.md\n写清：来源准确版本/路径、修了哪里、未决与阻塞、文字与媒体分别的状态。\n\"文本一致\"不等于\"我已经接受了素材\"。\n\n\n════════════════════════════════════════\n三、第二步：定单元（照做，不要发挥）\n════════════════════════════════════════\n\n**报我的时候，前面先写一段「单元规划（人读版）」，不超过 250 字，不许放表格。**\n用白话说清三件事：\n  · 成片 XX 秒，划成 N 个单元，每个单元大概几秒\n  · 每个单元一句话：这一盒在干什么（例：U01 清场装袋、U02 冲地刷墙……）\n  · 哪一盒最容易生成失败、为什么，失败时打算怎么补\n\n这一段后面再放完整的单元规划表。我要先看懂，再看表。\n\n顺序是死的：先算数 → 再装盒 → 再填表 → 再报我。\n跳步一定出错。先翻小分镜再想单元，你会照着 25 刀划出 25 个盒子，这是默认错误，不是估算。\n\n────────────────────────────────────────\n第 1 步：先算两个数（这时候还没看小分镜）\n────────────────────────────────────────\n\n· 成片总时长 ＝ ___ 秒（照设定书第 10 节，不自己重算）\n· 生成总时长 ＝ 成片总时长 ÷ 0.867 （阿初 15 秒生成、13 秒成片，`阿初的油管库.md` L4622／L8392；全项目唯一的剪裁比）\n\n然后查表得到**单元数**：\n\n| 成片时长 | 20–35 秒 | 36–50 秒 | 51–70 秒 | 71–95 秒 |\n|---|---|---|---|---|\n| 单元数 | **3–4 个** | **4–5 个** | **5–6 个** | **6–8 个** |\n\n单元数含开头 U01。\n\n**为什么是这个数（2026-10-27 全部改成阿初口径）：一组＝一次生成＝装满 13–15 秒，装 6–7 刀，每刀约 2 秒。**\n阿初原话：「一组 15 秒 需要设定 7 个左右的镜头……平均 2 秒左右 你就要设置一个镜头」（L4527–4529）；他自己的 15 秒组是 **2/2/2/3/5/1**（L4550）；生成 15 秒、成片剪成 13 秒（L4622）。\n平台容量是 4–15 秒，但**不拿 4–12 秒做整盒**：盒子越短，一盒能装的刀越少，每一刀就被拉得越长。\n一盒 2 刀、10 秒，等于每刀 5 秒。一刀的活 1 秒就干完，剩下 4 秒模型只能站着、直起腰、走过去、擦汗——**你在成片里看到的废动作，全是这么来的。**\n实测（2026-10-27 三条片子逐帧复核，共 13 刀）：**刀 ≤2.6 秒 6/6 切点干净；刀 ≥2.8 秒 7 刀里只有 1 刀切点干净**，其余 4 刀全废、2 刀半废（废掉的是 3.2 秒走路、3.2 秒抱长木条站在空桥上、3.6 秒重复刮同一片碎石、2.8 秒抱孩子走 2.5 秒）。\n**注意\"切点干净\"只指没有过渡帧、机位不漂，不等于刀里有活。** T7 那六刀（1.33–2.71 秒）五个切点全部一帧干净，走位彻底没了，但刀 3 后半 1.5 秒手掌按着不动、刀 4 空转 2.2 秒，**废的总时长 3.7 秒，和旧版走位差不多**。短刀只是把\"走位\"换成\"静止\"，不会自己消灭废动作——**所以第四条硬规矩（每刀都要演满）不能省。**\n\n所以单元数是**按 15 秒装满算出来的**，但要用这个式子，**不是直接拿生成总时长 ÷ 15**：\n\n　　单元数 ＝ 1 ＋ ⌈(生成总时长 − U01 生成秒) ÷ 15⌉\n\n因为 U01 只有 T ÷ 0.867 秒（常常 4–9 秒），它占不满 15；剩下那些盒子才按 13–15 装满。\n直接除会少算一个，装到最后一定有一个盒子超过 15 秒，或者你被逼去砍内容。\n\n例：成片 62.5 秒 → 生成 72.1 秒，U01 6 秒 →（72.1 − 6）÷ 15 ＝ 4.4 → 1 ＋ 5 ＝ **6 个盒子**。\n（如果直接 72.1 ÷ 15 ＝ 4.8，会算成 5 个，装不下。）\n\n**多一个盒子，就多一次\"每刀被拉长\"的机会。**\n\n**这个数字是后面所有动作的前提。你划的盒子数必须落在这一格，多一个都要单独写理由。**\n\n**一个例外，先记住：** 位移刀（人带着东西在空间里移动）必须排在本单元第 1 或第 2 刀，这会在它前面切一刀。\n所以设定书 4.5 节里位移刀有 3 条以上时，表值可能不够用 —— 先按表值装，装不下就据实多一个，\n并在第 4 步用「硬理由：」开头写清是哪条位移刀顶上来的。这是唯一允许超表值的情况。\n\n────────────────────────────────────────\n第 1b 步：先判每条刀能不能一次生成（不许跳）\n────────────────────────────────────────\n\n装盒之前，先把每一刀过一遍，只问一句：**这一刀里，人会不会从画面的一头走到另一头？**\n\n- **不会** → 正常，进第 2 步。\n- **会，而且手里拿着东西** → 这一刀**必须拆成两条生成**：\n  · 起手镜头：人在起点，把东西拿起／装上车\n  · 落点镜头：人已经在终点，把东西放下\n  两条之间硬切，中间那段路不生成。拆完在覆盖表里写成两行。\n- **会，但空手** → 可以一条，但要写「不推不拉不摇不跟」，且移动距离不超过画面高度的三分之一。\n\n**为什么硬要在这里判：模型记不住人物手里拿着的东西。** 人一走远、在画面里一变小，手里的物体就被丢掉。\n\n实测（同一件事试了 5 次）：前 4 次都在改措辞和时长，全败；第 5 次只写一个动作、8 秒给足、措辞全按新规则，\n**独轮车和墩还是在人物走远的 1 秒内消失，人空手走到了对面。** 同一批测试里，不跨景深的单点动作\n（掀板看水、耙碎石）全部成功。所以这是能力边界，不是措辞问题 —— **改词改到第五遍也不会成，只能在这一步就拆掉。**\n\n拆出来的**落点镜头**要这么写：机位切近（中景或近景，只装落点那一小块地）；起手就写「车已经停在他脚边、\n车斗里装着一个墩」，不解释来路；只写放下那一个动作（抱起→抬出车斗→放到地上→直起腰）。\n\n────────────────────────────────────────\n第 2 步：把刀装进盒子\n────────────────────────────────────────\n\n把所有刀按顺序装进上一步算出的那几个盒子，一个盒子装连续的几刀。\n\n· **U01 已经覆盖的刀不再装盒**，新盒子从 U01 结束的那一刀之后开始。\n· 同一个人、同一个空间、同一个阶段的连续动作，装一个盒子。\n· **一盒装 6–7 刀（内部硬切），每一刀只有一个机位。刀长由这一刀里的活决定，不设「必须 2 秒以上」的下限**——阿初自己的 15 秒组是 2/2/2/3/5/1，最短一刀 1 秒、最长一刀 5 秒。\n  **但 1 秒是硬底线，单刀不许短于 1 秒**：0.5 秒演不完一个状态变化，模型只会挑一个动作做，其余全丢（2026-10-28 实测：0.5 秒里写\"抬头＋眉间收紧＋下颌前顶＋捏杂志\"，出来只有抬头）。\n  **刀数不是规定值，是除出来的：生成秒数 ÷ 2 ≈ 该有几刀。** 13–15 秒就是 6–7 刀。\n  写出 2–4 刀，等于每刀 4–7 秒——那一刀必然有时间无事可做，模型就用站着、走过去把它填满。\n  不许把多刀写成\"一条连续运镜演到底\"——那是把剪辑结果当成拍摄内容。\n· **内部硬切必须换景别**（近景 ↔ 中景 ↔ 全景），相邻两刀景别不许相同。\n  只换机位角度、不换景别的\"切\"，观众看不见，模型也看不见，它会当成一条连续长镜头演下去。\n  2026-10-27 实测：近景 0.55m → 全景 1.45m 一帧切干净（F00053→F00054，无过渡帧）；\n  同景别只挪机位的写法，机位会漂成跟拍。\n· 换机位不单独开新盒，在盒内用硬切表达；但同一盒里相邻两刀的景别不许相同。\n· 一盒装不下、超 15 秒了，才开新盒。\n· **时间轴必须从 0.0 秒铺满到生成时长的最后一秒。** 生成 15 秒就写到 15.0 秒；\n  只写到 12 秒的，剩下那 3 秒模型自己编走位和静止，编出来的全要剪掉。\n  写不满就加一刀，不许留空。\n· 不许按这些理由开新盒：换机位、换工序、风险高、要单独验收、\"以前就是这么分的\"。\n\n开新盒的理由只有五个，写不出这五个之一就合回去：\n\n1. 模式不能承载\n2. 物理起点不兼容\n3. 去掉冗余后仍超 15 秒\n4. 真实生成持续过载\n5. 我明确要求分开\n\n────────────────────────────────────────\n第 2 步·补：分镜表里的一「段」是剪辑结果，不是拍摄内容（2026-10-27 新增）\n────────────────────────────────────────\n\n装盒前对每一段算一遍：**这一段里人手的自然速度，要不要超过这一段的秒数？**\n\n· 不超过 → 一段一刀，照写。\n· 超过 → 段内按**时间跳跃**切刀，每刀只演一个能自然做完的片段。\n\n例子（B0009 母版 ⑥）：15.300–19.933，4.633 秒，\"拆掉旧栈道：旧板被撬起搬走，河床与两岸清出裸土\"。\n真片里这是几十分钟的活剪成 4.6 秒。照抄成一次生成，等于要求模型 4.6 秒拆完 9 米桥面约 60 块板——\n物理上不成立，改多少措辞都不成立。\n\n**同一道算术也用在「已经是一刀」的刀上（2026-10-28 补）。**\n4.5 节和分镜给的一刀，如果它的素材秒超过 3 秒，先问一句：\n**这一刀里真有一件事能做满 3 秒吗？**\n\n· **没有** → 按时间跳跃拆成两刀（刀号加 a／b 后缀，如 N09a／N09b），每刀只留一个能自然做完的片段。\n  不拆就会把每刀拉到 3 秒以上，剩下的时间模型只能站着、走过去——傻站就是这么来的。\n· **有**（运镜、大景、情绪停留这类本来就要铺满的）→ 保留，不拆。阿初自己那组就有一刀 5 秒。\n  但要在说明里写一句为什么这一刀能做满。\n\n正确切法：撬起一块板 2.2 秒 → 硬切 → 桥面已空、两岸清到见土 2.4 秒。观众接受时间跳跃，\n因为母版就是这么剪的；观众不接受的是\"4.6 秒演完几十分钟\"。\n\n**这条判据比时长更硬。** 一段写着 4.6 秒但需要 30 秒的活，不是\"生成秒给足就能成\"，\n是必须切成两刀。\n\n────────────────────────────────────────\n第 2b 步：结尾验证段单独成盒，且受保护\n────────────────────────────────────────\n\n设定书第 9 节有「结尾验证段」四行表（对标时长／本片时长／对照物／使用兑现）。\n装盒时必须照它办：\n\n1. **结尾验证段整体单独成一个盒子**（可以含多刀）。\n   不许和「底边封死」「收工离场」这类过程刀混装，也不许并进前一个盒子。\n   理由：它是全片唯一的\"证明\"，混装之后一定会被前面的动作挤掉时间。\n2. 这一盒的**生成秒 ÷ 计划时长**，要能覆盖设定书写的验证段时长；不够就加生成秒，不许减成片秒。\n3. 这一盒的取用率**不适用 60% 下限**（它不是过程段，不许用\"取用率低所以合并\"这条把它吞掉）。\n4. 这一盒的动作数可以是 0（末镜常是空镜或坐着不动），**不因此被判为无效盒**。\n\n────────────────────────────────────────\n第 2d 步：不许跨段搬运工序\n────────────────────────────────────────\n\n设定书第 9 节表 B 的「工序清单」已经把每个工序钉在具体段里了。装盒时守住三条：\n\n1. **一个盒子里不许混进两个段的工序。**\n   开头段（呈现问题）的刀、中间段（连续改造）的刀、结尾段（验证兑现）的刀，\n   各进各的盒子。混装会把三段边界抹平，成片就没有「一条流水线」的节奏。\n2. **不许把中间段的工序挪到开头盒或结尾盒里去凑秒数。**\n   如果某个盒子凑不满，先看能不能并进同段的邻居，不许跨段并。\n3. **装完先对账，再报我：**\n\n   | 段 | 本片工序数 | 对标工序数 | 比值 | 判定 |\n   |---|---|---|---|---|\n   | 开头 | __ | __ | — | 必须 0 |\n   | 中间 | __ | __ | __ | ≥0.90 |\n   | 结尾 | __ | — | — | — |\n\n   中间段比值 <0.90 → 停工，报我，不许自己调。\n\n**为什么**：真实事故里，开头段塞进了「冲地」「刷墙」两个工序，\n中间段因此只剩 13 个工序（对标 16 个），观众觉得「改造偏少」。\n这两个工序一旦被装进开头盒，成片就再也拿不回来了。\n\n────────────────────────────────────────\n第 2e 步：交「覆盖表」，这一行机器要读\n────────────────────────────────────────\n\n装完盒子，在 `说明\\接缝核对与有效版本.md` 最前面写这一行，格式一个字都不许改：\n\n```text\n覆盖：U01=N01-N02;U02=N03-P04;U03=P05-P09;U04=P10-P13;U05=P14-P21\n```\n\n规则：\n\n1. **用刀号写，不许用「第几刀」的序号写。** 开头和后段拼起来的顺序号很容易数错，\n   写错一位整张图就错位。刀号是唯一的。\n2. 每个单元一段，段之间用分号隔开；一个单元覆盖的刀必须**连续**。\n3. **覆盖必须完整**：从第一刀到最后一刀，每一刀恰好被一个单元覆盖，\n   不许漏（漏了那一刀等于没生成）、不许重（重了等于两段素材抢同一刀）。\n4. **同一单元合计秒数 ≤ 10 秒**（生产档位上限；平台容量到 15，不用）。\n5. 同时给出人看的那张表，放在这一行下面：\n\n   | 单元 | 覆盖刀号 | 刀数 | 成片秒 | 生成秒 | 取用率 |\n   |---|---|---|---|---|---|\n\n6. 并且写一句「工序名全部取自 `19_工序词表.md`」。用了词表以外的名字，这一版打回。\n\n**这一行为什么必须有**：成片之后要校验「分镜 ↔ 单元」有没有走偏，\n现在只能靠人工回忆；有了这一行，跑一条命令就能出四层对照图，\n漏一刀、重一刀、单元超 15 秒，全部当场标红。\n\n```bash\npython \"E:\\智线出海内容运营\\09 工具\\Pipeline.py\" 看 四层 ^\n  --对标 对标分镜.csv --头 开头分镜.csv --段 后段分镜.csv ^\n  --units \"U01=N01-N02;U02=N03-P04;U03=P05-P09;U04=P10-P13;U05=P14-P21\" ^\n  --out 四层对照.png\n```\n\n────────────────────────────────────────\n第 2c 步：成片偏短时的裁剪顺序（改这一条之前先看这里）\n────────────────────────────────────────\n\n生成长度不够、成片必须裁的时候，只许按这个顺序裁，**不许跳序**：\n\n1. 先裁中段的重复准备（取工具、试水、走位回头）\n2. 再裁中段的过渡镜\n3. 再压中段的长动作（同一动作保留起手与落点，中间加速）\n4. **最后才允许动结尾验证段，而且只允许动前三刀，末镜一刀不许动**\n5. 末镜时长低于设定书的值 → 停下来报我，不许自己剪短\n\n一句话：**中段是过程，可以压；结尾是证明，压了就没了。**\n真实事故：全片生成 36.4 秒、成片只取 22.7 秒（取用率 62.3%），\n被裁掉的时间等比落在每一段上，结尾跟着一起缩，末镜只剩 1.14 秒。\n\n────────────────────────────────────────\n第 3 步：填表（填完自己看一眼，不过就回第 2 步重装）\n────────────────────────────────────────\n\n| 单元 | 覆盖哪几刀 | 生成秒 | 成片取用秒 | 取用率 |\n|---|---|---|---|---|\n\n**U01 也要有一行**，数字照抄已定稿的单元卡，不要重算、不要改。\n\n四条自检，有一条不过就重装：\n\n1. 生成秒是整数，**13–15 之间**（一组装满；末组除不尽可以短，不低于 4）\n2. **成片取用 ≥ 2 秒** —— 不到 2 秒的那一盒，并到邻居里去\n3. **取用率 ≥ 60%** —— 生成 6 秒只取 0.3 秒，就是这一盒根本不该单独存在\n4. Σ 生成秒 ≤ 预算 × 1.15\n\n第 2、3 条是同一件事：**一个盒子在成片里占不到 2 秒，它就不该单独存在。**\n省下来的不是钱，是一次导入、一张参考卡和一段要对的连续性。\n\n**但是——第 2、3 条是事后诊断，不是拆分的判决书，更不是\"多塞一件事\"的许可证。**\n\n它只能回答「这一盒是不是太小」，不能回答「这一盒是不是太满」。两个方向撞车时，**以总秒数装得下为准**：\n\n- 这一盒的活加起来超过 15 秒 —— 这时**宁可多一个盒子**，不许用\"取用率会掉\"当理由硬压进去。\n- 反过来，一盒三刀、每刀 5 秒、成片取 12 秒（80%，过线）—— **取用率过线也照样是废盒**，因为每刀里都有 3–4 秒无事可做。\n\n**取用率测不出「那件事根本没发生」，也测不出「那一刀里有几秒是傻站」。** 实测：一盒 12 秒里写了\"搬第一个墩 + 搬第二个墩\"，第二个墩一次都没出现在画面里，而取用率算下来完全正常。丢件是负载问题，取用率看不出来。\n\n判据只有一条，写进第 3 步表头上方：\n\n> **一盒装 6–7 刀、13–15 秒，装满为止。不按件数设上限，也不按工序分盒。**\n\n「事」和「刀」不是一回事：**一件事可以是 1–2 刀**（搬东西＝起手镜头＋落点镜头两刀，仍是一件事）。\n但**刀数不是限制项，是算出来的**：13–15 秒 ÷ 2 秒 ≈ 6–7 刀。阿初按场景／机位分组，一组 15 秒装 7 个镜头（L3696、L4527–4529），他从来没有\"一盒一个工序\"或\"最多两件事\"这两条。\n**唯一不许的是反过来：一盒只装 2–3 刀，把每刀拉到 4–5 秒。** 那一刀里的活 1 秒就干完，剩下 3–4 秒模型只能站着、走过去、擦汗——你说的\"铺好了站起来傻站一会儿\"，就是这么来的。\n一刀里塞两件事、写成一条连续长镜头演到底，仍然不许（那是把剪辑结果当拍摄内容，五轮改词也救不回来）。\n\n────────────────────────────────────────\n第 4 步：报我，只报这些\n────────────────────────────────────────\n\n先报第 1 步那两个数加单元数，再报第 3 步那张表，最后写一句：哪几刀你本来想分开，为什么合起来了。\n\n**如果单元数超过了表值，这一句必须用「硬理由：」开头**，写清是哪条位移刀或哪条约束顶上来的。\n不写这四个字，验收器会当成划碎直接打回。\n\n**这一轮不写词、不建单元文件、不动根目录。** 我说\"可以\"才进第二步。\n取用率低于 60% 的行我直接打回，不用解释。\n\n**两个数的分工，别搞混：**\n· **60% 是退回线**——低于它就说明这一盒根本不值得单独存在，必须合并或拆掉。\n· **87% 是规划目标**（阿初自己 15 秒生成、13 秒成片，86.7%，L4622）。允许的浪费只有\"节奏剪切\"（2 秒剪成 1.5 秒），**不是\"人物白走 3 秒\"**。\n· 60%–87% 之间可以交，但要写清那 27 个点浪费在哪：是节奏余量，还是可删的动作。写\"剪辑余量\"这种空话不算。\n\n────────────────────────────────────────\n依据：防过度拆分六条（原文，一字不改）\n────────────────────────────────────────\n\n【生产单元防过度拆分检查】\n\n小分镜是成片剪辑单位，不是一次生成单位。不得先按分镜或工序划出小组，再默认小组边界不可改变。\n\n规划时必须：\n\n1. 先列必须看见的首次接触、状态变化、功能证据和必要情绪停留。\n2. 同人物、同空间、可连续表达的相邻动作，先尝试合成一个生产单元；允许内部硬切，重复工序按项目规定省略。\n3. 从合并后的有效动作重新估算生成时长，去掉重复开场、取工具、走位、重复劳动和无职责收尾。禁止用两个旧单元的生成预算相加，作为\"超过时长所以必须拆\"的证明。\n4. 对每个拟拆边界，写出具体硬理由：模式不能承载、物理起点不兼容、去冗余后仍超时、真实生成持续过载、**一个人连续做不完（需要时间跳跃）**，或用户明确要求分开。换机位、换工序、高风险、需要独立验收，都不单独构成拆分理由。\n   · **第六条是 2026-10-27 新增的，它管的是「刀」这一层**：如果一段素材里必须跳过一次做不完的工作（比如\"40 块板铺满\"），那它本来就不是一刀，必须拆成两刀、中间硬切。这条不算\"过度拆分\"，因为拆完每一刀都是一个人真能做完的。\n   · 其余五条管的是「盒」（一次生成）这一层，别混。\n5. 提交提示词前，再检查一遍相邻单元是否可以合并、共享参考卡是否可以减少，以及生成与取用差额各自承担什么职责。不能为了利用率好看删除关键证据，也不能把预算节省说成实测成功。\n6. 合并容量不确定时，先验证负载最高的一组；失败只补局部或做最小拆分，不默认恢复旧方案。\n\n提交生产规划前，必须做\"生产单元划分与取用联合检查\"。先逐刀区分：完整动作、有效末段、原切点前可省的准备或重复劳动、允许的连续加速、不可压缩的功能与情绪停留。扣清后再合并、重新估生成时长，不把完整施工耗时或旧单元预算相加。\n\n同镜完整链如果压缩，必须写清怎样删掉无信息准备和重复劳动、怎样保留接触和功能证据、怎样合法取用有效末段。不能用\"自然动作需要\"\"剪辑余量\"\"后期选段\"笼统解释。\n\n每 U 必须列：覆盖分镜、完整动作、生成时间（估计/实测）、成片取用、负责内容、生成时间与成片取用差额的具体用途、拆分理由、参考图职责、合法裁剪、最大负载和最小修复。没有依据的动作秒数标为估计，不能用它证明必须拆分。\n\n交给用户之前，由未参与规划的新上下文对照原分镜检查是否漏信息、重复计算工时、预留过多、负载过满或无法合法裁剪；总控修复后再交。聊天只给简表，详细依据落文件。不要为了提高取用比例删动作、缩短停留或强行加速。\n\n【以上是原文，一字不改。下面是本版的落地细节】\n\n每个 U 的检查表，照这个写：\n\n| 项目 | 必须写清 |\n|---|---|\n| 覆盖分镜 | 具体 N 编号，不写\"中段\" |\n| 完整动作 | 从起点到终点的动作链 |\n| **动作总数** | 本单元覆盖的刀，动作数相加（每刀动作数取自设定书 4.5 节，只能是 0 或 1） |\n| **动作密度** | 动作总数 ÷ 生成秒数，必须 ≤ 本条原片基准 ×1.2 |\n| **位移刀位置** | 哪个 N 是位移类（人带着东西在空间移动），排在本单元第几刀 |\n| 生成时间 | 估计或实测，必须标状态 |\n| 成片取用 | 起止窗口和实际取用职责 |\n| **取用率** | 取用 ÷ 生成，必须 ≥60%。<60% 这个单元不许提交 |\n| **内容够不够一格** | 这一 U 承担的分镜时长，<2.0 秒不许单独成单元 |\n| 负责内容 | 这一 U 承担哪些状态变化 / 功能证据 / 情绪停留 |\n| 差额用途 | 生成时间与成片取用差额具体用于什么 |\n| 拆分理由 | 如有拆分，写具体硬理由 |\n| 参考图 | 上传顺序、文件名、每张图的职责 |\n| 合法裁剪 | 是否能从连续动作中合法取用 |\n| 负载风险 | 哪个接触或状态最容易失败 |\n\n【动作预算三条硬约束】（违反任一条，这个 U 就不许提交）\n\n1. **动作总数 ÷ 生成秒数 ≤ 本条原片基准 ×1.2。** 超了不是加时长，是删动作或拆单元。\n2. **位移类动作（走、跨、搬、拖、抬着走、进屋、出门）单独一刀，按走完这段路实际要几秒给素材秒（不设最小时长），且必须排在本单元第 1 或第 2 刀。**\n   实测依据：位移刀排在前两刀，素材保留 90–99%；排在最后一刀只剩 65–76%。\n3. **每刀动作数 = 1。** 若设定书 4.5 节某刀写了 2 个动作，退回小分镜重写，不许在生产单元里\"现场合并\"。\n\n\n单独不能支持拆分的理由（一条都不行）：\n· 换机位\n· 换工序\n· 风险高\n· 需要独立验收\n· 习惯上一个分镜一个单元\n· 旧方案曾经这样划分\n\n取用率的实测值：第 1/2/3 条成片是 84–91%，不是 100%。生成文件时长是准的，缺的部分是剪辑时压掉的重复准备和空档。\n这个数只用来排预算，不用来证明某个单元可以少取。\n\nU 编号规则：\n开头包归有效 U01（开头实际有多个 U 就据实映射），后段从下一个可用编号开始。\n不保留历史空号，所有 RC 和 U 编号与输出名唯一，有真实依赖，无环。\n\n输出：生产单元划分与取用联合检查.md\n\n\n════════════════════════════════════════\n四、第三步：写完整包\n════════════════════════════════════════\n\n【文件结构】\n根目录是唯一导入目录，不能让我把开头工作包和根目录包各导入一遍。\n\n· 00_生产包入口.md　　　总览、导入顺序、参数、检查结果\n· 共用卡制卡词.md　　　　所有图片任务，一张卡一段\n· 单元\\Uxx.md　　　　　 每单元：标题 ＋ 五行头部 ＋ 唯一「## 拼好的完整正文」text 块\n· 说明\\Uxx_说明.md　　　分析、依据、未决\n· 说明\\接缝核对与有效版本.md\n· 导入核对清单.md　　　　每张图的父图、输出名、参数、字符数\n· 生产单元划分与取用联合检查.md\n· 生产包独立检查.md\n· 任务记录.md　　　　　 来源、纠正、版本\n\n不许创建空框架、占位符、\"同上\"。\n不把还没复制过来的图片写成根目录已有图片。\n\n【图卡怎么分，按这条来，不要一物一卡】\n一张卡 = 一次生图 = 一次积分。分碎了就是白烧钱，而且分开的几张之间还会互相对不上。\n\n**核心原则：能塞进一张就塞进一张。** 不要一个物件一张卡。\n配角道具、工具、材料、五金件，只要不需要精确还原结构关系，全部拼版。\n\n**必须合成同一张卡的：**\n· 同一个人物的不同角度（正面 / 3-4 侧 / 侧面 / 背影 / 脸部近景）→ 一张多视图身份卡\n· 同一类器物的多个款式（几只杯子、几种抱枕、几个小摆件）→ 一张多视图实物卡\n· 同一套五金件（轨道、角码、挂钩、卡扣、压条）→ 一张多视图实物卡\n· 同一阶段同一空间的不同机位（广角、侧向、俯看）→ 一张多视图空间卡\n· **凑不到一起的零散小件**（卷尺、锤子、油漆桶、刷子、螺丝盒、扎带、抹布、绳子）\n  → 做成一张「工具与材料板」，一张里放 4–12 件，分格摆好、每件标名\n\n**只有这四种情况才分开：**\n· 同一个空间的不同施工阶段（空壳 → 装轨 → 挂帘 → 布置）——时间不同，合成一张必然互相污染\n· 人物 与 空间 —— 对象不同\n· 首帧卡 与 阶段卡 —— 首帧是单幅 9:16，阶段卡是多视图 3:2\n· 需要精确还原咬合关系的主力件（比如帘轨和角码怎么咬、卡扣怎么压进槽）\n  —— 这类要独立大图，不能缩在格子里\n\n**拼版正文照这个句式写：**\n```\n生成一张〔道具 / 工具 / 五金件〕参考板。3 列 2 行共 6 件，白底或浅灰底。\n正交俯视，无透视变形；同一光线、同一比例；每件占格内八成，四周留白。\n每格只放一件，不跨格、不重叠、不互相遮挡。\n6 件分别是：①… ②… ③… ④… ⑤… ⑥…\n每件正下方留白处标简短中文名，标签不压在物件上。\n不要投影、不要装饰陪衬物、不要页面边框、不要水印、不要第二个人。\n```\n\n**一格里能看清什么，按这个反推数量：**\n· 3:2 / 2K 出图约 2048×1365\n· 6 件（3×2）每格约 680×680 —— 款式、材质、颜色都清楚\n· 9 件（3×3）每格约 680×450 —— 够用\n· 12 件（4×3）每格约 512×455 —— 只够认款式，纹理要靠文字补\n· **超过 12 件就分两张。** 再多不是省积分，是每件都糊，等于白做\n\n**判断口诀：同一时刻、同一对象、只是换了看的角度 → 一张卡；\n换个时间点或者换了对象 → 换张卡；\n但换了对象也不必换张卡——零散小件照样能拼一版。**\n\n自查：出现\"正面卡、侧面卡、背面卡\"这种命名，或者一个卷尺一张卡、一桶油漆一张卡，都是拆错了。\n\n【每个单元的正文必须写全这十四项】\n1. 每张上传参考图借什么\n2. 当前空间和阶段\n3. 人物站位和动作起点（**必须写\"起手那一下\"的前 0.3 秒**，不写走过来、站好、准备、直起腰）\n4. 人物具体接触什么\n5. 接触后发生什么可见变化（**写\"完成那一下\"，不写\"完成之后\"**）\n6. 后续有效动作（**只能是这一刀要交代的那个状态变化本身，不许加过渡动作**）\n7. 结束状态\n8. 摄像机与景别：逐刀写清（第 1 刀：近景 0.55m 俯拍 45°／第 2 刀：全景 1.45m 略仰 3–5°），\n   相邻两刀景别必须不同；每处切点单独一行写「⚠️硬切至镜头N：一帧完成，不许推拉、不许摇、不许渐变、不许叠化、不许闪白」\n9. 动作声、环境声、音乐和旁白\n10. 生成时长\n11. 成片取用窗口\n12. 不能出现的未来状态\n13. AI 生成风险\n14. 失败时的最小修复方案\n\n不能交付：\n· 只有\"人物开始施工\"\n· 只有\"快速完成安装\"\n· 只有一串形容词\n· 只有禁止词，没有正面描述\n· 只有分析没有可复制正文\n· 一个单元里混入多个不相容的阶段\n· 用\"同上\"代替共享块或上传顺序\n· **提示词里出现小分镜没有的动作**（详见下面「动作来源闸门」）\n\n【状态跳跃定律：内容层失败的真正原因，2026-10-27 实测新增】\n\n**这一条比\"动作来源\"更靠上游。动作来源是\"别多写\"，这一条是\"别要求它做不到的事\"。**\n\n实测证据（U04 15 秒 5 刀——**15 秒本身没错，错在第 3 刀的状态跳跃**；U05 11 秒 4 刀，逐帧复核）：\n· U04 第 3 刀要求\"桥面已铺满\"，上一刀近景只演了**一块板**放上去。模型不知道板从哪来，于是**让他抱着一根长木条站在空桥上**，桥面一直空着。这一刀整废 3.5 秒。\n· U05 第 4 刀要求\"她已经在桥心\"，上一刀结尾她一只脚**踩在校车台阶上**。模型把她送回桥心，用的办法是**让她走回去**，走了 2 秒。\n· U05 第 1→2 刀的切点两侧**都是全景**，观众看不见这个切，模型也没当切，直接连成一条**推近长镜头**，近景到片尾才出现。\n\n**三种机制是同一个：一刀要的状态，上一刀画面里没有、这一刀内又做不完，模型就自己编一段过渡填上——走过去、搬东西、站着。填出来的全是要被剪掉的。**\n\n所以每一刀要求什么状态，只能用这三种合法出口之一：\n· **A 上一刀的画面里已经看见了**（不用跳）\n· **B 这一刀自己演得完**（\"放最后一块板\" 3 秒够了）\n· **C 结果镜头重新起手**（切进来就是一个静态的、已经完成的新画面，人在画面里**是静的、不需要走一步**）\n\n**第四种不合法：要求一个\"中间省略了大量工作\"的状态，但入口还是延续上一刀的人。** 模型必然用走位去填。\n\n配套两条禁令：\n1. **切点两侧景别必须真的不同**——只写\"相邻不同\"不够，要检查这两刀的实际画幅：如果上一刀结尾是全景、下一刀起手也是全景，这个切等于没切，模型会推。**同一个工序里要换景别，就得换到\"另一种看这个世界的方式\"**（近景看局部细节 ↔ 全景看整体），不能只是挪机位。\n2. **不许设计\"只拍腰以下\"的近景**——实测两次都失败（U05 第 2 刀彻底失败，U04 第 2 刀侥幸因为板占了主体）。模型不会\"一进来只有腿\"。要表现\"手没扶栏杆\"，用**全景＋手明显垂在身侧**，或**俯拍桥面只拍脚和栏杆的关系**。\n\n**最贵的结论（2026-10-27 修正归因）：一盒塞四道工序、15 秒 5 刀，废掉 35% —— 病根不是\"塞得满\"，是第 3 刀要求了一个上一刀没有建立的状态（\"桥面已铺满\"）。**\n同一天的反证：U04_v01 是 12 秒 4 刀、跨 3 个工序（铺板＋栏杆＋碎石），三个切点一帧干净、全部可用；U04_v03 是 15 秒 5 刀，反而废了 35%。**差别不在刀数、不在工序数，在那一个状态跳跃。**\n所以修法是三条合法出口（上面 A/B/C），**不是\"拆成一盒一工序\"**——一盒一工序会把每刀拉到 4–5 秒，正好造出你说的傻站。\n详见 `34_内容层为什么修不完_20261027.md`。\n\n【动作来源闸门：写每一刀之前先过这一道，2026-10-27 新增】\n\n真实事故：U04 那盒 12 秒，有 3.4 秒是\"桥面已经铺满、他空手从房子那头走向镜头\"；U05 那盒 11 秒，有 2.5 秒是\"她背对镜头走开、走完才转身\"。两条加起来 5.9 秒／23 秒 ≈ 26% 是要被剪掉的。查下来这些动作**小分镜里一个都没有**，全是写卡时为了\"这一刀别太静\"临时加的。\n\n所以每一刀落笔前，按顺序过三问（三问都能逐刀核对，不靠手感）：\n\n**第一问：这个动作，小分镜里写了吗？**\n翻 `分镜\\后段小分镜_有效.md` 该刀的第 ② 节「那一个动作」「接触对象」和「终点状态」。**只有这三处写了的动作才能进提示词。**\n小分镜没写的，哪怕看起来再自然（擦汗、直起腰、后退半步、看一眼成果、把工具戳在地上、走过来、站住），一律不许写。\n需要加，就退回分镜阶段改，不许在生产单元里\"现场补\"。\n\n**第二问：这一秒有没有新东西进来？**\n**不要问\"会不会被剪掉\"——那是剪辑台上的决定，写卡时判断不了，视频模型也看不到这句话。**\n要问的是可查的：这一刀要交代的事，写成一个不超过 6 个字的短句，和前几刀比，**一样就删一刀**（阿初的判据：拖沓＝传达同样信息的重复镜头，`阿初的油管库.md` L3359）。\n再查一遍秒数：把这一刀按\"发生了什么变化\"切段，**如果有一段是\"没变化\"，那段就是空的**——不是会不会剪的问题，是这一秒本来就没内容。\n阿初原话：「我基本少有一个片段的时长 是超过3秒的 为什么要搞这么快呢？这 就是信息密度」（L4624）。\n\n**生成秒必须按「素材秒」定，不能按「成片秒」定。**\n分镜里每刀有两个数：成片秒（剪完的长度）、素材秒（这个动作拍完要几秒）。**生成秒取素材秒**，出来的长一点就剪掉——这正是阿初的做法（15 秒生成、13 秒成片，剪掉 2 秒，L4622）。\n**取用率只在盒级考核，不对单刀设 60% 下限。** 理由是一笔硬账：平台单段最少 4 秒，任何成片 <2.4 秒的刀，用 4 秒生成取用率必然低于 60%（N04 转头 0.834 秒 → 20.8%，N10 立栏杆 2.033 秒 → 50.8%，N13 末镜 1.920 秒 → 48%）。**按刀卡 60%，等于强制把这些刀跨工序并进别的盒子，而跨工序合并必然产生状态跳跃。** 10-27 U04 那盒四道工序，就是这么被逼出来的。\n\n**基准线：取用率目标 87%，不是 100%。**\n阿初自己 15 秒生成、13 秒成片，剪掉 2 秒（L4622），取用率 86.7%。他允许 13% 的浪费，但浪费掉的是\"节奏剪切\"（2 秒剪成 1.5 秒），**不是\"人物白走 3 秒\"**。节奏剪切观众看不出来，白走观众一眼就看出来。\n\n**第三问：这一刀的状态变化在哪个瞬间？**\n状态变化落在切点上的，写「完成那一下」，不写「完成之后」。\n· 错：桥面已经铺满，他走在桥上\n· 对：最后一块板还端在手里，他放下去、锤敲两下\n\n**起手位置＝必须看见那一下的前 0.3 秒。** 不许从\"准备动作\"开始，也不许从\"结果状态\"开始。\n\n**秒数是建议值，模型会漂。** 2026-10-27 实测：U05 镜头4 写 2.8 秒，实出 4.6 秒；前三刀写的 8.2 秒被压成 6.4 秒。所以节奏靠刀数和刀的内容，不靠给某一刀加秒。**能写住的只有\"没有多余动作可做\"。**\n\n**交稿前必须跑一次动作来源检查，退出码必须是 0。**\n```\ncd /d \"E://智线出海内容运营//09 工具\"\npython 检查_动作来源.py \"<单元卡路径>\" --board \"<分镜\\后段小分镜_有效.md>\"\n```\n它会逐条抓：① 卡片里出现、小分镜里没有的过渡动作 ② 分镜有但没限秒数的走动 ③ 分镜写了但卡片丢掉的对照物（钢索、白菊）。不通过不许提交。为此卡片必须带一张「为什么这么切」映射表（`| 镜头1 | N09 前段 | … |`），否则它没法逐刀对账。\n\n**小分镜写了\"走动\"但要限秒数。** N13 写「背对镜头、脚步还没停」「脚步两声后停住」——走动是分镜要的，但它只值 0.5 秒、两声脚步。写成\"走过来再转身\"，模型会给 2.5 秒的完整走位。凡分镜写\"还在走／脚步没停\"，都要明写「只许原地并一下步（约 0.4 秒）就停住」，并否掉「不许先走一段」。\n\n【模型与参数】\n视频：Seedance 2.0 Mini｜9:16｜480P｜声音开｜单段 **13–15 秒**（平台容量 4–15，一组装满）\n制卡：GPT Image 2.5 Flare｜2K｜Medium｜默认 3:2（首帧卡 9:16）\n平台硬约束：\n· 生参考图上传上限 4 张\n· 图生视频上传上限：**每段最多 4 张**（2026-10-16 实测界面只让传 4 张）。\n  `SKILL.md` 参数表里也是 4 张，两边一致。不许按更大的数规划，也不许再问一次。\n  超过 4 张就把两张并成一张（多视图 / 拼版），**不是分成两次生成**。\n· 单段生成 **13–15 秒**，**只能是整数**（13、14、15）。4.5、8.3、9.1 这种提交不上去。末组除不尽可以短，但不低于 4。\n  单元卡头部那行「生成：N 秒」、规划表、单元预算简表，三处都必须一致是整数。\n· 完整 Prompt ≤ 4096 字符，按保守 CRLF / UTF16 大值算\n\n超 4096 就改结构，不许删关键动作、必要停留或已冻结的英文。\n修改后重计。不能为凑上限删东西。\n参数若和我实际界面不一致，把不匹配项阻塞提交，其他文本继续，不要擅自降级模型。\n\n注意：这条 4 张的上限会反过来影响单元划分。\n如果一个 U 需要 5 张以上的图才能说清，说明这个 U 装得太满，先回去合并或拆分，\n不要把 5 张硬压成 4 张、删掉某张图的职责了事。\n\n【语言与旁白】\n正文一律简体中文。\n英文旁白逐字来自 分镜\\后段小分镜_有效.md，一个词都不许改，不许翻译，不许概括。\n人物不念旁白、不对口型。\n不能为套单元结构改英文；确实读不下，把冲突交回分镜阶段做最小修订并留依据。\n\n【声音与字幕】\n视频模型同步三样：画面、画外美国成年男声旁白、跟读字幕。\n字幕规格：每屏 2–3 词｜词首大写｜白色粗体黑描边｜当前词黄色｜纵向约 2/3 位置\n配乐：低音量轻音乐\n不加施工声，不加环境底声\n顶部标题后期一次加，不写进提示词\n\n【情绪】\n沿用设定书第 5 节同一套五通道和同一套强度 0–3，不许换口径。\n正文提示词里禁止出现情绪形容词（着急、满意、心疼、无奈、紧张……）。\n要写就写可见的东西：肩前倾、快步不跑、每步比平时大、皱一次眉不持续。\n每条情绪至少落到 ②身体 或 ③环境 或 ④声音 之一。\n只靠 ①表情 一个通道承担的段落，不许直接提交，写进说明交回来。\n情绪形容词只许出现在「说明」文件里。\n\n【共享块】\n共享块只在快照维护一次，各卡逐字拼入。\n不写\"同上\"或占位，不让我补正文。\n\n【不许复用别的版本的生产包】\n\n这一条是硬规定，不是建议。\n\n不读上一个版本（或上一条片子）的 单元\\、共用卡制卡词、复用目录、生产底稿。\n一切从本版 00_版本设定书.md 从零写。\n\n为什么：第 2、3 条留下的\"不要红砖房\"\"橄榄绿 T 恤\"，就是下游抄上一条底稿抄出来的。\n底稿会把上一个版本的表面词和旧禁止项一起带进来，改一半就成雷。\n设定书是自包含的，够用。\n\n如果你在项目里看到 复用\\ 或者旧版本的 单元\\，不要打开。\n看到别的版本的文件名，也不要\"顺便参考一下\"。\n\n唯一允许的跨版本输入：RC01_主角身份参考_v01.png，只借脸和体型。\n\n\n════════════════════════════════════════\n五、第四步：检查与修复\n════════════════════════════════════════\n\n【独立检查】\n交给我之前，必须由没有参与规划、也没有参与写词的新上下文，对照完整原分镜检查：\n\n· 是否漏掉首次接触\n· 是否漏掉状态变化\n· 是否漏掉功能证据\n· 是否漏掉必要情绪停留\n· **单元数是否落在第 0 步硬表区间内**（超一个都要有硬理由）\n· **每单元取用率是否 ≥60%**\n· **全片取用率（成片 ÷ 生成合计）是否 ≥80%**\n· **每单元是否装满 13–15 秒、装 6–7 刀**；有没有哪一盒只装 2–3 刀、把每刀拉到 4 秒以上（那是傻站的来源）\n· 是否重复计算准备和重复劳动\n· 是否预留过多生成时间\n· 是否有单元负载过满\n· 是否无法合法裁剪\n· 是否可以进一步合并相邻单元\n· 是否能减少共享参考卡\n· 是否把计划图片写成已有图片\n· 提示词是否达到可直接提交程度\n\n你负责收口，我不逐个去找子任务。\n环境开不了独立检查，就明确写\"未做独立检查\"，不许用自检冒充。\n\n【静态检查】\n查这些：\n编号唯一、无环 / 每个 N 有覆盖 / 时窗不越生成时长 / 旁白归属正确 /\n共享块与正文正反不冲突 / 图片上游是实际存在还是计划中 / 输出名唯一 /\n入口与真实文件一致 / 根目录包里不存在别的批次或别的版本的绝对路径\n\n特别排除一种错：一边要模型生成字幕，一边在禁止项里写\"不要文字\"。\n\n【继承旧卡专项】\n继承旧卡时，正文末尾的禁止项一起核。\n禁止项和正面描述必须同时改，只改一边就是雷。\n\n【字符检查】\n所有图和视频的最终完整 Prompt ≤ 4096，含共享块、英文、标点、空白、换行。\n按保守 CRLF 和 UTF16 大值检查。\n\n字符检查不是实际导入，也不是媒体验收。\n\n【状态标记】\n没有实际生成的图片或视频，状态只能写\"待生成验证\"。\n不能把提示词写完说成视频质量已经验证。\n状态只有两种：定稿 / 草稿。定稿不等于媒体已验收。\n\n发现明确缺陷自行修复并回读。\n没有新问题，不反复做大审计、不改版本号、不重写文案。\n\n【不做的事】\n不跑导入器、不付费生成、不发布、不代我接受候选。\n不改全局 skill、不改现有生产程序或 Excel。\n只在版本文件夹里写文件。\n\n\n════════════════════════════════════════\n六、最终直接交这些\n════════════════════════════════════════\n\n1. 00_生产包入口.md 的路径\n2. 单元预算简表：单元 / 覆盖分镜 / 生成秒 / 取用秒 / **取用率** / 负责内容 / 差额用途\n   （这张表我在第一段已经点过头了，这里交的是最终版，数字和当时报的要是同一套）\n3. 完整图片词和视频词的位置\n4. 静态检查结果：错误数、覆盖数、最长字符数\n   必查六条，逐条答\"通过/不通过\"：\n   · 每张单元卡头部的生成秒数是不是整数\n   · 规划表、单元预算简表、单元卡头部，三处秒数是不是同一套\n   · 每个单元取用率是不是 ≥60%，取用秒数是不是 ≥2.0 秒\n   · 每张卡的上传参考图是不是 ≤4 张\n   · 每张卡完整 Prompt 是不是 ≤4096 字符（CRLF/UTF16 保守算）\n   · 正文是不是全简体中文（英文只允许出现在旁白原文里）\n5. 独立检查发现的问题，以及你怎么修的\n6. 需要我决定的实质冲突（没有就写\"无\"）\n7. 未导入、未生成、待媒体验证的范围\n\n汇报用中文，短，先结论再下一步。\n不汇报内部派工过程，不重复粘贴整包正文。\n给可点击的绝对路径，不只说\"修好了\"。\n不拿文件数量、AI 自评或\"检查错误 0\"当成片成功。\n\n**写入范围：**只写这个版本目录里的 单元\\、说明\\ 和生产包入口。\n　**00_版本设定书.md 和 分镜\\ 只读，一个字都不许改。**\n　发现设定书或分镜有问题（秒数对不上、动作数超了、缺项），不要自己改，报给我。\n　档期紧了也不许\"先按我的理解改一版\"——那会让上游三段的记录全部失效。\n\n\n════════════════════════════════════════\n附：真实生成失败之后怎么办\n════════════════════════════════════════\n\n这一段不是本轮授权，是给以后实际生成时的规则。\n\n只补坏的部分：声音、字幕、局部镜头，或做最小拆分。\n不默认全片退回后期配音。\n不修改已经可用的素材。\n失败不默认恢复碎片化的旧方案。\n\n════════════════════════════════════════\n交完之后\n════════════════════════════════════════\n\n全部产出落盘后，最后一行写这句话：\n「这一段的文件都在 <完整路径>。请双击 09 工具\\流程.bat（或运行 python \"E:\\智线出海内容运营\\09 工具\\Pipeline.py\" 查 全部 --版本 <完整路径>）检查一遍。」\n\n然后交**两张图**，都用绝对路径。\n\n【图一 · 结论图】自己跑（不用我跑，你有执行权限）：\n    python \"E:\\智线出海内容运营\\09 工具\\体检.py\" \"<本版本目录>\"\n→ 生成 `_验收\\体检单.png`：六行，绿=过、红=卡住、灰=还没做。\n\n【图二 · 过程图】这一段的专业图，我要看它判断完成度：\n    python \"E:\\智线出海内容运营\\09 工具\\看板_环节.py\" --stage 生产单元 --ref \"<对标工序:秒，逗号分隔>\" --map \"<工序=U01,工序=U02,…>\" --out \"<本版本目录>\\_验收\\看板_单元.png\"\n→ 存到 `<本版本目录>\\_验收\\看板_单元.png`\n\n两张都贴出来，不要贴文字、不要贴退出码。后面只写一句：**这一段过没过**；\n没过就补一句「卡在第几段 + 那一行写的原因」。\n不许自己声称\"已通过\"——以图为准。我只看图。\n\n【路径速查｜都是本机绝对路径，不要改成相对路径】\n· 工具目录：       E:\\智线出海内容运营\\09 工具\\\n· 结论图：         E:\\智线出海内容运营\\09 工具\\体检.py\n· 总闸门：         E:\\智线出海内容运营\\09 工具\\Pipeline.py\n· 过程图（环节）： E:\\智线出海内容运营\\09 工具\\看板_环节.py\n· 过程图（成片）： E:\\智线出海内容运营\\09 工具\\看板_对比.py\n· 项目根目录：     E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\\n· 本段产物：       <版本文件夹>\\\n· 规范目录：       E:\\智线出海内容运营\\13_内容复盘\\YouTube\\我的频道全套数据\\06_制作对话与决策\\00_视频生产流程规范_v1\\\n\n\n════════════════════════════════════════\n★ 人读版（每个环节都要交，缺了不算交稿）\n════════════════════════════════════════\n\n除了上面给 AI 看的详细文档，**另交一份 `单元_人读版.md`**：\n五块、一页纸、不超过 600 字、大白话。格式见 `38_人读版_统一格式_20261027.md`。\n\n```\n## 一、一句话          这条片子讲的是……\n## 二、我是怎么想的     3–5 条，每条一行，说清为什么这么定\n## 三、盒子表（这一盒装什么 / 生成几秒 / 剪成几秒 / 为什么不能和前后合）\n## 四、我删了什么、加了什么   各 1–3 条，带一句为什么\n## 五、这一版你最该盯的一处   必须写真话，不许写\"整体没问题\"\n```\n\n第三块的对比，第三栏一律用四个字开头：**同／删／换／加**\n（借阿初的办法：并排播放时「原片放、我的黑屏」＝我删了；「我的放、原片黑屏」＝我加了。L962–964）\n\n**人只审人读版。** 详细文档机器检查，人读版人看方向；人读版方向不对直接打回。\n"}, "skills": {"benchmark-select-and-breakdown": {"label": "①拆解·选题与拆解", "path": "skills/benchmark-select-and-breakdown/SKILL.md", "text": "---\nname: \"benchmark-select-and-breakdown\"\ndescription: \"拆一条对标视频：AI 自己分诊，开头能用就建 HOOK 开头卡，后半段是改造就建 BODY 整片对标（给 full-storyboard-design 用），分界点由 AI 定。用于\\\"找新对标/拆这个参考视频/建对标卡/拆后半段\\\"。不写提示词、不做微调（那是 benchmark-adapt-hook）。\"\n---\n\n# 对标选拆：选一个新对标，拆成一张卡\n\n一句话：找一个观众已经证明爱看的开头，把它的骨架一秒一秒拆清楚，写成卡。\n\n依据：阿初的油管库（D:\\自己开发的程序\\阿初的油管\\阿初的油管库.md），行号标【Lxxx】；【我们】是我们自己的补充。\n方法论全文：D:\\自己开发的程序\\阿初的油管\\方法论v2_20260930\\01_底层方法论_v2.md\n台账：同文件夹 02_对标库与数据台账_持续更新.md\n\n## 第 1 步：先查台账\n\n打开台账第 1 张表。用过的、停用的，不再用。一个对标只用一次【我们】。\n\n## 第 1.5 步：分诊（AI 自己判断，不问用户）【我们】\n\n一条视频进来，分别判断两件事：\n- 开头能不能做开头卡：按第 2 步五条判断。能，就走第 2–7 步，建 HOOK 卡\n- 后半段能不能做整片对标：必须是改造类（看到问题 → 动手改 → 变漂亮 → 人或宠物回来用）。能，就走文末\"后半段拆解\"，建 BODY\n- 两个都能就两个都建。都不能，在台账备注\"不收\"和原因，结束\n\n分界点由 AI 定，不按固定秒数：开头 = 问题被看见、出事的那一段；后半段从\"开始动手\"那一刻起。写明分界点在第几秒、为什么。\n开头不抓人也不影响 BODY：只是不建 HOOK 卡。\n\n## 第 2 步：选源，五条全部满足才算\n\n1. 自己看了会停下来。\"微调的选材 只有一个标准 那就是你喜欢\"【L5775】\n2. 播放量高，说明受众多【L10013】。记下播放量和链接\n3. 优先非 AI、跨赛道【L10596】。AI 来源的开头卡可以收，但标\"试验\"，台账写明来源类型，发布后和非 AI 来源的数据对比（见文末）\n4. 没有明星或 IP 加成【L9849】\n5. 红线：画面里没有看上去像儿童的人【L9588–9596】。有就跳过\n\n【我们】优先找 5–15 秒的真实短片开头（家庭随手拍、真实意外、改造前后），长片改成几秒很难【L10625–10629】。\n可以让 AI 按剧情类型帮忙找候选【L
